<script>
/**
 * JS.html — Foro Educativo Comunal Neiva 2026
 * Lógica de cliente. Reutiliza (adaptados a GRUPO) los patrones más
 * maduros de App.html en FEI 3.1 (docs/01-auditoria-fei-3.1.md §2.6):
 * dispositivoId persistente en localStorage, heartbeat periódico de
 * sesión, autoguardado con sincronización periódica al servidor.
 */

/* ------------------------------------------------------------------ *
 * Estado de cliente
 * ------------------------------------------------------------------ */
var estado = {
  dispositivoId: obtenerDispositivoId(),
  idGrupo: "",
  grupo: "",
  tokenSesion: "",
  esPrincipal: false,
  instituciones: [],
  ultimosFirmantes: [],
  metodoAsistencia: "",
  logoId: "",
  consentimientoGrupo: false,
  rolesForo: [],
  responsables: { principal: null, asistentes: [] },
  recursosSesion1Mostrado: false,
  fotoGrupoId: "",
  totalFirmantes: 0,
  participacionEstamento: null,
  prepIdIE: "",
  prepInstitucion: "",
  prepResponsable: "",
  socializacionPreparacion: [],
  explicacionConectaEducaVista: false
};

/** URL de imagen para un archivo de Drive público (logos) — mismo patrón usado para el QR de asistencia. */
function urlImagenDrive(idArchivo, ancho) {
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idArchivo) + "&sz=w" + (ancho || 600);
}

var ORDEN_PANTALLAS = [
  "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia", "pantallaAcceso",
  "pantallaConsentimientoGrupo", "pantallaParticipacion", "pantallaConfirmacionCaracterizacion",
  "pantallaPreSocializacion", "pantallaSeleccionIEPreparacion", "pantallaPreparacionIE",
  "pantallaSesion1", "pantallaSesion2", "pantallaRevisionCierre",
  "pantallaInformeGenerado", "pantallaDespedida"
];

function obtenerDispositivoId() {
  var clave = "forumComunalNeiva2026_dispositivo";
  try {
    var guardado = localStorage.getItem(clave);
    if (guardado) return guardado;
    var nuevo = "FEC-DEV-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(clave, nuevo);
    return nuevo;
  } catch (e) {
    return "FEC-DEV-" + Date.now().toString(36);
  }
}

/* ------------------------------------------------------------------ *
 * Llamadas al servidor (envoltorio de google.script.run)
 * ------------------------------------------------------------------ */
function llamarServidor(nombreFuncion, args, onExito, onError) {
  google.script.run
    .withSuccessHandler(function (resultado) {
      if (onExito) onExito(resultado);
    })
    .withFailureHandler(function (error) {
      console.error(nombreFuncion, error);
      if (onError) onError(error);
      else mostrarMensaje("mensajeGlobal", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    })
    [nombreFuncion].apply(null, args || []);
}

/* ------------------------------------------------------------------ *
 * Navegación entre pantallas
 * ------------------------------------------------------------------ */
function cambiarPantalla(idPantalla) {
  ORDEN_PANTALLAS.forEach(function (id) {
    document.getElementById(id).classList.toggle("visible", id === idPantalla);
  });
  var indice = ORDEN_PANTALLAS.indexOf(idPantalla);
  var porcentaje = Math.round(((indice + 1) / ORDEN_PANTALLAS.length) * 100);
  document.getElementById("barraProgresoRelleno").style.width = porcentaje + "%";
  window.scrollTo(0, 0);

  if (idPantalla === "pantallaParticipacion") {
    actualizarFirmantes();
    cargarResponsables();
    cargarParticipacionEstamento();
  }
  if (idPantalla === "pantallaConfirmacionCaracterizacion") cargarConfirmacionCaracterizacion();
  if (idPantalla === "pantallaSeleccionIEPreparacion") cargarListaIEPreparacion();
  if (idPantalla === "pantallaPreparacionIE") cargarPreparacionIE();
  if (idPantalla === "pantallaSesion1") {
    cargarSesion1();
    cargarRecursosSesion1();
    cargarSocializacionPreparacion();
  }
  if (idPantalla === "pantallaSesion2") {
    cargarConectaEduca();
    prepararPantallaConectaEduca();
  }
  if (idPantalla === "pantallaRevisionCierre") prepararCierre();
}

document.addEventListener("click", function (evento) {
  var boton = evento.target.closest("[data-ir]");
  if (boton) cambiarPantalla(boton.getAttribute("data-ir"));

  var cerrar = evento.target.closest("[data-cerrar-modal]");
  if (cerrar) cerrarModal(cerrar.getAttribute("data-cerrar-modal"));

  var borrarActor = evento.target.closest("[data-borrar-actor]");
  if (borrarActor) borrarActorConectaEduca(borrarActor.getAttribute("data-borrar-actor"));

  var quitarAsistente = evento.target.closest("[data-quitar-asistente]");
  if (quitarAsistente) quitarAsistenteEnvio(quitarAsistente.getAttribute("data-quitar-asistente"));

  var guardarRector = evento.target.closest("[data-guardar-rector]");
  if (guardarRector) guardarRectorIE(guardarRector.getAttribute("data-guardar-rector"));

  var elegirIEPreparacion = evento.target.closest("[data-preparar-ie]");
  if (elegirIEPreparacion) abrirModalResponsablePreparacion(elegirIEPreparacion.getAttribute("data-preparar-ie"));

  var verPantallaCompletaTexto = evento.target.closest("[data-ver-completo]");
  if (verPantallaCompletaTexto) abrirPantallaCompletaTexto(verPantallaCompletaTexto.getAttribute("data-ver-completo"));

  var alternarSocializacionIE = evento.target.closest("[data-alternar-socializacion]");
  if (alternarSocializacionIE) alternarTodosDesplegablesSocializacion();
});

function abrirModal(id) {
  document.getElementById(id).classList.remove("oculto");
}
function cerrarModal(id) {
  document.getElementById(id).classList.add("oculto");
}

/* ------------------------------------------------------------------ *
 * Transición inicial (splash: logo del Foro, luego logo de la SEM Neiva,
 * uno a la vez con crossfade)
 * ------------------------------------------------------------------ */
function iniciarSplashInicial() {
  var splash = document.getElementById("pantallaSplashInicial");
  if (!splash) return;
  var img = document.getElementById("imagenSplashActual");
  var secuencia = [LOGO_ENCABEZADO_ID, LOGO_PIE_ID].filter(Boolean);

  var cerrado = false;
  var temporizador = null;
  var cerrarSplash = function () {
    if (cerrado) return;
    cerrado = true;
    clearTimeout(temporizador);
    splash.classList.add("oculto");
  };

  if (!secuencia.length) {
    cerrarSplash();
    return;
  }

  var indice = 0;
  var mostrarSiguiente = function () {
    if (indice >= secuencia.length) {
      temporizador = setTimeout(cerrarSplash, 900);
      return;
    }
    img.classList.remove("visible");
    setTimeout(function () {
      if (cerrado) return;
      img.src = urlImagenDrive(secuencia[indice], 600);
      img.classList.add("visible");
    }, 250);
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 2200);
  };

  splash.addEventListener("click", cerrarSplash);
  mostrarSiguiente();
}
iniciarSplashInicial();

/* ------------------------------------------------------------------ *
 * Carrusel de bienvenida — cada I.E. del grupo aparece una a una (1s
 * c/u), justo después de validar el código de acceso (no antes).
 * ------------------------------------------------------------------ */
function mostrarCarruselIE(alTerminar) {
  alTerminar = alTerminar || function () {};
  llamarServidor("rpcInstitucionesDelGrupo", [estado.idGrupo], function (instituciones) {
    if (!instituciones || !instituciones.length) {
      alTerminar();
      return;
    }
    ejecutarCarruselIE(instituciones, alTerminar);
  }, alTerminar);
}

function ejecutarCarruselIE(instituciones, alTerminar) {
  var overlay = document.getElementById("pantallaCarruselIE");
  var contenedorItem = document.getElementById("itemCarruselIE");
  var progreso = document.getElementById("progresoCarruselIE");
  overlay.classList.remove("oculto");

  var indice = 0;
  var temporizador = null;

  var terminar = function () {
    if (temporizador) clearTimeout(temporizador);
    overlay.classList.add("oculto");
    alTerminar();
  };

  var mostrarSiguiente = function () {
    if (indice >= instituciones.length) {
      terminar();
      return;
    }
    var ie = instituciones[indice];
    var html = "<div class='carrusel-ie-item'>";
    if (ie.logoId) {
      html += "<img src='" + urlImagenDrive(ie.logoId, 400) + "' alt='" + escapeHtml(ie.institucion) + "'>";
    } else {
      html += "<span class='icono-generico'>🏫</span>";
    }
    html += "<p class='nombre-ie'>" + escapeHtml(ie.institucion) + "</p>";
    if (ie.grupo) html += "<p class='grupo-ie'>" + escapeHtml(ie.grupo) + "</p>";
    html += "</div>";
    contenedorItem.innerHTML = html;
    progreso.textContent = (indice + 1) + " / " + instituciones.length;
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 1000);
  };

  document.getElementById("btnSaltarCarruselIE").onclick = terminar;
  mostrarSiguiente();
}

document.getElementById("btnComenzarForo").addEventListener("click", function () {
  cambiarPantalla("pantallaPresentacion");
});

/* ------------------------------------------------------------------ *
 * Contador de palabras (Sesión 1 y Sesión 2 — preguntas abiertas)
 * ------------------------------------------------------------------ */
function inicializarContadoresPalabras() {
  var textareas = document.querySelectorAll("#pantallaSesion1 textarea, #pantallaSesion2 textarea");
  textareas.forEach(function (textarea) {
    var contador = document.createElement("p");
    contador.className = "contador-palabras";
    textarea.insertAdjacentElement("afterend", contador);
    var min = parseInt(textarea.dataset.minPalabras, 10) || 0;
    var max = parseInt(textarea.dataset.maxPalabras, 10) || 0;
    var actualizar = function () {
      var texto = textarea.value.trim();
      var palabras = texto ? texto.split(/\s+/).length : 0;
      var texto2 = palabras + (palabras === 1 ? " palabra" : " palabras");
      if (min || max) {
        texto2 += " (mínimo " + min + ", máximo " + max + ")";
        var enRango = palabras >= min && palabras <= max;
        contador.classList.toggle("fuera-de-rango", !enRango);
        contador.classList.toggle("en-rango", enRango);
      }
      contador.textContent = texto2;
    };
    textarea.addEventListener("input", actualizar);
    actualizar();
  });
}
inicializarContadoresPalabras();

/* ------------------------------------------------------------------ *
 * Recursos descargables antes de Sesión 1
 * ------------------------------------------------------------------ */
function cargarRecursosSesion1() {
  llamarServidor("rpcObtenerRecursosSesion1", [estado.idGrupo], function (recursos) {
    renderRecursosSesion1(recursos || []);
    if (!estado.recursosSesion1Mostrado) {
      estado.recursosSesion1Mostrado = true;
      abrirModal("modalRecursosSesion1");
    }
  });
}

/* ------------------------------------------------------------------ *
 * Acceso
 * ------------------------------------------------------------------ */
if (NOMBRE_GRUPO_ACCESO) {
  document.getElementById("nombreGrupoAcceso").textContent = "Grupo: " + NOMBRE_GRUPO_ACCESO;
}

function intentarValidarAcceso(forzar) {
  var codigo = document.getElementById("campoCodigoAcceso").value.trim();
  if (!TOKEN_ACCESO) {
    mostrarMensaje("mensajeAcceso", "El enlace de acceso no incluye un token válido.", "error");
    return;
  }
  if (!codigo) {
    mostrarMensaje("mensajeAcceso", "Ingrese el código de acceso.", "error");
    return;
  }
  llamarServidor("rpcValidarAcceso", [TOKEN_ACCESO, codigo, estado.dispositivoId, !!forzar], function (r) {
    if (!r.ok) {
      if (r.codigo === "SESION_YA_ABIERTA") {
        document.getElementById("mensajeTomaSesion").textContent = r.mensaje;
        abrirModal("modalTomaSesion");
        return;
      }
      mostrarMensaje("mensajeAcceso", r.mensaje || "No fue posible validar el acceso.", "error");
      return;
    }
    estado.idGrupo = r.idGrupo;
    estado.grupo = r.grupo;
    estado.tokenSesion = r.tokenSesion;
    estado.esPrincipal = r.esPrincipal;
    estado.instituciones = r.instituciones || [];
    estado.metodoAsistencia = r.metodoAsistencia || "";
    estado.logoId = r.logoId || "";
    estado.consentimientoGrupo = !!r.consentimientoGrupo;
    estado.fotoGrupoId = r.fotoGrupoId || "";

    document.getElementById("nombreGrupoParticipacion").textContent = r.grupo;
    poblarSelectInstituciones("campoIEResponsable", estado.instituciones);
    poblarSelectInstituciones("campoIEAsistente", estado.instituciones);
    renderListaInstituciones(estado.instituciones);
    renderFotoGrupo(estado.fotoGrupoId);
    document.getElementById("panelFirmantes").classList.remove("oculto");

    mostrarPanelMetodoAsistencia(estado.metodoAsistencia);
    iniciarHeartbeat();
    iniciarPollingFirmantes();
    cargarRolesForo();

    // El "recorrido" de logos de las IE del grupo va justo después de
    // validar el código de acceso (spec), no antes — en ese punto ya se
    // conoce con certeza a qué grupo pertenece este dispositivo.
    mostrarCarruselIE(function () {
      cambiarPantalla(estado.consentimientoGrupo ? "pantallaParticipacion" : "pantallaConsentimientoGrupo");
    });
  });
}

document.getElementById("btnValidarAcceso").addEventListener("click", function () {
  intentarValidarAcceso(false);
});
document.getElementById("btnForzarSesion").addEventListener("click", function () {
  cerrarModal("modalTomaSesion");
  intentarValidarAcceso(true);
});

/* ------------------------------------------------------------------ *
 * Consentimiento informado del grupo (sección 3.2)
 * ------------------------------------------------------------------ */
document.getElementById("checkConsentimientoGrupo").addEventListener("change", function () {
  document.getElementById("btnAceptarConsentimientoGrupo").disabled = !this.checked;
});

document.getElementById("btnAceptarConsentimientoGrupo").addEventListener("click", function () {
  llamarServidor("rpcGuardarConsentimientoGrupo", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeConsentimientoGrupo", r.mensaje || "No fue posible registrar el consentimiento.", "error");
      return;
    }
    estado.consentimientoGrupo = true;
    cambiarPantalla("pantallaParticipacion");
  });
});

/* ------------------------------------------------------------------ *
 * Heartbeat de sesión (mantiene el cupo de dispositivo activo)
 * ------------------------------------------------------------------ */
function iniciarHeartbeat() {
  setInterval(function () {
    if (!estado.idGrupo) return;
    llamarServidor(
      "rpcMantenerSesion",
      [estado.idGrupo, estado.dispositivoId, estado.tokenSesion],
      function (r) {
        if (!r.ok) {
          mostrarMensaje("mensajeGlobal", "Esta sesión ya no está activa en este dispositivo (otro dispositivo tomó el cupo). Vuelva a ingresar.", "error");
        }
      },
      function () {}
    );
  }, 30000);
}

/* ------------------------------------------------------------------ *
 * Método de asistencia (QR/enlace o listado físico + fotografía)
 * ------------------------------------------------------------------ */
function mostrarPanelMetodoAsistencia(metodo) {
  document.getElementById("panelMetodoQR").classList.toggle("oculto", metodo !== "QR");
  document.getElementById("panelMetodoListado").classList.toggle("oculto", metodo !== "LISTADO");
  // Métodos EXCLUSIVOS: con PDF (LISTADO) desaparece el conteo de firmas en
  // vivo (no aplica, nadie firma por celular); con QR sigue visible.
  var ocultarConteoFirmas = metodo === "LISTADO";
  document.getElementById("panelFirmantes").classList.toggle("oculto", ocultarConteoFirmas || !metodo);
  var filaContador = document.getElementById("filaContadorParticipantesTarjeta");
  if (filaContador) filaContador.classList.toggle("oculto", ocultarConteoFirmas);
  if (metodo === "QR") cargarEnlaceAsistencia();
}

function cargarEnlaceAsistencia() {
  llamarServidor("rpcUrlAsistencia", [estado.idGrupo], function (url) {
    var enlace = document.getElementById("enlaceAsistenciaQR");
    enlace.href = url;
    enlace.textContent = url;
    document.getElementById("imagenQRAsistencia").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(url);
  });
}

function elegirMetodoAsistencia(metodo) {
  mostrarPanelMetodoAsistencia(metodo);
  estado.metodoAsistencia = metodo;
  mostrarMensaje("mensajeSeleccionMetodo", "");
  document.getElementById("btnMetodoQR").classList.toggle("btn-metodo-activo", metodo === "QR");
  document.getElementById("btnMetodoListado").classList.toggle("btn-metodo-activo", metodo === "LISTADO");
  renderResumenParticipacionEstamentoTodo();
  llamarServidor("rpcGuardarMetodoAsistencia", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, metodo], function (r) {
    if (!r.ok) mostrarMensaje("mensajeMetodoAsistencia", r.mensaje || "No fue posible guardar el método.", "error");
  });
}

document.getElementById("btnMetodoQR").addEventListener("click", function () {
  elegirMetodoAsistencia("QR");
});
document.getElementById("btnMetodoListado").addEventListener("click", function () {
  elegirMetodoAsistencia("LISTADO");
});

// Es obligatorio elegir exactamente un método (QR o PDF) antes de continuar.
document.getElementById("btnContinuarAParticipacion").addEventListener("click", function () {
  if (estado.metodoAsistencia !== "QR" && estado.metodoAsistencia !== "LISTADO") {
    mostrarMensaje("mensajeSeleccionMetodo", "Elige un método de asistencia (QR o PDF) antes de continuar.", "error");
    document.getElementById("mensajeSeleccionMetodo").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  cambiarPantalla("pantallaConfirmacionCaracterizacion");
});

document.getElementById("btnCopiarEnlaceAsistencia").addEventListener("click", function () {
  var url = document.getElementById("enlaceAsistenciaQR").href;
  if (navigator.clipboard) navigator.clipboard.writeText(url);
});

/* ---- Vista de pantalla completa del QR (para proyectar en el evento) ---- */
var intervaloPantallaCompletaQR = null;

document.getElementById("btnPantallaCompletaQR").addEventListener("click", function () {
  var url = document.getElementById("enlaceAsistenciaQR").href;
  document.getElementById("imagenQRPantallaCompleta").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(url);
  document.getElementById("enlacePantallaCompleta").textContent = url;
  var overlay = document.getElementById("pantallaCompletaQR");
  overlay.classList.remove("oculto");
  if (overlay.requestFullscreen) overlay.requestFullscreen().catch(function () {});

  var actualizarContadorGrande = function () {
    llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
      document.getElementById("contadorFirmantesPantallaCompleta").textContent = r.total || 0;
    }, function () {});
  };
  actualizarContadorGrande();
  intervaloPantallaCompletaQR = setInterval(actualizarContadorGrande, 5000);
});

document.getElementById("btnCerrarPantallaCompletaQR").addEventListener("click", function () {
  clearInterval(intervaloPantallaCompletaQR);
  document.getElementById("pantallaCompletaQR").classList.add("oculto");
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
});

function leerArchivoComoBase64_(archivo, callback) {
  var lector = new FileReader();
  lector.onload = function () {
    var base64 = lector.result.split(",")[1];
    callback(base64);
  };
  lector.readAsDataURL(archivo);
}

document.getElementById("btnSubirListado").addEventListener("click", function () {
  var input = document.getElementById("campoArchivoListado");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeMetodoAsistencia", "Selecciona primero un archivo.", "error");
    return;
  }
  if (archivo.type !== "application/pdf") {
    mostrarMensaje("mensajeMetodoAsistencia", "Solo se admiten archivos PDF para el listado de asistencia.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    llamarServidor(
      "rpcSubirListadoAsistencia",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        mostrarMensaje("mensajeMetodoAsistencia", r.ok ? "Listado subido correctamente." : (r.mensaje || "No fue posible subir el listado."), r.ok ? "exito" : "error");
        if (r.ok) input.value = "";
      }
    );
  });
});

/* ------------------------------------------------------------------ *
 * Fotografía general del grupo (Participación) — independiente del
 * método de asistencia elegido.
 * ------------------------------------------------------------------ */
document.getElementById("btnSubirFotoGrupo").addEventListener("click", function () {
  var input = document.getElementById("campoFotoGrupo");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeFotoGrupo", "Selecciona primero una fotografía.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    llamarServidor(
      "rpcSubirFotoGrupo",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        mostrarMensaje("mensajeFotoGrupo", r.ok ? "Fotografía subida correctamente." : (r.mensaje || "No fue posible subir la fotografía."), r.ok ? "exito" : "error");
        if (r.ok) {
          input.value = "";
          estado.fotoGrupoId = r.fileId;
          renderFotoGrupo(estado.fotoGrupoId);
        }
      }
    );
  });
});

/* ------------------------------------------------------------------ *
 * Roles del foro (catálogo del Documento Orientador) e instituciones
 * ------------------------------------------------------------------ */
function cargarRolesForo() {
  llamarServidor("rpcRolesForo", [], function (roles) {
    estado.rolesForo = roles || [];
    ["campoRolForoResponsable", "campoRolForoAsistente"].forEach(function (id) {
      var select = document.getElementById(id);
      if (!select) return;
      select.innerHTML = "";
      estado.rolesForo.forEach(function (rol) {
        var opcion = document.createElement("option");
        opcion.value = rol;
        opcion.textContent = rol;
        select.appendChild(opcion);
      });
    });
  });
}

function poblarSelectInstituciones(idSelect, instituciones) {
  var select = document.getElementById(idSelect);
  if (!select) return;
  select.innerHTML = "";
  (instituciones || []).forEach(function (ie) {
    var opcion = document.createElement("option");
    opcion.value = ie.idIE;
    opcion.textContent = ie.institucion;
    select.appendChild(opcion);
  });
}

/* ------------------------------------------------------------------ *
 * Responsable de envío y asistentes de envío
 * ------------------------------------------------------------------ */
document.getElementById("btnGuardarResponsable").addEventListener("click", function () {
  var datos = {
    nombre: document.getElementById("campoNombreResponsable").value.trim(),
    idIE: document.getElementById("campoIEResponsable").value,
    rolForo: document.getElementById("campoRolForoResponsable").value,
    correo: document.getElementById("campoCorreoResponsable").value.trim()
  };
  if (!datos.nombre || !datos.correo) {
    mostrarMensaje("mensajeResponsable", "Nombre y correo son obligatorios.", "error");
    return;
  }
  llamarServidor("rpcGuardarResponsable", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, "PRINCIPAL", datos], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeResponsable", r.mensaje || "No fue posible guardar.", "error");
      return;
    }
    mostrarMensaje("mensajeResponsable", "Responsable de envío guardado.", "exito");
    cargarResponsables();
  });
});

document.getElementById("btnMostrarFormAsistente").addEventListener("click", function () {

/* ------------------------------------------------------------------ *
 * Participación por estamento e institución (formato de 3.1) — UNA sola
 * tabla horizontal (filas = estamento, columnas = IE, fila Total),
 * conteo manual con autosuma, distinta del conteo de firmantes en vivo.
 * Se muestra y se puede editar tanto en Participación como en
 * Confirmación de caracterización (misma tabla, dos contenedores).
 * ------------------------------------------------------------------ */
var CONTENEDORES_PARTICIPACION_ESTAMENTO_ = ["contenedorParticipacionEstamento", "contenedorParticipacionEstamentoCaracterizacion"];
var RESUMENES_PARTICIPACION_ESTAMENTO_ = ["resumenParticipacionEstamento", "resumenParticipacionEstamentoCaracterizacion"];
var temporizadoresGuardadoParticipacionEstamento_ = {};

function cargarParticipacionEstamento(alTerminar) {
  if (!estado.idGrupo) {
    if (alTerminar) alTerminar();
    return;
  }
  llamarServidor("rpcObtenerParticipacionEstamento", [estado.idGrupo], function (datos) {
    estado.participacionEstamento = datos;
    CONTENEDORES_PARTICIPACION_ESTAMENTO_.forEach(function (idContenedor) {
      if (document.getElementById(idContenedor)) renderParticipacionEstamento(datos, idContenedor);
    });
    renderResumenParticipacionEstamentoTodo();
    if (alTerminar) alTerminar();
  }, function (error) {
    console.error("rpcObtenerParticipacionEstamento", error);
    if (alTerminar) alTerminar();
  });
}

function renderResumenParticipacionEstamentoTodo() {
  RESUMENES_PARTICIPACION_ESTAMENTO_.forEach(function (idResumen) {
    if (document.getElementById(idResumen)) {
      renderResumenParticipacionEstamento(idResumen, estado.participacionEstamento, estado.metodoAsistencia, estado.totalFirmantes || 0);
    }
  });
}

/** Recalcula en vivo la fila/columna de totales de la tabla horizontal que contiene este input, sin ir al servidor. */
function actualizarTotalesParticipacionEstamentoHorizontal_(tabla) {
  if (!tabla) return;
  var totalGeneral = 0;
  tabla.querySelectorAll("tbody tr[data-estamento]").forEach(function (fila) {
    var totalFila = 0;
    fila.querySelectorAll(".input-participantes-h").forEach(function (input) {
      totalFila += Math.max(0, parseInt(input.value, 10) || 0);
    });
    var celdaTotalFila = fila.querySelector(".total-fila-estamento");
    if (celdaTotalFila) celdaTotalFila.textContent = totalFila;
  });
  var filaTotal = tabla.querySelector("tfoot tr.fila-total-ie");
  if (filaTotal) {
    var granTotal = 0;
    filaTotal.querySelectorAll("[data-total-ie]").forEach(function (celda) {
      var idIE = celda.getAttribute("data-total-ie");
      var totalIE = 0;
      tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
        totalIE += Math.max(0, parseInt(input.value, 10) || 0);
      });
      celda.textContent = totalIE;
      granTotal += totalIE;
    });
    var celdaGranTotal = filaTotal.querySelector(".gran-total");
    if (celdaGranTotal) celdaGranTotal.textContent = granTotal;
  }
}

/** Autoguardado por columna (IE): junta los valores de esa IE en TODA la tabla que se está editando y los guarda. */
function guardarColumnaParticipacionEstamento_(tabla, idIE) {
  var valores = {};
  tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
    valores[input.dataset.estamento] = input.value;
  });
  llamarServidor("rpcGuardarParticipacionEstamentoIE", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, idIE, valores], function (r) {
    if (r.ok) {
      estado.participacionEstamento = null; // se refresca en segundo plano en la próxima carga, sin pisar lo que el usuario está escribiendo ahora
      llamarServidor("rpcObtenerParticipacionEstamento", [estado.idGrupo], function (datos) {
        estado.participacionEstamento = datos;
      });
    }
  });
}

document.addEventListener("input", function (evento) {
  var input = evento.target.closest(".input-participantes-h");
  if (!input) return;
  var tabla = input.closest("table.tabla-participacion-horizontal");
  if (!tabla) return;
  actualizarTotalesParticipacionEstamentoHorizontal_(tabla);

  var idIE = input.dataset.ie;
  var clave = tabla.id + "|" + idIE;
  clearTimeout(temporizadoresGuardadoParticipacionEstamento_[clave]);
  temporizadoresGuardadoParticipacionEstamento_[clave] = setTimeout(function () {
    guardarColumnaParticipacionEstamento_(tabla, idIE);
  }, 1500);
});

// "Sesión1" en el nombre es histórico: este arreglo cubre todos los

  "REFLEXIONES", "DESAFIOS", "APUESTAS", "CONCLUSIONES",
  "PRIORIDADES", "PROPUESTAS_COLECTIVAS", "ACUERDOS", "RUTA",
  "NECESIDADES_ARTICULACION_GRUPO", "OPORTUNIDADES_GRUPO",
  "PRIORIDADES_CE", "ACUERDOS_CE", "PROPUESTAS_CE", "RUTA_CE",
  "APORTE_PROPIO_S1_TITULO", "APORTE_PROPIO_S1_TEXTO", "APORTE_PROPIO_S2_TITULO", "APORTE_PROPIO_S2_TEXTO"
];
var temporizadorGuardadoSesion1 = null;

function recolectarCamposSesion1() {
  var campos = {};
  CAMPOS_SESION1.forEach(function (nombre) {

function guardarSesion1(manual) {

/* ------------------------------------------------------------------ *
 * Confirmación de caracterización — el botón "Confirmo que la
 * información es correcta" permanece oculto hasta que TODA la
 * información (ficha + matriz de participación) haya terminado de
 * cargar, para que nadie confirme antes de verla.
 * ------------------------------------------------------------------ */
function cargarConfirmacionCaracterizacion() {
  if (!estado.idGrupo) return;
  var boton = document.getElementById("btnConfirmarCaracterizacion");
  var aviso = document.getElementById("avisoCargandoCaracterizacion");
  boton.classList.add("oculto");
  if (aviso) aviso.classList.remove("oculto");

  var pendientes = 2;
  var marcarListo = function () {
    pendientes--;
    if (pendientes <= 0) {
      boton.classList.remove("oculto");
      if (aviso) aviso.classList.add("oculto");
    }
  };

  llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (estadoFirmantes) {
    llamarServidor("rpcListarResponsables", [estado.idGrupo], function (responsables) {
      renderFichaCaracterizacion(estado.grupo, estado.instituciones, estadoFirmantes, responsables);
      marcarListo();
    }, marcarListo);
  }, marcarListo);

  cargarParticipacionEstamento(marcarListo);
}

      if (ie) ie.rector = input.value;

/* ------------------------------------------------------------------ *
 * Sesión de preparación (pre-socialización) — cada IE elige responsable,
 * transición con su logo, responde 6 preguntas (punto de partida:
 * resumen sugerido del Informe Ejecutivo de esa IE) y las envía.
 * ------------------------------------------------------------------ */
function cargarListaIEPreparacion() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcPreparacionesEnviadasGrupo", [estado.idGrupo], function (enviadas) {
    var idsEnviados = {};
    (enviadas || []).forEach(function (e) { idsEnviados[e.idIE] = true; });
    renderListaIEPreparacion(estado.instituciones, idsEnviados);
    mostrarMensajePreparacionFaltante_(idsEnviados);
  });
}

/**
 * La Sesión de preparación NO es opcional: es condición para continuar a
 * Sesión 1 (spec: "La preparación no es opcional, es condición para
 * continuar a la sesión uno"). Verifica que TODAS las IE del grupo hayan
 * enviado sus aportes antes de permitir avanzar.
 */
function mostrarMensajePreparacionFaltante_(idsEnviados) {
  var faltantes = estado.instituciones.filter(function (ie) { return !idsEnviados[ie.idIE]; });
  var contenedor = document.getElementById("mensajePreparacionPendiente");
  if (!contenedor) return;
  if (!faltantes.length) {
    contenedor.innerHTML = "<div class='mensaje exito'>✅ Todas las instituciones completaron su preparación. Ya pueden continuar a Sesión 1.</div>";
  } else {
    contenedor.innerHTML =
      "<div class='mensaje info'>Faltan por enviar su preparación: " +
      faltantes.map(function (ie) { return escapeHtml(ie.institucion); }).join(", ") + "</div>";
  }
}

function verificarPreparacionCompletaGrupo_(alTerminar) {
  if (!estado.idGrupo) {
    alTerminar(false, []);
    return;
  }
  llamarServidor("rpcPreparacionesEnviadasGrupo", [estado.idGrupo], function (enviadas) {
    var idsEnviados = {};
    (enviadas || []).forEach(function (e) { idsEnviados[e.idIE] = true; });
    var faltantes = estado.instituciones.filter(function (ie) { return !idsEnviados[ie.idIE]; });
    alTerminar(faltantes.length === 0, faltantes);
  });
}

function intentarContinuarASesion1_(idContenedorMensaje) {
  verificarPreparacionCompletaGrupo_(function (completa, faltantes) {
    if (completa) {
      cambiarPantalla("pantallaSesion1");
      return;
    }
    var texto =
      "La Sesión de preparación no es opcional: todas las instituciones deben completar y enviar sus " +
      "aportes antes de continuar a Sesión 1. Faltan: " +
      faltantes.map(function (ie) { return ie.institucion; }).join(", ");
    if (idContenedorMensaje) {
      mostrarMensaje(idContenedorMensaje, texto, "error");
    } else {
      mostrarMensaje("mensajeGlobal", texto, "error");
    }
  });
}

document.getElementById("btnContinuarASesion1DesdeSeleccion").addEventListener("click", function () {

document.getElementById("btnContinuarASesion1DesdePreparacionIE").addEventListener("click", function () {

/** Transición de un único logo (mismo mecanismo del carrusel de bienvenida, pero un solo ítem). */
function ejecutarTransicionLogoIE(ie, alTerminar) {
  alTerminar = alTerminar || function () {};
  var overlay = document.getElementById("pantallaTransicionLogoIE");
  var contenedorItem = document.getElementById("itemTransicionLogoIE");
  if (!overlay || !contenedorItem || !ie) {
    alTerminar();
    return;
  }
  var html = "<div class='carrusel-ie-item'>";
  if (ie.logoId) {
    html += "<img src='" + urlImagenDrive(ie.logoId, 400) + "' alt='" + escapeHtml(ie.institucion) + "'>";
  } else {
    html += "<span class='icono-generico'>🏫</span>";
  }
  html += "<p class='nombre-ie'>" + escapeHtml(ie.institucion) + "</p>";
  html += "</div>";
  contenedorItem.innerHTML = html;
  overlay.classList.remove("oculto");
  setTimeout(function () {
    overlay.classList.add("oculto");
    alTerminar();
  }, 1600);
}

var CAMPOS_PREPARACION_ = ["P1", "P2", "P3", "P4", "P5", "P6"];
var temporizadorGuardadoPreparacion = null;

function cargarPreparacionIE() {

function recolectarRespuestasPreparacionIE() {

    var el = document.getElementById("campo_prep_" + clave);
    if (el) respuestas[clave] = el.value;
  });
  return respuestas;
}

/**
 * `callback` se llama SIEMPRE cuando el guardado termina (con r.ok), para
 * poder encadenar guardar → enviar sin condición de carrera: antes, al
 * hacer clic en "Enviar" inmediatamente después de "Guardar" (fire-and-
 * forget), el servidor a veces todavía no había escrito el resumen
 * sugerido en la hoja, y mostraba por error "Responda al menos una
 * pregunta antes de enviar" aunque la pantalla ya mostrara texto.
 */
function guardarPreparacionIEActual(manual, callback) {
  if (!estado.idGrupo || !estado.prepIdIE) {
    if (callback) callback(false);
    return;
  }
  llamarServidor(
    "rpcGuardarPreparacionIE",
    [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, estado.prepIdIE, estado.prepResponsable, recolectarRespuestasPreparacionIE()],
    function (r) {
      if (manual) mostrarMensaje("mensajePreparacionIE", r.ok ? "Avance guardado." : (r.mensaje || "No fue posible guardar."), r.ok ? "exito" : "error");
      if (callback) callback(!!r.ok);
    },
    function () {
      if (callback) callback(false);
    }
  );
}

document.addEventListener("input", function (evento) {
  var campo = evento.target.closest("[data-prep-pregunta]");
  if (!campo) return;
  clearTimeout(temporizadorGuardadoPreparacion);
  temporizadorGuardadoPreparacion = setTimeout(function () {
    guardarPreparacionIEActual(false);
  }, 2000);
});

document.getElementById("btnGuardarPreparacionIE").addEventListener("click", function () {
  guardarPreparacionIEActual(true);
});

document.getElementById("btnEnviarPreparacionIE").addEventListener("click", function () {
  if (!confirm("¿Enviar los aportes de " + estado.prepInstitucion + " para socializar con el grupo?")) return;
  // Guardar PRIMERO y esperar a que termine antes de enviar — evita la
  // condición de carrera que mostraba "Responda al menos una pregunta
  // antes de enviar" aunque el resumen sugerido ya estuviera en pantalla.
  guardarPreparacionIEActual(false, function (guardadoOk) {
    if (!guardadoOk) {
      mostrarMensaje("mensajePreparacionIE", "No fue posible guardar antes de enviar. Intente de nuevo.", "error");
      return;
    }
    llamarServidor("rpcMarcarPreparacionEnviada", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, estado.prepIdIE], function (r) {
      if (!r.ok) {
        mostrarMensaje("mensajePreparacionIE", r.mensaje || "No fue posible enviar.", "error");
        return;
      }
      mostrarMensaje(
        "mensajePreparacionIE",
        "✅ Aportes de la IE " + estado.prepInstitucion + " enviados para socializar oralmente con el grupo " +
          estado.grupo + " y la comunidad asistente.",
        "exito"
      );
      var banner = document.getElementById("bannerPreparacionYaCompletada");
      if (banner) banner.classList.remove("oculto");
    });
  });
});

/* ---- Sección de socialización en Sesión 1: aportes de preparación ya enviados por cada IE ---- */
function cargarSocializacionPreparacion() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcPreparacionesEnviadasGrupo", [estado.idGrupo], function (datos) {
    estado.socializacionPreparacion = datos || [];
    renderSocializacionPreparacion(estado.socializacionPreparacion);
  });
}

function abrirPantallaCompletaTexto(clave) {
  var partes = String(clave || "").split("|");
  var idIE = partes[0];
  var claveSeccion = partes[1];
  var ie = (estado.socializacionPreparacion || []).find(function (i) { return i.idIE === idIE; });
  if (!ie) return;
  var seccion = ie.secciones.find(function (s) { return s.clave === claveSeccion; });
  if (!seccion) return;
  document.getElementById("tituloPantallaCompletaTexto").textContent = ie.institucion + " — " + seccion.titulo;
  document.getElementById("cuerpoPantallaCompletaTexto").innerHTML = "<p>" + escapeHtml(seccion.texto).replace(/\n/g, "<br>") + "</p>";
  document.getElementById("pantallaCompletaTexto").classList.remove("oculto");
}
document.getElementById("btnCerrarPantallaCompletaTexto").addEventListener("click", function () {
  document.getElementById("pantallaCompletaTexto").classList.add("oculto");
});

function alternarTodosDesplegablesSocializacion() {
  var todos = document.querySelectorAll("#listaSocializacionPreparacion details.socializacion-ie");
  if (!todos.length) return;
  var abrirTodas = !todos[0].open;
  todos.forEach(function (d) { d.open = abrirTodas; });
  var boton = document.querySelector("[data-alternar-socializacion]");
  if (boton) boton.textContent = abrirTodas ? "Colapsar todas" : "Expandir todas";
}

/* ------------------------------------------------------------------ *
 * Revisión, cierre y generación del informe
 * ------------------------------------------------------------------ */
estado.valoracionCompletada = false;

function prepararCierre() {
  cargarValoracion();
}

function cargarValoracion() {
  llamarServidor("rpcObtenerValoracion", [estado.idGrupo], function (v) {
    estado.valoracionCompletada = !!v;
    mostrarEstadoValoracion(v);
    actualizarBotonGenerarInforme();
  });
}

function mostrarEstadoValoracion(valoracion) {
  var formulario = document.getElementById("valoracionFormulario");
  var yaEnviada = document.getElementById("valoracionYaEnviada");
  if (valoracion) {
    formulario.classList.add("oculto");
    var nota = Number(valoracion.NOTA_PROMEDIO || 0).toFixed(1);
    yaEnviada.innerHTML = "<p class='valoracion-ya-enviada'>✅ Valoración enviada — nota promedio: " + nota + " / 5.0</p>";
    yaEnviada.classList.remove("oculto");
  } else {
    formulario.classList.remove("oculto");
    yaEnviada.classList.add("oculto");
  }
}

function actualizarBotonGenerarInforme() {
  var boton = document.getElementById("btnGenerarInforme");
  var aviso = document.getElementById("avisoResponsablePrincipal");
  if (!estado.esPrincipal) {
    aviso.textContent = "Solo el responsable principal del grupo puede generar el informe definitivo. Puede seguir revisando mientras tanto.";
    boton.disabled = true;
  } else if (!estado.valoracionCompletada) {
    aviso.textContent = "Complete la valoración del Foro (arriba) antes de generar el informe.";
    boton.disabled = true;
  } else {
    aviso.textContent = "";
    boton.disabled = false;
  }
}

/* ---- Valoración del Foro — 4 preguntas de corazones + 1 abierta (copiado de FEI 3.1) ---- */
(function inicializarValoracion() {
  var contenedor = document.getElementById("tarjetaValoracion");
  if (!contenedor) return;
  var puntajes = { p1: 0, p2: 0, p3: 0, p4: 0 };

  function actualizarResultadoValoracion() {
    var bloqueAbierto = document.getElementById("valoracionAbiertaBloque");
    var bloqueResultado = document.getElementById("valoracionResultado");
    var notaTexto = document.getElementById("valoracionNotaTexto");
    var labelAbierto = document.getElementById("valoracionP5Label");

    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      bloqueAbierto.classList.add("oculto");
      bloqueResultado.classList.add("oculto");
      return;
    }

    var nota = (puntajes.p1 + puntajes.p2 + puntajes.p3 + puntajes.p4) / 4;
    var emoji, pregunta;
    if (nota < 3) {
      emoji = "😭";
      pregunta = "😭 ¡Debemos hacerlo mejor! ¿Qué sugerencias, recomendaciones o propuestas tienen para fortalecer la organización y desarrollo del Foro Educativo Comunal?";
    } else if (nota <= 4) {
      emoji = "😬";
      pregunta = "😬 ¡Pasamos raspados! ¿Quieren decirnos qué funcionó bien para " + (estado.grupo || "el grupo") + " y qué pudo haber sido mejor para fortalecer la organización y desarrollo del Foro Educativo Comunal?";
    } else {
      emoji = "🎉";
      pregunta = "🎉 ¡Bravo, gracias por el reconocimiento! ¿Quieren decirnos qué hicimos bien para " + (estado.grupo || "el grupo") + " para merecer el reconocimiento de ustedes? Y de paso también pueden decirnos cómo mejorar para fortalecer la organización y desarrollo del Foro Educativo Comunal.";
    }

    notaTexto.textContent = emoji + " Nuestra nota fue de: " + nota.toFixed(1) + " / 5.0 " + emoji;
    bloqueResultado.classList.remove("oculto");
    labelAbierto.textContent = pregunta;
    bloqueAbierto.classList.remove("oculto");
  }

  contenedor.querySelectorAll(".valoracion-pregunta[data-pregunta]").forEach(function (bloque) {
    var pregunta = bloque.dataset.pregunta;
    var corazones = Array.prototype.slice.call(bloque.querySelectorAll(".corazon-valoracion"));
    var bloqueMejora = contenedor.querySelector('.valoracion-mejora[data-mejora-de="' + pregunta + '"]');

    corazones.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var valor = Number(this.dataset.valor);
        puntajes[pregunta] = valor;
        corazones.forEach(function (b) {
          var v = Number(b.dataset.valor);
          b.textContent = v <= valor ? "❤️" : "🤍";
        });
        if (bloqueMejora) bloqueMejora.classList.toggle("oculto", valor > 2);
        actualizarResultadoValoracion();
      });
    });
  });

  document.getElementById("btnEnviarValoracion").addEventListener("click", function () {
    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      mostrarMensaje("mensajeValoracion", "Seleccione de 1 a 5 corazones en las cuatro preguntas antes de enviar.", "error");
      return;
    }
    var boton = document.getElementById("btnEnviarValoracion");
    boton.disabled = true;
    var respuestas = {
      p1: puntajes.p1, p2: puntajes.p2, p3: puntajes.p3, p4: puntajes.p4,
      p5: document.getElementById("valoracionP5").value,
      mejoraP1: document.getElementById("valoracionMejoraP1").value,
      mejoraP2: document.getElementById("valoracionMejoraP2").value,
      mejoraP3: document.getElementById("valoracionMejoraP3").value,
      mejoraP4: document.getElementById("valoracionMejoraP4").value
    };
    llamarServidor("rpcGuardarValoracion", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, respuestas], function (r) {
      boton.disabled = false;
      if (!r.ok) {
        mostrarMensaje("mensajeValoracion", r.mensaje || "No fue posible guardar la valoración.", "error");
        return;
      }
      mostrarMensaje("mensajeValoracion", "", "");
      estado.valoracionCompletada = true;
      mostrarEstadoValoracion({ NOTA_PROMEDIO: r.notaPromedio });
      actualizarBotonGenerarInforme();
    });
  });
})();

document.getElementById("btnGenerarInforme").addEventListener("click", function () {
  if (!confirm("¿Generar el informe definitivo del grupo? Esta acción crea el documento único que verán todas las IE del grupo.")) return;
  document.getElementById("btnGenerarInforme").disabled = true;
  llamarServidor("rpcGenerarInforme", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    document.getElementById("btnGenerarInforme").disabled = false;
    if (!r.ok) {
      mostrarMensaje("mensajeCierre", r.mensaje || "No fue posible generar el informe.", "error");
      return;
    }
    document.getElementById("enlaceInformeGenerado").href = r.url;
    document.getElementById("btnEnviarInformePorCorreo").disabled = true;
    mostrarMensaje("mensajeEnvioInforme", "", "");
    document.getElementById("notaEnvioInforme").textContent = "Descargue el informe (botón de arriba) para habilitar el envío por correo al responsable del grupo.";
    cambiarPantalla("pantallaInformeGenerado");
  });
});

/* ---- Descargar informe (habilita el envío por correo) y enviarlo ---- */
document.getElementById("enlaceInformeGenerado").addEventListener("click", function () {
  llamarServidor("rpcMarcarInformeDescargado", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (!r.ok) return;
    document.getElementById("btnEnviarInformePorCorreo").disabled = false;
    document.getElementById("notaEnvioInforme").textContent = "Ya puede enviar el informe por correo al responsable del grupo.";
  }, function () {});
});

document.getElementById("btnEnviarInformePorCorreo").addEventListener("click", function () {
  var boton = document.getElementById("btnEnviarInformePorCorreo");
  boton.disabled = true;
  llamarServidor("rpcEnviarInformePorCorreo", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    boton.disabled = false;
    if (!r.ok) {
      mostrarMensaje("mensajeEnvioInforme", r.mensaje || "No fue posible enviar el informe.", "error");
      return;
    }
    mostrarMensaje("mensajeEnvioInforme", r.diferido ? r.mensaje : "Informe enviado por correo.", "exito");
  });
});
</script>
