<script>
/**
 * JS.html — Foro Educativo Comunal Neiva 2026
 * Lógica de cliente. Reutiliza (adaptados a GRUPO) los patrones más
 * maduros de App.html en FEI 3.1 (docs/01-auditoria-fei-3.1.md §2.6):
 * dispositivoId persistente en localStorage, heartbeat periódico de
 * sesión, autoguardado con sincronización periódica al servidor.
 */

/* ------------------------------------------------------------------ *
 * Estado de cliente
 * ------------------------------------------------------------------ */
var estado = {
  dispositivoId: obtenerDispositivoId(),
  idGrupo: "",
  grupo: "",
  tokenSesion: "",
  esPrincipal: false,
  instituciones: [],
  ultimosFirmantes: [],
  metodoAsistencia: "",
  logoId: "",
  consentimientoGrupo: false,
  rolesForo: [],
  responsables: { principal: null, asistentes: [] },
  recursosSesion1Mostrado: false,
  fotoGrupoId: "",
  totalFirmantes: 0,
  participacionEstamento: null,
  prepIdIE: "",
  prepInstitucion: "",
  prepResponsable: "",
  socializacionPreparacion: [],
  explicacionConectaEducaVista: false,
  fotoGrupoMasTardeConfirmado: false
};

/** URL de imagen para un archivo de Drive público (logos) — mismo patrón usado para el QR de asistencia. */
function urlImagenDrive(idArchivo, ancho) {
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idArchivo) + "&sz=w" + (ancho || 600);
}

// El código de acceso se pide ANTES que cualquier otra pantalla (spec:
// "Código debe pedirse antes de cualquier pantalla") — Acceso va primero;
// Inicio/Presentación/Metodología se muestran DESPUÉS de validar el
// código (ver intentarValidarAcceso), como introducción antes de
// Participación.
var ORDEN_PANTALLAS = [
  "pantallaAcceso", "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia",
  "pantallaConsentimientoGrupo", "pantallaParticipacion", "pantallaConfirmacionCaracterizacion",
  "pantallaPreSocializacion", "pantallaSeleccionIEPreparacion", "pantallaPreparacionIE",
  "pantallaSesion1", "pantallaSesion2", "pantallaRevisionCierre",
  "pantallaInformeGenerado", "pantallaDespedida"
];

// Pantallas de "introducción" (no representan avance real del grupo, se
// muestran siempre al validar el código por primera vez) — nunca se
// retoma directamente en ellas ni se marcan como "última pantalla".
var PANTALLAS_NO_RESUMIBLES_ = ["pantallaAcceso", "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia"];

// Algunas pantallas necesitan una selección previa (ej. cuál IE se está
// preparando) que solo vive en el estado del dispositivo actual, no en el
// servidor — retomar ahí directamente fallaría, así que en esos casos se
// retoma en el paso anterior seguro (el selector correspondiente).
var MAPA_RESUMEN_PANTALLA_ = {
  pantallaPreparacionIE: "pantallaSeleccionIEPreparacion"
};

/** A qué pantalla ir para retomar el progreso del grupo, o null si debe mostrarse la introducción normal. */
function destinoResumenPantalla_(ultimaPantalla) {
  ultimaPantalla = String(ultimaPantalla || "").trim();
  if (!ultimaPantalla) return null;
  if (MAPA_RESUMEN_PANTALLA_[ultimaPantalla]) ultimaPantalla = MAPA_RESUMEN_PANTALLA_[ultimaPantalla];
  if (PANTALLAS_NO_RESUMIBLES_.indexOf(ultimaPantalla) !== -1) return null;
  if (ORDEN_PANTALLAS.indexOf(ultimaPantalla) === -1) return null;
  return ultimaPantalla;
}

function obtenerDispositivoId() {
  var clave = "forumComunalNeiva2026_dispositivo";
  try {
    var guardado = localStorage.getItem(clave);
    if (guardado) return guardado;
    var nuevo = "FEC-DEV-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(clave, nuevo);
    return nuevo;
  } catch (e) {
    return "FEC-DEV-" + Date.now().toString(36);
  }
}

/* ------------------------------------------------------------------ *
 * Llamadas al servidor (envoltorio de google.script.run)
 * ------------------------------------------------------------------ */
function llamarServidor(nombreFuncion, args, onExito, onError) {
  google.script.run
    .withSuccessHandler(function (resultado) {
      if (onExito) onExito(resultado);
    })
    .withFailureHandler(function (error) {
      console.error(nombreFuncion, error);
      if (onError) onError(error);
      else mostrarMensaje("mensajeGlobal", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    })
    [nombreFuncion].apply(null, args || []);
}

/* ------------------------------------------------------------------ *
 * Navegación entre pantallas
 * ------------------------------------------------------------------ */
function cambiarPantalla(idPantalla) {
  ORDEN_PANTALLAS.forEach(function (id) {
    document.getElementById(id).classList.toggle("visible", id === idPantalla);
  });
  var indice = ORDEN_PANTALLAS.indexOf(idPantalla);
  var porcentaje = Math.round(((indice + 1) / ORDEN_PANTALLAS.length) * 100);
  document.getElementById("barraProgresoRelleno").style.width = porcentaje + "%";
  window.scrollTo(0, 0);

  if (idPantalla === "pantallaParticipacion") {
    actualizarFirmantes();
    cargarResponsables();
    cargarParticipacionEstamento();
  }
  if (idPantalla === "pantallaConfirmacionCaracterizacion") cargarConfirmacionCaracterizacion();
  if (idPantalla === "pantallaSeleccionIEPreparacion") cargarListaIEPreparacion();
  if (idPantalla === "pantallaPreparacionIE") cargarPreparacionIE();
  if (idPantalla === "pantallaSesion1") {
    cargarSesion1();
    cargarRecursosSesion1();
    cargarSocializacionPreparacion();
    // "Continuar a Sesión 2" no se habilita hasta que Sesión 1 se envió
    // de forma definitiva (spec del usuario) — se refresca cada vez que
    // se entra a esta pantalla, no solo tras hacer clic en Enviar, para
    // que también quede correcto al retomar desde otro dispositivo/día.
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.sesion1Enviada = !!(estadoGrupo && estadoGrupo.sesion1Enviada);
      actualizarGateSesion2_();
      actualizarEstadoEnvioSesion1_();
    }, function () {});
  }
  if (idPantalla === "pantallaSesion2") {
    cargarConectaEduca();
    prepararPantallaConectaEduca();
    // Los campos de "Antes de registrar actores" y de "Construcción
    // colectiva" de Sesión 2 viven en la misma hoja/RPC que Sesión 1
    // (CAMPOS_SESION1) — se cargan aquí también por si se llega
    // directamente a esta pantalla (p. ej. al retomar el recorrido) sin
    // haber pasado antes por pantallaSesion1 en este dispositivo.
    cargarSesion1();
    // Cualquiera puede enviar Sesión 2, pero solo una vez (spec del
    // usuario) — si ya se envió, se muestra el aviso y se deshabilita el
    // botón, igual que Sesión 1.
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.sesion2Enviada = !!(estadoGrupo && estadoGrupo.sesion2Enviada);
      actualizarEstadoEnvioSesion2_();
    }, function () {});
  }
  if (idPantalla === "pantallaRevisionCierre") prepararCierre();
  if (idPantalla === "pantallaInformeGenerado") {
    mostrarMensaje("mensajeFaltaFotoFinalizar", "");
    actualizarAvisoDestinatariosInforme_();
    actualizarBotonFinalizarForo_();
  }

  // Recuerda la última pantalla del recorrido (compartida por todo el
  // grupo) para poder retomar ahí si se cae la señal o alguien entra
  // desde otro dispositivo (spec del usuario) — no se marca la
  // introducción, solo el avance real (ver destinoResumenPantalla_).
  if (estado.idGrupo && PANTALLAS_NO_RESUMIBLES_.indexOf(idPantalla) === -1) {
    llamarServidor("rpcGuardarUltimaPantalla", [estado.idGrupo, idPantalla], function () {}, function () {});
  }
}

document.addEventListener("click", function (evento) {
  var boton = evento.target.closest("[data-ir]");
  if (boton) cambiarPantalla(boton.getAttribute("data-ir"));

  var cerrar = evento.target.closest("[data-cerrar-modal]");
  if (cerrar) cerrarModal(cerrar.getAttribute("data-cerrar-modal"));

  var borrarActor = evento.target.closest("[data-borrar-actor]");
  if (borrarActor) borrarActorConectaEduca(borrarActor.getAttribute("data-borrar-actor"));

  var quitarAsistente = evento.target.closest("[data-quitar-asistente]");
  if (quitarAsistente) quitarAsistenteEnvio(quitarAsistente.getAttribute("data-quitar-asistente"));

  var elegirIEPreparacion = evento.target.closest("[data-preparar-ie]");
  if (elegirIEPreparacion) abrirModalResponsablePreparacion(elegirIEPreparacion.getAttribute("data-preparar-ie"));

  var verPantallaCompletaTexto = evento.target.closest("[data-ver-completo]");
  if (verPantallaCompletaTexto) abrirPantallaCompletaTexto(verPantallaCompletaTexto.getAttribute("data-ver-completo"));

  var alternarSocializacionIE = evento.target.closest("[data-alternar-socializacion]");
  if (alternarSocializacionIE) alternarTodosDesplegablesSocializacion();

  // "Cambiar fotografía" — inyectado dinámicamente por renderFotoGrupo
  // (Components.html) junto a la vista previa, en cualquier pantalla
  // donde se muestre la foto del grupo (spec del usuario: "permitir
  // cambiar foto"): reabre el formulario de subida ya oculto.
  var cambiarFoto = evento.target.closest("[data-cambiar-foto]");
  if (cambiarFoto) {
    var formularioFoto = document.getElementById(cambiarFoto.getAttribute("data-cambiar-foto"));
    if (formularioFoto) formularioFoto.classList.remove("oculto");
  }
});

// Rector(a) editable (Confirmación de caracterización): se guarda solo,
// al salir del campo (evento "change", sin icono ni botón de guardado
// aparte — el mismo patrón de autoguardado que el resto de la app).
document.addEventListener("change", function (evento) {
  var campoRector = evento.target.closest("[data-ie-rector]");
  if (campoRector) guardarRectorIE(campoRector.getAttribute("data-ie-rector"));
});

function abrirModal(id) {
  document.getElementById(id).classList.remove("oculto");
}
function cerrarModal(id) {
  document.getElementById(id).classList.add("oculto");
}

/**
 * Reemplazo de window.confirm() (nativo): dentro del iframe con sandbox
 * de HtmlService, confirm() puede verse feo (diálogo nativo del
 * navegador, fuera de todo control de diseño) o directamente no
 * mostrarse/no hacer nada según el navegador — bloqueado en silencio, lo
 * que hace que el botón "no haga nada". Este modal propio (#modalConfirmar
 * en Modal.html) es DOM puro, así que nunca queda bloqueado por el sandbox.
 */
var _callbackModalConfirmar_ = null;
var _callbackCancelarModalConfirmar_ = null;
/**
 * `opciones.textoConfirmar`/`opciones.textoCancelar` permiten reusar este
 * mismo modal para preguntas de sí/no con etiquetas propias (p.ej. "Es
 * correcto" / "No es correcto, corregir") en vez de "Confirmar"/"Cancelar"
 * — se restauran al valor por defecto en cada llamada, así que no hace
 * falta "resetearlos" a mano en cada sitio que use el modal genérico.
 */
function confirmarAccion(mensaje, callback, tituloOpcional, opciones) {
  document.getElementById("tituloModalConfirmar").textContent = tituloOpcional || "Confirmar";
  document.getElementById("mensajeModalConfirmar").textContent = mensaje;
  document.getElementById("btnAceptarModalConfirmar").textContent = (opciones && opciones.textoConfirmar) || "Confirmar";
  document.getElementById("btnCancelarModalConfirmar").textContent = (opciones && opciones.textoCancelar) || "Cancelar";
  _callbackModalConfirmar_ = callback;
  _callbackCancelarModalConfirmar_ = (opciones && opciones.alCancelar) || null;
  abrirModal("modalConfirmar");
}
document.getElementById("btnCancelarModalConfirmar").addEventListener("click", function () {
  var alCancelar = _callbackCancelarModalConfirmar_;
  _callbackModalConfirmar_ = null;
  _callbackCancelarModalConfirmar_ = null;
  cerrarModal("modalConfirmar");
  if (alCancelar) alCancelar();
});
document.getElementById("btnAceptarModalConfirmar").addEventListener("click", function () {
  var callback = _callbackModalConfirmar_;
  _callbackModalConfirmar_ = null;
  _callbackCancelarModalConfirmar_ = null;
  cerrarModal("modalConfirmar");
  if (callback) callback();
});

/* ------------------------------------------------------------------ *
 * Transición inicial (splash: logo de la Alcaldía/SEM Neiva primero,
 * luego el logo del Foro (#FORO), uno a la vez con crossfade — spec del
 * usuario: "usar imagen de transición luego de logo de la alcaldía").
 * ------------------------------------------------------------------ */
function iniciarSplashInicial() {
  var splash = document.getElementById("pantallaSplashInicial");
  if (!splash) return;
  var img = document.getElementById("imagenSplashActual");
  var secuencia = [LOGO_PIE_ID, LOGO_ENCABEZADO_ID].filter(Boolean);

  var cerrado = false;
  var temporizador = null;
  var cerrarSplash = function () {
    if (cerrado) return;
    cerrado = true;
    clearTimeout(temporizador);
    splash.classList.add("oculto");
  };

  if (!secuencia.length) {
    cerrarSplash();
    return;
  }

  var indice = 0;
  var mostrarSiguiente = function () {
    if (indice >= secuencia.length) {
      temporizador = setTimeout(cerrarSplash, 900);
      return;
    }
    img.classList.remove("visible");
    setTimeout(function () {
      if (cerrado) return;
      img.src = urlImagenDrive(secuencia[indice], 600);
      img.classList.add("visible");
    }, 250);
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 2200);
  };

  splash.addEventListener("click", cerrarSplash);
  mostrarSiguiente();
}
iniciarSplashInicial();

/* ------------------------------------------------------------------ *
 * Overlay de carga con imagen propia — un gif real (compartido por el
 * usuario vía Drive) por cada momento concreto, siempre acompañado de un
 * texto de apoyo:
 *   - acceso: justo después de validar el código, antes de entrar al Foro.
 *   - foto: al subir o cambiar la fotografía del grupo.
 *   - aportes: al enviar los aportes de Preparación (IE o invitado).
 *   - sesionDefinitiva: al enviar Sesión 1 o Sesión 2 de forma definitiva.
 *   - valoracionAsistencia: al enviar la valoración del Foro o al firmar
 *     la asistencia.
 *   - informe: al generar el informe del grupo.
 *   - responsable: al guardar el responsable de envío — sticker de Giphy
 *     "Cargando Sticker by dipielbella" (no es un gif de Drive del
 *     usuario, se mantiene del lote anterior).
 *
 * Los 6 gifs de Drive se embeben como data: URI (GIFS_DATAURI_, ver
 * GifsData.html) en vez de enlazarlos por URL a Drive: el hotlink externo
 * (drive.google.com/uc?export=view) dejó de servir el archivo de forma
 * fiable (Google lo está retirando por la eliminación de cookies de
 * terceros — devuelve 403 en muchos navegadores, que es exactamente el
 * "no cargan, solo aparece el círculo" que se reportó) y
 * drive.google.com/thumbnail NO anima los gifs (solo un fotograma fijo).
 * Con el gif embebido directamente en la página, carga siempre, sin
 * depender de Drive ni de políticas de Google que cambian con el tiempo.
 * Si por algún motivo igual fallara (img.onerror), el overlay cae de
 * vuelta al spinner genérico.
 * ------------------------------------------------------------------ */
var URL_STICKER_CARGANDO_RESPONSABLE_ = "https://media.giphy.com/media/SYIu9YMtvUc6tBzDH6/giphy.gif";
var GIFS_CARGA_ACCION_ = {
  acceso: { texto: "Ingresando al Foro…" },
  foto: { texto: "Subiendo fotografía…" },
  aportes: { texto: "Enviando aportes…" },
  sesionDefinitiva: { texto: "Enviando de forma definitiva…" },
  valoracionAsistencia: { texto: "Enviando…" },
  informe: { texto: "Generando el informe…" }
};

function mostrarCargaAccion_(tipo, texto) {
  var overlay = document.getElementById("overlayCargaAccion");
  if (!overlay) return;
  var img = document.getElementById("imagenCargaAccion");
  var emoji = document.getElementById("emojiCargaAccion");
  overlay.classList.remove("con-imagen-caida");
  img.onerror = function () { overlay.classList.add("con-imagen-caida"); };

  var gif = GIFS_CARGA_ACCION_[tipo];
  var dataUri = typeof GIFS_DATAURI_ !== "undefined" ? GIFS_DATAURI_[tipo] : null;
  if (tipo === "responsable") {
    img.src = URL_STICKER_CARGANDO_RESPONSABLE_;
    img.classList.remove("oculto");
    emoji.classList.add("oculto");
  } else if (gif && dataUri) {
    img.src = dataUri;
    img.classList.remove("oculto");
    emoji.classList.add("oculto");
  } else {
    img.classList.add("oculto");
    emoji.textContent = "⏳";
    emoji.className = "emoji-carga-accion";
  }
  document.getElementById("textoCargaAccion").textContent = texto || (gif && gif.texto) || "Cargando…";
  overlay.classList.remove("oculto");
}
function ocultarCargaAccion_() {
  var overlay = document.getElementById("overlayCargaAccion");
  if (overlay) overlay.classList.add("oculto");
}

/* ------------------------------------------------------------------ *
 * Carrusel de bienvenida — cada I.E. del grupo aparece una a una (1s
 * c/u), justo después de validar el código de acceso (no antes).
 * ------------------------------------------------------------------ */
function mostrarCarruselIE(alTerminar) {
  alTerminar = alTerminar || function () {};
  llamarServidor("rpcInstitucionesDelGrupo", [estado.idGrupo], function (instituciones) {
    if (!instituciones || !instituciones.length) {
      alTerminar();
      return;
    }
    ejecutarCarruselIE(instituciones, alTerminar);
  }, alTerminar);
}

function ejecutarCarruselIE(instituciones, alTerminar) {
  var overlay = document.getElementById("pantallaCarruselIE");
  var contenedorItem = document.getElementById("itemCarruselIE");
  var progreso = document.getElementById("progresoCarruselIE");
  overlay.classList.remove("oculto");

  var indice = 0;
  var temporizador = null;

  var terminar = function () {
    if (temporizador) clearTimeout(temporizador);
    overlay.classList.add("oculto");
    alTerminar();
  };

  var mostrarSiguiente = function () {
    if (indice >= instituciones.length) {
      terminar();
      return;
    }
    var ie = instituciones[indice];
    var html = "<div class='carrusel-ie-item'>";
    if (ie.logoId) {
      html += "<img src='" + urlImagenDrive(ie.logoId, 400) + "' alt='" + escapeHtml(ie.institucion) + "'>";
    } else {
      html += "<span class='icono-generico'>🏫</span>";
    }
    html += "<p class='nombre-ie'>" + escapeHtml(ie.institucion) + "</p>";
    if (ie.grupo) html += "<p class='grupo-ie'>" + escapeHtml(ie.grupo) + "</p>";
    html += "</div>";
    contenedorItem.innerHTML = html;
    progreso.textContent = (indice + 1) + " / " + instituciones.length;
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 1000);
  };

  document.getElementById("btnSaltarCarruselIE").onclick = terminar;
  mostrarSiguiente();
}

document.getElementById("btnComenzarForo").addEventListener("click", function () {
  cambiarPantalla("pantallaPresentacion");
});

/* ------------------------------------------------------------------ *
 * Contador de palabras (Sesión 1 y Sesión 2 — preguntas abiertas)
 * ------------------------------------------------------------------ */
function inicializarContadoresPalabras() {
  var textareas = document.querySelectorAll("#pantallaSesion1 textarea, #pantallaSesion2 textarea");
  textareas.forEach(function (textarea) {
    var contador = document.createElement("p");
    contador.className = "contador-palabras";
    textarea.insertAdjacentElement("afterend", contador);
    var min = parseInt(textarea.dataset.minPalabras, 10) || 0;
    var max = parseInt(textarea.dataset.maxPalabras, 10) || 0;
    var actualizar = function () {
      var texto = textarea.value.trim();
      var palabras = texto ? texto.split(/\s+/).length : 0;
      var texto2 = palabras + (palabras === 1 ? " palabra" : " palabras");
      if (min || max) {
        texto2 += " (mínimo " + min + ", máximo " + max + ")";
        var enRango = palabras >= min && palabras <= max;
        contador.classList.toggle("fuera-de-rango", !enRango);
        contador.classList.toggle("en-rango", enRango);
      }
      contador.textContent = texto2;
    };
    textarea.addEventListener("input", actualizar);
    actualizar();
  });
}
inicializarContadoresPalabras();

/* ------------------------------------------------------------------ *
 * Recursos descargables (Informe Ejecutivo, etc.) — la ventana emergente
 * con estos archivos solo aparece automáticamente en Preparación (para
 * la IE, ver cargarPreparacionIE), nunca en Socialización/Sesión 1 (spec
 * del usuario). En Sesión 1 se deja únicamente la sección en pantalla
 * "📎 Archivos de apoyo para esta sesión" (listaRecursosSesion1Botones),
 * sin ventana emergente.
 * ------------------------------------------------------------------ */
function cargarRecursosSesion1() {
  llamarServidor("rpcObtenerRecursosSesion1", [estado.idGrupo], function (recursos) {
    renderRecursosSesion1(recursos || []);
  });
}

/* ------------------------------------------------------------------ *
 * Acceso
 * ------------------------------------------------------------------ */
if (NOMBRE_GRUPO_ACCESO) {
  document.getElementById("nombreGrupoAcceso").textContent = "Grupo: " + NOMBRE_GRUPO_ACCESO;
}

function intentarValidarAcceso(forzar) {
  var codigo = document.getElementById("campoCodigoAcceso").value.trim();
  if (!TOKEN_ACCESO) {
    mostrarMensaje("mensajeAcceso", "El enlace de acceso no incluye un token válido.", "error");
    return;
  }
  if (!codigo) {
    mostrarMensaje("mensajeAcceso", "Ingrese el código de acceso.", "error");
    return;
  }
  mostrarCargaAccion_("acceso", "Validando código de acceso…");
  llamarServidor("rpcValidarAcceso", [TOKEN_ACCESO, codigo, estado.dispositivoId, !!forzar], function (r) {
    ocultarCargaAccion_();
    if (!r.ok) {
      if (r.codigo === "SESION_YA_ABIERTA") {
        document.getElementById("mensajeTomaSesion").textContent = r.mensaje;
        abrirModal("modalTomaSesion");
        return;
      }
      mostrarMensaje("mensajeAcceso", r.mensaje || "No fue posible validar el acceso.", "error");
      return;
    }
    estado.idGrupo = r.idGrupo;
    estado.grupo = r.grupo;
    estado.tokenSesion = r.tokenSesion;
    estado.esPrincipal = r.esPrincipal;
    estado.instituciones = r.instituciones || [];
    estado.metodoAsistencia = r.metodoAsistencia || "";
    estado.logoId = r.logoId || "";
    estado.consentimientoGrupo = !!r.consentimientoGrupo;
    estado.fotoGrupoId = r.fotoGrupoId || "";

    document.getElementById("nombreGrupoParticipacion").textContent = r.grupo;
    var elNombreGrupoAviso = document.getElementById("nombreGrupoAvisoPlazoFirmas");
    if (elNombreGrupoAviso) elNombreGrupoAviso.textContent = r.grupo;
    var elNombreGrupoBienvenida = document.getElementById("nombreGrupoBienvenida");
    if (elNombreGrupoBienvenida) elNombreGrupoBienvenida.textContent = r.grupo;
    poblarSelectInstituciones("campoIEResponsable", estado.instituciones);
    poblarSelectInstituciones("campoIEAsistente", estado.instituciones);
    renderListaInstituciones(estado.instituciones);
    actualizarEtiquetasConectaEducaGrupo();
    renderFotoGrupo(estado.fotoGrupoId, "previaFotoGrupo", "formularioFotoGrupo", estado.grupo);
    document.getElementById("panelFirmantes").classList.remove("oculto");

    mostrarPanelMetodoAsistencia(estado.metodoAsistencia);
    iniciarHeartbeat();
    iniciarPollingFirmantes();
    cargarRolesForo();
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.asistenciaCerrada = !!(estadoGrupo && estadoGrupo.informeGenerado);
      estado.informeGenerado = !!(estadoGrupo && estadoGrupo.informeGenerado);
      actualizarPanelFirmantesCerrado_();
      actualizarBloqueoMetodoAsistencia_();
    }, function () {});

    // Retomar donde el grupo se quedó (spec del usuario: "si se cae la
    // señal o se cambia de dispositivo, solo pedir código de ingreso y
    // retomar desde la última parte que se dejó") — si el grupo (desde
    // cualquier dispositivo) ya había avanzado más allá de la
    // introducción, se salta el carrusel de bienvenida y la introducción
    // (Inicio/Presentación/Metodología) y se va directo a esa pantalla.
    var destinoResumen = destinoResumenPantalla_(r.ultimaPantalla);
    if (destinoResumen) {
      cambiarPantalla(destinoResumen);
      return;
    }

    // El "recorrido" de logos de las IE del grupo va justo después de
    // validar el código de acceso (spec), no antes — en ese punto ya se
    // conoce con certeza a qué grupo pertenece este dispositivo. El
    // código se pide antes que cualquier otra pantalla, así que Inicio/
    // Presentación/Metodología (la introducción) se muestran DESPUÉS de
    // validar, no antes.
    mostrarCarruselIE(function () {
      cambiarPantalla("pantallaInicio");
    });
  }, function (error) {
    ocultarCargaAccion_();
    console.error("rpcValidarAcceso", error);
    mostrarMensaje("mensajeAcceso", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
  });
}

// Paso 1 tras elegir el tipo de invitado: elegir el GRUPO (1 a 6), no la
// institución directamente (spec del usuario: "no debe aparecer IE en el
// listado de IE para invitados, si no grupos 1 a 6") — la institución se

document.querySelectorAll("[data-invitado-tipo]").forEach(function (boton) {

/**
 * Antes de responder las preguntas, cada invitado (estudiante/egresado o
 * adulto responsable) diligencia unos datos de caracterización — spec del
 * usuario: nombre, IE (ya elegida), edad, sexo, rol y (para estudiantes)
 * años estudiando en la IE; o (para adultos) vínculo y rol dentro de la
 * IE. Nunca se muestran en pantalla, solo quedan disponibles al final en
 * el informe consolidado del grupo (Informes.gs).
 */
function abrirCaracterizacionInvitado_() {
  document.getElementById("campoNombreInvitado").value = "";
  document.getElementById("campoEdadInvitado").value = "";
  document.getElementById("campoSexoInvitado").selectedIndex = 0;
  document.getElementById("campoRolEstudianteInvitado").selectedIndex = 0;
  document.getElementById("campoAniosEstudiandoInvitado").value = "";
  document.getElementById("campoVinculoIEInvitado").selectedIndex = 0;
  document.getElementById("campoRolIEInvitado").selectedIndex = 0;
  var esEstudiante = estadoInvitado.tipoInvitado === "ESTUDIANTE";
  document.getElementById("camposInvitadoEstudiante").classList.toggle("oculto", !esEstudiante);
  document.getElementById("camposInvitadoAcudiente").classList.toggle("oculto", esEstudiante);
  mostrarMensaje("mensajeInvitadoCaracterizacion", "");
  document.getElementById("overlayInvitadoCaracterizacion").classList.remove("oculto");
}
document.getElementById("btnCerrarInvitadoCaracterizacion").addEventListener("click", function () {
  document.getElementById("overlayInvitadoCaracterizacion").classList.add("oculto");
  document.getElementById("overlayInvitadoIE").classList.remove("oculto");
});
document.getElementById("btnContinuarInvitadoCaracterizacion").addEventListener("click", function () {
  var nombre = document.getElementById("campoNombreInvitado").value.trim();
  if (!nombre) {
    mostrarMensaje("mensajeInvitadoCaracterizacion", "Ingresa tu nombre completo.", "error");
    return;
  }
  var datos = {
    nombre: nombre,
    edad: document.getElementById("campoEdadInvitado").value,
    sexo: document.getElementById("campoSexoInvitado").value
  };
  if (estadoInvitado.tipoInvitado === "ESTUDIANTE") {
    datos.rolEstudiante = document.getElementById("campoRolEstudianteInvitado").value;
    datos.aniosEstudiando = document.getElementById("campoAniosEstudiandoInvitado").value;
  } else {
    datos.vinculoIE = document.getElementById("campoVinculoIEInvitado").value;
    datos.rolIEAcudiente = document.getElementById("campoRolIEInvitado").value;
  }
  llamarServidor(
    "rpcGuardarCaracterizacionInvitado",
    [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estado.dispositivoId, datos],
    function (r) {
      if (!r.ok) {
        mostrarMensaje("mensajeInvitadoCaracterizacion", r.mensaje || "No fue posible guardar. Intenta de nuevo.", "error");
        return;
      }
      document.getElementById("overlayInvitadoCaracterizacion").classList.add("oculto");
      abrirPreparacionInvitado_();
    },
    function (error) {
      console.error("rpcGuardarCaracterizacionInvitado", error);
      mostrarMensaje("mensajeInvitadoCaracterizacion", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    }
  );
});

function abrirPreparacionInvitado_() {
  document.getElementById("nombreIEInvitadoPrep").textContent = estadoInvitado.institucion;
  document.getElementById("tipoInvitadoTexto").textContent =
    estadoInvitado.tipoInvitado === "ESTUDIANTE" ? "Estudiante o egresado(a)" : "Adulto responsable de un(a) estudiante";
  llamarServidor(
    "rpcObtenerPreparacionIEInvitado",
    [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estado.dispositivoId],
    function (datos) {
      if (!datos) return;
      renderPreguntasInvitado(datos.preguntas, datos.respuestas);

  );
  document.getElementById("overlayInvitadoPreparacion").classList.remove("oculto");
}

function recolectarRespuestasInvitado_() {
  var respuestas = {};
  CAMPOS_PREPARACION_.forEach(function (clave) {

    if (el) respuestas[clave] = el.value;
  });
  return respuestas;
}

var temporizadorGuardadoInvitado_ = null;
function guardarPreparacionInvitadoActual_(manual, callback) {
  llamarServidor(
    "rpcGuardarPreparacionIEInvitado",
    [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estadoInvitado.tipoInvitado, estado.dispositivoId, recolectarRespuestasInvitado_()],
    function (r) {
      if (manual) mostrarMensaje("mensajePreparacionInvitado", r.ok ? "Avance guardado." : (r.mensaje || "No fue posible guardar."), r.ok ? "exito" : "error");
      if (callback) callback(!!r.ok);
    },
    function () {
      if (callback) callback(false);
    }
  );
}

document.addEventListener("input", function (evento) {
  var campo = evento.target.closest("[data-inv-prep-pregunta]");
  if (!campo) return;
  clearTimeout(temporizadorGuardadoInvitado_);
  temporizadorGuardadoInvitado_ = setTimeout(function () {

  }, 2000);
});

document.getElementById("btnEnviarPreparacionInvitado").addEventListener("click", function () {
  confirmarAccion("¿Enviar tus aportes para " + estadoInvitado.institucion + "?", function () {
    guardarPreparacionInvitadoActual_(false, function (guardadoOk) {
      if (!guardadoOk) {
        mostrarMensaje("mensajePreparacionInvitado", "No fue posible guardar antes de enviar. Intenta de nuevo.", "error");
        return;
      }
      mostrarCargaAccion_("aportes");
      llamarServidor(
        "rpcMarcarPreparacionEnviadaInvitado",
        [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estado.dispositivoId],
        function (r) {
          ocultarCargaAccion_();
          if (!r.ok) {
            mostrarMensaje("mensajePreparacionInvitado", r.mensaje || "No fue posible enviar.", "error");
            return;
          }
          // "envía aportes y no tiene más acceso" — se cierra la preparación

          document.getElementById("overlayInvitadoFinalizado").classList.remove("oculto");

        function (error) {
          ocultarCargaAccion_();
          console.error("rpcMarcarPreparacionEnviadaInvitado", error);
          mostrarMensaje("mensajePreparacionInvitado", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
        }
      );

});

/* ------------------------------------------------------------------ *
 * Heartbeat de sesión (mantiene el cupo de dispositivo activo)
 * ------------------------------------------------------------------ */
/**
 * El heartbeat mantiene vivo el cupo de este dispositivo en segundo
 * plano; ya NO interrumpe con un mensaje de error si un tick falla (ni
 * siquiera si el cupo se perdió) — con el tope de sesiones ampliado y la
 * poda automática de cupos inactivos (Session.gs, podarSesionesInactivas_)
 * esto ya no debería ocurrir en uso normal, y si de verdad ocurre, la
 * PRÓXIMA acción de escritura (guardar/enviar) lo reporta con un mensaje
 * concreto y accionable en el contexto donde ocurre, en vez de una alerta
 * genérica y alarmante que interrumpe a mitad de cualquier pantalla.
 */
function iniciarHeartbeat() {
  setInterval(function () {
    if (!estado.idGrupo) return;
    llamarServidor(
      "rpcMantenerSesion",
      [estado.idGrupo, estado.dispositivoId, estado.tokenSesion],
      function () {},
      function () {}
    );
  }, 30000);
}

/* ------------------------------------------------------------------ *
 * Método de asistencia (QR/enlace o listado físico + fotografía)
 * ------------------------------------------------------------------ */
function mostrarPanelMetodoAsistencia(metodo) {
  document.getElementById("panelMetodoQR").classList.toggle("oculto", metodo !== "QR");
  document.getElementById("panelMetodoListado").classList.toggle("oculto", metodo !== "LISTADO");
  // Métodos EXCLUSIVOS: con PDF (LISTADO) desaparece el conteo de firmas en
  // vivo (no aplica, nadie firma por celular); con QR sigue visible.
  var ocultarConteoFirmas = metodo === "LISTADO";
  document.getElementById("panelFirmantes").classList.toggle("oculto", ocultarConteoFirmas || !metodo);
  var filaContador = document.getElementById("filaContadorParticipantesTarjeta");
  if (filaContador) filaContador.classList.toggle("oculto", ocultarConteoFirmas);
  if (metodo === "QR") cargarEnlaceAsistencia();
  actualizarBloqueoMetodoAsistencia_();
}

/**
 * Con QR elegido, se puede cambiar a listado en PDF SIEMPRE QUE el
 * informe del grupo todavía no se haya generado (spec del usuario:
 * "permitir cambio a PDF si es posible siempre y cuando no se haya
 * generado un informe" — corrige el bloqueo total del lote anterior). Si
 * tienen PDF, pueden pasarse a QR en cualquier momento, generado o no.
 */
function actualizarBloqueoMetodoAsistencia_() {
  var btnListado = document.getElementById("btnMetodoListado");
  if (!btnListado) return;
  var bloqueado = estado.metodoAsistencia === "QR" && !!estado.asistenciaCerrada;
  btnListado.disabled = bloqueado;
  btnListado.title = bloqueado
    ? "El informe del grupo ya fue generado: no es posible cambiar de QR/enlace a listado en PDF."
    : "";
}

function cargarEnlaceAsistencia() {
  llamarServidor("rpcUrlAsistencia", [estado.idGrupo], function (url) {
    var enlace = document.getElementById("enlaceAsistenciaQR");
    enlace.href = url;
    enlace.textContent = url;
    document.getElementById("imagenQRAsistencia").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(url);
  });
}

function elegirMetodoAsistencia(metodo) {
  mostrarPanelMetodoAsistencia(metodo);
  estado.metodoAsistencia = metodo;
  mostrarMensaje("mensajeSeleccionMetodo", "");
  document.getElementById("btnMetodoQR").classList.toggle("btn-metodo-activo", metodo === "QR");
  document.getElementById("btnMetodoListado").classList.toggle("btn-metodo-activo", metodo === "LISTADO");
  renderResumenParticipacionEstamentoTodo();
  llamarServidor("rpcGuardarMetodoAsistencia", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, metodo], function (r) {
    if (!r.ok) mostrarMensaje("mensajeMetodoAsistencia", r.mensaje || "No fue posible guardar el método.", "error");
  });
}

document.getElementById("btnMetodoQR").addEventListener("click", function () {
  elegirMetodoAsistencia("QR");
});
document.getElementById("btnMetodoListado").addEventListener("click", function () {
  elegirMetodoAsistencia("LISTADO");
});

// Es obligatorio elegir exactamente un método (QR o PDF) antes de continuar.
document.getElementById("btnContinuarAParticipacion").addEventListener("click", function () {
  if (estado.metodoAsistencia !== "QR" && estado.metodoAsistencia !== "LISTADO") {
    mostrarMensaje("mensajeSeleccionMetodo", "Elige un método de asistencia (QR o PDF) antes de continuar.", "error");
    document.getElementById("mensajeSeleccionMetodo").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // Ni se subió la foto ni se confirmó "más tarde" — antes de dejar
  // avanzar, se pregunta explícitamente qué se quiere hacer (spec: "debe
  // aparecer anuncio diciendo que si desea subir foto ahora o más adelante").
  if (!estado.fotoGrupoId && !estado.fotoGrupoMasTardeConfirmado) {
    confirmarAccion(
      "Todavía no has subido la fotografía general del grupo. ¿Deseas subirla ahora o continuar y subirla más adelante?",
      function () {
        estado.fotoGrupoMasTardeConfirmado = true;
        document.getElementById("btnContinuarAParticipacion").click();
      },
      "Fotografía del grupo",
      { textoConfirmar: "Continuar, subirla más adelante", textoCancelar: "Subir ahora" }
    );
    document.getElementById("formularioFotoGrupo").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // La advertencia de "Verifique la participación por institución" ya NO
  // se muestra aquí (spec del usuario: "solo debe aparecer en la
  // confirmación de autorización [de caracterización], no antes") — queda
  // únicamente en btnConfirmarCaracterizacion, más abajo.
  cambiarPantalla("pantallaConfirmacionCaracterizacion");
});

/** Instituciones del grupo cuya columna en la matriz de participación por estamento quedó en cero. */
function institucionesSinParticipacionMarcada_() {
  var datos = estado.participacionEstamento;
  if (!datos || !datos.instituciones) return [];
  return datos.instituciones
    .filter(function (ie) { return !ie.total; })
    .map(function (ie) { return ie.institucion; });
}

// La advertencia "Verifique la participación por institución" solo se
// muestra aquí, en la confirmación de caracterización (spec del
// usuario) — no antes, en Participación (ver btnContinuarAParticipacion).
document.getElementById("btnConfirmarCaracterizacion").addEventListener("click", function () {
  var institucionesSinMarcar = institucionesSinParticipacionMarcada_();
  if (institucionesSinMarcar.length) {
    confirmarAccion(
      "Estas instituciones no tienen ninguna persona registrada en el cuadro de \"Participación por " +
        "estamento e institución\": " + institucionesSinMarcar.join(", ") + ". ¿La información es correcta?",
      function () {
        cambiarPantalla("pantallaPreSocializacion");
      },
      "Verifique la participación por institución",
      { textoConfirmar: "Es correcto", textoCancelar: "No es correcto, voy a corregir" }
    );

  }
  cambiarPantalla("pantallaPreSocializacion");
});

document.getElementById("btnCopiarEnlaceAsistencia").addEventListener("click", function () {

/* ---- Vista de pantalla completa del QR (para proyectar en el evento) ---- */

      document.getElementById("contadorFirmantesPantallaCompleta").textContent = r.total || 0;
    }, function () {});

document.getElementById("btnCerrarPantallaCompletaQR").addEventListener("click", function () {
  clearInterval(intervaloPantallaCompletaQR);

/** Número real del grupo (p.ej. "Grupo 3" -> "3"), para reemplazar los "(#)" de las etiquetas. */
function numeroGrupoActual_() {
  var m = String(estado.grupo || "").match(/\d+/);
  return m ? m[0] : String(estado.grupo || "").trim();
}

/**
 * Lista de comunas (y "zona rural" si aplica) de las IE del grupo, en
 * texto natural sin paréntesis — p.ej. "1 y 2" o "1, 2 y zona rural".
 */
function textoComunasGrupoActual_() {
  var numericas = [];
  var tieneRural = false;
  (estado.instituciones || []).forEach(function (ie) {
    var c = String(ie.comuna || "").trim();
    if (!c) return;
    if (/^\d+$/.test(c)) {
      if (numericas.indexOf(c) === -1) numericas.push(c);
    } else {
      tieneRural = true;
    }
  });
  numericas.sort(function (a, b) {
    return Number(a) - Number(b);
  });
  var partes = numericas.map(function (n) {
    return n;
  });
  if (tieneRural) partes.push("zona rural");
  if (!partes.length) return "comunas del grupo";
  if (partes.length === 1) return "comuna " + partes[0];
  return "comunas " + partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1];
}

/**
 * Reemplaza los "grupo (#)" / "(comunas # y rural)" fijos de las etiquetas
 * de la segunda parte de ConectaEduca por el número de grupo y las
 * comunas reales del grupo actual — ya sin paréntesis.
 */
function actualizarEtiquetasConectaEducaGrupo() {
  var numeroGrupo = numeroGrupoActual_();
  ["numeroGrupoCE_PRIORIDADES", "numeroGrupoCE_PROPUESTAS", "numeroGrupoCE_RUTA"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = "Grupo " + numeroGrupo;
  });
  var elComunas = document.getElementById("comunasGrupoCE_ACUERDOS");
  if (elComunas) elComunas.textContent = textoComunasGrupoActual_();
}

/* ------------------------------------------------------------------ *
 * Correo: mismo autocompletado (@g -> @gmail.com, @h -> @hotmail.com) y
 * validación de formato que la página pública de asistencia
 * (AsistenciaPublica.html) — reutilizado aquí para responsable/asistentes
 * de envío.
 * ------------------------------------------------------------------ */
var REGEX_CORREO_ = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function activarAutocompletadoCorreo_(idCampo) {
  var campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.addEventListener("input", function () {
    var m = /^([^@\s]+)@(g|h)$/i.exec(campo.value);
    if (m) campo.value = m[1] + "@" + (m[2].toLowerCase() === "g" ? "gmail.com" : "hotmail.com");
  });
}
/** true si el campo tiene un correo con formato válido; si no, lo reporta en idMensaje y enfoca el campo. */
function correoValido_(idCampo, idMensaje) {
  var campo = document.getElementById(idCampo);
  var valor = campo ? campo.value.trim() : "";
  if (REGEX_CORREO_.test(valor)) return true;
  mostrarMensaje(idMensaje, "Corrige el formato del correo electrónico (ejemplo: nombre@correo.com).", "error");
  if (campo) campo.focus();
  return false;
}

/** Recalcula en vivo la fila/columna de totales de la tabla horizontal que contiene este input, sin ir al servidor. */
function actualizarTotalesParticipacionEstamentoHorizontal_(tabla) {
  if (!tabla) return;
  var totalGeneral = 0;
  tabla.querySelectorAll("tbody tr[data-estamento]").forEach(function (fila) {
    var totalFila = 0;
    fila.querySelectorAll(".input-participantes-h").forEach(function (input) {
      totalFila += Math.max(0, parseInt(input.value, 10) || 0);
    });
    var celdaTotalFila = fila.querySelector(".total-fila-estamento");
    if (celdaTotalFila) celdaTotalFila.textContent = totalFila;
  });
  var filaTotal = tabla.querySelector("tfoot tr.fila-total-ie");
  if (filaTotal) {
    var granTotal = 0;
    filaTotal.querySelectorAll("[data-total-ie]").forEach(function (celda) {
      var idIE = celda.getAttribute("data-total-ie");
      var totalIE = 0;
      tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
        totalIE += Math.max(0, parseInt(input.value, 10) || 0);
      });
      celda.textContent = totalIE;
      granTotal += totalIE;
    });
    var celdaGranTotal = filaTotal.querySelector(".gran-total");
    if (celdaGranTotal) celdaGranTotal.textContent = granTotal;
  }
}

/** Autoguardado por columna (IE): junta los valores de esa IE en TODA la tabla que se está editando y los guarda. */
function guardarColumnaParticipacionEstamento_(tabla, idIE) {
  var valores = {};
  tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
    valores[input.dataset.estamento] = input.value;
  });
  llamarServidor("rpcGuardarParticipacionEstamentoIE", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, idIE, valores], function (r) {
    if (r.ok) {
      estado.participacionEstamento = null; // se refresca en segundo plano en la próxima carga, sin pisar lo que el usuario está escribiendo ahora
      llamarServidor("rpcObtenerParticipacionEstamento", [estado.idGrupo], function (datos) {
        estado.participacionEstamento = datos;
      });
    }
  });
}

document.addEventListener("input", function (evento) {
  var input = evento.target.closest(".input-participantes-h");
  if (!input) return;
  var tabla = input.closest("table.tabla-participacion-horizontal");
  if (!tabla) return;
  actualizarTotalesParticipacionEstamentoHorizontal_(tabla);

  var idIE = input.dataset.ie;
  var clave = tabla.id + "|" + idIE;
  clearTimeout(temporizadoresGuardadoParticipacionEstamento_[clave]);
  temporizadoresGuardadoParticipacionEstamento_[clave] = setTimeout(function () {
    guardarColumnaParticipacionEstamento_(tabla, idIE);
  }, 1500);
});

 * nube (spec del usuario: "verifica guardado local y guardado en la
 * nube"). Se escribe en cada tecleo, sin debounce (es instantáneo y no
 * necesita red) — así, si se cierra la pestaña de golpe antes de que el
 * guardado a la nube (2s de debounce) alcance a dispararse, el borrador
 * sigue disponible al reabrir en el MISMO dispositivo. Si se cambia de
 * dispositivo, no hay borrador local ahí, así que se retoma desde el
 * último guardado en la nube (rpcObtenerSesion1, más abajo).
 */
function claveBorradorLocalSesion1_(campo) {
  return "FEC_BORRADOR_" + estado.idGrupo + "_" + campo;
}
function guardarBorradorLocalSesion1_(campo, valor) {
  try {
    localStorage.setItem(claveBorradorLocalSesion1_(campo), valor);
  } catch (e) {}
}
/** Rellena los campos vacíos con el borrador local del dispositivo, antes de consultar la nube. */
function poblarDesdeBorradorLocalSesion1_() {
  if (!estado.idGrupo) return;
  CAMPOS_SESION1.forEach(function (nombre) {
    var el = document.getElementById("campo_" + nombre);
    if (!el || el.value) return;
    try {
      var borrador = localStorage.getItem(claveBorradorLocalSesion1_(nombre));
      if (borrador) el.value = borrador;
    } catch (e) {}
  });
}

function cargarSesion1() {
  if (!estado.idGrupo) return;
  poblarDesdeBorradorLocalSesion1_();
  llamarServidor("rpcObtenerSesion1", [estado.idGrupo], function (datos) {
    if (datos) {
      CAMPOS_SESION1.forEach(function (nombre) {
        var el = document.getElementById("campo_" + nombre);
        if (el && !el.value && datos[nombre]) el.value = datos[nombre];
      });
    }
    // Refresca también la vista de solo lectura (si Sesión 1/2 ya se
    // envió) ahora que los campos ya tienen su valor real — se llama de
    // nuevo aquí (además de en el callback de rpcEstadoGrupo) porque
    // ambas llamadas al servidor corren en paralelo y cualquiera de las
    // dos puede terminar primero.
    actualizarEstadoEnvioSesion1_();
    actualizarEstadoEnvioSesion2_();
  });
}

/**
 * Pinta, en solo lectura, las respuestas ya guardadas (leídas directamente
 * de los campos de edición, que ya tienen el valor real gracias a
 * cargarSesion1) — nunca vuelve a mostrar el cuadro de texto en blanco,
 * solo el texto ya escrito (spec del usuario).
 */
function renderRespuestasSoloLectura_(idContenedor, preguntas, claveTituloAporte, claveTextoAporte) {
  var contenedor = document.getElementById(idContenedor);
  if (!contenedor) return;
  var html = "";
  preguntas.forEach(function (p) {
    var el = document.getElementById("campo_" + p.clave);
    var valor = el ? el.value.trim() : "";
    if (!valor) return;
    html += "<div class='respuesta-solo-lectura'><h4>" + escapeHtml(p.etiqueta) + "</h4><p>" +
      escapeHtml(valor) + "</p></div>";
  });
  if (claveTituloAporte && claveTextoAporte) {
    var elTitulo = document.getElementById("campo_" + claveTituloAporte);
    var elTexto = document.getElementById("campo_" + claveTextoAporte);
    var titulo = elTitulo ? elTitulo.value.trim() : "";
    var texto = elTexto ? elTexto.value.trim() : "";
    if (titulo || texto) {
      html += "<div class='respuesta-solo-lectura'><h4>➕ Aporte propio del grupo" +
        (titulo ? ": " + escapeHtml(titulo) : "") + "</h4><p>" + escapeHtml(texto) + "</p></div>";
    }
  }
  contenedor.innerHTML = html;
}

  boton.classList.add("oculto");

  var marcarListo = function () {
    pendientes--;

      boton.classList.remove("oculto");

      refrescarVistasFotoGrupo_();
    }
  };

  llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (estadoFirmantes) {

      renderFichaCaracterizacion(estado.grupo, estado.instituciones, estadoFirmantes, responsables);
      marcarListo();

  }, marcarListo);

  cargarParticipacionEstamento(marcarListo);
}

/* ------------------------------------------------------------------ *
 * Sesión de preparación (pre-socialización) — cada IE elige responsable,
 * transición con su logo, responde 6 preguntas (punto de partida:
 * resumen sugerido del Informe Ejecutivo de esa IE) y las envía.
 * ------------------------------------------------------------------ */
function cargarListaIEPreparacion() {
  if (!estado.idGrupo) return;
  // Overlay de carga mientras se pintan las instituciones y los aportes
  // de invitados — antes esta pantalla no mostraba ningún gif mientras
  // cargaba (spec del usuario).
  mostrarCargaAccion_("acceso", "Cargando instituciones y aportes…");
  var pendientesCargaLista_ = 2;
  var marcarListoCargaLista_ = function () {
    pendientesCargaLista_--;
    if (pendientesCargaLista_ <= 0) ocultarCargaAccion_();
  };
  llamarServidor(
    "rpcPreparacionesEnviadasGrupo",
    [estado.idGrupo],
    function (enviadas) {
      // rpcPreparacionesEnviadasGrupo normalmente devuelve un arreglo
      // (no el objeto {ok, mensaje} de las demás RPC): si el servidor
      // atrapó una excepción (ejecutarRpcSeguro_), `enviadas` llega como
      // {ok:false, ...} en vez de arreglo. Sin esta guarda, el
      // .forEach de abajo lanzaría un TypeError silencioso que dejaba a
      // medias el pintado de la pantalla — y con él, el botón
      // "Continuar a Sesión 1" nunca se actualizaba. Se protege con
      // try/catch además, para que un error en el pintado (p. ej. un
      // dato inesperado de una IE puntual) tampoco impida que el botón
      // se actualice.
      try {
        var idsEnviados = {};
        (Array.isArray(enviadas) ? enviadas : []).forEach(function (e) { idsEnviados[e.idIE] = true; });
        estado.idsPreparacionEnviados = idsEnviados;
        renderListaIEPreparacion(estado.instituciones, idsEnviados);
        mostrarMensajePreparacionFaltante_(idsEnviados);
        if (enviadas && enviadas.ok === false) {
          mostrarMensaje("mensajePreparacionPendiente", enviadas.mensaje || "No fue posible cargar el estado de preparación. Intente de nuevo.", "error");
        }
      } catch (error) {
        console.error("cargarListaIEPreparacion", error);
      }
      actualizarBotonesContinuarSesion1_();
      marcarListoCargaLista_();
    },
    function (error) {
      console.error("rpcPreparacionesEnviadasGrupo", error);
      mostrarMensaje("mensajePreparacionPendiente", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
      actualizarBotonesContinuarSesion1_();
      marcarListoCargaLista_();
    }
  );
  llamarServidor("rpcAportesInvitadosGrupo", [estado.idGrupo], function (datos) {
    renderAportesInvitadosGrupo(Array.isArray(datos) ? datos : []);
    marcarListoCargaLista_();
  }, function () {
    marcarListoCargaLista_();
  });
}

/**
 * La Sesión de preparación NO es opcional: es condición para continuar a
 * Sesión 1 (spec: "La preparación no es opcional, es condición para
 * continuar a la sesión uno"). Cada IE avanza por su cuenta apenas
 * envía sus propios aportes — SIN esperar a que las demás instituciones
 * del grupo terminen (spec: "debe dar botón continuar si ya la IE hizo
 * sus aportes", "aparece por IE individual, sin esperar a las demás"):
 *   - Desde la pantalla de una IE, "Continuar a Sesión 1" aparece en
 *     cuanto ESA IE ya envió.
 *   - Desde la pantalla de Selección, aparece en cuanto AL MENOS UNA IE
 *     del grupo ya envió (hay algo que socializar).
 */
function algunaIEPreparo_() {
  var idsEnviados = estado.idsPreparacionEnviados || {};
  return Object.keys(idsEnviados).some(function (id) { return !!idsEnviados[id]; });
}
function actualizarBotonesContinuarSesion1_() {
  var idsEnviados = estado.idsPreparacionEnviados || {};
  var botonSeleccion = document.getElementById("btnContinuarASesion1DesdeSeleccion");
  if (botonSeleccion) botonSeleccion.classList.toggle("oculto", !algunaIEPreparo_());
  var botonPreparacionIE = document.getElementById("btnContinuarASesion1DesdePreparacionIE");
  if (botonPreparacionIE) botonPreparacionIE.classList.toggle("oculto", !idsEnviados[estado.prepIdIE]);
}

function mostrarMensajePreparacionFaltante_(idsEnviados) {
  var faltantes = estado.instituciones.filter(function (ie) { return !idsEnviados[ie.idIE]; });
  var contenedor = document.getElementById("mensajePreparacionPendiente");
  if (!contenedor) return;
  if (!faltantes.length) {
    contenedor.innerHTML = "<div class='mensaje exito'>Todas las instituciones completaron su preparación.</div>";
  } else {
    contenedor.innerHTML =
      "<div class='mensaje info'>Aún falta por diligenciar la preparación de la socialización: <strong>" +
      faltantes.map(function (ie) { return escapeHtml(ie.institucion); }).join("</strong>, <strong>") +
      "</strong>. La institución que ya terminó puede continuar a Sesión 1 sin esperar a las demás.</div>";
  }
}

/**
 * `callback` se llama SIEMPRE cuando el guardado termina (con r.ok), para
 * poder encadenar guardar → enviar sin condición de carrera: antes, al
 * hacer clic en "Enviar" inmediatamente después de "Guardar" (fire-and-
 * forget), el servidor a veces todavía no había escrito el resumen
 * sugerido en la hoja, y mostraba por error "Responda al menos una
 * pregunta antes de enviar" aunque la pantalla ya mostrara texto.
 */
function guardarPreparacionIEActual(manual, callback) {
  if (!estado.idGrupo || !estado.prepIdIE) {
    if (callback) callback(false);
    return;
  }
  llamarServidor(
    "rpcGuardarPreparacionIE",
    [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, estado.prepIdIE, estado.prepResponsable, recolectarRespuestasPreparacionIE()],
    function (r) {
      if (manual) mostrarMensaje("mensajePreparacionIE", r.ok ? "Avance guardado." : (r.mensaje || "No fue posible guardar."), r.ok ? "exito" : "error");
      if (callback) callback(!!r.ok);
    },
    function () {
      if (callback) callback(false);
    }
  );
}

/**
 * Al seleccionar cualquier fragmento de texto dentro de los aportes de
 * preparación por institución (Sesión 1), queda copiado automáticamente
 * al portapapeles — listo para pegar en cualquiera de las preguntas de
 * "Construcción colectiva del grupo" (spec del usuario) — con un aviso
 * central sutil, sin bloquear la pantalla.
 */
(function () {
  var contenedor = document.getElementById("listaSocializacionPreparacion");
  if (!contenedor) return;
  var aviso = document.getElementById("avisoTextoCopiado");
  var temporizadorAviso = null;

  function copiarSeleccionActual_() {
    var seleccion = window.getSelection ? window.getSelection() : null;
    var texto = seleccion ? seleccion.toString().trim() : "";
    if (!texto) return;
    var terminar = function () {
      if (!aviso) return;
      aviso.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(function () {
        aviso.classList.remove("visible");
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(terminar, terminar);
    } else {
      // Reserva para navegadores sin Clipboard API (poco frecuentes hoy):
      // copiar mediante un textarea temporal y el comando de copia clásico.
      var temporal = document.createElement("textarea");
      temporal.value = texto;
      temporal.style.position = "fixed";
      temporal.style.opacity = "0";
      document.body.appendChild(temporal);
      temporal.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(temporal);
      terminar();
    }
  }

  contenedor.addEventListener("mouseup", copiarSeleccionActual_);
  contenedor.addEventListener("touchend", copiarSeleccionActual_);
})();

/* ------------------------------------------------------------------ *
 * Pantalla completa EDITABLE (👁️) + guardado inline (💾) para cualquier
 * pregunta de texto largo (Sesión 1, Sesión 2, Preparación IE, invitado):
 * más cómodo que escribir en una caja pequeña, especialmente en celular.
 * ------------------------------------------------------------------ */
var textareaEdicionCompletaActual_ = null;

/** Deduce un título legible para la pantalla completa a partir del H3/label/summary que antecede al textarea. */
function tituloParaTextarea_(ta) {
  var previo = ta.previousElementSibling;
  while (previo && previo.tagName === "P" && previo.classList.contains("ayuda")) {
    previo = previo.previousElementSibling;
  }
  if (previo && (previo.tagName === "H3" || previo.tagName === "LABEL")) return previo.textContent.trim();
  var detalles = ta.closest("details");
  if (detalles) {
    var resumen = detalles.querySelector("summary");
    if (resumen) return resumen.textContent.replace("✓", "").trim();
  }
  return "Editar respuesta";
}

function abrirEdicionPantallaCompleta(ta) {
  textareaEdicionCompletaActual_ = ta;
  document.getElementById("tituloPantallaCompletaEdicion").textContent = tituloParaTextarea_(ta);
  var area = document.getElementById("areaPantallaCompletaEdicion");
  area.value = ta.value;
  document.getElementById("pantallaCompletaEdicion").classList.remove("oculto");
  area.focus();
}
function cerrarEdicionPantallaCompleta() {
  document.getElementById("pantallaCompletaEdicion").classList.add("oculto");
  textareaEdicionCompletaActual_ = null;
}
document.getElementById("btnCerrarPantallaCompletaEdicion").addEventListener("click", cerrarEdicionPantallaCompleta);
document.getElementById("areaPantallaCompletaEdicion").addEventListener("input", function () {
  if (!textareaEdicionCompletaActual_) return;
  textareaEdicionCompletaActual_.value = this.value;
  // Dispara el evento "input" en el textarea real para que el autoguardado
  // y el contador de palabras normales sigan funcionando sin duplicar esa
  // lógica aquí.
  textareaEdicionCompletaActual_.dispatchEvent(new Event("input", { bubbles: true }));
});
document.addEventListener("keydown", function (evento) {
  if (evento.key === "Escape" && !document.getElementById("pantallaCompletaEdicion").classList.contains("oculto")) {
    cerrarEdicionPantallaCompleta();
  }
});

/**
 * Cómo guardar y qué debounce cancelar según el tipo de pregunta —
 * Sesión 1/2 (data-campo-sesion1), Preparación IE oficial
 * (data-prep-pregunta) o invitado (data-inv-prep-pregunta). Cada flujo ya
 * tenía su propia función de guardado y su propio temporizador de
 * autoguardado; aquí solo se homogeniza cómo el botón 💾 los usa.
 */
function configGuardadoParaTextarea_(ta) {
  if (ta.hasAttribute("data-campo-sesion1")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoSesion1); },
      guardar: function (callback) { guardarSesion1(false, callback); }
    };
  }
  if (ta.hasAttribute("data-prep-pregunta")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoPreparacion); },
      guardar: function (callback) {
        guardarPreparacionIEActual(false, function (ok) {
          callback({ ok: ok, mensaje: ok ? "" : "No fue posible guardar." });
        });
      }
    };
  }
  if (ta.hasAttribute("data-inv-prep-pregunta")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoInvitado_); },
      guardar: function (callback) {
        guardarPreparacionInvitadoActual_(false, function (ok) {
          callback({ ok: ok, mensaje: ok ? "" : "No fue posible guardar." });
        });
      }
    };
  }
  return null;
}

/**
 * Agrega, después de cada textarea de pregunta larga, una barra con 👁️
 * (pantalla completa editable) y 💾 (guardar esa pregunta ya, sin esperar
 * el autoguardado) con un texto auxiliar de confirmación — para las tres
 * clases de pregunta (Sesión 1/2, Preparación IE, invitado). Idempotente:
 * se puede llamar varias veces sobre el mismo contenedor (p.ej. después
 * de un render dinámico) sin duplicar nada.
 */
function agregarAccionesTextareas_(raiz) {
  var root = raiz || document;
  var selector = "textarea[data-campo-sesion1], textarea[data-prep-pregunta], textarea[data-inv-prep-pregunta]";
  root.querySelectorAll(selector).forEach(function (ta) {
    if (ta.dataset.accionesListas) return;
    ta.dataset.accionesListas = "1";

    var barra = document.createElement("div");
    barra.className = "barra-acciones-textarea";

    var botonOjo = document.createElement("button");
    botonOjo.type = "button";
    botonOjo.className = "btn-accion-textarea";
    botonOjo.title = "Ver y editar en pantalla completa";
    botonOjo.textContent = "👁️";
    botonOjo.addEventListener("click", function () {
      abrirEdicionPantallaCompleta(ta);
    });
    barra.appendChild(botonOjo);

    var config = configGuardadoParaTextarea_(ta);
    if (config) {
      var estadoSpan = document.createElement("span");
      estadoSpan.className = "estado-guardado-campo";

      var botonGuardar = document.createElement("button");
      botonGuardar.type = "button";
      botonGuardar.className = "btn-accion-textarea";
      botonGuardar.title = "Guardar esta respuesta ahora";
      botonGuardar.textContent = "💾";
      botonGuardar.addEventListener("click", function () {
        config.cancelarDebounce();
        estadoSpan.textContent = "Guardando…";
        estadoSpan.className = "estado-guardado-campo";
        config.guardar(function (r) {
          estadoSpan.textContent = r.ok ? "✓ Guardado" : (r.mensaje || "No fue posible guardar.");
          estadoSpan.className = "estado-guardado-campo " + (r.ok ? "estado-guardado-ok" : "estado-guardado-error");
          if (r.ok) setTimeout(function () { estadoSpan.textContent = ""; }, 4000);
        });
      });
      barra.appendChild(botonGuardar);
      barra.appendChild(estadoSpan);
    }

    ta.insertAdjacentElement("afterend", barra);
  });
}
// Textareas estáticos de Sesión 1/Sesión 2 (ya presentes al cargar la
// página); las de Preparación IE/invitado se agregan tras cada render
// dinámico (ver renderPreguntasPreparacionIE/renderPreguntasInvitado en
// Components.html).
agregarAccionesTextareas_(document);

/* ---- Valoración del Foro — 4 preguntas de corazones + 1 abierta (copiado de FEI 3.1) ---- */
(function inicializarValoracion() {
  var contenedor = document.getElementById("tarjetaValoracion");
  if (!contenedor) return;
  var puntajes = { p1: 0, p2: 0, p3: 0, p4: 0 };

  function actualizarResultadoValoracion() {
    var bloqueAbierto = document.getElementById("valoracionAbiertaBloque");
    var bloqueResultado = document.getElementById("valoracionResultado");
    var notaTexto = document.getElementById("valoracionNotaTexto");
    var labelAbierto = document.getElementById("valoracionP5Label");

    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      bloqueAbierto.classList.add("oculto");
      bloqueResultado.classList.add("oculto");
      return;
    }

    var nota = (puntajes.p1 + puntajes.p2 + puntajes.p3 + puntajes.p4) / 4;
    var emoji, pregunta;
    if (nota < 3) {
      emoji = "😭";
      pregunta = "😭 ¡Debemos hacerlo mejor! ¿Qué sugerencias, recomendaciones o propuestas tienen para fortalecer la organización y desarrollo del Foro Educativo Comunal?";
    } else if (nota <= 4) {
      emoji = "😬";
      pregunta = "😬 ¡Pasamos raspados! ¿Quieren decirnos qué funcionó bien para " + (estado.grupo || "el grupo") + " y qué pudo haber sido mejor para fortalecer la organización y desarrollo del Foro Educativo Comunal?";
    } else {
      emoji = "🎉";
      pregunta = "🎉 ¡Bravo, gracias por el reconocimiento! ¿Quieren decirnos qué hicimos bien para " + (estado.grupo || "el grupo") + " para merecer el reconocimiento de ustedes? Y de paso también pueden decirnos cómo mejorar para fortalecer la organización y desarrollo del Foro Educativo Comunal.";
    }

    notaTexto.textContent = emoji + " Nuestra nota fue de: " + nota.toFixed(1) + " / 5.0 " + emoji;
    bloqueResultado.classList.remove("oculto");
    labelAbierto.textContent = pregunta;
    bloqueAbierto.classList.remove("oculto");
  }

  contenedor.querySelectorAll(".valoracion-pregunta[data-pregunta]").forEach(function (bloque) {
    var pregunta = bloque.dataset.pregunta;
    var corazones = Array.prototype.slice.call(bloque.querySelectorAll(".corazon-valoracion"));
    var bloqueMejora = contenedor.querySelector('.valoracion-mejora[data-mejora-de="' + pregunta + '"]');

    corazones.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var valor = Number(this.dataset.valor);
        puntajes[pregunta] = valor;
        corazones.forEach(function (b) {
          var v = Number(b.dataset.valor);
          b.textContent = v <= valor ? "❤️" : "🤍";
        });
        if (bloqueMejora) bloqueMejora.classList.toggle("oculto", valor > 2);
        actualizarResultadoValoracion();
      });
    });
  });

  document.getElementById("btnEnviarValoracion").addEventListener("click", function () {
    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      mostrarMensaje("mensajeValoracion", "Seleccione de 1 a 5 corazones en las cuatro preguntas antes de enviar.", "error");
      return;
    }
    var boton = document.getElementById("btnEnviarValoracion");
    boton.disabled = true;
    var respuestas = {
      p1: puntajes.p1, p2: puntajes.p2, p3: puntajes.p3, p4: puntajes.p4,
      p5: document.getElementById("valoracionP5").value,
      mejoraP1: document.getElementById("valoracionMejoraP1").value,
      mejoraP2: document.getElementById("valoracionMejoraP2").value,
      mejoraP3: document.getElementById("valoracionMejoraP3").value,
      mejoraP4: document.getElementById("valoracionMejoraP4").value
    };
    mostrarCargaAccion_("valoracionAsistencia", "Enviando valoración…");
    llamarServidor("rpcGuardarValoracion", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, respuestas], function (r) {
      ocultarCargaAccion_();
      boton.disabled = false;
      if (!r.ok) {
        mostrarMensaje("mensajeValoracion", r.mensaje || "No fue posible guardar la valoración.", "error");
        return;
      }
      mostrarMensaje("mensajeValoracion", "", "");
      estado.valoracionCompletada = true;
      mostrarEstadoValoracion({ NOTA_PROMEDIO: r.notaPromedio });
      actualizarBotonGenerarInforme();
    }, function (error) {
      ocultarCargaAccion_();
      boton.disabled = false;
      console.error("rpcGuardarValoracion", error);
      mostrarMensaje("mensajeValoracion", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    });
  });
})();

document.getElementById("btnGenerarInforme").addEventListener("click", function () {
  // La fotografía ya no se pide en la pantalla de "Informe generado"
  // (spec del usuario: "la fotografía debe desaparecer de la pantalla de
  // informe generado") — este es ahora el último punto donde se exige,
  // antes de generar el documento (queda incluida en él, ver Informes.gs).
  if (!estado.fotoGrupoId) {
    mostrarMensaje(
      "mensajeCierre",
      "Falta subir la fotografía general del grupo antes de generar el informe. Puede hacerlo desde " +
        "\"Atrás\" (arriba) — en Participación, o en el botón \"Agregar fotografía\" de Confirmación de " +
        "caracterización.",
      "error"
    );
    return;
  }
  confirmarAccion("¿Generar el informe definitivo del grupo? Esta acción crea el documento único que verán todas las IE del grupo.", function () {
    document.getElementById("btnGenerarInforme").disabled = true;
    mostrarCargaAccion_("informe");
    llamarServidor("rpcGenerarInforme", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
      ocultarCargaAccion_();
      document.getElementById("btnGenerarInforme").disabled = false;
      if (!r.ok) {
        mostrarMensaje("mensajeCierre", r.mensaje || "No fue posible generar el informe.", "error");
        return;
      }
      document.getElementById("enlaceInformeGenerado").href = r.url;
      document.getElementById("btnEnviarInformePorCorreo").disabled = true;
      mostrarMensaje("mensajeEnvioInforme", "", "");
      document.getElementById("notaEnvioInforme").textContent = "Descargue el informe (botón de arriba) para habilitar el envío por correo al responsable del grupo.";
      // Al generar el informe, la asistencia queda cerrada (spec del
      // usuario) — se refleja de inmediato en el encabezado permanente.
      estado.asistenciaCerrada = true;
      estado.informeGenerado = true;
      actualizarPanelFirmantesCerrado_();
      cambiarPantalla("pantallaInformeGenerado");
    }, function (error) {
      ocultarCargaAccion_();
      document.getElementById("btnGenerarInforme").disabled = false;
      console.error("rpcGenerarInforme", error);
      mostrarMensaje("mensajeCierre", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    });
  });
});

/* ---- Descargar informe (habilita el envío por correo) y enviarlo ---- */
document.getElementById("enlaceInformeGenerado").addEventListener("click", function () {
  llamarServidor("rpcMarcarInformeDescargado", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (!r.ok) return;
    document.getElementById("btnEnviarInformePorCorreo").disabled = false;
    document.getElementById("notaEnvioInforme").textContent = "Ya puede enviar el informe por correo al responsable del grupo.";
  }, function () {});
});

document.getElementById("btnEnviarInformePorCorreo").addEventListener("click", function () {
  var boton = document.getElementById("btnEnviarInformePorCorreo");
  boton.disabled = true;
  llamarServidor("rpcEnviarInformePorCorreo", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    boton.disabled = false;
    if (!r.ok) {
      mostrarMensaje("mensajeEnvioInforme", r.mensaje || "No fue posible enviar el informe.", "error");
      return;
    }
    mostrarMensaje("mensajeEnvioInforme", r.diferido ? r.mensaje : "Informe enviado por correo.", "exito");
    // "Finalizar Foro" no se habilita hasta que el informe se haya
    // enviado por correo al menos una vez (spec del usuario) — un envío
    // diferido por cuota también cuenta, porque el informe ya quedó en
    // la cola y llegará automáticamente (ver Correo.gs).
    estado.informeEnviadoPorCorreo = true;
    actualizarBotonFinalizarForo_();
  });
});

/**
 * Texto de apoyo: a qué correos institucionales llegará el informe
 * (spec del usuario) — se arma con las IE reales del grupo, ya
 * disponibles en estado.instituciones desde el login.
 */
function actualizarAvisoDestinatariosInforme_() {
  var aviso = document.getElementById("avisoDestinatariosInforme");
  if (!aviso) return;
  var nombresIE = (estado.instituciones || []).map(function (ie) { return ie.institucion; }).filter(Boolean);
  if (!nombresIE.length) {
    aviso.textContent = "";
    return;
  }
  aviso.textContent = "Este informe llegará también a los correos de las instituciones educativas que " +
    "conformaron el " + (estado.grupo || "grupo") + " del Foro Educativo Comunal 2026: " +
    nombresIE.join(", ") + ".";
}

/**
 * "Finalizar Foro" no se puede accionar hasta que el informe se haya
 * enviado por correo (spec del usuario: "no se puede dar Finalizar Foro
 * hasta que se haya dado click en enviar informe al correo").
 */
function actualizarBotonFinalizarForo_() {
  var boton = document.getElementById("btnFinalizarForo");
  var aviso = document.getElementById("avisoFaltaEnvioCorreo");
  if (boton) boton.disabled = !estado.informeEnviadoPorCorreo;
  if (aviso) aviso.classList.toggle("oculto", !!estado.informeEnviadoPorCorreo);
}

// La fotografía ya se exigió antes de poder generar el informe (ver
// btnGenerarInforme más arriba), así que aquí ya no hace falta volver a
// pedirla. "Finalizar Foro Comunal Educativo 2026" reemplaza al antiguo
// botón genérico "Continuar" (spec del usuario) y solo se puede accionar
// una vez — se deshabilita de inmediato al hacer clic.
document.getElementById("btnFinalizarForo").addEventListener("click", function () {
  this.disabled = true;
  cambiarPantalla("pantallaDespedida");
});
</script>
