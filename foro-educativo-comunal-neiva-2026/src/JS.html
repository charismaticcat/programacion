<script>
/**
 * JS.html — Foro Educativo Comunal Neiva 2026
 * Lógica de cliente. Reutiliza (adaptados a GRUPO) los patrones más
 * maduros de App.html en FEI 3.1 (docs/01-auditoria-fei-3.1.md §2.6):
 * dispositivoId persistente en localStorage, heartbeat periódico de
 * sesión, autoguardado con sincronización periódica al servidor.
 */

/* ------------------------------------------------------------------ *
 * Estado de cliente
 * ------------------------------------------------------------------ */
var estado = {
  dispositivoId: obtenerDispositivoId(),
  idGrupo: "",
  grupo: "",
  tokenSesion: "",
  esPrincipal: false,
  instituciones: [],
  ultimosFirmantes: [],
  metodoAsistencia: "",
  logoId: "",
  consentimientoGrupo: false,
  rolesForo: [],
  responsables: { principal: null, asistentes: [] },
  recursosSesion1Mostrado: false,
  fotoGrupoId: ""
};

/** URL de imagen para un archivo de Drive público (logos) — mismo patrón usado para el QR de asistencia. */
function urlImagenDrive(idArchivo, ancho) {
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idArchivo) + "&sz=w" + (ancho || 600);
}

var ORDEN_PANTALLAS = [
  "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia", "pantallaAcceso",
  "pantallaConsentimientoGrupo", "pantallaParticipacion", "pantallaConfirmacionCaracterizacion",
  "pantallaSesion1", "pantallaSesion2", "pantallaRevisionCierre",
  "pantallaInformeGenerado", "pantallaDespedida"
];

function obtenerDispositivoId() {
  var clave = "forumComunalNeiva2026_dispositivo";
  try {
    var guardado = localStorage.getItem(clave);
    if (guardado) return guardado;
    var nuevo = "FEC-DEV-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(clave, nuevo);
    return nuevo;
  } catch (e) {
    return "FEC-DEV-" + Date.now().toString(36);
  }
}

/* ------------------------------------------------------------------ *
 * Llamadas al servidor (envoltorio de google.script.run)
 * ------------------------------------------------------------------ */
function llamarServidor(nombreFuncion, args, onExito, onError) {
  google.script.run
    .withSuccessHandler(function (resultado) {
      if (onExito) onExito(resultado);
    })
    .withFailureHandler(function (error) {
      console.error(nombreFuncion, error);
      if (onError) onError(error);
      else mostrarMensaje("mensajeGlobal", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    })
    [nombreFuncion].apply(null, args || []);
}

/* ------------------------------------------------------------------ *
 * Navegación entre pantallas
 * ------------------------------------------------------------------ */
function cambiarPantalla(idPantalla) {
  ORDEN_PANTALLAS.forEach(function (id) {
    document.getElementById(id).classList.toggle("visible", id === idPantalla);
  });
  var indice = ORDEN_PANTALLAS.indexOf(idPantalla);
  var porcentaje = Math.round(((indice + 1) / ORDEN_PANTALLAS.length) * 100);
  document.getElementById("barraProgresoRelleno").style.width = porcentaje + "%";
  window.scrollTo(0, 0);

  if (idPantalla === "pantallaParticipacion") {
    actualizarFirmantes();
    cargarResponsables();
    cargarMatrizParticipacion();
  }
  if (idPantalla === "pantallaConfirmacionCaracterizacion") cargarConfirmacionCaracterizacion();
  if (idPantalla === "pantallaSesion1") {
    cargarSesion1();
    cargarRecursosSesion1();
  }
  if (idPantalla === "pantallaSesion2") cargarConectaEduca();
  if (idPantalla === "pantallaRevisionCierre") prepararCierre();
}

document.addEventListener("click", function (evento) {
  var boton = evento.target.closest("[data-ir]");
  if (boton) cambiarPantalla(boton.getAttribute("data-ir"));

  var cerrar = evento.target.closest("[data-cerrar-modal]");
  if (cerrar) cerrarModal(cerrar.getAttribute("data-cerrar-modal"));

  var borrarActor = evento.target.closest("[data-borrar-actor]");
  if (borrarActor) borrarActorConectaEduca(borrarActor.getAttribute("data-borrar-actor"));

  var quitarAsistente = evento.target.closest("[data-quitar-asistente]");
  if (quitarAsistente) quitarAsistenteEnvio(quitarAsistente.getAttribute("data-quitar-asistente"));
});

function abrirModal(id) {
  document.getElementById(id).classList.remove("oculto");
}
function cerrarModal(id) {
  document.getElementById(id).classList.add("oculto");
}

/* ------------------------------------------------------------------ *
 * Transición inicial (splash: logo del Foro + logo de la Alcaldía)
 * ------------------------------------------------------------------ */
function iniciarSplashInicial() {
  var splash = document.getElementById("pantallaSplashInicial");
  if (!splash) return;

  if (LOGO_ENCABEZADO_ID) {
    var imgForo = document.getElementById("imagenLogoForoSplash");
    imgForo.src = urlImagenDrive(LOGO_ENCABEZADO_ID, 500);
    imgForo.classList.remove("oculto");
  }
  if (LOGO_PIE_ID) {
    var imgAlcaldia = document.getElementById("imagenLogoAlcaldiaSplash");
    imgAlcaldia.src = urlImagenDrive(LOGO_PIE_ID, 500);
    imgAlcaldia.classList.remove("oculto");
  }

  var cerrado = false;
  var cerrarSplash = function () {
    if (cerrado) return;
    cerrado = true;
    splash.classList.add("oculto");
  };
  splash.addEventListener("click", cerrarSplash);
  setTimeout(cerrarSplash, 4000); // menos de 5 segundos, spec
}
iniciarSplashInicial();

/* ------------------------------------------------------------------ *
 * Carrusel de bienvenida — cada I.E. aparece una a una (1s c/u)
 * ------------------------------------------------------------------ */
function mostrarCarruselIE() {
  // El enlace de acceso (?t=TOKEN) ya identifica un grupo concreto: en ese
  // caso el carrusel solo debe mostrar las IE de ESE grupo, nunca las de
  // los demás. Solo se muestran todas cuando el enlace es genérico (sin
  // token de grupo todavía resuelto).
  var nombreRpc = ID_GRUPO_ACCESO ? "rpcInstitucionesDelGrupo" : "rpcTodasLasInstituciones";
  var argumentos = ID_GRUPO_ACCESO ? [ID_GRUPO_ACCESO] : [];

  llamarServidor(nombreRpc, argumentos, function (instituciones) {
    if (!instituciones || !instituciones.length) {
      cambiarPantalla("pantallaPresentacion");
      return;
    }
    ejecutarCarruselIE(instituciones);
  }, function () {
    cambiarPantalla("pantallaPresentacion");
  });
}

function ejecutarCarruselIE(instituciones) {
  var overlay = document.getElementById("pantallaCarruselIE");
  var contenedorItem = document.getElementById("itemCarruselIE");
  var progreso = document.getElementById("progresoCarruselIE");
  overlay.classList.remove("oculto");

  var indice = 0;
  var temporizador = null;

  var terminar = function () {
    if (temporizador) clearTimeout(temporizador);
    overlay.classList.add("oculto");
    cambiarPantalla("pantallaPresentacion");
  };

  var mostrarSiguiente = function () {
    if (indice >= instituciones.length) {
      terminar();
      return;
    }
    var ie = instituciones[indice];
    var html = "<div class='carrusel-ie-item'>";
    if (ie.logoId) {
      html += "<img src='" + urlImagenDrive(ie.logoId, 400) + "' alt='" + escapeHtml(ie.institucion) + "'>";
    } else {
      html += "<span class='icono-generico'>🏫</span>";
    }
    html += "<p class='nombre-ie'>" + escapeHtml(ie.institucion) + "</p>";
    if (ie.grupo) html += "<p class='grupo-ie'>" + escapeHtml(ie.grupo) + "</p>";
    html += "</div>";
    contenedorItem.innerHTML = html;
    progreso.textContent = (indice + 1) + " / " + instituciones.length;
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 1000);
  };

  document.getElementById("btnSaltarCarruselIE").onclick = terminar;
  mostrarSiguiente();
}

document.getElementById("btnComenzarForo").addEventListener("click", function () {
  mostrarCarruselIE();
});

/* ------------------------------------------------------------------ *
 * Contador de palabras (Sesión 1 y Sesión 2 — preguntas abiertas)
 * ------------------------------------------------------------------ */
function inicializarContadoresPalabras() {
  var textareas = document.querySelectorAll("#pantallaSesion1 textarea, #pantallaSesion2 textarea");
  textareas.forEach(function (textarea) {
    var contador = document.createElement("p");
    contador.className = "contador-palabras";
    textarea.insertAdjacentElement("afterend", contador);
    var actualizar = function () {
      var texto = textarea.value.trim();
      var palabras = texto ? texto.split(/\s+/).length : 0;
      contador.textContent = palabras + (palabras === 1 ? " palabra" : " palabras");
    };
    textarea.addEventListener("input", actualizar);
    actualizar();
  });
}
inicializarContadoresPalabras();

/* ------------------------------------------------------------------ *
 * Recursos descargables antes de Sesión 1
 * ------------------------------------------------------------------ */
function cargarRecursosSesion1() {
  llamarServidor("rpcObtenerRecursosSesion1", [estado.idGrupo], function (recursos) {
    renderRecursosSesion1(recursos || []);
    if (!estado.recursosSesion1Mostrado) {
      estado.recursosSesion1Mostrado = true;
      abrirModal("modalRecursosSesion1");
    }
  });
}

/* ------------------------------------------------------------------ *
 * Acceso
 * ------------------------------------------------------------------ */
if (NOMBRE_GRUPO_ACCESO) {
  document.getElementById("nombreGrupoAcceso").textContent = "Grupo: " + NOMBRE_GRUPO_ACCESO;
}

function intentarValidarAcceso(forzar) {
  var codigo = document.getElementById("campoCodigoAcceso").value.trim();
  if (!TOKEN_ACCESO) {
    mostrarMensaje("mensajeAcceso", "El enlace de acceso no incluye un token válido.", "error");
    return;
  }
  if (!codigo) {
    mostrarMensaje("mensajeAcceso", "Ingrese el código de acceso.", "error");
    return;
  }
  llamarServidor("rpcValidarAcceso", [TOKEN_ACCESO, codigo, estado.dispositivoId, !!forzar], function (r) {
    if (!r.ok) {
      if (r.codigo === "SESION_YA_ABIERTA") {
        document.getElementById("mensajeTomaSesion").textContent = r.mensaje;
        abrirModal("modalTomaSesion");
        return;
      }
      mostrarMensaje("mensajeAcceso", r.mensaje || "No fue posible validar el acceso.", "error");
      return;
    }
    estado.idGrupo = r.idGrupo;
    estado.grupo = r.grupo;
    estado.tokenSesion = r.tokenSesion;
    estado.esPrincipal = r.esPrincipal;
    estado.instituciones = r.instituciones || [];
    estado.metodoAsistencia = r.metodoAsistencia || "";
    estado.logoId = r.logoId || "";
    estado.consentimientoGrupo = !!r.consentimientoGrupo;
    estado.fotoGrupoId = r.fotoGrupoId || "";

    document.getElementById("nombreGrupoParticipacion").textContent = r.grupo;
    poblarSelectInstituciones("campoIEResponsable", estado.instituciones);
    poblarSelectInstituciones("campoIEAsistente", estado.instituciones);
    renderListaInstituciones(estado.instituciones);
    renderFotoGrupo(estado.fotoGrupoId);
    document.getElementById("panelFirmantes").classList.remove("oculto");

    mostrarPanelMetodoAsistencia(estado.metodoAsistencia);
    iniciarHeartbeat();
    iniciarPollingFirmantes();
    cargarRolesForo();

    cambiarPantalla(estado.consentimientoGrupo ? "pantallaParticipacion" : "pantallaConsentimientoGrupo");
  });
}

document.getElementById("btnValidarAcceso").addEventListener("click", function () {
  intentarValidarAcceso(false);
});
document.getElementById("btnForzarSesion").addEventListener("click", function () {
  cerrarModal("modalTomaSesion");
  intentarValidarAcceso(true);
});

/* ------------------------------------------------------------------ *
 * Consentimiento informado del grupo (sección 3.2)
 * ------------------------------------------------------------------ */
document.getElementById("checkConsentimientoGrupo").addEventListener("change", function () {
  document.getElementById("btnAceptarConsentimientoGrupo").disabled = !this.checked;
});

document.getElementById("btnAceptarConsentimientoGrupo").addEventListener("click", function () {
  llamarServidor("rpcGuardarConsentimientoGrupo", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeConsentimientoGrupo", r.mensaje || "No fue posible registrar el consentimiento.", "error");
      return;
    }
    estado.consentimientoGrupo = true;
    cambiarPantalla("pantallaParticipacion");
  });
});

/* ------------------------------------------------------------------ *
 * Heartbeat de sesión (mantiene el cupo de dispositivo activo)
 * ------------------------------------------------------------------ */
function iniciarHeartbeat() {
  setInterval(function () {
    if (!estado.idGrupo) return;
    llamarServidor(
      "rpcMantenerSesion",
      [estado.idGrupo, estado.dispositivoId, estado.tokenSesion],
      function (r) {
        if (!r.ok) {
          mostrarMensaje("mensajeGlobal", "Esta sesión ya no está activa en este dispositivo (otro dispositivo tomó el cupo). Vuelva a ingresar.", "error");
        }
      },
      function () {}
    );
  }, 30000);
}

/* ------------------------------------------------------------------ *
 * Método de asistencia (QR/enlace o listado físico + fotografía)
 * ------------------------------------------------------------------ */
function mostrarPanelMetodoAsistencia(metodo) {
  document.getElementById("panelMetodoQR").classList.toggle("oculto", metodo !== "QR");
  document.getElementById("panelMetodoListado").classList.toggle("oculto", metodo !== "LISTADO");
  if (metodo === "QR") cargarEnlaceAsistencia();
}

function cargarEnlaceAsistencia() {
  llamarServidor("rpcUrlAsistencia", [estado.idGrupo], function (url) {
    var enlace = document.getElementById("enlaceAsistenciaQR");
    enlace.href = url;
    enlace.textContent = url;
    document.getElementById("imagenQRAsistencia").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(url);
  });
}

function elegirMetodoAsistencia(metodo) {
  mostrarPanelMetodoAsistencia(metodo);
  llamarServidor("rpcGuardarMetodoAsistencia", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, metodo], function (r) {
    if (!r.ok) mostrarMensaje("mensajeMetodoAsistencia", r.mensaje || "No fue posible guardar el método.", "error");
  });
}

document.getElementById("btnMetodoQR").addEventListener("click", function () {
  elegirMetodoAsistencia("QR");
});
document.getElementById("btnMetodoListado").addEventListener("click", function () {
  elegirMetodoAsistencia("LISTADO");
});

document.getElementById("btnCopiarEnlaceAsistencia").addEventListener("click", function () {
  var url = document.getElementById("enlaceAsistenciaQR").href;
  if (navigator.clipboard) navigator.clipboard.writeText(url);
});

/* ---- Vista de pantalla completa del QR (para proyectar en el evento) ---- */
var intervaloPantallaCompletaQR = null;

document.getElementById("btnPantallaCompletaQR").addEventListener("click", function () {
  var url = document.getElementById("enlaceAsistenciaQR").href;
  document.getElementById("imagenQRPantallaCompleta").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(url);
  document.getElementById("enlacePantallaCompleta").textContent = url;
  var overlay = document.getElementById("pantallaCompletaQR");
  overlay.classList.remove("oculto");
  if (overlay.requestFullscreen) overlay.requestFullscreen().catch(function () {});

  var actualizarContadorGrande = function () {
    llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
      document.getElementById("contadorFirmantesPantallaCompleta").textContent = r.total || 0;
    }, function () {});
  };
  actualizarContadorGrande();
  intervaloPantallaCompletaQR = setInterval(actualizarContadorGrande, 5000);
});

document.getElementById("btnCerrarPantallaCompletaQR").addEventListener("click", function () {
  clearInterval(intervaloPantallaCompletaQR);
  document.getElementById("pantallaCompletaQR").classList.add("oculto");
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
});

function leerArchivoComoBase64_(archivo, callback) {
  var lector = new FileReader();
  lector.onload = function () {
    var base64 = lector.result.split(",")[1];
    callback(base64);
  };
  lector.readAsDataURL(archivo);
}

document.getElementById("btnSubirListado").addEventListener("click", function () {
  var input = document.getElementById("campoArchivoListado");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeMetodoAsistencia", "Selecciona primero un archivo.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    llamarServidor(
      "rpcSubirListadoAsistencia",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        mostrarMensaje("mensajeMetodoAsistencia", r.ok ? "Listado subido correctamente." : (r.mensaje || "No fue posible subir el listado."), r.ok ? "exito" : "error");
        if (r.ok) input.value = "";
      }
    );
  });
});

document.getElementById("btnSubirEvidencia").addEventListener("click", function () {
  var input = document.getElementById("campoArchivoEvidencia");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeMetodoAsistencia", "Selecciona primero una fotografía.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    llamarServidor(
      "rpcSubirFotoEvidencia",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        mostrarMensaje("mensajeMetodoAsistencia", r.ok ? "Fotografía subida correctamente." : (r.mensaje || "No fue posible subir la fotografía."), r.ok ? "exito" : "error");
        if (r.ok) input.value = "";
      }
    );
  });
});

/* ------------------------------------------------------------------ *
 * Fotografía general del grupo (Participación) — independiente del
 * método de asistencia elegido.
 * ------------------------------------------------------------------ */
document.getElementById("btnSubirFotoGrupo").addEventListener("click", function () {
  var input = document.getElementById("campoFotoGrupo");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeFotoGrupo", "Selecciona primero una fotografía.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    llamarServidor(
      "rpcSubirFotoGrupo",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        mostrarMensaje("mensajeFotoGrupo", r.ok ? "Fotografía subida correctamente." : (r.mensaje || "No fue posible subir la fotografía."), r.ok ? "exito" : "error");
        if (r.ok) {
          input.value = "";
          estado.fotoGrupoId = r.fileId;
          renderFotoGrupo(estado.fotoGrupoId);
        }
      }
    );
  });
});

/* ------------------------------------------------------------------ *
 * Roles del foro (catálogo del Documento Orientador) e instituciones
 * ------------------------------------------------------------------ */
function cargarRolesForo() {
  llamarServidor("rpcRolesForo", [], function (roles) {
    estado.rolesForo = roles || [];
    ["campoRolForoResponsable", "campoRolForoAsistente"].forEach(function (id) {
      var select = document.getElementById(id);
      if (!select) return;
      select.innerHTML = "";
      estado.rolesForo.forEach(function (rol) {
        var opcion = document.createElement("option");
        opcion.value = rol;
        opcion.textContent = rol;
        select.appendChild(opcion);
      });
    });
  });
}

function poblarSelectInstituciones(idSelect, instituciones) {
  var select = document.getElementById(idSelect);
  if (!select) return;
  select.innerHTML = "";
  (instituciones || []).forEach(function (ie) {
    var opcion = document.createElement("option");
    opcion.value = ie.idIE;
    opcion.textContent = ie.institucion;
    select.appendChild(opcion);
  });
}

/* ------------------------------------------------------------------ *
 * Responsable de envío y asistentes de envío
 * ------------------------------------------------------------------ */
document.getElementById("btnGuardarResponsable").addEventListener("click", function () {
  var datos = {
    nombre: document.getElementById("campoNombreResponsable").value.trim(),
    idIE: document.getElementById("campoIEResponsable").value,
    rolForo: document.getElementById("campoRolForoResponsable").value,
    correo: document.getElementById("campoCorreoResponsable").value.trim()
  };
  if (!datos.nombre || !datos.correo) {
    mostrarMensaje("mensajeResponsable", "Nombre y correo son obligatorios.", "error");
    return;
  }
  llamarServidor("rpcGuardarResponsable", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, "PRINCIPAL", datos], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeResponsable", r.mensaje || "No fue posible guardar.", "error");
      return;
    }
    mostrarMensaje("mensajeResponsable", "Responsable de envío guardado.", "exito");
    cargarResponsables();
  });
});

document.getElementById("btnMostrarFormAsistente").addEventListener("click", function () {
  document.getElementById("formularioAsistenteEnvio").classList.remove("oculto");
});

document.getElementById("btnGuardarAsistente").addEventListener("click", function () {
  var datos = {
    nombre: document.getElementById("campoNombreAsistente").value.trim(),
    idIE: document.getElementById("campoIEAsistente").value,
    rolForo: document.getElementById("campoRolForoAsistente").value,
    correo: document.getElementById("campoCorreoAsistente").value.trim()
  };
  if (!datos.nombre || !datos.correo) {
    mostrarMensaje("mensajeAsistente", "Nombre y correo son obligatorios.", "error");
    return;
  }
  llamarServidor("rpcGuardarResponsable", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, "ASISTENTE", datos], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeAsistente", r.mensaje || "No fue posible agregar.", "error");
      return;
    }
    ["campoNombreAsistente", "campoCorreoAsistente"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    document.getElementById("formularioAsistenteEnvio").classList.add("oculto");
    cargarResponsables();
  });
});

function cargarResponsables() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcListarResponsables", [estado.idGrupo], function (r) {
    estado.responsables = r;
    renderResponsables(r);
    document.getElementById("btnMostrarFormAsistente").disabled = (r.asistentes || []).length >= 3;
  });
}

function quitarAsistenteEnvio(idRegistro) {
  llamarServidor("rpcEliminarResponsable", [estado.idGrupo, idRegistro, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (r.ok) cargarResponsables();
  });
}

/* ------------------------------------------------------------------ *
 * Matriz de participación por estamento e institución
 * ------------------------------------------------------------------ */
function cargarMatrizParticipacion() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcMatrizParticipacion", [estado.idGrupo], function (matriz) {
    renderMatrizParticipacion(matriz);
  });
}

/* ------------------------------------------------------------------ *
 * Participación / firmantes
 * ------------------------------------------------------------------ */
function actualizarFirmantes() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
    estado.ultimosFirmantes = r.firmantes || [];
    renderResumenFirmantes(r);
  });
}

function iniciarPollingFirmantes() {
  actualizarFirmantes();
  setInterval(actualizarFirmantes, 15000);
}

document.getElementById("btnVerTodosFirmantes").addEventListener("click", function () {
  renderTablaTodosFirmantes(estado.ultimosFirmantes);
  abrirModal("modalFirmantes");
});

/* ------------------------------------------------------------------ *
 * Sesión 1 — autoguardado con sincronización periódica
 * ------------------------------------------------------------------ */
var CAMPOS_SESION1 = [
  "REFLEXIONES", "CONCLUSIONES", "PROPUESTAS_IE", "EXPERIENCIAS", "RETOS", "APORTES_TERRITORIALES",
  "CONVERGENCIAS", "APUESTAS", "DESAFIOS", "IDENTIDAD", "PRIORIDADES", "PROPUESTAS_COLECTIVAS", "ACUERDOS", "RUTA",
  "APORTE_PROPIO_S1_TITULO", "APORTE_PROPIO_S1_TEXTO", "APORTE_PROPIO_S2_TITULO", "APORTE_PROPIO_S2_TEXTO"
];
var temporizadorGuardadoSesion1 = null;

function recolectarCamposSesion1() {
  var campos = {};
  CAMPOS_SESION1.forEach(function (nombre) {
    var el = document.getElementById("campo_" + nombre);
    if (el) campos[nombre] = el.value;
  });
  return campos;
}

function cargarSesion1() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcObtenerSesion1", [estado.idGrupo], function (datos) {
    if (!datos) return;
    CAMPOS_SESION1.forEach(function (nombre) {
      var el = document.getElementById("campo_" + nombre);
      if (el && !el.value && datos[nombre]) el.value = datos[nombre];
    });
  });
}

function guardarSesion1(manual) {
  if (!estado.idGrupo) return;
  llamarServidor("rpcGuardarSesion1", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, recolectarCamposSesion1()], function (r) {
    if (manual) mostrarMensaje("mensajeSesion1", r.ok ? "Avance guardado." : (r.mensaje || "No fue posible guardar."), r.ok ? "exito" : "error");
  });
}

document.querySelectorAll("[data-campo-sesion1]").forEach(function (campo) {
  campo.addEventListener("input", function () {
    clearTimeout(temporizadorGuardadoSesion1);
    temporizadorGuardadoSesion1 = setTimeout(function () {
      guardarSesion1(false);
    }, 2000);
  });
});
setInterval(function () {
  if (estado.idGrupo) guardarSesion1(false);
}, 30000);

document.getElementById("btnGuardarSesion1").addEventListener("click", function () {
  guardarSesion1(true);
});

document.getElementById("btnEnviarSesion1").addEventListener("click", function () {
  if (!confirm("¿Enviar Sesión 1 de forma definitiva? Verifique que todos los campos estén completos.")) return;
  guardarSesion1(false);
  llamarServidor("rpcEnviarSesion1", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    mostrarMensaje("mensajeSesion1", r.ok ? "Sesión 1 enviada." : (r.mensaje || "No fue posible enviar."), r.ok ? "exito" : "error");
  });
});

/* ------------------------------------------------------------------ *
 * Sesión 2 — ConectaEduca
 * ------------------------------------------------------------------ */
function cargarConectaEduca() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcListarConectaEduca", [estado.idGrupo], function (registros) {
    renderTablaConectaEduca(registros);
  });
}

document.getElementById("btnAgregarActorCE").addEventListener("click", function () {
  var registro = {
    ACTOR: document.getElementById("campoActorCE").value.trim(),
    TIPO_ACTOR: document.getElementById("campoTipoActorCE").value,
    AREA: document.getElementById("campoAreaCE").value.trim(),
    NECESIDADES_ARTICULACION: document.getElementById("campoNecesidadesCE").value.trim(),
    OPORTUNIDAD: document.getElementById("campoOportunidadCE").value.trim(),
    ALIANZA: document.getElementById("campoAlianzaCE").value.trim(),
    IE_INTERESADAS: document.getElementById("campoIEInteresadasCE").value.trim(),
    CONEXIONES: document.getElementById("campoConexionesCE").value.trim(),
    OBSERVACIONES: document.getElementById("campoObservacionesCE").value.trim()
  };
  if (!registro.ACTOR) {
    mostrarMensaje("mensajeConectaEduca", "El nombre del actor/entidad es obligatorio.", "error");
    return;
  }
  llamarServidor("rpcGuardarActorConectaEduca", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, registro], function (r) {
    if (!r.ok) {
      mostrarMensaje("mensajeConectaEduca", r.mensaje || "No fue posible guardar el registro.", "error");
      return;
    }
    mostrarMensaje("mensajeConectaEduca", "Actor registrado.", "exito");
    ["campoActorCE", "campoAreaCE", "campoNecesidadesCE", "campoOportunidadCE", "campoAlianzaCE", "campoIEInteresadasCE", "campoConexionesCE", "campoObservacionesCE"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    cargarConectaEduca();
  });
});

function borrarActorConectaEduca(idRegistro) {
  llamarServidor("rpcEliminarActorConectaEduca", [estado.idGrupo, idRegistro, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (r.ok) cargarConectaEduca();
  });
}

document.getElementById("btnEnviarSesion2").addEventListener("click", function () {
  if (!confirm("¿Enviar Sesión 2 (ConectaEduca) de forma definitiva?")) return;
  llamarServidor("rpcEnviarSesion2", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    mostrarMensaje("mensajeConectaEduca", r.ok ? "Sesión 2 enviada." : (r.mensaje || "No fue posible enviar."), r.ok ? "exito" : "error");
  });
});

/* ------------------------------------------------------------------ *
 * Confirmación de caracterización
 * ------------------------------------------------------------------ */
function cargarConfirmacionCaracterizacion() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcMatrizParticipacion", [estado.idGrupo], function (matriz) {
    llamarServidor("rpcListarResponsables", [estado.idGrupo], function (responsables) {
      renderFichaCaracterizacion(estado.grupo, estado.instituciones, matriz, responsables);
    });
  });
}

/* ------------------------------------------------------------------ *
 * Revisión, cierre y generación del informe
 * ------------------------------------------------------------------ */
function prepararCierre() {
  var boton = document.getElementById("btnGenerarInforme");
  var aviso = document.getElementById("avisoResponsablePrincipal");
  if (!estado.esPrincipal) {
    aviso.textContent = "Solo el responsable principal del grupo puede generar el informe definitivo. Puede seguir revisando mientras tanto.";
    boton.disabled = true;
  } else {
    aviso.textContent = "";
    boton.disabled = false;
  }
}

document.getElementById("btnGenerarInforme").addEventListener("click", function () {
  if (!confirm("¿Generar el informe definitivo del grupo? Esta acción crea el documento único que verán todas las IE del grupo.")) return;
  document.getElementById("btnGenerarInforme").disabled = true;
  llamarServidor("rpcGenerarInforme", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    document.getElementById("btnGenerarInforme").disabled = false;
    if (!r.ok) {
      mostrarMensaje("mensajeCierre", r.mensaje || "No fue posible generar el informe.", "error");
      return;
    }
    document.getElementById("enlaceInformeGenerado").href = r.url;
    cambiarPantalla("pantallaInformeGenerado");
  });
});
</script>
