/* ------------------------------------------------------------------ *
 * Heartbeat de sesión (mantiene el cupo de dispositivo activo)
 * ------------------------------------------------------------------ */
/**
 * El heartbeat mantiene vivo el cupo de este dispositivo en segundo
 * plano; ya NO interrumpe con un mensaje de error si un tick falla (ni
 * siquiera si el cupo se perdió) — con el tope de sesiones ampliado y la
 * poda automática de cupos inactivos (Session.gs, podarSesionesInactivas_)
 * esto ya no debería ocurrir en uso normal, y si de verdad ocurre, la
 * PRÓXIMA acción de escritura (guardar/enviar) lo reporta con un mensaje
 * concreto y accionable en el contexto donde ocurre, en vez de una alerta
 * genérica y alarmante que interrumpe a mitad de cualquier pantalla.
 */
function iniciarHeartbeat() {
  setInterval(function () {
    if (!estado.idGrupo) return;
    llamarServidor(
      "rpcMantenerSesion",
      [estado.idGrupo, estado.dispositivoId, estado.tokenSesion],
      function () {},
      function () {}
    );
  }, 30000);
}

/* ------------------------------------------------------------------ *
 * Método de asistencia (QR/enlace o listado físico + fotografía)
 * ------------------------------------------------------------------ */
function mostrarPanelMetodoAsistencia(metodo) {
  document.getElementById("panelMetodoQR").classList.toggle("oculto", metodo !== "QR");
  document.getElementById("panelMetodoListado").classList.toggle("oculto", metodo !== "LISTADO");
  // Métodos EXCLUSIVOS: con PDF (LISTADO) desaparece el conteo de firmas en
  // vivo (no aplica, nadie firma por celular); con QR sigue visible.
  var ocultarConteoFirmas = metodo === "LISTADO";
  document.getElementById("panelFirmantes").classList.toggle("oculto", ocultarConteoFirmas || !metodo);
  var filaContador = document.getElementById("filaContadorParticipantesTarjeta");
  if (filaContador) filaContador.classList.toggle("oculto", ocultarConteoFirmas);
  if (metodo === "QR") cargarEnlaceAsistencia();
  if (metodo === "LISTADO") cargarCantidadListado_();
}

function cargarEnlaceAsistencia() {
  llamarServidor("rpcUrlAsistencia", [estado.idGrupo], function (url) {
    var enlace = document.getElementById("enlaceAsistenciaQR");
    enlace.href = url;
    enlace.textContent = url;
    document.getElementById("imagenQRAsistencia").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(url);
  });
}

function elegirMetodoAsistencia(metodo) {
  mostrarPanelMetodoAsistencia(metodo);
  estado.metodoAsistencia = metodo;
  mostrarMensaje("mensajeSeleccionMetodo", "");
  document.getElementById("btnMetodoQR").classList.toggle("btn-metodo-activo", metodo === "QR");
  document.getElementById("btnMetodoListado").classList.toggle("btn-metodo-activo", metodo === "LISTADO");
  renderResumenParticipacionEstamentoTodo();
  llamarServidor("rpcGuardarMetodoAsistencia", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, metodo], function (r) {
    if (!r.ok) mostrarMensaje("mensajeMetodoAsistencia", r.mensaje || "No fue posible guardar el método.", "error");
  });
}

document.getElementById("btnMetodoQR").addEventListener("click", function () {
  elegirMetodoAsistencia("QR");
});
document.getElementById("btnMetodoListado").addEventListener("click", function () {
  elegirMetodoAsistencia("LISTADO");
});

// Es obligatorio elegir exactamente un método (QR o PDF) antes de continuar.
document.getElementById("btnContinuarAParticipacion").addEventListener("click", function () {
  if (estado.metodoAsistencia !== "QR" && estado.metodoAsistencia !== "LISTADO") {
    mostrarMensaje("mensajeSeleccionMetodo", "Elige un método de asistencia (QR o PDF) antes de continuar.", "error");
    document.getElementById("mensajeSeleccionMetodo").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // Ni se subió la foto ni se confirmó "más tarde" — antes de dejar
  // avanzar, se pregunta explícitamente qué se quiere hacer (spec: "debe
  // aparecer anuncio diciendo que si desea subir foto ahora o más adelante").
  if (!estado.fotoGrupoId && !estado.fotoGrupoMasTardeConfirmado) {
    confirmarAccion(
      "Todavía no has subido la fotografía general del grupo. ¿Deseas subirla ahora o continuar y subirla más adelante?",
      function () {
        estado.fotoGrupoMasTardeConfirmado = true;
        document.getElementById("btnContinuarAParticipacion").click();
      },
      "Fotografía del grupo",
      { textoConfirmar: "Continuar, subirla más adelante", textoCancelar: "Subir ahora" }
    );
    document.getElementById("formularioFotoGrupo").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  // La advertencia de "Verifique la participación por institución" ya NO
  // se muestra aquí (spec del usuario: "solo debe aparecer en la
  // confirmación de autorización [de caracterización], no antes") — queda
  // únicamente en btnConfirmarCaracterizacion, más abajo.
  // Recordatorio de hasta 4 colaboradores (responsable de envío + hasta 3
  // asistentes) que pueden recibir el informe — spec del usuario: "al dar
  // continuar, recordar que es posible tener hasta 4 colaboradores". Se
  // muestra una sola vez por sesión, no en cada clic.
  if (!estado.avisoColaboradoresMostrado) {
    estado.avisoColaboradoresMostrado = true;
    confirmarAccion(
      "Recuerda que puedes registrar hasta 4 colaboradores (el responsable de envío y hasta 3 asistentes) " +
        "para que reciban el informe del grupo — lo encuentras en \"Responsable de envío\", más abajo en " +
        "esta misma pantalla.",
      function () {
        irTrasParticipacion_();
      },
      "Colaboradores del grupo",
      { textoConfirmar: "Entendido, continuar", textoCancelar: "Volver a revisar" }
    );
    return;
  }
  irTrasParticipacion_();
});

/** Instituciones del grupo cuya columna en la matriz de participación por estamento quedó en cero. */
function institucionesSinParticipacionMarcada_() {
  var datos = estado.participacionEstamento;
  if (!datos || !datos.instituciones) return [];
  return datos.instituciones
    .filter(function (ie) { return !ie.total; })
    .map(function (ie) { return ie.institucion; });
}

/**
 * Tras "Continuar" en Participación: Encuentro va directo a la Sesión de
 * socialización (item 10 — reemplaza a "invitados especiales"/"Sesión de
 * preparación", ambas ocultas desde el item 9); ConectaEduca (item 8) va
 * directo a su propia pantalla. Confirmación de caracterización ya NO es
 * el siguiente paso aquí (spec del usuario: se movió al final del
 * recorrido, justo antes de Revisión y cierre — ver
 * irTrasConfirmarCaracterizacion_ más abajo).
 */
function irTrasParticipacion_() {
  if (estado.seccion === "CONECTAEDUCA") {
    cambiarPantalla("pantallaSesion2");
    return;
  }
  cambiarPantalla("pantallaSesionSocializacion");
}

/**
 * Tras confirmar la caracterización: a Revisión y cierre — igual para
 * ambas secciones, ya no hace falta ramificar por estado.seccion (spec
 * del usuario: Caracterización pasó a ser el último chequeo antes de
 * cerrar, en vez del paso intermedio entre Participación y las sesiones
 * de trabajo que era antes).
 */
function irTrasConfirmarCaracterizacion_() {
  cambiarPantalla("pantallaRevisionCierre");
}

/** "Atrás, corregir" de Confirmación de caracterización: vuelve a la sesión de trabajo de la sección actual. */
document.getElementById("btnAtrasCaracterizacion").addEventListener("click", function () {
  cambiarPantalla(estado.seccion === "CONECTAEDUCA" ? "pantallaSesion2" : "pantallaSesion1");
});

// La advertencia "Verifique la participación por institución" solo se
// muestra aquí, en la confirmación de caracterización (spec del
// usuario) — no antes, en Participación (ver btnContinuarAParticipacion).
//
// Antes de decidir si hay que mostrar "Invitados especiales", se refresca
// `estado.participacionEstamento` desde el servidor: el autoguardado por
// columna de la matriz (guardarColumnaParticipacionEstamento_) lo pone en
// null apenas se guarda y lo repuebla en segundo plano sin avisar a nadie
// — si el grupo terminaba de escribir la cantidad de estudiantes/
// egresados/padres y le daba click a "Confirmar" casi de inmediato,
// `irTrasConfirmarCaracterizacion_` podía leer ese `null` (o un valor
// viejo) y saltarse la pantalla de invitados aunque sí se hubiera
// declarado gente — dejando sin aparecer nunca la opción de enviar el
// enlace de invitados (bug reportado por el usuario).
document.getElementById("btnConfirmarCaracterizacion").addEventListener("click", function () {
  flushGuardadosPendientesParticipacionEstamento_(function () {
    cargarParticipacionEstamento(function () {
      var institucionesSinMarcar = institucionesSinParticipacionMarcada_();
      if (institucionesSinMarcar.length) {
        confirmarAccion(
          "Estas instituciones no tienen ninguna persona registrada en el cuadro de \"Participación por " +
            "estamento e institución\": " + institucionesSinMarcar.join(", ") + ". ¿La información es correcta?",
          irTrasConfirmarCaracterizacion_,
          "Verifique la participación por institución",
          { textoConfirmar: "Es correcto", textoCancelar: "No es correcto, voy a corregir" }
        );
        return;
      }
      irTrasConfirmarCaracterizacion_();
    });
  });
});

/* ------------------------------------------------------------------ *
 * Invitados especiales (estudiantes/egresados y padres/madres/
 * acudientes) — pantalla previa a la sesión de preparación, spec del
 * usuario: "tienen un espacio especial como invitados. Sus aportes deben
 * ser enviados desde el perfil de invitados."
 * ------------------------------------------------------------------ */
function prepararPantallaInvitadosEspeciales_() {
  var totales = (estado.participacionEstamento && estado.participacionEstamento.totalesPorEstamento) || {};
  var totalEstudiantes = (Number(totales.ESTUDIANTES) || 0) + (Number(totales.EGRESADOS) || 0);
  var totalPadres = Number(totales.PADRES) || 0;

  var partes = [];
  if (totalEstudiantes > 0) partes.push("Los/Las " + totalEstudiantes + " estudiantes y egresados(as) registrados(as)");
  if (totalPadres > 0) partes.push("los " + totalPadres + " padres/madres/acudientes registrados(as)");
  var texto = document.getElementById("textoInvitadosEspeciales");
  if (texto) {
    texto.textContent = partes.length
      ? partes.join(" y ") + " tienen un espacio especial como invitados. Sus aportes deben ser enviados desde el perfil de invitados."
      : "";
  }
  document.getElementById("bloqueInvitadosEstudiantes").classList.toggle("oculto", !totalEstudiantes);
  document.getElementById("bloqueInvitadosPadres").classList.toggle("oculto", !totalPadres);

  // Se limpia el estado de la pantalla en cada entrada (enlaces en caché,
  // mensajes, formularios de envío abiertos) para que no queden restos de
  // una visita anterior con otros conteos.
  estado.enlacesInvitados = null;
  ["mensajeEnlaceEstudiantes", "mensajeEnlacePadres", "mensajeEnvioEstudiantes", "mensajeEnvioPadres"].forEach(function (id) {
    mostrarMensaje(id, "");
  });
  document.getElementById("formularioEnvioEstudiantes").classList.add("oculto");
  document.getElementById("formularioEnvioPadres").classList.add("oculto");
}

/** Enlaces de invitado del grupo (estudiante/egresado y acudiente), obtenidos una sola vez y cacheados en estado. */
function obtenerEnlacesInvitados_(callback) {
  if (estado.enlacesInvitados) {
    callback(estado.enlacesInvitados);
    return;
  }
  llamarServidor(
    "rpcObtenerEnlacesInvitadosGrupo",
    [estado.idGrupo],
    function (r) {
      if (!r || !r.ok) {
        callback(null);
        return;
      }
      estado.enlacesInvitados = r;
      callback(r);
    },
    function () {
      callback(null);
    }
  );
}

function darEnlaceInvitados_(tipoInvitado, idMensaje) {
  obtenerEnlacesInvitados_(function (r) {
    if (!r) {
      mostrarMensaje(idMensaje, "No fue posible obtener el enlace.", "error");
      return;
    }
    var enlace = tipoInvitado === "ESTUDIANTE" ? r.estudiante : r.acudiente;
    if (navigator.clipboard) navigator.clipboard.writeText(enlace);
    mostrarMensaje(idMensaje, "Enlace copiado: " + enlace, "exito");
  });
}

document.getElementById("btnDarEnlaceEstudiantes").addEventListener("click", function () {
  darEnlaceInvitados_("ESTUDIANTE", "mensajeEnlaceEstudiantes");
});
document.getElementById("btnDarEnlacePadres").addEventListener("click", function () {

document.getElementById("btnMostrarEnvioEstudiantes").addEventListener("click", function () {

/** Envía por correo el enlace de invitado al responsable de envío que el grupo designe para su propio grupo (estudiantes/egresados o padres/madres/acudientes). */
function enviarEnlaceInvitadosDesdeUI_(tipoInvitado, idCampo, idMensaje) {
  var valor = document.getElementById(idCampo).value.trim();
  if (!valor) {
    mostrarMensaje(idMensaje, "Escriba al menos un correo electrónico.", "error");
    return;
  }
  llamarServidor(
    "rpcEnviarEnlaceInvitados",
    [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, tipoInvitado, valor],
    function (r) {
      if (!r.ok) {
        mostrarMensaje(idMensaje, r.mensaje || "No fue posible enviar el correo.", "error");
        return;
      }
      mostrarMensaje(idMensaje, "Enlace enviado por correo.", "exito");
    }
  );
}

document.getElementById("btnEnviarEmailEstudiantes").addEventListener("click", function () {
  enviarEnlaceInvitadosDesdeUI_("ESTUDIANTE", "campoEmailsEstudiantes", "mensajeEnvioEstudiantes");

document.getElementById("btnCopiarEnlaceAsistencia").addEventListener("click", function () {

});

/**
 * Vista de pantalla completa del QR (para proyectar en el evento) —
 * compartida entre Participación (botón original) y Revisión y cierre
 * (spec del usuario: dar la misma opción ahí para el método QR).
 */
var intervaloPantallaCompletaQR = null;
function abrirPantallaCompletaQR_(url) {
  if (!url) return;
  document.getElementById("imagenQRPantallaCompleta").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(url);
  document.getElementById("enlacePantallaCompleta").textContent = url;
  var overlay = document.getElementById("pantallaCompletaQR");
  overlay.classList.remove("oculto");
  if (overlay.requestFullscreen) overlay.requestFullscreen().catch(function () {});

  var actualizarContadorGrande = function () {
    llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
      document.getElementById("contadorFirmantesPantallaCompleta").textContent = r.total || 0;
    }, function () {});
  };
  actualizarContadorGrande();
  intervaloPantallaCompletaQR = setInterval(actualizarContadorGrande, 5000);
}

document.getElementById("btnPantallaCompletaQR").addEventListener("click", function () {
  abrirPantallaCompletaQR_(document.getElementById("enlaceAsistenciaQR").href);
});
document.getElementById("btnPantallaCompletaQRCierre").addEventListener("click", function () {
  abrirPantallaCompletaQR_(document.getElementById("enlaceAsistenciaQRCierre").href);
});

document.getElementById("btnCerrarPantallaCompletaQR").addEventListener("click", function () {
  clearInterval(intervaloPantallaCompletaQR);
  document.getElementById("pantallaCompletaQR").classList.add("oculto");
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
});

document.getElementById("btnCopiarEnlacePantallaCompleta").addEventListener("click", function () {
  var url = document.getElementById("enlacePantallaCompleta").textContent;
  if (navigator.clipboard && url) navigator.clipboard.writeText(url);
});

function leerArchivoComoBase64_(archivo, callback) {
  var lector = new FileReader();
  lector.onload = function () {
    var base64 = lector.result.split(",")[1];
    callback(base64);
  };
  lector.readAsDataURL(archivo);
}

document.getElementById("btnSubirListado").addEventListener("click", function () {
  var input = document.getElementById("campoArchivoListado");
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje("mensajeMetodoAsistencia", "Selecciona primero un archivo.", "error");
    return;
  }
  if (archivo.type !== "application/pdf") {
    mostrarMensaje("mensajeMetodoAsistencia", "Solo se admiten archivos PDF para el listado de asistencia.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    mostrarCargaAccion_("listado", "Subiendo listado de asistencia…");
    llamarServidor(
      "rpcSubirListadoAsistencia",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        ocultarCargaAccion_();
        mostrarMensaje("mensajeMetodoAsistencia", r.ok ? "PDF subido correctamente." : (r.mensaje || "No fue posible subir el listado."), r.ok ? "exito" : "error");
        if (r.ok) {
          input.value = "";
          // Apenas se sube el PDF, se despliega de inmediato la casilla
          // para declarar cuántas personas quedaron registradas en el
          // listado (spec del usuario) — reutiliza el mismo mecanismo de
          // Revisión y cierre (rpcGuardarCantidadListadoAsistencia).
          document.getElementById("panelCantidadListado").classList.remove("oculto");
          cargarCantidadListado_();
        }
      },
      function (error) {
        ocultarCargaAccion_();
        console.error("rpcSubirListadoAsistencia", error);
        mostrarMensaje("mensajeMetodoAsistencia", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
      }
    );
  });
});

// "Subir más tarde" no sube nada: solo tranquiliza a quien diligencia de
// que puede seguir con el resto del instrumento — el listado se puede
// subir en cualquier momento después, desde este mismo panel (no hay
// candado que lo exija para continuar ni para generar el informe).
document.getElementById("btnListadoMasTarde").addEventListener("click", function () {
  estado.listadoAsistenciaMasTardeConfirmado = true;
  mostrarMensaje(
    "mensajeMetodoAsistencia",
    "De acuerdo — puedes continuar con el instrumento. Cuando lo tengas a mano, vuelve a esta pantalla para " +
      "subir el listado firmado.",
    "info"
  );
});

/**
 * Cantidad declarada del listado de asistencia (método PDF), en
 * Participación — misma fuente/RPC que "panelListadoCierre" en Revisión y
 * cierre (rpcObtenerInfoListadoAsistencia / rpcGuardarCantidadListadoAsistencia),
 * para que ambas pantallas queden siempre sincronizadas.
 */
function cargarCantidadListado_() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcObtenerInfoListadoAsistencia", [estado.idGrupo], function (info) {
    estado.cantidadListado = (info && info.cantidad) || 0;
    var campo = document.getElementById("campoCantidadListado");
    if (campo && document.activeElement !== campo) campo.value = estado.cantidadListado || "";
    var panel = document.getElementById("panelCantidadListado");
    if (panel && info && info.idListado) panel.classList.remove("oculto");
    renderResumenParticipacionEstamentoTodo();
  }, function () {});
}

document.getElementById("campoCantidadListado").addEventListener("change", function () {
  var valor = Math.max(0, parseInt(this.value, 10) || 0);
  llamarServidor(
    "rpcGuardarCantidadListadoAsistencia",
    [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, valor],
    function (r) {
      if (!r.ok) {
        mostrarMensaje("mensajeCantidadListado", r.mensaje || "No fue posible guardar.", "error");
        return;
      }
      estado.cantidadListado = valor;
      var campoCierre = document.getElementById("campoCantidadListadoCierre");
      if (campoCierre) campoCierre.value = valor || "";
      renderResumenParticipacionEstamentoTodo();
      mostrarMensaje("mensajeCantidadListado", "Guardado.", "exito");
    }
  );
});

/* ------------------------------------------------------------------ *
 * Fotografía general del grupo — independiente del método de asistencia
 * elegido, obligatoria para poder finalizar el Foro. Se puede subir
 * desde Participación o, si se aplaza, desde la pantalla final (Informe
 * generado) — mismo botón/lógica reutilizada en las dos pantallas.
 * ------------------------------------------------------------------ */
function subirFotoGrupoDesde_(idInput, idMensaje) {
  var input = document.getElementById(idInput);
  var archivo = input.files[0];
  if (!archivo) {
    mostrarMensaje(idMensaje, "Selecciona primero una fotografía.", "error");
    return;
  }
  leerArchivoComoBase64_(archivo, function (base64) {
    mostrarCargaAccion_("foto", "Subiendo fotografía…");
    llamarServidor(
      "rpcSubirFotoGrupo",
      [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, base64, archivo.name, archivo.type],
      function (r) {
        ocultarCargaAccion_();
        mostrarMensaje(idMensaje, r.ok ? "Fotografía subida correctamente." : (r.mensaje || "No fue posible subir la fotografía."), r.ok ? "exito" : "error");
        if (r.ok) {
          input.value = "";
          estado.fotoGrupoId = r.fileId;
          refrescarVistasFotoGrupo_();
          mostrarMensaje("mensajeFaltaFotoFinalizar", "");
        }
      },
      function (error) {
        ocultarCargaAccion_();
        console.error("rpcSubirFotoGrupo", error);
        mostrarMensaje(idMensaje, "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
      }
    );
  });
}

/**
 * Refresca las vistas de la fotografía del grupo (Participación,
 * Confirmación de caracterización y Revisión y cierre) tras subirla/
 * cambiarla. Ya no incluye la pantalla de Informe generado: la
 * fotografía se dejó de pedir/mostrar ahí (spec del usuario) — el último
 * punto donde se exige es "Generar informe" (Revisión y cierre), y queda
 * incluida dentro del informe mismo (ver Informes.gs), no en pantalla.
 */
function refrescarVistasFotoGrupo_() {
  renderFotoGrupo(estado.fotoGrupoId, "previaFotoGrupo", "formularioFotoGrupo", estado.grupo);
  var totalDeclarado = (estado.participacionEstamento && estado.participacionEstamento.totalGeneral) || 0;
  renderPieFotoCaracterizacion(estado.fotoGrupoId, estado.grupo, totalDeclarado);
  renderPieFotoCaracterizacion(estado.fotoGrupoId, estado.grupo, totalDeclarado, "pieFotoCierre");
  renderPieFotoCaracterizacion(estado.fotoGrupoId, estado.grupo, totalDeclarado, "previaFotoGrupoRevisar");
  var btnCambiarFoto = document.getElementById("btnCambiarFotoCaracterizacion");
  if (btnCambiarFoto) btnCambiarFoto.textContent = estado.fotoGrupoId ? "✏️ Cambiar fotografía" : "📷 Agregar fotografía";
  var formCaracterizacion = document.getElementById("formularioFotoGrupoCaracterizacion");
  if (formCaracterizacion) formCaracterizacion.classList.add("oculto");
  // Si todavía no se ha subido la fotografía (spec del usuario: "si se
  // pide subir fotografía más adelante, no debe aparecer opción de
  // cambiar ni de subir fotografía en caracterización") NO debe aparecer
  // ni "Cambiar fotografía" ni "Subir fotografía" en Confirmación de
  // caracterización — el gate obligatorio de Participación ya exige
  // subirla o aplazarla explícitamente antes de llegar aquí, así que
  // llegar sin fotoGrupoId siempre significa que se aplazó; se vuelve a
  // pedir en Revisión y cierre (última pantalla donde sí se exige, antes
  // de generar el informe), no en medio del recorrido. Se usa fotoGrupoId
  // (dato del servidor) en vez del flag local fotoGrupoMasTardeConfirmado
  // para que funcione igual sin importar desde qué dispositivo se entre.
  var filaBotonFotoCaracterizacion = document.getElementById("filaBotonFotoCaracterizacion");
  if (filaBotonFotoCaracterizacion) {
    filaBotonFotoCaracterizacion.classList.toggle("oculto", !estado.fotoGrupoId);
  }
  var btnCambiarFotoCierre = document.getElementById("btnCambiarFotoCierre");
  if (btnCambiarFotoCierre) btnCambiarFotoCierre.textContent = estado.fotoGrupoId ? "✏️ Cambiar fotografía" : "📷 Agregar fotografía";

/** Número real del grupo (p.ej. "Grupo 3" -> "3"), para reemplazar los "(#)" de las etiquetas. */
function numeroGrupoActual_() {
  var m = String(estado.grupo || "").match(/\d+/);
  return m ? m[0] : String(estado.grupo || "").trim();
}

/**
 * Lista de comunas (y "zona rural" si aplica) de las IE del grupo, en
 * texto natural sin paréntesis — p.ej. "1 y 2" o "1, 2 y zona rural".
 */
function textoComunasGrupoActual_() {
  var numericas = [];
  var tieneRural = false;
  (estado.instituciones || []).forEach(function (ie) {
    var c = String(ie.comuna || "").trim();
    if (!c) return;
    if (/^\d+$/.test(c)) {
      if (numericas.indexOf(c) === -1) numericas.push(c);
    } else {
      tieneRural = true;
    }
  });
  numericas.sort(function (a, b) {
    return Number(a) - Number(b);
  });
  var partes = numericas.map(function (n) {
    return n;
  });
  if (tieneRural) partes.push("zona rural");
  if (!partes.length) return "comunas del grupo";
  if (partes.length === 1) return "comuna " + partes[0];
  return "comunas " + partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1];
}

/**
 * Reemplaza los "grupo (#)" / "(comunas # y rural)" fijos de las etiquetas
 * de la segunda parte de ConectaEduca por el número de grupo y las
 * comunas reales del grupo actual — ya sin paréntesis.
 */
function actualizarEtiquetasConectaEducaGrupo() {
  var numeroGrupo = numeroGrupoActual_();
  ["numeroGrupoCE_PRIORIDADES", "numeroGrupoCE_PROPUESTAS", "numeroGrupoCE_RUTA"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = "Grupo " + numeroGrupo;
  });
  var elComunas = document.getElementById("comunasGrupoCE_ACUERDOS");
  if (elComunas) elComunas.textContent = textoComunasGrupoActual_();
}

/* ------------------------------------------------------------------ *
 * Correo: mismo autocompletado (@g -> @gmail.com, @h -> @hotmail.com) y
 * validación de formato que la página pública de asistencia
 * (AsistenciaPublica.html) — reutilizado aquí para responsable/asistentes
 * de envío.
 * ------------------------------------------------------------------ */
var REGEX_CORREO_ = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function activarAutocompletadoCorreo_(idCampo) {
  var campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.addEventListener("input", function () {
    var m = /^([^@\s]+)@(g|h)$/i.exec(campo.value);
    if (m) campo.value = m[1] + "@" + (m[2].toLowerCase() === "g" ? "gmail.com" : "hotmail.com");
  });
}
/** true si el campo tiene un correo con formato válido; si no, lo reporta en idMensaje y enfoca el campo. */
function correoValido_(idCampo, idMensaje) {
  var campo = document.getElementById(idCampo);
  var valor = campo ? campo.value.trim() : "";
  if (REGEX_CORREO_.test(valor)) return true;
  mostrarMensaje(idMensaje, "Corrige el formato del correo electrónico (ejemplo: nombre@correo.com).", "error");
  if (campo) campo.focus();
  return false;
}

/* ------------------------------------------------------------------ *
 * Participación por estamento e institución (formato de 3.1) — UNA sola
 * tabla horizontal (filas = estamento, columnas = IE, fila Total),

var CONTENEDORES_PARTICIPACION_ESTAMENTO_ = ["contenedorParticipacionEstamento", "contenedorParticipacionEstamentoCaracterizacion", "contenedorParticipacionEstamentoRevisar"];
var RESUMENES_PARTICIPACION_ESTAMENTO_ = ["resumenParticipacionEstamento", "resumenParticipacionEstamentoCaracterizacion", "resumenParticipacionEstamentoRevisar"];
var temporizadoresGuardadoParticipacionEstamento_ = {};

function cargarParticipacionEstamento(alTerminar) {

  }, function (error) {

  });
}

function renderResumenParticipacionEstamentoTodo() {

    }

/** Recalcula en vivo la fila/columna de totales de la tabla horizontal que contiene este input, sin ir al servidor. */
function actualizarTotalesParticipacionEstamentoHorizontal_(tabla) {
  if (!tabla) return;
  var totalGeneral = 0;
  tabla.querySelectorAll("tbody tr[data-estamento]").forEach(function (fila) {
    var totalFila = 0;
    fila.querySelectorAll(".input-participantes-h").forEach(function (input) {
      totalFila += Math.max(0, parseInt(input.value, 10) || 0);
    });
    var celdaTotalFila = fila.querySelector(".total-fila-estamento");
    if (celdaTotalFila) celdaTotalFila.textContent = totalFila;
  });
  var filaTotal = tabla.querySelector("tfoot tr.fila-total-ie");
  if (filaTotal) {
    var granTotal = 0;
    filaTotal.querySelectorAll("[data-total-ie]").forEach(function (celda) {
      var idIE = celda.getAttribute("data-total-ie");
      var totalIE = 0;
      tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
        totalIE += Math.max(0, parseInt(input.value, 10) || 0);
      });
      celda.textContent = totalIE;
      granTotal += totalIE;
    });
    var celdaGranTotal = filaTotal.querySelector(".gran-total");
    if (celdaGranTotal) celdaGranTotal.textContent = granTotal;
  }
}

/**
 * Autoguardado por columna (IE): junta los valores de esa IE en TODA la
 * tabla que se está editando y los guarda. `alTerminar`, si se pasa, se
 * llama cuando el guardado (y el refresco posterior de
 * estado.participacionEstamento) ya terminó — lo usa
 * flushGuardadosPendientesParticipacionEstamento_ para saber cuándo es
 * seguro leer los totales recién guardados.
 */
function guardarColumnaParticipacionEstamento_(tabla, idIE, alTerminar) {
  var valores = {};
  tabla.querySelectorAll('.input-participantes-h[data-ie="' + idIE + '"]').forEach(function (input) {
    valores[input.dataset.estamento] = input.value;
  });
  llamarServidor("rpcGuardarParticipacionEstamentoIE", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, idIE, valores], function (r) {
    if (r.ok) {
      estado.participacionEstamento = null; // se refresca en segundo plano en la próxima carga, sin pisar lo que el usuario está escribiendo ahora
      llamarServidor("rpcObtenerParticipacionEstamento", [estado.idGrupo], function (datos) {
        estado.participacionEstamento = datos;
        if (alTerminar) alTerminar();
      }, function () { if (alTerminar) alTerminar(); });
    } else if (alTerminar) {
      alTerminar();
    }
  }, function () { if (alTerminar) alTerminar(); });
}

/**
 * Vuelca de inmediato cualquier guardado de la matriz de participación por
 * estamento que todavía esté esperando su debounce de 1.5s (columna que
 * el grupo acaba de editar) — evita que "Confirmar caracterización",
 * llamado casi al instante de escribir, decida si hay invitados
 * especiales con datos todavía no guardados. Llama a `callback` cuando
 * todos los guardados pendientes (si había alguno) ya terminaron.
 */
function flushGuardadosPendientesParticipacionEstamento_(callback) {
  var claves = Object.keys(temporizadoresGuardadoParticipacionEstamento_);
  if (!claves.length) {
    callback();
    return;
  }
  var pendientes = claves.length;
  function unoMenos() {
    pendientes--;
    if (pendientes <= 0) callback();
  }
  claves.forEach(function (clave) {
    clearTimeout(temporizadoresGuardadoParticipacionEstamento_[clave]);
    delete temporizadoresGuardadoParticipacionEstamento_[clave];
    var separador = clave.lastIndexOf("|");
    var idTabla = clave.slice(0, separador);
    var idIE = clave.slice(separador + 1);
    var tabla = document.getElementById(idTabla);
    if (!tabla) {
      unoMenos();
      return;
    }
    guardarColumnaParticipacionEstamento_(tabla, idIE, unoMenos);
  });
}

document.addEventListener("input", function (evento) {
  var input = evento.target.closest(".input-participantes-h");
  if (!input) return;
  var tabla = input.closest("table.tabla-participacion-horizontal");
  if (!tabla) return;
  actualizarTotalesParticipacionEstamentoHorizontal_(tabla);

  var idIE = input.dataset.ie;
  var clave = tabla.id + "|" + idIE;
  clearTimeout(temporizadoresGuardadoParticipacionEstamento_[clave]);
  temporizadoresGuardadoParticipacionEstamento_[clave] = setTimeout(function () {
    guardarColumnaParticipacionEstamento_(tabla, idIE);
  }, 1500);
});

 * ------------------------------------------------------------------ */
// "Sesión1" en el nombre es histórico: este arreglo cubre todos los
// campos de texto libre a nivel de GRUPO, tanto de Sesión 1 (Consolidado
// de Socialización + Construcción colectiva) como de Sesión 2/ConectaEduca
// (preguntas de grupo + segunda parte + aporte propio) — todos comparten
// el mismo autoguardado y el mismo UPSERT-por-grupo (Sesion1.gs).
var CAMPOS_SESION1 = [
  // Sesión 1 — las 11 preguntas reales del FEI (item 16, Documento Orientador FEM2026).
  "FEM2025_P1", "FEM2025_P2",
  "CURRICULO_P1", "CURRICULO_P2", "CURRICULO_P3", "CURRICULO_P4", "CURRICULO_P5",
  "GOBIERNO_P1", "GOBIERNO_P2", "GOBIERNO_P3", "GOBIERNO_P4",
  "NECESIDADES_ARTICULACION_GRUPO", "OPORTUNIDADES_GRUPO",
  "APRECIACION_SENA_GRUPO", "PROFUNDIZACIONES_GRUPO",
  "PRIORIDADES_CE", "ACUERDOS_CE", "PROPUESTAS_CE", "RUTA_CE",
  "APORTE_PROPIO_S1_TITULO", "APORTE_PROPIO_S1_TEXTO", "APORTE_PROPIO_S2_TITULO", "APORTE_PROPIO_S2_TEXTO"
];
var temporizadorGuardadoSesion1 = null;

function recolectarCamposSesion1() {
  var campos = {};
  CAMPOS_SESION1.forEach(function (nombre) {
    var el = document.getElementById("campo_" + nombre);
    if (el) campos[nombre] = el.value;
  });

}

/**
 * Guardado local (localStorage) de Sesión 1/2, además del guardado en la
 * nube (spec del usuario: "verifica guardado local y guardado en la
 * nube"). Se escribe en cada tecleo, sin debounce (es instantáneo y no
 * necesita red) — así, si se cierra la pestaña de golpe antes de que el
 * guardado a la nube (2s de debounce) alcance a dispararse, el borrador
 * sigue disponible al reabrir en el MISMO dispositivo. Si se cambia de
 * dispositivo, no hay borrador local ahí, así que se retoma desde el
 * último guardado en la nube (rpcObtenerSesion1, más abajo).
 */
function claveBorradorLocalSesion1_(campo) {
  return "FEC_BORRADOR_" + estado.idGrupo + "_" + campo;
}
function guardarBorradorLocalSesion1_(campo, valor) {
  try {
    localStorage.setItem(claveBorradorLocalSesion1_(campo), valor);
  } catch (e) {}
}
/** Rellena los campos vacíos con el borrador local del dispositivo, antes de consultar la nube. */
function poblarDesdeBorradorLocalSesion1_() {
  if (!estado.idGrupo) return;
  CAMPOS_SESION1.forEach(function (nombre) {
    var el = document.getElementById("campo_" + nombre);
    if (!el || el.value) return;
    try {
      var borrador = localStorage.getItem(claveBorradorLocalSesion1_(nombre));
      if (borrador) el.value = borrador;
    } catch (e) {}
  });
}

function cargarSesion1() {
  if (!estado.idGrupo) return;
  poblarDesdeBorradorLocalSesion1_();

/**
 * Pinta, en solo lectura, las respuestas ya guardadas (leídas directamente
 * de los campos de edición, que ya tienen el valor real gracias a
 * cargarSesion1) — nunca vuelve a mostrar el cuadro de texto en blanco,
 * solo el texto ya escrito (spec del usuario).
 */
function renderRespuestasSoloLectura_(idContenedor, preguntas, claveTituloAporte, claveTextoAporte) {
  var contenedor = document.getElementById(idContenedor);
  if (!contenedor) return;
  var html = "";
  preguntas.forEach(function (p) {
    var el = document.getElementById("campo_" + p.clave);
    var valor = el ? el.value.trim() : "";
    if (!valor) return;
    html += "<div class='respuesta-solo-lectura'><h4>" + escapeHtml(p.etiqueta) + "</h4><p>" +
      escapeHtml(valor) + "</p></div>";
  });
  if (claveTituloAporte && claveTextoAporte) {
    var elTitulo = document.getElementById("campo_" + claveTituloAporte);
    var elTexto = document.getElementById("campo_" + claveTextoAporte);
    var titulo = elTitulo ? elTitulo.value.trim() : "";
    var texto = elTexto ? elTexto.value.trim() : "";
    if (titulo || texto) {
      html += "<div class='respuesta-solo-lectura'><h4>➕ Aporte propio del grupo" +
        (titulo ? ": " + escapeHtml(titulo) : "") + "</h4><p>" + escapeHtml(texto) + "</p></div>";
    }
  }
  contenedor.innerHTML = html;
}

/* ------------------------------------------------------------------ *
 * Sesión de preparación (pre-socialización) — cada IE elige responsable,
 * transición con su logo, responde 6 preguntas (punto de partida:
 * resumen sugerido del Informe Ejecutivo de esa IE) y las envía.
 * ------------------------------------------------------------------ */
function cargarListaIEPreparacion() {
  if (!estado.idGrupo) return;
  // Overlay de carga mientras se pintan las instituciones y los aportes
  // de invitados — antes esta pantalla no mostraba ningún gif mientras
  // cargaba (spec del usuario).
  mostrarCargaAccion_("acceso", "Cargando instituciones y aportes…");
  var pendientesCargaLista_ = 2;
  var marcarListoCargaLista_ = function () {
    pendientesCargaLista_--;
    if (pendientesCargaLista_ <= 0) ocultarCargaAccion_();
  };
  llamarServidor(
    "rpcPreparacionesEnviadasGrupo",
    [estado.idGrupo],
    function (enviadas) {
      // rpcPreparacionesEnviadasGrupo normalmente devuelve un arreglo
      // (no el objeto {ok, mensaje} de las demás RPC): si el servidor
      // atrapó una excepción (ejecutarRpcSeguro_), `enviadas` llega como
      // {ok:false, ...} en vez de arreglo. Sin esta guarda, el
      // .forEach de abajo lanzaría un TypeError silencioso que dejaba a
      // medias el pintado de la pantalla — y con él, el botón
      // "Continuar a Sesión 1" nunca se actualizaba. Se protege con
      // try/catch además, para que un error en el pintado (p. ej. un
      // dato inesperado de una IE puntual) tampoco impida que el botón
      // se actualice.
      try {
        var idsEnviados = {};
        (Array.isArray(enviadas) ? enviadas : []).forEach(function (e) { idsEnviados[e.idIE] = true; });
        estado.idsPreparacionEnviados = idsEnviados;
        renderListaIEPreparacion(estado.instituciones, idsEnviados);
        mostrarMensajePreparacionFaltante_(idsEnviados);
        if (enviadas && enviadas.ok === false) {
          mostrarMensaje("mensajePreparacionPendiente", enviadas.mensaje || "No fue posible cargar el estado de preparación. Intente de nuevo.", "error");
        }
      } catch (error) {
        console.error("cargarListaIEPreparacion", error);
      }
      actualizarBotonesContinuarSesion1_();
      marcarListoCargaLista_();
    },
    function (error) {
      console.error("rpcPreparacionesEnviadasGrupo", error);
      mostrarMensaje("mensajePreparacionPendiente", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
      actualizarBotonesContinuarSesion1_();
      marcarListoCargaLista_();
    }
  );
  llamarServidor("rpcAportesInvitadosGrupo", [estado.idGrupo], function (datos) {
    renderAportesInvitadosGrupo(Array.isArray(datos) ? datos : []);
    marcarListoCargaLista_();
  }, function () {
    marcarListoCargaLista_();
  });
}

/**
 * La Sesión de preparación NO es opcional: es condición para continuar a
 * Sesión 1 (spec: "La preparación no es opcional, es condición para
 * continuar a la sesión uno"). Cada IE avanza por su cuenta apenas
 * envía sus propios aportes — SIN esperar a que las demás instituciones
 * del grupo terminen (spec: "debe dar botón continuar si ya la IE hizo
 * sus aportes", "aparece por IE individual, sin esperar a las demás"):
 *   - Desde la pantalla de una IE, "Continuar a Sesión 1" aparece en
 *     cuanto ESA IE ya envió.
 *   - Desde la pantalla de Selección, aparece en cuanto AL MENOS UNA IE
 *     del grupo ya envió (hay algo que socializar).
 */
function algunaIEPreparo_() {
  var idsEnviados = estado.idsPreparacionEnviados || {};

  if (botonPreparacionIE) botonPreparacionIE.classList.toggle("oculto", !idsEnviados[estado.prepIdIE]);

function mostrarMensajePreparacionFaltante_(idsEnviados) {
  var faltantes = estado.instituciones.filter(function (ie) { return !idsEnviados[ie.idIE]; });
  var contenedor = document.getElementById("mensajePreparacionPendiente");
  if (!contenedor) return;

  } else {

      "</strong>. La institución que ya terminó puede continuar a Sesión 1 sin esperar a las demás.</div>";
  }
}

/**
 * `callback` se llama SIEMPRE cuando el guardado termina (con r.ok), para
 * poder encadenar guardar → enviar sin condición de carrera: antes, al
 * hacer clic en "Enviar" inmediatamente después de "Guardar" (fire-and-
 * forget), el servidor a veces todavía no había escrito el resumen
 * sugerido en la hoja, y mostraba por error "Responda al menos una
 * pregunta antes de enviar" aunque la pantalla ya mostrara texto.
 */
function guardarPreparacionIEActual(manual, callback) {
  if (!estado.idGrupo || !estado.prepIdIE) {
    if (callback) callback(false);
    return;
  }
  llamarServidor(
    "rpcGuardarPreparacionIE",
    [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, estado.prepIdIE, estado.prepResponsable, recolectarRespuestasPreparacionIE()],
    function (r) {
      if (manual) mostrarMensaje("mensajePreparacionIE", r.ok ? "Avance guardado." : (r.mensaje || "No fue posible guardar."), r.ok ? "exito" : "error");
      if (callback) callback(!!r.ok);
    },
    function () {
      if (callback) callback(false);
    }
  );
}

/**
 * Al seleccionar cualquier fragmento de texto dentro de los aportes
 * relevantes de la socialización (Sesión 1), queda copiado automáticamente
 * al portapapeles — listo para pegar en cualquiera de las preguntas de
 * "Construcción colectiva del grupo" (spec del usuario) — con un aviso
 * central sutil, sin bloquear la pantalla.
 */
(function () {
  var contenedor = document.getElementById("listaSocializacionPreparacion");
  if (!contenedor) return;
  var aviso = document.getElementById("avisoTextoCopiado");
  var temporizadorAviso = null;

  function copiarSeleccionActual_() {
    var seleccion = window.getSelection ? window.getSelection() : null;
    var texto = seleccion ? seleccion.toString().trim() : "";
    if (!texto) return;
    var terminar = function () {
      if (!aviso) return;
      aviso.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(function () {
        aviso.classList.remove("visible");
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(terminar, terminar);
    } else {
      // Reserva para navegadores sin Clipboard API (poco frecuentes hoy):
      // copiar mediante un textarea temporal y el comando de copia clásico.
      var temporal = document.createElement("textarea");
      temporal.value = texto;
      temporal.style.position = "fixed";
      temporal.style.opacity = "0";
      document.body.appendChild(temporal);
      temporal.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(temporal);
      terminar();
    }
  }

  contenedor.addEventListener("mouseup", copiarSeleccionActual_);
  contenedor.addEventListener("touchend", copiarSeleccionActual_);
})();

/* ------------------------------------------------------------------ *
 * Pantalla completa EDITABLE (👁️) + guardado inline (💾) para cualquier
 * pregunta de texto largo (Sesión 1, Sesión 2, Preparación IE, invitado):
 * más cómodo que escribir en una caja pequeña, especialmente en celular.
 * ------------------------------------------------------------------ */
var textareaEdicionCompletaActual_ = null;

/** Deduce un título legible para la pantalla completa a partir del H3/label/summary que antecede al textarea. */
function tituloParaTextarea_(ta) {
  var previo = ta.previousElementSibling;
  while (previo && previo.tagName === "P" && previo.classList.contains("ayuda")) {
    previo = previo.previousElementSibling;
  }
  if (previo && (previo.tagName === "H3" || previo.tagName === "LABEL")) return previo.textContent.trim();
  var detalles = ta.closest("details");
  if (detalles) {
    var resumen = detalles.querySelector("summary");
    if (resumen) return resumen.textContent.replace("✓", "").trim();
  }
  return "Editar respuesta";
}

function abrirEdicionPantallaCompleta(ta) {
  textareaEdicionCompletaActual_ = ta;
  document.getElementById("tituloPantallaCompletaEdicion").textContent = tituloParaTextarea_(ta);
  var area = document.getElementById("areaPantallaCompletaEdicion");
  area.value = ta.value;
  document.getElementById("pantallaCompletaEdicion").classList.remove("oculto");
  area.focus();
}
function cerrarEdicionPantallaCompleta() {
  document.getElementById("pantallaCompletaEdicion").classList.add("oculto");
  textareaEdicionCompletaActual_ = null;
}
document.getElementById("btnCerrarPantallaCompletaEdicion").addEventListener("click", cerrarEdicionPantallaCompleta);
document.getElementById("areaPantallaCompletaEdicion").addEventListener("input", function () {
  if (!textareaEdicionCompletaActual_) return;
  textareaEdicionCompletaActual_.value = this.value;
  // Dispara el evento "input" en el textarea real para que el autoguardado
  // y el contador de palabras normales sigan funcionando sin duplicar esa
  // lógica aquí.
  textareaEdicionCompletaActual_.dispatchEvent(new Event("input", { bubbles: true }));
});
document.addEventListener("keydown", function (evento) {
  if (evento.key === "Escape" && !document.getElementById("pantallaCompletaEdicion").classList.contains("oculto")) {
    cerrarEdicionPantallaCompleta();
  }
});

/**
 * Cómo guardar y qué debounce cancelar según el tipo de pregunta —
 * Sesión 1/2 (data-campo-sesion1), Preparación IE oficial
 * (data-prep-pregunta) o invitado (data-inv-prep-pregunta). Cada flujo ya
 * tenía su propia función de guardado y su propio temporizador de
 * autoguardado; aquí solo se homogeniza cómo el botón 💾 los usa.
 */
function configGuardadoParaTextarea_(ta) {
  if (ta.hasAttribute("data-campo-sesion1")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoSesion1); },
      guardar: function (callback) { guardarSesion1(false, callback); }
    };
  }
  if (ta.hasAttribute("data-prep-pregunta")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoPreparacion); },
      guardar: function (callback) {
        guardarPreparacionIEActual(false, function (ok) {
          callback({ ok: ok, mensaje: ok ? "" : "No fue posible guardar." });
        });
      }
    };
  }
  if (ta.hasAttribute("data-inv-prep-pregunta")) {
    return {
      cancelarDebounce: function () { clearTimeout(temporizadorGuardadoInvitado_); },
      guardar: function (callback) {
        guardarPreparacionInvitadoActual_(false, function (ok) {
          callback({ ok: ok, mensaje: ok ? "" : "No fue posible guardar." });
        });
      }
    };
  }
  return null;
}

/**
 * Agrega, después de cada textarea de pregunta larga, una barra con 👁️
 * (pantalla completa editable) y 💾 (guardar esa pregunta ya, sin esperar
 * el autoguardado) con un texto auxiliar de confirmación — para las tres
 * clases de pregunta (Sesión 1/2, Preparación IE, invitado). Idempotente:
 * se puede llamar varias veces sobre el mismo contenedor (p.ej. después
 * de un render dinámico) sin duplicar nada.
 */
function agregarAccionesTextareas_(raiz) {
  var root = raiz || document;
  var selector = "textarea[data-campo-sesion1], textarea[data-prep-pregunta], textarea[data-inv-prep-pregunta]";
  root.querySelectorAll(selector).forEach(function (ta) {
    if (ta.dataset.accionesListas) return;
    ta.dataset.accionesListas = "1";

    var barra = document.createElement("div");
    barra.className = "barra-acciones-textarea";

    var botonOjo = document.createElement("button");
    botonOjo.type = "button";
    botonOjo.className = "btn-accion-textarea";
    botonOjo.title = "Ver y editar en pantalla completa";
    botonOjo.textContent = "👁️";
    botonOjo.addEventListener("click", function () {
      abrirEdicionPantallaCompleta(ta);
    });
    barra.appendChild(botonOjo);

    var config = configGuardadoParaTextarea_(ta);
    if (config) {
      var estadoSpan = document.createElement("span");
      estadoSpan.className = "estado-guardado-campo";

      var botonGuardar = document.createElement("button");
      botonGuardar.type = "button";
      botonGuardar.className = "btn-accion-textarea";
      botonGuardar.title = "Guardar esta respuesta ahora";
      botonGuardar.textContent = "💾";
      botonGuardar.addEventListener("click", function () {
        config.cancelarDebounce();
        estadoSpan.textContent = "Guardando…";
        estadoSpan.className = "estado-guardado-campo";
        config.guardar(function (r) {
          estadoSpan.textContent = r.ok ? "✓ Guardado" : (r.mensaje || "No fue posible guardar.");
          estadoSpan.className = "estado-guardado-campo " + (r.ok ? "estado-guardado-ok" : "estado-guardado-error");
          if (r.ok) setTimeout(function () { estadoSpan.textContent = ""; }, 4000);
        });
      });
      barra.appendChild(botonGuardar);
      barra.appendChild(estadoSpan);
    }

    ta.insertAdjacentElement("afterend", barra);
  });
}

/**
 * Valor a mostrar para un campo de Sesión 1/2 en "Revisar todo": el
 * campo original de su pantalla (campo_<CLAVE>) manda si ya tiene algo
 * escrito — el autoguardado de esas pantallas tiene un debounce de hasta
 * 2s antes de llegar al servidor, así que si el grupo escribe algo y
 * pasa casi de inmediato a "Revisar todo", `datos` (la última foto ya
 * guardada) puede no traer todavía lo último escrito; el campo en
 * pantalla, en cambio, siempre tiene lo que se ve. Si ese campo no
 * existe o está vacío (p. ej. primera vez que se abre esta sesión), se
 * usa lo que haya en `datos`. Esto es lo que hacía que "Revisar todo"
 * se viera vacío para el grupo aunque las respuestas sí estuvieran ahí
 * (bug reportado por el usuario).
 */
function _valorCampoParaRevisar_(clave, datos) {
  var elOriginal = document.getElementById("campo_" + clave);
  if (elOriginal && elOriginal.value) return elOriginal.value;
  return (datos && datos[clave]) || "";
}

function _renderCamposRevisarSesion_(idContenedor, camposMeta, datos) {
  var contenedor = document.getElementById(idContenedor);
  if (!contenedor) return;
  contenedor.innerHTML = "";
  camposMeta.forEach(function (campo) {
    var bloque = document.createElement("div");
    bloque.className = "revisar-todo-campo";
    var label = document.createElement("label");
    label.setAttribute("for", "campoRevisar_" + campo.clave);
    label.textContent = campo.etiqueta;
    var esTexto = campo.tipo === "text";
    var input = document.createElement(esTexto ? "input" : "textarea");
    if (esTexto) input.type = "text";
    else input.rows = 6;
    input.id = "campoRevisar_" + campo.clave;
    input.lang = "es";
    input.spellcheck = true;
    input.setAttribute("data-campo-revisar", campo.clave);
    input.value = _valorCampoParaRevisar_(campo.clave, datos);
    bloque.appendChild(label);
    bloque.appendChild(input);
    contenedor.appendChild(bloque);
  });
}

var temporizadoresGuardadoRevisar_ = {};
document.addEventListener("input", function (evento) {
  var campo = evento.target.closest("[data-campo-revisar]");
  if (!campo) return;
  var clave = campo.getAttribute("data-campo-revisar");
  // Refleja el cambio también en el campo original de su pantalla (si
  // existe), para que ambas vistas del mismo dato nunca queden
  // desincronizadas entre sí.
  var elOriginal = document.getElementById("campo_" + clave);
  if (elOriginal) elOriginal.value = campo.value;
  clearTimeout(temporizadoresGuardadoRevisar_[clave]);
  temporizadoresGuardadoRevisar_[clave] = setTimeout(function () {
    var valores = {};
    valores[clave] = campo.value;
    llamarServidor("rpcGuardarSesion1", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, valores], function () {}, function () {});
  }, 1200);
});

/**
 * "Revise que todos los participantes hayan firmado la asistencia" —
 * conteos + visor QR/link (método QR) o cantidad declarada + ver PDF +
 * cambiar a QR (método Listado en PDF), otra vez, justo antes de generar
 * el informe. Con Listado en PDF no existe un conteo de firmas EN VIVO
 * (nadie firma por celular), así que "han firmado" se reemplaza por la
 * cantidad que el grupo declara haber registrado en el listado físico
 * (spec del usuario).
 */
function cargarVerificacionFirmantesCierre_() {
  if (!estado.idGrupo) return;
  document.getElementById("totalParticipantesCierre").textContent =
    (estado.participacionEstamento && estado.participacionEstamento.totalGeneral) || 0;

  var esQR = estado.metodoAsistencia === "QR";
  document.getElementById("panelQRCierre").classList.toggle("oculto", !esQR);
  document.getElementById("panelListadoCierre").classList.toggle("oculto", esQR);
  // Cada vez que se (re)carga esta pantalla se cierra el listado de
  // firmantes si estaba abierto, para no dejar un intervalo de sondeo
  // corriendo de una visita anterior.
  ocultarListadoFirmantesQRCierre_();
  var textoFirmantes = document.getElementById("textoFirmantesCierre");
  if (textoFirmantes) textoFirmantes.textContent = esQR ? "han firmado" : "han firmado asistencia en formato PDF";

  if (esQR) {
    llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
      document.getElementById("totalFirmantesCierre").textContent = (r && r.total) || 0;
    }, function () {});
    llamarServidor("rpcUrlAsistencia", [estado.idGrupo], function (url) {
      var enlace = document.getElementById("enlaceAsistenciaQRCierre");
      enlace.href = url;
      enlace.textContent = url;
      document.getElementById("imagenQRAsistenciaCierre").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(url);
    }, function () {});
  } else {
    llamarServidor("rpcObtenerInfoListadoAsistencia", [estado.idGrupo], function (info) {
      var cantidad = (info && info.cantidad) || 0;
      document.getElementById("totalFirmantesCierre").textContent = cantidad;
      document.getElementById("campoCantidadListadoCierre").value = cantidad || "";
      var enlaceVer = document.getElementById("enlaceVerListadoCierre");
      if (info && info.urlListado) {
        enlaceVer.href = info.urlListado;
        enlaceVer.classList.remove("oculto");
      } else {
        enlaceVer.classList.add("oculto");
      }
    }, function () {});
  }
}

/**
 * "🔍 Verificar listado" (método QR, Revisión y cierre): muestra, en modo
 * SOLO LECTURA, quiénes ya firmaron la asistencia — mismo dato y mismo
 * estilo de fila que la pantalla pública de asistencia
 * (actualizarListadoEnVivoPublico_, AsistenciaPublica.html), reutilizando
 * rpcEstadoFirmantes. Nunca permite editar ni eliminar firmas desde aquí;
 * es solo para revisar antes de generar el informe.
 */
var intervaloListadoFirmantesQRCierre_ = null;
function actualizarListadoFirmantesQRCierre_() {
  if (!estado.idGrupo) return;
  llamarServidor("rpcEstadoFirmantes", [estado.idGrupo], function (r) {
    var lista = document.getElementById("listaFirmantesQRCierre");
    if (!lista) return;
    lista.innerHTML = "";
    ((r && r.firmantes) || []).forEach(function (f) {
      var fila = document.createElement("p");
      fila.textContent = "✅ " + f.nombre + (f.institucion ? " — " + f.institucion : "") + (f.estamento ? " (" + f.estamento + ")" : "");
      lista.appendChild(fila);
    });
    if (!((r && r.firmantes) || []).length) {
      lista.innerHTML = "<p class='ayuda'>Todavía nadie ha firmado.</p>";
    }
  }, function () {});
}
function ocultarListadoFirmantesQRCierre_() {
  clearInterval(intervaloListadoFirmantesQRCierre_);
  intervaloListadoFirmantesQRCierre_ = null;
  var contenedor = document.getElementById("listadoFirmantesQRCierre");
  if (contenedor) contenedor.classList.add("oculto");
  var boton = document.getElementById("btnVerificarListadoQRCierre");
  if (boton) boton.textContent = "🔍 Verificar listado";
}
document.getElementById("btnVerificarListadoQRCierre").addEventListener("click", function () {
  var contenedor = document.getElementById("listadoFirmantesQRCierre");
  if (!contenedor.classList.contains("oculto")) {
    ocultarListadoFirmantesQRCierre_();
    return;
  }
  contenedor.classList.remove("oculto");
  this.textContent = "🔽 Ocultar listado";
  actualizarListadoFirmantesQRCierre_();
  clearInterval(intervaloListadoFirmantesQRCierre_);
  intervaloListadoFirmantesQRCierre_ = setInterval(actualizarListadoFirmantesQRCierre_, 4000);
});

/**
 * "Revisión y cierre" y todo lo posterior de esa tarjeta (verificar
 * firmantes, fotografía, generar informe) deben verse en gris hasta que
 * la valoración del Foro (arriba, misma pantalla) ya se haya enviado —
 * spec del usuario. El botón "Generar informe" YA estaba gateado por
 * separado (actualizarBotonGenerarInforme); esto solo agrega el bloqueo
 * VISUAL de toda la sección, para que quede claro desde el primer
 * vistazo que hay que valorar primero.
 */
function actualizarBloqueoCierrePorValoracion_() {
  var tarjeta = document.getElementById("tarjetaCierrePasos");
  if (!tarjeta) return;
  tarjeta.classList.toggle("cierre-bloqueado", !estado.valoracionCompletada);

  if (aviso) aviso.classList.toggle("oculto", !!estado.valoracionCompletada);
}

function actualizarBotonGenerarInforme() {
  var boton = document.getElementById("btnGenerarInforme");
  var aviso = document.getElementById("avisoResponsablePrincipal");
  actualizarBloqueoCierrePorValoracion_();
  // Cualquier integrante del grupo con sesión activa puede generar el
  // informe (spec del usuario: revierte la restricción de "solo el
  // responsable principal"); pero solo se genera UNA vez en total —
  // Grupos.gs (generarInformeCompletoGrupo) es idempotente y devuelve el
  // mismo informe si ya existe, así que aquí basta con exigir la
  // valoración antes de habilitar el botón.
  if (estado.informeGenerado) {
    aviso.textContent = "El informe definitivo ya fue generado para este grupo.";
    boton.disabled = true;
  } else if (!estado.valoracionCompletada) {
    aviso.textContent = "Complete la valoración (arriba) antes de generar el informe.";
    boton.disabled = true;
  } else {
    aviso.textContent = "";
    boton.disabled = false;
  }
}

/* ---- Valoración de la sesión — 4 preguntas de satisfacción + 1 abierta
 * (copiado de FEI 3.1). Item 21 (Documento Orientador FEM2026, Sección F):
 * la escala de corazones se reemplazó por 5 opciones nombradas
 * (MALO=1..EXCELENTE=5) — selección única por pregunta, no un "relleno
 * acumulado" como los corazones. Item 22: el texto ya no nombra "el foro"
 * ni "Conecta Educa" (ver actualizarResultadoValoracion más abajo y las
 * preguntas en Index.html) — usa "la sesión de hoy" para servir a ambas
 * secciones con el mismo texto genérico. ---- */
(function inicializarValoracion() {
  var contenedor = document.getElementById("tarjetaValoracion");
  if (!contenedor) return;
  var puntajes = { p1: 0, p2: 0, p3: 0, p4: 0 };

  function actualizarResultadoValoracion() {
    var bloqueAbierto = document.getElementById("valoracionAbiertaBloque");
    var bloqueResultado = document.getElementById("valoracionResultado");
    var notaTexto = document.getElementById("valoracionNotaTexto");
    var labelAbierto = document.getElementById("valoracionP5Label");

    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      bloqueAbierto.classList.add("oculto");
      bloqueResultado.classList.add("oculto");
      return;
    }

    var nota = (puntajes.p1 + puntajes.p2 + puntajes.p3 + puntajes.p4) / 4;
    var emoji, pregunta;
    if (nota < 3) {
      emoji = "😭";
      pregunta = "😭 ¡Debemos hacerlo mejor! ¿Qué sugerencias, recomendaciones o propuestas tienen para fortalecer la organización y desarrollo de la sesión de hoy?";
    } else if (nota <= 4) {
      emoji = "😬";
      pregunta = "😬 ¡Pasamos raspados! ¿Quieren decirnos qué funcionó bien para " + (estado.grupo || "el grupo") + " y qué pudo haber sido mejor para fortalecer la organización y desarrollo de la sesión de hoy?";
    } else {
      emoji = "🎉";
      pregunta = "🎉 ¡Bravo, gracias por el reconocimiento! ¿Quieren decirnos qué hicimos bien para " + (estado.grupo || "el grupo") + " para merecer el reconocimiento de ustedes? Y de paso también pueden decirnos cómo mejorar para fortalecer la organización y desarrollo de la sesión de hoy.";
    }

    notaTexto.textContent = emoji + " Nuestra nota fue de: " + nota.toFixed(1) + " / 5.0 " + emoji;
    bloqueResultado.classList.remove("oculto");
    labelAbierto.textContent = pregunta;
    bloqueAbierto.classList.remove("oculto");
  }

  contenedor.querySelectorAll(".valoracion-pregunta[data-pregunta]").forEach(function (bloque) {
    var pregunta = bloque.dataset.pregunta;
    var opciones = Array.prototype.slice.call(bloque.querySelectorAll(".opcion-valoracion"));
    var bloqueMejora = contenedor.querySelector('.valoracion-mejora[data-mejora-de="' + pregunta + '"]');

    opciones.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var valor = Number(this.dataset.valor);
        puntajes[pregunta] = valor;
        opciones.forEach(function (b) {
          b.classList.toggle("opcion-valoracion-seleccionada", Number(b.dataset.valor) === valor);
        });
        if (bloqueMejora) bloqueMejora.classList.toggle("oculto", valor > 2);
        actualizarResultadoValoracion();
      });
    });
  });

  document.getElementById("btnEnviarValoracion").addEventListener("click", function () {
    if (!puntajes.p1 || !puntajes.p2 || !puntajes.p3 || !puntajes.p4) {
      mostrarMensaje("mensajeValoracion", "Seleccione una opción en las cuatro preguntas antes de enviar.", "error");
      return;
    }
    var boton = document.getElementById("btnEnviarValoracion");
    boton.disabled = true;
    var respuestas = {
      p1: puntajes.p1, p2: puntajes.p2, p3: puntajes.p3, p4: puntajes.p4,
      p5: document.getElementById("valoracionP5").value,
      mejoraP1: document.getElementById("valoracionMejoraP1").value,
      mejoraP2: document.getElementById("valoracionMejoraP2").value,
      mejoraP3: document.getElementById("valoracionMejoraP3").value,
      mejoraP4: document.getElementById("valoracionMejoraP4").value
    };
    mostrarCargaAccion_("valoracionAsistencia", "Enviando valoración…");
    llamarServidor("rpcGuardarValoracion", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId, respuestas, estado.seccion], function (r) {
      ocultarCargaAccion_();
      boton.disabled = false;
      if (!r.ok) {
        mostrarMensaje("mensajeValoracion", r.mensaje || "No fue posible guardar la valoración.", "error");
        return;
      }
      mostrarMensaje("mensajeValoracion", "", "");
      estado.valoracionCompletada = true;
      mostrarEstadoValoracion({ NOTA_PROMEDIO: r.notaPromedio });
      actualizarBotonGenerarInforme();
    }, function (error) {
      ocultarCargaAccion_();
      boton.disabled = false;
      console.error("rpcGuardarValoracion", error);
      mostrarMensaje("mensajeValoracion", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    });
  });
})();

document.getElementById("btnGenerarInforme").addEventListener("click", function () {
  // La fotografía ya no se pide en la pantalla de "Informe generado"
  // (spec del usuario: "la fotografía debe desaparecer de la pantalla de

  confirmarAccion("¿Generar el informe definitivo del grupo? Esta acción crea el documento único que verán todas las IE del grupo.", function () {

    mostrarCargaAccion_("informe");

      document.getElementById("btnEnviarInformePorCorreo").disabled = true;
      mostrarMensaje("mensajeEnvioInforme", "", "");
      document.getElementById("notaEnvioInforme").textContent = "Descargue el informe (botón de arriba) para habilitar el envío por correo a las Instituciones Educativas y al responsable del grupo.";
      // Al generar el informe, la asistencia queda cerrada (spec del
      // usuario) — se refleja de inmediato en el encabezado permanente.
      estado.asistenciaCerrada = true;
      estado.informeGenerado = true;
      actualizarPanelFirmantesCerrado_();
      cambiarPantalla("pantallaInformeGenerado");
    }, function (error) {
      ocultarCargaAccion_();
      document.getElementById("btnGenerarInforme").disabled = false;
      console.error("rpcGenerarInforme", error);
      mostrarMensaje("mensajeCierre", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    });
  });
});

/* ---- Descargar informe (habilita el envío por correo) y enviarlo ---- */
document.getElementById("enlaceInformeGenerado").addEventListener("click", function () {
  llamarServidor("rpcMarcarInformeDescargado", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    if (!r.ok) return;
    document.getElementById("btnEnviarInformePorCorreo").disabled = false;
    document.getElementById("notaEnvioInforme").textContent = "Ya puede enviar el informe por correo a las Instituciones Educativas y al responsable del grupo.";
  }, function () {});
});

document.getElementById("btnEnviarInformePorCorreo").addEventListener("click", function () {
  var boton = document.getElementById("btnEnviarInformePorCorreo");
  boton.disabled = true;
  llamarServidor("rpcEnviarInformePorCorreo", [estado.idGrupo, estado.tokenSesion, estado.dispositivoId], function (r) {
    boton.disabled = false;
    if (!r.ok) {
      mostrarMensaje("mensajeEnvioInforme", r.mensaje || "No fue posible enviar el informe.", "error");
      return;
    }
    mostrarMensaje("mensajeEnvioInforme", r.diferido ? r.mensaje : "Informe enviado por correo.", "exito");
    // "Finalizar Foro" no se habilita hasta que el informe se haya
    // enviado por correo al menos una vez (spec del usuario) — un envío
    // diferido por cuota también cuenta, porque el informe ya quedó en
    // la cola y llegará automáticamente (ver Correo.gs).
    estado.informeEnviadoPorCorreo = true;
    actualizarBotonFinalizarForo_();
  });
});

/**
 * Texto de apoyo: a qué correos institucionales llegará el informe
 * (spec del usuario) — se arma con las IE reales del grupo, ya
 * disponibles en estado.instituciones desde el login.
 */
function actualizarAvisoDestinatariosInforme_() {
  var aviso = document.getElementById("avisoDestinatariosInforme");
  if (!aviso) return;
  var nombresIE = (estado.instituciones || []).map(function (ie) { return ie.institucion; }).filter(Boolean);
  if (!nombresIE.length) {
    aviso.textContent = "";
    return;
  }
  aviso.textContent = "Este informe llegará también a los correos de las instituciones educativas que " +
    "conformaron el " + (estado.grupo || "grupo") + " del Encuentro de voces que construyen territorio, Neiva 2026: " +
    nombresIE.join(", ") + ".";
}

/**
 * "Finalizar Foro" no se puede accionar hasta que el informe se haya
 * enviado por correo (spec del usuario: "no se puede dar Finalizar Foro
 * hasta que se haya dado click en enviar informe al correo").
 */
function actualizarBotonFinalizarForo_() {
  var boton = document.getElementById("btnFinalizarForo");
  var aviso = document.getElementById("avisoFaltaEnvioCorreo");
  if (boton) boton.disabled = !estado.informeEnviadoPorCorreo;
  if (aviso) aviso.classList.toggle("oculto", !!estado.informeEnviadoPorCorreo);
}

// La fotografía ya se exigió antes de poder generar el informe (ver
// btnGenerarInforme más arriba), así que aquí ya no hace falta volver a
// pedirla. "Finalizar Encuentro de voces que construyen territorio" reemplaza al antiguo
// botón genérico "Continuar" (spec del usuario) y solo se puede accionar
// una vez — se deshabilita de inmediato al hacer clic.
document.getElementById("btnFinalizarForo").addEventListener("click", function () {
  this.disabled = true;
  cambiarPantalla("pantallaDespedida");
});
</script>
