<script>
/**
 * JS.html — Foro Educativo Comunal Neiva 2026
 * Lógica de cliente. Reutiliza (adaptados a GRUPO) los patrones más
 * maduros de App.html en FEI 3.1 (docs/01-auditoria-fei-3.1.md §2.6):
 * dispositivoId persistente en localStorage, heartbeat periódico de
 * sesión, autoguardado con sincronización periódica al servidor.
 */

/* ------------------------------------------------------------------ *
 * Estado de cliente
 * ------------------------------------------------------------------ */
var estado = {
  dispositivoId: obtenerDispositivoId(),
  idGrupo: "",
  grupo: "",
  tokenSesion: "",
  esPrincipal: false,
  instituciones: [],
  ultimosFirmantes: [],
  metodoAsistencia: "",
  logoId: "",
  consentimientoGrupo: false,
  consentimientoConectaEduca: false,
  rolesForo: [],
  responsables: { principal: null, asistentes: [] },
  recursosSesion1Mostrado: false,
  fotoGrupoId: "",
  totalFirmantes: 0,
  participacionEstamento: null,
  prepIdIE: "",
  prepInstitucion: "",
  prepResponsable: "",
  socializacionPreparacion: [],
  explicacionConectaEducaVista: false,
  fotoGrupoMasTardeConfirmado: false,
  listadoAsistenciaMasTardeConfirmado: false,
  avisoColaboradoresMostrado: false,
  enlacesInvitados: null,
  seccion: "",
  // Conversatorio (Conecta Educa, pedido del usuario) — mini-herramienta
  // independiente; cada Institución Educativa se elige de un listado (sin
  // código, sin token de grupo) — ver más abajo.
  institucionConversatorio: "",
  grupoElegidoConversatorio: "",
  gruposConversatorio: [],
  catalogoTecnicasConversatorio: [],
  // Responsable de diligenciar el Conversatorio (nombre/rol/acompañante) —
  // alimenta el banner "Respetado(a), <rol> de la IE <institución> y
  // <acompañante>" (spec del usuario).
  responsableConversatorio: { nombre: "", rol: "", acompanante: "" },
  // Panel de superadministrador (código único de la SEM) — permite entrar
  // a cualquier institución, además de generar el informe consolidado.
  modoSuperadminConversatorio: false,
  codigoSuperadminConversatorio: ""
};

/** URL de imagen para un archivo de Drive público (logos) — mismo patrón usado para el QR de asistencia. */
function urlImagenDrive(idArchivo, ancho) {
  return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idArchivo) + "&sz=w" + (ancho || 600);
}

/**
 * Logos institucionales en las esquinas superiores del encabezado (spec
 * del usuario) — mismos IDs de Drive que ya usan el splash inicial y el
 * encabezado del informe (LOGO_PIE_ID = SEM/Alcaldía, LOGO_ENCABEZADO_ID
 * = Foro/FEM). Si algún ID no está configurado, ese logo simplemente no
 * se muestra (permanece oculto).
 */
(function poblarLogosEncabezado_() {
  var logoSEM = document.getElementById("logoSEMEncabezado");
  if (logoSEM && LOGO_PIE_ID) {
    logoSEM.src = urlImagenDrive(LOGO_PIE_ID, 120);
    logoSEM.classList.remove("oculto");
  }
  var logoFEM = document.getElementById("logoFEMEncabezado");
  if (logoFEM && LOGO_ENCABEZADO_ID) {
    logoFEM.src = urlImagenDrive(LOGO_ENCABEZADO_ID, 120);
    logoFEM.classList.remove("oculto");
  }
  var logoDev = document.getElementById("logoDesarrolladorPie");
  if (logoDev && LOGO_DESARROLLADOR_ID) {
    logoDev.src = urlImagenDrive(LOGO_DESARROLLADOR_ID, 90);
    logoDev.alt = "HelpRofe";
    logoDev.classList.remove("oculto");
  }
})();

// El código de acceso se pide ANTES que cualquier otra pantalla (spec:
// "Código debe pedirse antes de cualquier pantalla") — Acceso va primero;
// Inicio/Presentación/Metodología se muestran DESPUÉS de validar el
// código (ver intentarValidarAcceso), como introducción antes de
// Participación.
// pantallaInvitadosEspeciales/pantallaPreSocializacion/pantallaSeleccionIEPreparacion/
// pantallaPreparacionIE son la vieja "Preparación", oculta desde el item 9
// (Documento Orientador FEM2026) — se dejan en el orden solo para no
// romper índices de código antiguo; ya no están en PANTALLAS_SOLO_ENCUENTRO_
// (más abajo), así que pantallaPerteneceASeccionActual_ las rechaza y
// nada en la app navega hacia ellas. pantallaSesionSocializacion las
// reemplaza (item 10).
// Confirmación de caracterización se movió al final del recorrido, justo
// antes de Revisión y cierre (spec del usuario) — antes iba justo después
// de Participación, como paso intermedio obligatorio hacia las sesiones
// de trabajo; ahora es el último chequeo ("verificar que todo esté
// correcto") antes de valorar y generar el informe.
var ORDEN_PANTALLAS = [
  "pantallaEleccionSeccion", "pantallaAcceso",
  "pantallaAccesoConversatorio", "pantallaAccesoSuperadminConversatorio", "pantallaPanelSuperadminConversatorio",
  "pantallaResponsableConversatorio",
  "pantallaResolucionConversatorio", "pantallaCaracterizacionConversatorio", "pantallaCierreConversatorio",
  "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia",
  "pantallaConsentimientoGrupo", "pantallaConsentimientoConectaEduca", "pantallaParticipacion",
  "pantallaInvitadosEspeciales",
  "pantallaPreSocializacion", "pantallaSeleccionIEPreparacion", "pantallaPreparacionIE",
  "pantallaSesionSocializacion",
  "pantallaSesion1", "pantallaSesion2",
  "pantallaConfirmacionCaracterizacion", "pantallaRevisionCierre",
  "pantallaInformeGenerado", "pantallaDespedida"
];

// Pantallas de "introducción" (no representan avance real del grupo, se
// muestran siempre al validar el código por primera vez) — nunca se
// retoma directamente en ellas ni se marcan como "última pantalla".
var PANTALLAS_NO_RESUMIBLES_ = [
  "pantallaEleccionSeccion", "pantallaAcceso",
  "pantallaAccesoConversatorio", "pantallaAccesoSuperadminConversatorio", "pantallaPanelSuperadminConversatorio",
  "pantallaResponsableConversatorio",
  "pantallaResolucionConversatorio", "pantallaCaracterizacionConversatorio", "pantallaCierreConversatorio",
  "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia"
];

/**
 * Documento Orientador FEM2026, sección D, item 8: "trasladar toda la
 * sesión de ConectaEduca a su propia pantalla" — ConectaEduca ya no es
 * un paso intermedio del recorrido único, sino su propia rama. Estas
 * listas dicen qué pantallas son de uso compartido (código, consentimiento,
 * participación/asistencia, caracterización, cierre — todavía sin
 * duplicar por sección, eso es la Sección E/F del pedido) y cuáles son
 * exclusivas de cada sección, para poder filtrar la barra de progreso
 * navegable y evitar que "retomar donde se quedó" mande a alguien a una
 * pantalla de la sección contraria.
 */
var PANTALLAS_COMUNES_SECCION_ = [
  "pantallaEleccionSeccion", "pantallaAcceso", "pantallaParticipacion",
  "pantallaConfirmacionCaracterizacion", "pantallaRevisionCierre", "pantallaInformeGenerado", "pantallaDespedida"
];
var PANTALLAS_SOLO_ENCUENTRO_ = [
  "pantallaInicio", "pantallaPresentacion", "pantallaMetodologia", "pantallaConsentimientoGrupo",
  "pantallaSesionSocializacion", "pantallaSesion1"
];
// item 17 (Documento Orientador FEM2026): Conecta Educa tiene su propio
// consentimiento informado, distinto del de pantallaConsentimientoGrupo.
var PANTALLAS_SOLO_CONECTAEDUCA_ = ["pantallaConsentimientoConectaEduca", "pantallaSesion2"];

/** true si `idPantalla` es alcanzable desde la sección actualmente elegida (estado.seccion). */
function pantallaPerteneceASeccionActual_(idPantalla) {
  if (PANTALLAS_COMUNES_SECCION_.indexOf(idPantalla) !== -1) return true;
  if (estado.seccion === "CONECTAEDUCA") return PANTALLAS_SOLO_CONECTAEDUCA_.indexOf(idPantalla) !== -1;
  return PANTALLAS_SOLO_ENCUENTRO_.indexOf(idPantalla) !== -1;
}

// Algunas pantallas necesitan una selección previa (ej. cuál IE se está
// preparando) que solo vive en el estado del dispositivo actual, no en el
// servidor — retomar ahí directamente fallaría, así que en esos casos se
// retoma en el paso anterior seguro (el selector correspondiente).
var MAPA_RESUMEN_PANTALLA_ = {
  pantallaPreparacionIE: "pantallaSeleccionIEPreparacion"
};

/** A qué pantalla ir para retomar el progreso del grupo, o null si debe mostrarse la introducción normal. */
function destinoResumenPantalla_(ultimaPantalla) {
  ultimaPantalla = String(ultimaPantalla || "").trim();
  if (!ultimaPantalla) return null;
  if (MAPA_RESUMEN_PANTALLA_[ultimaPantalla]) ultimaPantalla = MAPA_RESUMEN_PANTALLA_[ultimaPantalla];
  if (PANTALLAS_NO_RESUMIBLES_.indexOf(ultimaPantalla) !== -1) return null;
  if (ORDEN_PANTALLAS.indexOf(ultimaPantalla) === -1) return null;
  // ULTIMA_PANTALLA es una sola columna compartida por todo el grupo, pero
  // Encuentro y ConectaEduca ahora son ramas separadas (item 8) — si la
  // última pantalla guardada pertenece a la sección contraria a la elegida
  // ahora (p. ej. el grupo venía de Sesión 1 y alguien entra por la puerta
  // de ConectaEduca en la tarde), no se retoma ahí: se deja que el
  // recorrido normal de ESTA sección decida por dónde empezar.
  if (!pantallaPerteneceASeccionActual_(ultimaPantalla)) return null;
  return ultimaPantalla;
}

function obtenerDispositivoId() {
  var clave = "forumComunalNeiva2026_dispositivo";
  try {
    var guardado = localStorage.getItem(clave);
    if (guardado) return guardado;
    var nuevo = "FEC-DEV-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(clave, nuevo);
    return nuevo;
  } catch (e) {
    return "FEC-DEV-" + Date.now().toString(36);
  }
}

/* ------------------------------------------------------------------ *
 * Llamadas al servidor (envoltorio de google.script.run)
 * ------------------------------------------------------------------ */
function llamarServidor(nombreFuncion, args, onExito, onError) {
  google.script.run
    .withSuccessHandler(function (resultado) {
      if (onExito) onExito(resultado);
    })
    .withFailureHandler(function (error) {
      console.error(nombreFuncion, error);
      if (onError) onError(error);
      else mostrarMensaje("mensajeGlobal", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    })
    [nombreFuncion].apply(null, args || []);
}

/* ------------------------------------------------------------------ *
 * Navegación entre pantallas
 * ------------------------------------------------------------------ */
/**
 * Barra de progreso navegable (spec del usuario): un botón por cada
 * sesión principal del recorrido, con su nombre. Nunca permite saltar
 * HACIA ADELANTE, más allá de la pantalla más lejana ya alcanzada en
 * este recorrido (indiceMaximoOrdenPantallas_) — así no se salta ningún
 * candado (p. ej. no se puede ir a Sesión 2 sin haber enviado Sesión 1
 * de forma definitiva). Ir hacia atrás siempre es seguro: esas pantallas
 * ya son las mismas que "✏️ Editar en…" de Revisar todo permite abrir.
 */
var PASOS_PROGRESO_ENCUENTRO_ = [
  { id: "pantallaParticipacion", etiqueta: "Participación" },
  { id: "pantallaSesionSocializacion", etiqueta: "Socialización" },
  { id: "pantallaSesion1", etiqueta: "Sesión 1" },
  { id: "pantallaConfirmacionCaracterizacion", etiqueta: "Caracterización" },
  { id: "pantallaRevisionCierre", etiqueta: "Cierre" }
];
var PASOS_PROGRESO_CONECTAEDUCA_ = [
  { id: "pantallaParticipacion", etiqueta: "Participación" },
  { id: "pantallaSesion2", etiqueta: "Conecta Educa" },
  { id: "pantallaConfirmacionCaracterizacion", etiqueta: "Caracterización" },
  { id: "pantallaRevisionCierre", etiqueta: "Cierre" }
];
function pasosProgresoSeccionActual_() {
  return estado.seccion === "CONECTAEDUCA" ? PASOS_PROGRESO_CONECTAEDUCA_ : PASOS_PROGRESO_ENCUENTRO_;
}
var indiceMaximoOrdenPantallas_ = 0;
// Pantalla visible en este momento — se necesita para poder refrescar la
// barra (qué botón queda "activo") desde una respuesta async que llega
// después de cambiarPantalla (p. ej. rpcEstadoGrupo al validar el acceso),
// sin tener que repetir el cambio de pantalla en sí.
var pantallaActual_ = "";
/**
 * Reconstruye los botones de la barra de progreso navegable según la
 * sección elegida (Encuentro/ConectaEduca, item 8) — se llama al cargar
 * la página (con la lista por defecto, antes de elegir sección) y de
 * nuevo cada vez que se elige/cambia de sección, para que los botones
 * mostrados sean siempre los de la rama correcta.
 */
function reconstruirBarraProgresoNav_() {
  var contenedor = document.getElementById("barraProgresoNav");
  if (!contenedor) return;
  contenedor.innerHTML = "";
  pasosProgresoSeccionActual_().forEach(function (paso) {
    var boton = document.createElement("button");
    boton.type = "button";
    boton.className = "paso-progreso";
    boton.textContent = paso.etiqueta;
    boton.setAttribute("data-paso-progreso", paso.id);
    boton.addEventListener("click", function () {
      if (!boton.disabled) cambiarPantalla(paso.id);
    });
    contenedor.appendChild(boton);
  });
  actualizarBarraProgresoNav_(pantallaActual_ || "pantallaAcceso");
}
reconstruirBarraProgresoNav_();

function actualizarBarraProgresoNav_(idPantalla) {
  var indiceActual = ORDEN_PANTALLAS.indexOf(idPantalla);
  document.querySelectorAll("[data-paso-progreso]").forEach(function (boton) {
    var idPaso = boton.getAttribute("data-paso-progreso");
    var indicePaso = ORDEN_PANTALLAS.indexOf(idPaso);
    boton.disabled = indicePaso > indiceMaximoOrdenPantallas_;
    boton.classList.toggle("paso-activo", idPaso === idPantalla);
    boton.classList.toggle("paso-alcanzado", indicePaso <= indiceActual);
  });
}

document.getElementById("btnIrInicio").addEventListener("click", function () {
  // Antes de validar el código de acceso no hay grupo cargado todavía —
  // "Inicio" necesita esos datos (nombre del grupo, etc.), así que el
  // botón no hace nada hasta ese momento (en la práctica, en esa
  // pantalla ya se está viendo "Inicio" desde el flujo normal).
  if (!estado.idGrupo) return;
  // "pantallaInicio" (bienvenida) es exclusiva de la sección Encuentro
  // (item 8) — en ConectaEduca no hay un equivalente, así que "Inicio"
  // lleva a Participación, su primer paso real.
  cambiarPantalla(estado.seccion === "CONECTAEDUCA" ? "pantallaParticipacion" : "pantallaInicio");
});

// Índice de Participación en ORDEN_PANTALLAS — más allá de este punto,
// elegir método de asistencia es obligatorio (ver guarda en cambiarPantalla).
var INDICE_PARTICIPACION_ = ORDEN_PANTALLAS.indexOf("pantallaParticipacion");

function cambiarPantalla(idPantalla) {
  // Seleccionar un método de asistencia (QR o PDF) es obligatorio para
  // continuar a Confirmación de caracterización y a cualquier pantalla
  // posterior (spec del usuario) — btnContinuarAParticipacion ya lo
  // exigía, pero solo por ese único botón; esta misma validación aquí,
  // dentro de cambiarPantalla, cierra también otras formas de llegar más
  // allá de Participación sin haber elegido método (la barra de progreso
  // navegable, "Editar en…" desde Revisar todo, o cualquier llamada
  // directa a cambiarPantalla) — nunca deja avanzar, redirige de vuelta.
  if (
    estado.idGrupo &&
    ORDEN_PANTALLAS.indexOf(idPantalla) > INDICE_PARTICIPACION_ &&
    estado.metodoAsistencia !== "QR" && estado.metodoAsistencia !== "LISTADO"
  ) {
    idPantalla = "pantallaParticipacion";
    mostrarMensaje("mensajeSeleccionMetodo", "Elige un método de asistencia (QR o PDF) antes de continuar.", "error");
  }
  pantallaActual_ = idPantalla;
  ORDEN_PANTALLAS.forEach(function (id) {
    document.getElementById(id).classList.toggle("visible", id === idPantalla);
  });
  var indice = ORDEN_PANTALLAS.indexOf(idPantalla);
  indiceMaximoOrdenPantallas_ = Math.max(indiceMaximoOrdenPantallas_, indice);
  actualizarBarraProgresoNav_(idPantalla);
  var porcentaje = Math.round(((indice + 1) / ORDEN_PANTALLAS.length) * 100);
  document.getElementById("barraProgresoRelleno").style.width = porcentaje + "%";
  window.scrollTo(0, 0);

  if (idPantalla === "pantallaParticipacion") {
    actualizarFirmantes();
    cargarResponsables();
    cargarParticipacionEstamento();
    // item 18 (Documento Orientador FEM2026): Conecta Educa usa su propio
    // formato de asistencia, distinto del Encuentro — Participación es una
    // pantalla compartida entre ambas secciones, así que el enlace de
    // descarga se ajusta aquí según estado.seccion.
    var esCE = estado.seccion === "CONECTAEDUCA";
    document.getElementById("btnDescargarFormatoAsistenciaParticipacion").href =
      "https://drive.google.com/file/d/" + (esCE ? FORMATO_ASISTENCIA_CONECTAEDUCA_ID : FORMATO_ASISTENCIA_ENCUENTRO_ID) + "/view";
  }
  if (idPantalla === "pantallaConfirmacionCaracterizacion") cargarConfirmacionCaracterizacion();
  if (idPantalla === "pantallaInvitadosEspeciales") {
    // Se refresca siempre al entrar (no solo al confirmar la
    // caracterización), por si se resume el recorrido directo en esta
    // pantalla desde otro dispositivo (spec del usuario: retomar desde
    // la última entrada) — así los conteos de estudiantes/egresados y
    // padres/madres/acudientes están siempre al día.
    cargarParticipacionEstamento(function () {
      prepararPantallaInvitadosEspeciales_();
    });
  }
  if (idPantalla === "pantallaSeleccionIEPreparacion") cargarListaIEPreparacion();
  if (idPantalla === "pantallaPreparacionIE") cargarPreparacionIE();
  if (idPantalla === "pantallaSesionSocializacion") cargarSocializacionIE();
  if (idPantalla === "pantallaSesion1") {
    cargarSesion1();
    cargarRecursosSesion1();
    // Aportes relevantes de la Sesión de socialización (pantalla
    // anterior) — reactivado (pedido del usuario): tarjetaSocializacionPreparacion
    // se había ocultado en un lote anterior porque dependía de la vieja
    // "Preparación" (item 9), siempre vacía; ahora se recableó a
    // rpcObtenerSocializacionGrupo (los datos reales que sí se capturan
    // en Sesión de socialización) — ver cargarSocializacionPreparacion.
    cargarSocializacionPreparacion();
    cargarAportesRelevantesSocializacionPdf_();
    // "Continuar a Revisión y cierre" no se habilita hasta que Sesión 1 se
    // envió de forma definitiva (spec del usuario) — se refresca cada vez
    // que se entra a esta pantalla, no solo tras hacer clic en Enviar,
    // para que también quede correcto al retomar desde otro dispositivo/día.
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.sesion1Enviada = !!(estadoGrupo && estadoGrupo.sesion1Enviada);
      actualizarGateContinuarCierre_();
      actualizarEstadoEnvioSesion1_();
    }, function () {});
  }
  if (idPantalla === "pantallaSesion2") {
    cargarConectaEduca();
    prepararPantallaConectaEduca();
    // Los campos de "Antes de registrar actores" y de "Construcción
    // colectiva" de Sesión 2 viven en la misma hoja/RPC que Sesión 1
    // (CAMPOS_SESION1) — se cargan aquí también por si se llega
    // directamente a esta pantalla (p. ej. al retomar el recorrido) sin
    // haber pasado antes por pantallaSesion1 en este dispositivo.
    cargarSesion1();
    // Cualquiera puede enviar Sesión 2, pero solo una vez (spec del
    // usuario) — si ya se envió, se muestra el aviso y se deshabilita el
    // botón, igual que Sesión 1.
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.sesion2Enviada = !!(estadoGrupo && estadoGrupo.sesion2Enviada);
      actualizarEstadoEnvioSesion2_();
    }, function () {});
  }
  if (idPantalla === "pantallaRevisionCierre") prepararCierre();
  if (idPantalla === "pantallaInformeGenerado") {
    mostrarMensaje("mensajeFaltaFotoFinalizar", "");
    actualizarAvisoDestinatariosInforme_();
    actualizarBotonFinalizarForo_();
  }

  // Recuerda la última pantalla del recorrido (compartida por todo el
  // grupo) para poder retomar ahí si se cae la señal o alguien entra
  // desde otro dispositivo (spec del usuario) — no se marca la
  // introducción, solo el avance real (ver destinoResumenPantalla_).
  if (estado.idGrupo && PANTALLAS_NO_RESUMIBLES_.indexOf(idPantalla) === -1) {
    llamarServidor("rpcGuardarUltimaPantalla", [estado.idGrupo, idPantalla], function () {}, function () {});
  }
}

/* ------------------------------------------------------------------ *
 * Elección de sección (Documento Orientador FEM2026, sección C): dos
 * secciones independientes ("Encuentro de voces que construyen
 * territorio" y "Conecta Educa"), cada una con su propio logo y su
 * propia entrada — el código de acceso sigue siendo el mismo del grupo
 * en ambas (un solo GRUPO/sesión, ver nota en la guía de puesta en
 * marcha). Se recuerda la última sección elegida en este dispositivo
 * (localStorage) para no pedirla de nuevo en cada visita (spec del
 * usuario, item 3: "clic en Inicio debe ir directo a Ingresar código").
 * ------------------------------------------------------------------ */
var CLAVE_SECCION_LOCAL_ = "fec_seccion_elegida";
// Conecta Educa ya no usa este mecanismo de "sección recordada" — va
// directo a Conversatorio (btnIrConversatorio) sin pasar por
// aplicarSeccionElegida_/pantallaAcceso. Solo queda ENCUENTRO aquí: si
// un dispositivo tenía guardado "CONECTAEDUCA" de antes de este cambio,
// retomarSeccionElegida_ (más abajo) ya no lo reconoce como válido y cae
// de vuelta a pantallaEleccionSeccion en vez de saltar a la pantalla
// vieja de acceso (bug reportado por el usuario: "actualmente esta
// iniciando en conecta educa").
var TEXTOS_SECCION_ = {
  ENCUENTRO: { titulo: "Encuentro de voces que construyen territorio", logo: LOGO_ENCUENTRO_ID }
};

(function poblarLogosSeccion_() {
  [
    { id: "logoTarjetaEncuentro", logo: LOGO_ENCUENTRO_ID },
    { id: "logoTarjetaConectaEduca", logo: LOGO_CONECTAEDUCA_ID },
    { id: "logoAccesoConversatorio", logo: LOGO_CONECTAEDUCA_ID }
  ].forEach(function (item) {
    var img = document.getElementById(item.id);
    if (img && item.logo) {
      img.src = urlImagenDrive(item.logo, 300);
      img.classList.remove("oculto");
    }
  });
})();

function aplicarSeccionElegida_(seccion) {
  var datos = TEXTOS_SECCION_[seccion];
  if (!datos) return;
  estado.seccion = seccion;

/** Catálogo de técnicas para el checklist de "nueva articulación" — se pide una sola vez y se cachea. */
function conCatalogoTecnicasConversatorio_(callback) {
  if (estado.catalogoTecnicasConversatorio && estado.catalogoTecnicasConversatorio.length) {
    callback(estado.catalogoTecnicasConversatorio);
    return;
  }
  llamarServidor("rpcObtenerCatalogoTecnicasConversatorio", [], function (r) {
    estado.catalogoTecnicasConversatorio = (r && r.ok && r.tecnicas) || [];
    callback(estado.catalogoTecnicasConversatorio);
  }, function () {
    callback([]);
  });
}

/** Texto del banner de bienvenida (spec del usuario, literal): "respetado (a), (rol seleccionado) de la IE (nombre) y (acompañante si registró)". */
function textoBannerResponsableConversatorio_() {

  var texto = "Respetado(a) " + r.rol + " de la IE " + estado.institucionConversatorio;
  if (r.acompanante) texto += " y " + r.acompanante;
  return texto + ".";
}

function pintarBannerResponsableConversatorio_(idBanner) {

/** Guarda los campos de una fila en secuencia (un RPC por campo, uno tras otro). */
function guardarCamposTecnicaConversatorioEnSecuencia_(campos, indice, alTerminar) {
  if (indice >= campos.length) {
    alTerminar();
    return;
  }
  llamarServidor(
    "rpcGuardarCampoTecnicaConversatorio",
    [estado.institucionConversatorio, campos[indice].idFila, campos[indice].campo, campos[indice].valor],
    function (r) {
      if (!r.ok) {
        mostrarMensaje("mensajeResolucionConversatorio", r.mensaje || "No fue posible guardar un campo.", "error");
        return;
      }
      guardarCamposTecnicaConversatorioEnSecuencia_(campos, indice + 1, alTerminar);
    },
    function () {
      mostrarMensaje("mensajeResolucionConversatorio", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
    }
  );
}

document.addEventListener("click", function (evento) {
  var guardar = evento.target.closest("[data-guardar-tecnica-conversatorio]");
  if (!guardar) return;
  var idFila = guardar.getAttribute("data-guardar-tecnica-conversatorio");
  var tarjeta = guardar.closest("[data-tarjeta-tecnica-conversatorio]");
  if (!tarjeta) return;

  // Spec del usuario: "debe editarse obligatoriamente las preguntas de si
  // y de no y guardar" — ambas preguntas Sí/No son obligatorias antes de
  // poder guardar la tarjeta.
  var respuestaQ1 = tarjeta.querySelector("[data-campo-edicion-tecnica='preguntaApertura2027']").value;
  var respuestaQ2Validar = tarjeta.querySelector("[data-campo-edicion-tecnica='preguntaNuevaArticulacion2027']").value;
  if (!respuestaQ1 || !respuestaQ2Validar) {
    mostrarMensaje("mensajeResolucionConversatorio", "Responda las dos preguntas de Sí/No antes de guardar.", "error");
    return;
  }

  var campos = [];
  tarjeta.querySelectorAll("[data-campo-edicion-tecnica]").forEach(function (campo) {
    campos.push({ idFila: idFila, campo: campo.getAttribute("data-campo-edicion-tecnica"), valor: campo.value });
  });

  // "Otro" + técnicas marcadas del catálogo, unidos en un solo texto — solo
  // si la pregunta 2 quedó en "Sí"; si no, se limpia (spec del usuario: el
  // detalle solo aplica cuando la respuesta es afirmativa).
  var respuestaQ2 = tarjeta.querySelector("[data-campo-edicion-tecnica='preguntaNuevaArticulacion2027']").value;
  var detalle = "";
  if (respuestaQ2 === "Sí") {
    var partes = [];
    var otro = tarjeta.querySelector("[data-otro-nueva-articulacion='" + idFila + "']");
    if (otro && otro.value.trim()) partes.push("Otro: " + otro.value.trim());
    tarjeta.querySelectorAll("[data-catalogo-tecnica='" + idFila + "']:checked").forEach(function (casilla) {
      partes.push(casilla.value);
    });
    detalle = partes.join("; ");
  }
  campos.push({ idFila: idFila, campo: "nuevaArticulacionDetalle", valor: detalle });

  mostrarCargaAccion_("acceso", "Guardando…");
  guardarCamposTecnicaConversatorioEnSecuencia_(campos, 0, function () {
    ocultarCargaAccion_();
    cargarTecnicasYMostrarConversatorio_("mensajeResolucionConversatorio");
  });
});

/**
 * Reemplazo de window.confirm() (nativo): dentro del iframe con sandbox
 * de HtmlService, confirm() puede verse feo (diálogo nativo del
 * navegador, fuera de todo control de diseño) o directamente no
 * mostrarse/no hacer nada según el navegador — bloqueado en silencio, lo
 * que hace que el botón "no haga nada". Este modal propio (#modalConfirmar
 * en Modal.html) es DOM puro, así que nunca queda bloqueado por el sandbox.
 */
var _callbackModalConfirmar_ = null;
var _callbackCancelarModalConfirmar_ = null;
/**
 * `opciones.textoConfirmar`/`opciones.textoCancelar` permiten reusar este
 * mismo modal para preguntas de sí/no con etiquetas propias (p.ej. "Es
 * correcto" / "No es correcto, corregir") en vez de "Confirmar"/"Cancelar"
 * — se restauran al valor por defecto en cada llamada, así que no hace
 * falta "resetearlos" a mano en cada sitio que use el modal genérico.
 */
function confirmarAccion(mensaje, callback, tituloOpcional, opciones) {
  document.getElementById("tituloModalConfirmar").textContent = tituloOpcional || "Confirmar";
  document.getElementById("mensajeModalConfirmar").textContent = mensaje;
  document.getElementById("btnAceptarModalConfirmar").textContent = (opciones && opciones.textoConfirmar) || "Confirmar";
  document.getElementById("btnCancelarModalConfirmar").textContent = (opciones && opciones.textoCancelar) || "Cancelar";
  _callbackModalConfirmar_ = callback;
  _callbackCancelarModalConfirmar_ = (opciones && opciones.alCancelar) || null;
  abrirModal("modalConfirmar");
}
document.getElementById("btnCancelarModalConfirmar").addEventListener("click", function () {
  var alCancelar = _callbackCancelarModalConfirmar_;
  _callbackModalConfirmar_ = null;
  _callbackCancelarModalConfirmar_ = null;
  cerrarModal("modalConfirmar");
  if (alCancelar) alCancelar();
});
document.getElementById("btnAceptarModalConfirmar").addEventListener("click", function () {
  var callback = _callbackModalConfirmar_;
  _callbackModalConfirmar_ = null;
  _callbackCancelarModalConfirmar_ = null;
  cerrarModal("modalConfirmar");
  if (callback) callback();
});

/* ------------------------------------------------------------------ *
 * Transición inicial (splash: logo de la Alcaldía/SEM Neiva primero,
 * luego el logo del Foro (#FORO), uno a la vez con crossfade — spec del
 * usuario: "usar imagen de transición luego de logo de la alcaldía").
 *
 * Fix (spec del usuario: "solo carga logo FEM, el logo de la alcaldía
 * no alcanza a cargar"): antes se pasaba al siguiente logo con un
 * temporizador fijo que arrancaba apenas se pedía la imagen — si el
 * primer logo (Alcaldía/SEM, sin caché todavía) tardaba en descargar
 * más que ese tiempo, el temporizador ya había avanzado a la imagen
 * siguiente antes de que el navegador terminara de pintarlo, y se veía
 * como si solo cargara el del Foro. Ahora el conteo para pasar al
 * siguiente logo empieza solo cuando la imagen actual YA cargó (o falló,
 * o ya estaba en caché) — nunca antes — y además dura más tiempo en
 * pantalla (spec del usuario: "haz la transición más larga").
 * ------------------------------------------------------------------ */
function iniciarSplashInicial() {
  var splash = document.getElementById("pantallaSplashInicial");
  if (!splash) return;
  var img = document.getElementById("imagenSplashActual");
  var secuencia = [LOGO_PIE_ID, LOGO_ENCABEZADO_ID].filter(Boolean);

  var cerrado = false;
  var temporizador = null;
  var cerrarSplash = function () {
    if (cerrado) return;
    cerrado = true;
    clearTimeout(temporizador);
    splash.classList.add("oculto");
  };

  if (!secuencia.length) {
    cerrarSplash();
    return;
  }

  var indice = 0;
  var mostrarSiguiente = function () {
    if (cerrado) return;
    if (indice >= secuencia.length) {
      temporizador = setTimeout(cerrarSplash, 1200);
      return;
    }
    var idLogo = secuencia[indice];
    indice++;
    img.classList.remove("visible");
    setTimeout(function () {
      if (cerrado) return;
      var yaMostrado = false;
      var respaldo = null;
      var mostrarAhora = function () {
        if (cerrado || yaMostrado) return;
        yaMostrado = true;
        clearTimeout(respaldo);
        img.classList.add("visible");
        // El logo queda un buen tramo visible antes de pasar al
        // siguiente — se cuenta desde que YA se ve, no desde que se pidió.
        temporizador = setTimeout(mostrarSiguiente, 3200);
      };
      img.onload = mostrarAhora;
      img.onerror = mostrarAhora;
      // Red de seguridad: si por lo que sea ninguno de los dos eventos
      // llega a disparar, no se queda la pantalla de splash trabada.
      respaldo = setTimeout(mostrarAhora, 5000);
      img.src = urlImagenDrive(idLogo, 600);
      if (img.complete) mostrarAhora();
    }, 250);
  };

  splash.addEventListener("click", cerrarSplash);
  mostrarSiguiente();
}
iniciarSplashInicial();

/* ------------------------------------------------------------------ *
 * Overlay de carga con imagen propia — un gif real (compartido por el
 * usuario vía Drive) por cada momento concreto, siempre acompañado de un
 * texto de apoyo:
 *   - acceso: justo después de validar el código, antes de entrar al Foro.
 *   - foto: al subir o cambiar la fotografía del grupo.
 *   - aportes: al enviar los aportes de Preparación (IE o invitado).
 *   - sesionDefinitiva: al enviar Sesión 1 o Sesión 2 de forma definitiva.
 *   - valoracionAsistencia: al enviar la valoración del Foro o al firmar
 *     la asistencia.
 *   - informe: al generar el informe del grupo.
 *   - responsable: al guardar el responsable de envío — sticker de Giphy
 *     "Cargando Sticker by dipielbella" (no es un gif de Drive del
 *     usuario, se mantiene del lote anterior).
 *   - listado: al subir el listado de asistencia en PDF — mismo sticker
 *     "Cargando Sticker by dipielbella" que "responsable" (el usuario
 *     volvió a compartir este mismo gif para este momento puntual).
 *
 * Los 6 gifs de Drive se embeben como data: URI (GIFS_DATAURI_, ver
 * GifsData.html) en vez de enlazarlos por URL a Drive: el hotlink externo
 * (drive.google.com/uc?export=view) dejó de servir el archivo de forma
 * fiable (Google lo está retirando por la eliminación de cookies de
 * terceros — devuelve 403 en muchos navegadores, que es exactamente el
 * "no cargan, solo aparece el círculo" que se reportó) y
 * drive.google.com/thumbnail NO anima los gifs (solo un fotograma fijo).
 * Con el gif embebido directamente en la página, carga siempre, sin
 * depender de Drive ni de políticas de Google que cambian con el tiempo.
 * Si por algún motivo igual fallara (img.onerror), el overlay cae de
 * vuelta al spinner genérico.
 * ------------------------------------------------------------------ */
var URL_STICKER_CARGANDO_RESPONSABLE_ = "https://media.giphy.com/media/SYIu9YMtvUc6tBzDH6/giphy.gif";
var GIFS_CARGA_ACCION_ = {
  acceso: { texto: "Ingresando al Foro…" },
  foto: { texto: "Subiendo fotografía…" },
  aportes: { texto: "Enviando aportes…" },
  sesionDefinitiva: { texto: "Enviando de forma definitiva…" },
  valoracionAsistencia: { texto: "Enviando…" },
  informe: { texto: "Generando el informe… Esto puede tomar hasta dos minutos, no cierre esta ventana." },
  // Mismo sticker "Cargando" que "responsable" (spec del usuario: compartió
  // este mismo gif de nuevo, ahora como indicador de carga de la subida
  // del listado de asistencia en PDF) — ver rama especial más abajo.
  listado: { texto: "Subiendo listado de asistencia…" },
  // Mismo sticker "Cargando" para TODAS las cargas y cambios de pantalla
  // del flujo de invitados (estudiantes, egresados(as) y acudientes) —
  // spec del usuario: "usa este gif para todas las cargas y cambios de
  // pantalla en los perfiles de estudiantes, egresados y acudientes".
  invitado: { texto: "Cargando…" }
};

function mostrarCargaAccion_(tipo, texto) {
  var overlay = document.getElementById("overlayCargaAccion");
  if (!overlay) return;
  var img = document.getElementById("imagenCargaAccion");
  var emoji = document.getElementById("emojiCargaAccion");
  overlay.classList.remove("con-imagen-caida");
  img.onerror = function () { overlay.classList.add("con-imagen-caida"); };

  var gif = GIFS_CARGA_ACCION_[tipo];
  var dataUri = typeof GIFS_DATAURI_ !== "undefined" ? GIFS_DATAURI_[tipo] : null;
  // "informe" e "invitado" muestran la barra de progreso simulada — con
  // ella visible, no se muestra ningún gif/emoji encima (spec del
  // usuario: "si ya hay barra de progreso, quitar gif"), para no
  // duplicar la señal de "algo está avanzando". "aportesRelevantesSocializacion"
  // se agrega aquí por el mismo motivo: genera un Doc y lo exporta a PDF
  // (Socializacion.gs), una operación de varios segundos que con el
  // ⏳ estático se sentía "trabada" aunque estuviera avanzando.
  var usaBarraProgreso = tipo === "informe" || tipo === "invitado" || tipo === "aportesRelevantesSocializacion";
  if (usaBarraProgreso) {
    img.classList.add("oculto");
    emoji.classList.add("oculto");
  } else if (tipo === "responsable" || tipo === "listado") {
    img.src = URL_STICKER_CARGANDO_RESPONSABLE_;
    img.classList.remove("oculto");
    emoji.classList.add("oculto");
  } else if (gif && dataUri) {
    img.src = dataUri;
    img.classList.remove("oculto");
    emoji.classList.add("oculto");
  } else {
    img.classList.add("oculto");
    emoji.textContent = "⏳";
    emoji.className = "emoji-carga-accion";
  }
  document.getElementById("textoCargaAccion").textContent = texto || (gif && gif.texto) || "Cargando…";
  overlay.classList.remove("oculto");

  // Barra de progreso propia de "Generando el informe…" — el resto de
  // acciones ya tienen la barra indeterminada de abajo, así que esta
  // solo se muestra para tipo === "informe" y, desde este lote, también
  // para "invitado" (spec del usuario: "debe cargar más rápido o mostrar
  // una barra de progreso mientras se muestra el gif" — el flujo de
  // invitados encadena varias llamadas al servidor seguidas, así que se
  // reutiliza la misma barra simulada para que la espera se sienta con
  // avance real, en vez de solo el gif estático).
  if (usaBarraProgreso) {
    iniciarBarraProgresoInforme_();
  } else {
    detenerBarraProgresoInforme_(false);
  }
}
function ocultarCargaAccion_() {
  var overlay = document.getElementById("overlayCargaAccion");
  if (overlay) overlay.classList.add("oculto");
  detenerBarraProgresoInforme_(true);
}

/**
 * Apps Script no reporta avance real de una sola llamada síncrona (no hay
 * forma de saber "va en el 40%" mientras se arma el Doc/PDF), así que se
 * simula: avanza rápido al principio y se frena cerca del 90%, dejando el
 * último tramo para cuando el servidor de verdad responda
 * (ocultarCargaAccion_ lo completa a 100% antes de ocultarlo).
 */
var intervaloProgresoInforme_ = null;
function iniciarBarraProgresoInforme_() {
  var contenedor = document.getElementById("barraProgresoInforme");
  var relleno = document.getElementById("barraProgresoInformeRelleno");
  if (!contenedor || !relleno) return;
  contenedor.classList.remove("oculto");
  var porcentaje = 0;
  relleno.style.width = "0%";
  clearInterval(intervaloProgresoInforme_);
  intervaloProgresoInforme_ = setInterval(function () {
    porcentaje += (90 - porcentaje) * 0.08;
    relleno.style.width = Math.min(porcentaje, 90) + "%";
  }, 300);
}
function detenerBarraProgresoInforme_(completar) {
  clearInterval(intervaloProgresoInforme_);
  intervaloProgresoInforme_ = null;
  var contenedor = document.getElementById("barraProgresoInforme");
  var relleno = document.getElementById("barraProgresoInformeRelleno");
  if (!contenedor || !relleno) return;
  if (completar && !contenedor.classList.contains("oculto")) {
    relleno.style.width = "100%";
    setTimeout(function () {
      contenedor.classList.add("oculto");
      relleno.style.width = "0%";
    }, 300);
  } else {
    contenedor.classList.add("oculto");
    relleno.style.width = "0%";
  }
}

/* ------------------------------------------------------------------ *
 * Carrusel de bienvenida — cada I.E. del grupo aparece una a una (1s
 * c/u), justo después de validar el código de acceso (no antes).
 * ------------------------------------------------------------------ */
function mostrarCarruselIE(alTerminar) {
  alTerminar = alTerminar || function () {};
  llamarServidor("rpcInstitucionesDelGrupo", [estado.idGrupo], function (instituciones) {
    if (!instituciones || !instituciones.length) {
      alTerminar();
      return;
    }
    ejecutarCarruselIE(instituciones, alTerminar);
  }, alTerminar);
}

function ejecutarCarruselIE(instituciones, alTerminar) {
  var overlay = document.getElementById("pantallaCarruselIE");
  var contenedorItem = document.getElementById("itemCarruselIE");
  var progreso = document.getElementById("progresoCarruselIE");
  overlay.classList.remove("oculto");

  var indice = 0;
  var temporizador = null;

  var terminar = function () {
    if (temporizador) clearTimeout(temporizador);
    overlay.classList.add("oculto");
    alTerminar();
  };

  var mostrarSiguiente = function () {
    if (indice >= instituciones.length) {
      terminar();
      return;
    }
    var ie = instituciones[indice];
    var html = "<div class='carrusel-ie-item'>";
    if (ie.logoId) {
      html += "<img src='" + urlImagenDrive(ie.logoId, 400) + "' alt='" + escapeHtml(ie.institucion) + "'>";
    } else {
      html += "<span class='icono-generico'>🏫</span>";
    }
    html += "<p class='nombre-ie'>" + escapeHtml(ie.institucion) + "</p>";
    if (ie.grupo) html += "<p class='grupo-ie'>" + escapeHtml(ie.grupo) + "</p>";
    html += "</div>";
    contenedorItem.innerHTML = html;
    progreso.textContent = (indice + 1) + " / " + instituciones.length;
    indice++;
    temporizador = setTimeout(mostrarSiguiente, 1000);
  };

  document.getElementById("btnSaltarCarruselIE").onclick = terminar;
  mostrarSiguiente();
}

/* ------------------------------------------------------------------ *
 * Contador de palabras (Sesión 1 y Sesión 2 — preguntas abiertas)
 * ------------------------------------------------------------------ */
function inicializarContadoresPalabras() {
  var textareas = document.querySelectorAll("#pantallaSesion1 textarea, #pantallaSesion2 textarea");
  textareas.forEach(function (textarea) {
    var contador = document.createElement("p");
    contador.className = "contador-palabras";
    textarea.insertAdjacentElement("afterend", contador);
    var min = parseInt(textarea.dataset.minPalabras, 10) || 0;
    var max = parseInt(textarea.dataset.maxPalabras, 10) || 0;
    var actualizar = function () {
      var texto = textarea.value.trim();
      var palabras = texto ? texto.split(/\s+/).length : 0;
      var texto2 = palabras + (palabras === 1 ? " palabra" : " palabras");
      if (min || max) {
        texto2 += " (mínimo " + min + ", máximo " + max + ")";
        var enRango = palabras >= min && palabras <= max;
        contador.classList.toggle("fuera-de-rango", !enRango);
        contador.classList.toggle("en-rango", enRango);
      }
      contador.textContent = texto2;
    };
    textarea.addEventListener("input", actualizar);
    actualizar();
  });
}
inicializarContadoresPalabras();

/* ------------------------------------------------------------------ *
 * Sesión de socialización (Documento Orientador FEM2026, sección D,
 * item 10) — reemplaza a "Preparación" (item 9): checklist de qué IE ya
 * socializó, con un temporizador de apoyo (10 min + botón "+2 minutos")
 * por institución. Mientras el temporizador corre, la pantalla se parte
 * a la mitad (spec del usuario): una mitad el reloj, la otra un textarea
 * con botón "Guardar" para consolidar en vivo lo compartido por esa IE
 * — "Finalizar" guarda lo que haya en ese textarea y cierra el panel. El
 * cuadro emergente "Datos relevantes" (modalDatosRelevantesIE) se
 * conserva solo para editar una IE que YA NO está en temporizador
 * (data-editar-socializacion-ie).
 * ------------------------------------------------------------------ */
var estadoSocializacion = {
  datos: [],
  ieActivaId: "",
  ieActivaNombre: "",
  segundosRestantes: 0,
  temporizadorId: null
};
var SEGUNDOS_INICIALES_SOCIALIZACION_ = 600;

function cargarSocializacionIE() {
  llamarServidor("rpcObtenerSocializacionGrupo", [estado.idGrupo], function (datos) {
    estadoSocializacion.datos = Array.isArray(datos) ? datos : [];
    renderChecklistSocializacionIE(estadoSocializacion.datos);
  }, function () {
    mostrarMensaje("mensajeGlobal", "No fue posible cargar el listado de instituciones. Intente de nuevo.", "error");
  });
}

function _formatoRelojSocializacion_(segundos) {
  var m = Math.floor(Math.abs(segundos) / 60);
  var s = Math.abs(segundos) % 60;
  return (segundos < 0 ? "-" : "") + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function _actualizarRelojSocializacion_() {
  document.getElementById("relojSocializacion").textContent = _formatoRelojSocializacion_(estadoSocializacion.segundosRestantes);
}

/**
 * Sonidos sutiles para cada momento del temporizador (spec del usuario) —
 * tonos cortos generados con Web Audio API (sin archivos externos que
 * alojar), volumen bajo a propósito. Si el navegador bloquea audio sin
 * interacción previa del usuario, falla en silencio: nunca debe romper
 * el temporizador.
 */
var contextoAudioSocializacion_ = null;
var PATRONES_SONIDO_SOCIALIZACION_ = {
  inicio: [{ freq: 660, dur: 0.12 }],
  mitad: [{ freq: 550, dur: 0.1 }, { freq: 550, dur: 0.1, gap: 0.08 }],
  cierre: [{ freq: 440, dur: 0.1 }, { freq: 440, dur: 0.1, gap: 0.08 }, { freq: 440, dur: 0.1, gap: 0.08 }],
  fin: [{ freq: 330, dur: 0.3 }]
};
function reproducirSonidoSocializacion_(tipo) {
  try {
    if (!contextoAudioSocializacion_) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      contextoAudioSocializacion_ = new Ctx();
    }
    var ctx = contextoAudioSocializacion_;
    if (ctx.state === "suspended") ctx.resume();
    var tiempo = ctx.currentTime;
    (PATRONES_SONIDO_SOCIALIZACION_[tipo] || []).forEach(function (nota) {
      tiempo += nota.gap || 0;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = nota.freq;
      gain.gain.setValueAtTime(0.0001, tiempo);
      gain.gain.exponentialRampToValueAtTime(0.06, tiempo + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, tiempo + nota.dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(tiempo);
      osc.stop(tiempo + nota.dur + 0.02);
      tiempo += nota.dur;
    });
  } catch (e) {
    // Silencioso a propósito — ver comentario arriba.
  }
}

/** Aviso visual breve (destello + texto) para cada momento del temporizador. */
function mostrarAvisoMomentoSocializacion_(texto) {
  var el = document.getElementById("avisoMomentoSocializacion");
  if (!el) return;
  el.textContent = texto;
  el.classList.remove("oculto");
  el.classList.remove("aviso-socializacion-flash");
  // Forzar reflow para poder reiniciar la animación si ya se había mostrado antes.
  void el.offsetWidth;
  el.classList.add("aviso-socializacion-flash");
}

function iniciarTemporizadorSocializacionIE_(idIE, nombreIE) {
  clearInterval(estadoSocializacion.temporizadorId);
  estadoSocializacion.ieActivaId = idIE;
  estadoSocializacion.ieActivaNombre = nombreIE;
  estadoSocializacion.segundosRestantes = SEGUNDOS_INICIALES_SOCIALIZACION_;
  document.getElementById("nombreIESocializando").textContent = nombreIE;
  _actualizarRelojSocializacion_();
  var registro = estadoSocializacion.datos.find(function (ie) { return ie.idIE === idIE; });
  var campoNotas = document.getElementById("campoDatosRelevantesEnVivo");
  if (campoNotas) campoNotas.value = registro ? (registro.datosRelevantes || "") : "";
  mostrarMensaje("mensajeDatosRelevantesEnVivo", "");
  document.getElementById("panelTemporizadorSocializacion").classList.remove("oculto");
  document.getElementById("panelTemporizadorSocializacion").scrollIntoView({ behavior: "smooth", block: "center" });
  mostrarAvisoMomentoSocializacion_("🟢 Socialización de " + nombreIE + " iniciada.");
  reproducirSonidoSocializacion_("inicio");
  estadoSocializacion.temporizadorId = setInterval(function () {
    estadoSocializacion.segundosRestantes--;
    _actualizarRelojSocializacion_();
    if (estadoSocializacion.segundosRestantes === 300) {
      mostrarAvisoMomentoSocializacion_("🟡 Mitad de la socialización alcanzada.");
      reproducirSonidoSocializacion_("mitad");
    } else if (estadoSocializacion.segundosRestantes === 60) {
      mostrarAvisoMomentoSocializacion_("🟠 Último minuto — cierre de la socialización de " + estadoSocializacion.ieActivaNombre + ".");
      reproducirSonidoSocializacion_("cierre");
    } else if (estadoSocializacion.segundosRestantes === 0) {
      mostrarAvisoMomentoSocializacion_("🔴 Fin de la socialización.");
      reproducirSonidoSocializacion_("fin");
    }
  }, 1000);
}

document.getElementById("btnMas2MinSocializacion").addEventListener("click", function () {
  estadoSocializacion.segundosRestantes += 120;
  _actualizarRelojSocializacion_();
  mostrarAvisoMomentoSocializacion_("➕ Se añadieron 2 minutos a la presentación de " + estadoSocializacion.ieActivaNombre + ".");
});

/** Guarda lo escrito en el textarea en vivo (botón "Guardar" o al presionar "Finalizar"). */
function guardarDatosRelevantesEnVivo_(callback) {
  var idIE = estadoSocializacion.ieActivaId;
  if (!idIE) {

function intentarValidarAcceso(forzar) {
  var codigo = document.getElementById("campoCodigoAcceso").value.trim();
  if (!TOKEN_ACCESO) {
    mostrarMensaje("mensajeAcceso", "El enlace de acceso no incluye un token válido.", "error");
    return;
  }
  if (!codigo) {
    mostrarMensaje("mensajeAcceso", "Ingrese el código de acceso.", "error");
    return;
  }
  mostrarCargaAccion_("acceso", "Validando código de acceso…");
  llamarServidor("rpcValidarAcceso", [TOKEN_ACCESO, codigo, estado.dispositivoId, !!forzar], function (r) {
    ocultarCargaAccion_();
    if (!r.ok) {
      if (r.codigo === "SESION_YA_ABIERTA") {
        document.getElementById("mensajeTomaSesion").textContent = r.mensaje;
        abrirModal("modalTomaSesion");
        return;
      }
      mostrarMensaje("mensajeAcceso", r.mensaje || "No fue posible validar el acceso.", "error");
      return;
    }
    estado.idGrupo = r.idGrupo;
    estado.grupo = r.grupo;
    estado.tokenSesion = r.tokenSesion;
    estado.esPrincipal = r.esPrincipal;
    estado.instituciones = r.instituciones || [];
    estado.metodoAsistencia = r.metodoAsistencia || "";
    estado.logoId = r.logoId || "";
    estado.consentimientoGrupo = !!r.consentimientoGrupo;
    estado.consentimientoConectaEduca = !!r.consentimientoConectaEduca;
    estado.fotoGrupoId = r.fotoGrupoId || "";

    // La barra de progreso navegable debe poder usarse apenas se valida
    // el código (spec del usuario), sin tener que pasar primero por
    // Inicio/Presentación/Metodología — esas son solo introducción, no
    // un candado real. Se habilita hasta Participación de una vez (o más
    // allá, si el grupo ya venía más adelante — cambiarPantalla, más
    // abajo, la sigue subiendo si corresponde).
    indiceMaximoOrdenPantallas_ = Math.max(indiceMaximoOrdenPantallas_, ORDEN_PANTALLAS.indexOf("pantallaParticipacion"));
    actualizarBarraProgresoNav_("pantallaAcceso");

    document.getElementById("nombreGrupoParticipacion").textContent = r.grupo;
    var elNombreGrupoAviso = document.getElementById("nombreGrupoAvisoPlazoFirmas");
    if (elNombreGrupoAviso) elNombreGrupoAviso.textContent = r.grupo;
    var elNombreGrupoBienvenida = document.getElementById("nombreGrupoBienvenida");
    if (elNombreGrupoBienvenida) elNombreGrupoBienvenida.textContent = r.grupo;
    poblarSelectInstituciones("campoIEResponsable", estado.instituciones);
    poblarSelectInstituciones("campoIEAsistente", estado.instituciones);
    renderListaInstituciones(estado.instituciones);
    actualizarEtiquetasConectaEducaGrupo();
    renderFotoGrupo(estado.fotoGrupoId, "previaFotoGrupo", "formularioFotoGrupo", estado.grupo);
    document.getElementById("panelFirmantes").classList.remove("oculto");

    // Desde el item 13 (Documento Orientador FEM2026) el único método de
    // asistencia es el listado en PDF — si el grupo no lo tenía guardado
    // todavía (o traía "QR" de antes de este cambio), se fuerza aquí sin
    // esperar un clic; elegirMetodoAsistencia ya se encarga de guardarlo.
    if (estado.metodoAsistencia !== "LISTADO") {
      elegirMetodoAsistencia("LISTADO");
    } else {
      mostrarPanelMetodoAsistencia(estado.metodoAsistencia);
    }
    iniciarHeartbeat();
    iniciarPollingFirmantes();
    cargarRolesForo();
    llamarServidor("rpcEstadoGrupo", [estado.idGrupo], function (estadoGrupo) {
      estado.asistenciaCerrada = !!(estadoGrupo && estadoGrupo.informeGenerado);
      estado.informeGenerado = !!(estadoGrupo && estadoGrupo.informeGenerado);
      actualizarPanelFirmantesCerrado_();

      // Habilita la barra de progreso hasta donde el grupo REALMENTE haya
      // avanzado en la nube (spec del usuario: "si ya hay avances locales
      // y en la nube puedes retomar en cualquier punto ya realizado y
      // habilitar la barra"), sin depender ÚNICAMENTE de ULTIMA_PANTALLA
      // (que cambiarPantalla ya usó más arriba, vía destinoResumenPantalla_)
      // — así, aunque esa columna no reflejara el punto más lejano, el
      // progreso real (Sesión 1/2 enviada, informe generado) igual
      // desbloquea los pasos correspondientes de la barra.
      // Encuentro y ConectaEduca son ramas separadas (item 8) — el
      // avance en la nube de una no dice nada sobre la otra, así que cada
      // una calcula su propio punto más lejano alcanzado.
      var pantallaMasLejanaCloud_ = "pantallaParticipacion";
      if (estado.seccion === "CONECTAEDUCA") {
        pantallaMasLejanaCloud_ = "pantallaSesion2";
        if (estadoGrupo && (estadoGrupo.sesion2Enviada || estadoGrupo.informeGenerado)) pantallaMasLejanaCloud_ = "pantallaRevisionCierre";
      } else {
        if (estadoGrupo && estadoGrupo.sesion1Enviada) pantallaMasLejanaCloud_ = "pantallaRevisionCierre";
      }
      indiceMaximoOrdenPantallas_ = Math.max(indiceMaximoOrdenPantallas_, ORDEN_PANTALLAS.indexOf(pantallaMasLejanaCloud_));
      actualizarBarraProgresoNav_(pantallaActual_ || "pantallaAcceso");
    }, function () {});

    // Retomar donde el grupo se quedó (spec del usuario: "si se cae la
    // señal o se cambia de dispositivo, solo pedir código de ingreso y
    // retomar desde la última parte que se dejó") — si el grupo (desde
    // cualquier dispositivo) ya había avanzado más allá de la
    // introducción EN ESTA MISMA SECCIÓN (destinoResumenPantalla_ ya
    // descarta un avance de la sección contraria), se salta el carrusel
    // de bienvenida y la introducción y se va directo a esa pantalla.
    var destinoResumen = destinoResumenPantalla_(r.ultimaPantalla);
    if (destinoResumen) {
      cambiarPantalla(destinoResumen);
      return;
    }

    // ConectaEduca no tiene pantallas de introducción propias (Inicio/
    // Presentación/Metodología son exclusivas de Encuentro, item 8) — va
    // directo a Consentimiento o Participación, igual que
    // irTrasMetodologia_ al terminar la introducción de Encuentro.
    if (estado.seccion === "CONECTAEDUCA") {
      cambiarPantalla(estado.consentimientoConectaEduca ? "pantallaParticipacion" : "pantallaConsentimientoConectaEduca");
      return;
    }

    // El "recorrido" de logos de las IE del grupo va justo después de
    // validar el código de acceso (spec), no antes — en ese punto ya se
    // conoce con certeza a qué grupo pertenece este dispositivo. El
    // código se pide antes que cualquier otra pantalla, así que Inicio/
    // Presentación/Metodología (la introducción) se muestran DESPUÉS de
    // validar, no antes.
    mostrarCarruselIE(function () {
      cambiarPantalla("pantallaInicio");
    });
  }, function (error) {
    ocultarCargaAccion_();
    console.error("rpcValidarAcceso", error);
    mostrarMensaje("mensajeAcceso", "Ocurrió un error de comunicación con el servidor. Intente de nuevo.", "error");
  });
}

/**
 * Paso "Instituciones que representan": estimado agregado de hombres y
 * mujeres por institución del grupo (hasta 6, las que tenga ese grupo).
 * Además, la(s) institución(es) marcadas aquí SON la elección de
 * institución del propio invitado — ya no se vuelve a preguntar en una
 * pantalla aparte (spec del usuario: "luego de seleccionar las IE no
 * debe devolverse a seleccionar las IE"): se exige marcar al menos una
 * para poder continuar, y se usa la primera marcada.
 */
function abrirInstitucionesRepresentadasInvitado_() {
  var contenedor = document.getElementById("listaInstitucionesRepresentadasInvitado");
  var html = "";
  estadoInvitado.institucionesDelGrupoSeleccionado.forEach(function (ie, indice) {
    html +=
      "<div class='fila-institucion-representada'>" +
      "<label class='fila-institucion-representada-check'>" +
      "<input type='checkbox' data-rep-ie-check data-rep-ie-indice='" + indice + "'> " + escapeHtml(ie.institucion) +
      "</label>" +
      "<div class='fila-institucion-representada-cantidades'>" +
      "<label>Hombres <input type='number' min='0' data-rep-ie-hombres data-rep-ie-indice='" + indice + "' disabled value='0'></label>" +
      "<label>Mujeres <input type='number' min='0' data-rep-ie-mujeres data-rep-ie-indice='" + indice + "' disabled value='0'></label>" +
      "</div></div>";
  });
  contenedor.innerHTML = html || "<p class='ayuda'>Este grupo todavía no tiene instituciones activas.</p>";
  contenedor.querySelectorAll("[data-rep-ie-check]").forEach(function (check) {
    check.addEventListener("change", function () {
      var indice = this.getAttribute("data-rep-ie-indice");
      contenedor.querySelectorAll("[data-rep-ie-indice='" + indice + "'][data-rep-ie-hombres], [data-rep-ie-indice='" + indice + "'][data-rep-ie-mujeres]")
        .forEach(function (campo) { campo.disabled = !this.checked; }.bind(this));
    });
  });
  mostrarMensaje("mensajeInvitadoInstituciones", "");
  document.getElementById("overlayInvitadoInstituciones").classList.remove("oculto");
}
document.getElementById("btnCerrarInvitadoInstituciones").addEventListener("click", function () {

});
document.getElementById("btnContinuarInvitadoInstituciones").addEventListener("click", function () {
  var contenedor = document.getElementById("listaInstitucionesRepresentadasInvitado");
  var declaraciones = [];
  var institucionesMarcadas = [];
  contenedor.querySelectorAll("[data-rep-ie-check]").forEach(function (check) {
    var indice = Number(check.getAttribute("data-rep-ie-indice"));
    var ie = estadoInvitado.institucionesDelGrupoSeleccionado[indice];
    if (!ie) return;
    if (check.checked) institucionesMarcadas.push(ie);
    if (!check.checked) return;
    var hombres = contenedor.querySelector("[data-rep-ie-hombres][data-rep-ie-indice='" + indice + "']");
    var mujeres = contenedor.querySelector("[data-rep-ie-mujeres][data-rep-ie-indice='" + indice + "']");
    declaraciones.push({
      idIE: ie.idIE,
      cantidadHombres: hombres ? hombres.value : 0,
      cantidadMujeres: mujeres ? mujeres.value : 0
    });
  });

  if (!institucionesMarcadas.length) {
    mostrarMensaje("mensajeInvitadoInstituciones", "Marquen al menos una institución.", "error");
    return;
  }
  estadoInvitado.institucionesMarcadas_ = institucionesMarcadas;

  function continuarAPreparar() {
    document.getElementById("overlayInvitadoInstituciones").classList.add("oculto");
    entrarAPrepararInstitucion_(institucionesMarcadas[0].idIE, "mensajeInvitadoInstituciones");
  }

  if (!declaraciones.length) {
    continuarAPreparar();
    return;
  }
  var idGrupoDeclarante = (estadoInvitado.institucionesDelGrupoSeleccionado[0] || {}).idGrupo || "";
  llamarServidor("rpcGuardarInstitucionesRepresentadasInvitado", [idGrupoDeclarante, declaraciones], function () {
    continuarAPreparar();
  }, function () {
    // El estimado es informativo — un fallo al guardarlo no debe bloquear el flujo.
    continuarAPreparar();
  });
});

/**
 * Entra a la sesión de invitado de una IE concreta y va DIRECTO a la
 * preparación — se omite por completo la pantalla de caracterización
 * (spec del usuario: "omite la parte de pedir datos personales"). Se
 * reutiliza tanto desde "Instituciones que representan" (flujo normal)
 * como desde "Su institución educativa" (enlace directo).
 */
function entrarAPrepararInstitucion_(idIE, idMensajeError) {
  mostrarCargaAccion_("invitado", "Ingresando…");

      mostrarMensaje(idMensajeError, r.mensaje || "No fue posible ingresar.", "error");

    estadoInvitado.tokenInvitado = r.tokenInvitado;
    estadoInvitado.idIE = r.idIE;
    estadoInvitado.institucion = r.institucion;
    estadoInvitado.idGrupo = r.idGrupo;
    estadoInvitado.grupo = r.grupo;
    document.getElementById("overlayInvitadoIE").classList.add("oculto");

  }, function (error) {
    ocultarCargaAccion_();
    console.error("rpcIniciarAccesoInvitado", error);

}

/**
 * Enlace directo de invitado (?t=TOKEN&invitado=ESTUDIANTE|ACUDIENTE),
 * enviado desde la pantalla de "invitados especiales" (spec del usuario)
 * — tipo de invitado y grupo ya vienen resueltos por el enlace, así que
 * se salta "¿Quién eres?" y "Tu grupo" y se abre directo "Tu institución
 * educativa", acotada a las IE de ese grupo (ID_GRUPO_ACCESO, ya resuelto
 * por doGet a partir del mismo TOKEN — ver Code.gs).
 */
if (INVITADO_TIPO_ACCESO && ID_GRUPO_ACCESO) {
  estadoInvitado.tipoInvitado = INVITADO_TIPO_ACCESO;
  // El enlace directo (pantalla de "invitados especiales") no distingue
  // todavía estudiante actual de egresado(a) — por defecto se trata como
  // estudiante actual; quien entre puede simplemente elegir "Somos
  // invitados" desde el inicio si quiere marcarse como egresado(a).
  estadoInvitado.rolEstudiante = INVITADO_TIPO_ACCESO === "ESTUDIANTE" ? "ESTUDIANTE" : "";
  estadoInvitado.viaEnlaceDirecto_ = true;
  document.getElementById("btnCerrarInvitadoIE").textContent = "Cancelar";
  mostrarCargaAccion_("invitado", "Cargando instituciones…");
  llamarServidor("rpcInstitucionesDelGrupo", [ID_GRUPO_ACCESO], function (instituciones) {

/**

function abrirCaracterizacionInvitado_() {

  };

    }
  } else {
    datos.vinculoIE = document.getElementById("campoVinculoIEInvitado").value;

      mostrarMensaje("mensajeInvitadoCaracterizacion", "Ocurrió un error de comunicación con el servidor. Intenten de nuevo.", "error");
    }
  );
});

/** "EDUARDO SANTOS" -> "Eduardo Santos" (spec del usuario: "nombres de IE solo con inicial Mayúscula"). */
function _capitalizarNombreIE_(nombre) {
  return String(nombre || "").toLowerCase().replace(/(^|\s)([a-záéíóúñü])/g, function (coincidencia, separador, letra) {
    return separador + letra.toUpperCase();
  });
}

/** Nombres de las instituciones representadas por el invitado, ya capitalizados, sin duplicados. */
function _institucionesRepresentadasInvitado_() {
  var nombres = (estadoInvitado.institucionesMarcadas_ || []).map(function (ie) { return ie.institucion; });
  if (!nombres.length && estadoInvitado.institucion) nombres = [estadoInvitado.institucion];
  return nombres.map(_capitalizarNombreIE_);
}

/**
 * Texto con el que puede INICIAR cada respuesta de preparación del
 * invitado — dos formatos posibles a elegir con un botón (spec del
 * usuario), "general" por defecto:
 *   - general: una sola frase mencionando todas las instituciones
 *     representadas, ej. "En las Instituciones Educativas Eduardo
 *     Santos, Gabriel García Márquez y Jairo Mosquera Moreno; ".
 *   - específico: una frase POR institución, una tras otra, ej. "en la
 *     Institución Educativa Eduardo Santos en la Institución Educativa
 *     Gabriel García Márquez ", para que quien responde pueda intercalar
 *     su comentario propio de cada una.
 * Menciona TODAS las instituciones marcadas en "Instituciones que
 * representan" (institucionesMarcadas_), no solo la primera (que es la
 * única a la que quedan asociadas las respuestas, ver
 * entrarAPrepararInstitucion_), para que quede constancia de a cuáles
 * representa quien responde. Si llegó por enlace directo (sin pasar por
 * "Instituciones que representan"), se usa la única institución de ese
 * enlace.
 */
function _textoInicialGeneralInvitado_() {
  var nombres = _institucionesRepresentadasInvitado_();
  if (!nombres.length) return "";
  if (nombres.length === 1) return "En la Institución Educativa " + nombres[0] + "; ";
  var ultimo = nombres[nombres.length - 1];
  return "En las Instituciones Educativas " + nombres.slice(0, -1).join(", ") + " y " + ultimo + "; ";
}
function _textoInicialEspecificoInvitado_() {
  var nombres = _institucionesRepresentadasInvitado_();
  if (!nombres.length) return "";
  if (nombres.length === 1) return "En la Institución Educativa " + nombres[0] + "; ";
  return nombres.map(function (nombre) { return "en la Institución Educativa " + nombre; }).join(" ") + " ";
}
/** El texto inicial que corresponde al modo actualmente elegido (estadoInvitado.modoTextoInicial_, "general" por defecto). */
function _textoInicialPreparacionInvitado_() {
  return estadoInvitado.modoTextoInicial_ === "especifico"
    ? _textoInicialEspecificoInvitado_()
    : _textoInicialGeneralInvitado_();
}

/**
 * Botón "General"/"Específico" para elegir el formato del texto inicial
 * (solo tiene sentido con más de una institución representada, si no,
 * ambos formatos son iguales) — se repite en CADA una de las 6 preguntas
 * (spec del usuario: "debe aparecer en cada pregunta"), pero el modo
 * elegido es un solo estado compartido (estadoInvitado.modoTextoInicial_),
 * así que un clic en cualquiera de las 12 copias del botón actualiza las
 * 6 respuestas y dejan las 12 copias con el mismo estado activo/inactivo.
 * Cambiar de modo SOLO reemplaza el texto inicial en los campos que están
 * vacíos o que todavía tienen exactamente el texto inicial anterior sin
 * tocar; nunca borra algo que ya se haya escrito encima. Un solo listener
 * delegado (en vez de 12) porque estos botones se repintan cada vez que
 * se abre esta pantalla (renderPreguntasInvitado).
 */
function _aplicarModoTextoInicialInvitado_(nuevoModo) {
  var anterior = _textoInicialPreparacionInvitado_();
  estadoInvitado.modoTextoInicial_ = nuevoModo;
  var nuevo = _textoInicialPreparacionInvitado_();
  CAMPOS_PREPARACION_.forEach(function (clave) {
    var el = document.getElementById("campo_inv_prep_" + clave);
    if (!el) return;
    if (el.value === "" || el.value === anterior) el.value = nuevo;
  });
  _actualizarBotonesModoTextoInicialInvitado_();
}
function _actualizarBotonesModoTextoInicialInvitado_() {
  document.querySelectorAll("[data-modo-texto-btn]").forEach(function (boton) {
    boton.classList.toggle("btn-metodo-activo", boton.getAttribute("data-modo-texto-btn") === estadoInvitado.modoTextoInicial_);
  });
}
document.addEventListener("click", function (evento) {
  var boton = evento.target.closest("[data-modo-texto-btn]");
  if (boton) _aplicarModoTextoInicialInvitado_(boton.getAttribute("data-modo-texto-btn"));
});

function abrirPreparacionInvitado_() {
  document.getElementById("nombreIEInvitadoPrep").textContent = estadoInvitado.institucion;
  document.getElementById("tipoInvitadoTexto").textContent =
    estadoInvitado.tipoInvitado !== "ESTUDIANTE"
      ? "Adultos responsables de un(a) estudiante"
      : (estadoInvitado.rolEstudiante === "GRADUADO" ? "Egresados(as)" : "Estudiantes actuales");
  // "General" es siempre el punto de partida al abrir esta pantalla — el
  // botón de cambiar de modo solo se pinta (dentro de cada pregunta, ver
  // renderPreguntasInvitado) si de verdad hay más de una institución
  // representada (con una sola, ambos formatos son idénticos).
  estadoInvitado.modoTextoInicial_ = "general";
  var mostrarBotonModoTexto = _institucionesRepresentadasInvitado_().length > 1;
  // El gif ya puede estar visible desde entrarAPrepararInstitucion_ (se
  // deja así, sin ocultarlo entre medio) — mostrarCargaAccion_ es
  // idempotente, así que llamarlo de nuevo aquí no causa parpadeo y cubre
  // también al otro punto de entrada a esta función.
  mostrarCargaAccion_("invitado", "Cargando preparación…");
  llamarServidor(
    "rpcObtenerPreparacionIEInvitado",
    [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estado.dispositivoId, estadoInvitado.rolEstudiante],
    function (datos) {
      ocultarCargaAccion_();
      document.getElementById("overlayInvitadoPreparacion").classList.remove("oculto");
      if (!datos) return;
      renderPreguntasInvitado(datos.preguntas, datos.respuestas, _textoInicialPreparacionInvitado_(), mostrarBotonModoTexto);
      _actualizarBotonesModoTextoInicialInvitado_();
    },
    function (error) {
      ocultarCargaAccion_();
      console.error("rpcObtenerPreparacionIEInvitado", error);
      document.getElementById("overlayInvitadoPreparacion").classList.remove("oculto");
    }
  );
}

document.getElementById("btnEnviarPreparacionInvitado").addEventListener("click", function () {
  // Se valida ANTES de mostrar el gif/confirmación (spec del usuario:
  // "debe aparecer antes de iniciar carga de gif") — el servidor ya
  // rechazaba el envío con este mismo mensaje si faltaba alguna
  // pregunta, pero solo después de mostrar el gif y hacer el viaje de
  // ida y vuelta al servidor; validar aquí primero evita ese paso
  // innecesario cuando el problema ya se puede ver en el propio
  // dispositivo.
  var faltan = CAMPOS_PREPARACION_.some(function (clave) {
    var el = document.getElementById("campo_inv_prep_" + clave);
    return !el || !el.value.trim();
  });
  if (faltan) {
    mostrarMensaje("mensajePreparacionInvitado", "Respondan todas las preguntas antes de enviar.", "error");
    return;
  }
  confirmarAccion("¿Enviar los aportes de " + _etiquetaRolInvitado_() + "?", function () {
    guardarPreparacionInvitadoActual_(false, function (guardadoOk) {
      if (!guardadoOk) {
        mostrarMensaje("mensajePreparacionInvitado", "No fue posible guardar antes de enviar. Intenten de nuevo.", "error");
        return;
      }
      mostrarCargaAccion_("invitado", "Enviando aportes…");
      llamarServidor(
        "rpcMarcarPreparacionEnviadaInvitado",
        [estadoInvitado.tokenInvitado, estadoInvitado.idIE, estado.dispositivoId],
        function (r) {
          ocultarCargaAccion_();
          if (!r.ok) {
            mostrarMensaje("mensajePreparacionInvitado", r.mensaje || "No fue posible enviar.", "error");
            return;
          }
          // "envía aportes y no tiene más acceso" — se cierra la preparación
          // y se muestra una pantalla final sin ningún camino de vuelta a la app.
          document.getElementById("overlayInvitadoPreparacion").classList.add("oculto");
          document.getElementById("overlayInvitadoFinalizado").classList.remove("oculto");
        },
        function (error) {
          ocultarCargaAccion_();
          console.error("rpcMarcarPreparacionEnviadaInvitado", error);
          mostrarMensaje("mensajePreparacionInvitado", "Ocurrió un error de comunicación con el servidor. Intenten de nuevo.", "error");
        }
      );
    });
  });
});
