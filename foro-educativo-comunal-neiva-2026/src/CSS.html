<style>
/* =====================================================
   Foro Educativo Comunal Neiva 2026 — estilos
   Paleta institucional heredada de FEI 3.1 (verde/amarillo,
   ver docs/01-auditoria-fei-3.1.md §2.6), adaptada a un layout
   propio y más compacto que el de 3.1.
   ===================================================== */

:root {
  --verde: #0b6a44;
  --verde-oscuro: #084d32;
  --verde-claro: #e6f2ec;
  --amarillo: #f2b705;
  --gris-texto: #444444;
  --gris-borde: #dcdcdc;
  --gris-fondo: #f7f8f7;
  --blanco: #ffffff;
  --rojo: #b3261e;
  --radio: 10px;
  --sombra: 0 2px 10px rgba(0, 0, 0, 0.08);
  font-family: "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--gris-fondo);
  color: #1a1a1a;
  font-size: 16px;
  line-height: 1.5;
}

.oculto { display: none !important; }

/* ---------- Panel permanente de firmantes (spec sección 8) ---------- */
#panelFirmantes {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--verde);
  color: var(--blanco);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  box-shadow: var(--sombra);
}
#panelFirmantes .icono { font-size: 1.3rem; margin-right: 8px; }
#panelFirmantes .info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
#panelFirmantes .contador { font-weight: 700; }
#panelFirmantes .ultimos { opacity: 0.9; font-size: 0.85rem; }
#panelFirmantes button {
  background: var(--blanco);
  color: var(--verde);
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ---------- Encabezado de marca ---------- */
header.marca {
  text-align: center;
  padding: 28px 16px 12px;
}
header.marca h1 {
  color: var(--verde);
  margin: 0 0 4px;
  font-size: 1.6rem;
}
header.marca p.subtitulo {
  margin: 0;
  color: var(--gris-texto);
  font-style: italic;
}

/* ---------- Contenedor principal / pantallas ---------- */
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 12px 16px 80px;
}
.pantalla { display: none; animation: aparecer 0.5s ease-out; }
.pantalla.visible { display: block; }
@keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--gris-borde);
  border-radius: var(--radio);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--sombra);
}

h2.titulo-seccion {
  color: var(--verde);
  border-bottom: 2px solid var(--verde-claro);
  padding-bottom: 8px;
  margin-top: 0;
}
h3.subtitulo-campo { color: var(--verde-oscuro); margin-bottom: 4px; }
p.ayuda { color: var(--gris-texto); font-size: 0.9rem; margin-top: 0; }

/* ---------- Formularios ---------- */
label { display: block; font-weight: 600; margin: 12px 0 4px; }
input[type="text"], input[type="email"], input[type="password"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  background: var(--blanco);
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--verde); border-color: var(--verde); }

.fila-botones { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
button.btn, a.btn {
  display: inline-block;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}
button.btn-primario, a.btn-primario { background: var(--verde); color: var(--blanco); }
button.btn-primario:hover, a.btn-primario:hover { background: var(--verde-oscuro); }
button.btn-secundario { background: var(--blanco); color: var(--verde); border: 1px solid var(--verde); }
button.btn-peligro { background: var(--rojo); color: var(--blanco); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.mensaje { padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-size: 0.95rem; }
.mensaje.error { background: #fbe9e7; color: var(--rojo); border: 1px solid #f3c1bd; }
.mensaje.exito { background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid #bfe0cf; }
.mensaje.info { background: #eef4fb; color: #1d4e78; border: 1px solid #cfe0f0; }

/* ---------- Instituciones / tarjetas de lista ---------- */
.lista-instituciones { display: grid; gap: 8px; margin: 12px 0; }
.item-institucion {
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.item-institucion .comuna { color: var(--gris-texto); font-size: 0.85rem; }

/* ---------- Tabla ConectaEduca / firmantes ---------- */
table.tabla-simple { width: 100%; border-collapse: collapse; margin: 12px 0; }
table.tabla-simple th, table.tabla-simple td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--gris-borde);
  font-size: 0.92rem;
}
table.tabla-simple th { color: var(--verde-oscuro); }

/* ---------- Barra de progreso (avance del recorrido) ---------- */
.barra-progreso { height: 6px; background: var(--gris-borde); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.barra-progreso > div { height: 100%; background: var(--amarillo); transition: width 0.3s ease; }

/* ---------- Modal ---------- */
.modal-fondo {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-caja {
  background: var(--blanco); border-radius: var(--radio);
  max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding: 22px 24px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}
.modal-caja h3 { color: var(--verde); margin-top: 0; }
.modal-cerrar { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--gris-texto); }

footer.marca-pie {
  text-align: center; color: var(--gris-texto); font-size: 0.8rem;
  padding: 20px 16px 40px;
}

/* ---------- Desplegable "aporte propio" (accordion nativo <details>) ---------- */
details.desplegable-aporte {
  border: 1px dashed var(--verde);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 16px;
  background: var(--verde-claro);
}
details.desplegable-aporte summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--verde-oscuro);
}
details.desplegable-aporte[open] summary { margin-bottom: 8px; }

/* ---------- Ficha de caracterización (pantalla de confirmación) ---------- */
.ficha-caracterizacion { border-collapse: collapse; width: 100%; margin: 10px 0 18px; }
.ficha-caracterizacion th, .ficha-caracterizacion td {
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--gris-borde); font-size: 0.9rem;
}
.ficha-caracterizacion caption {
  text-align: left; font-weight: 700; color: var(--verde); margin-bottom: 6px;
}
.celda-rector { display: flex; align-items: center; gap: 6px; }
.celda-rector .input-rector { flex: 1; min-width: 140px; padding: 6px 8px; font-size: 0.9rem; }
.btn-guardar-rector {
  background: none; border: 1px solid var(--gris-borde); border-radius: 6px;
  padding: 4px 8px; cursor: pointer; font-size: 1rem;
}
.estado-rector { font-size: 0.8rem; color: var(--verde-oscuro); }

/* ---------- Fichas de responsable/asistente de envío ---------- */
.tarjeta-responsable {
  background: var(--verde-claro); border-radius: 8px; padding: 10px 14px; margin: 8px 0;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}

/* ---------- Vista de pantalla completa del QR ---------- */
.pantalla-completa-qr {
  position: fixed; inset: 0; z-index: 200; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding: 24px; text-align: center;
}
.pantalla-completa-qr img { max-width: min(70vw, 480px); background: var(--blanco); padding: 16px; border-radius: 12px; }
.pantalla-completa-qr .contador-grande { font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 700; margin: 0; }
.pantalla-completa-qr .enlace-grande { font-size: 1rem; opacity: 0.85; word-break: break-all; max-width: 90vw; }
.pantalla-completa-qr #btnCerrarPantallaCompletaQR { position: absolute; top: 20px; right: 20px; }

/* ---------- Recursos descargables (Sesión 1) ---------- */
.tarjeta-recursos {
  background: var(--gris-fondo);
  border: 1px dashed var(--gris-borde);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 18px;
}
.item-recurso {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0;
  text-decoration: none;
  color: inherit;
}
.item-recurso:hover { background: #d9ede2; }
.item-recurso .emoji-recurso { font-size: 1.4rem; line-height: 1.2; }
.item-recurso strong { color: var(--verde-oscuro); display: block; }
.item-recurso p.ayuda { margin: 2px 0 0; }
.fila-botones-recursos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
a.btn-recurso {
  background: var(--blanco);
  color: var(--verde-oscuro);
  border: 1px solid var(--verde);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 600;
}
a.btn-recurso:hover { background: var(--verde-claro); }

/* ---------- Transición inicial (splash: logo del Foro, luego de la SEM) ---------- */
.pantalla-splash {
  position: fixed; inset: 0; z-index: 300; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  text-align: center; padding: 24px; cursor: pointer;
  transition: opacity 0.6s ease;
}
.pantalla-splash img.imagen-splash {
  max-height: 26vh; max-width: 70vw; background: var(--blanco); border-radius: 12px; padding: 16px;
  opacity: 0; transition: opacity 0.8s ease;
}
.pantalla-splash img.imagen-splash.visible { opacity: 1; }
.pantalla-splash .toque-continuar { font-size: 0.8rem; opacity: 0.75; position: absolute; bottom: 24px; margin: 0; }

/* ---------- Carrusel de bienvenida (logos y nombres de I.E., uno a uno) ---------- */
.pantalla-carrusel-ie {
  position: fixed; inset: 0; z-index: 300; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
}
.carrusel-ie-item { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: aparecerCarrusel 1s ease; }
.carrusel-ie-item img { max-height: 18vh; max-width: 60vw; background: var(--blanco); border-radius: 10px; padding: 10px; }
.carrusel-ie-item .icono-generico { font-size: 4rem; }
.carrusel-ie-item .nombre-ie { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700; margin: 0; }
.carrusel-ie-item .grupo-ie { opacity: 0.85; margin: 0; font-size: 0.9rem; }
@keyframes aparecerCarrusel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.carrusel-ie-progreso { position: absolute; bottom: 24px; font-size: 0.85rem; opacity: 0.8; margin: 0; }
.carrusel-ie-saltar { position: absolute; top: 20px; right: 20px; }

/* ---------- Participación por estamento e institución (formato 3.1) ----------
   UNA sola tabla horizontal: filas = estamento, columnas = IE, con
   encabezado corto "Comuna (N)" (nombre completo como tooltip) y fila/
   columna de Total — igual formato que el cuadro del informe generado. */
.resumen-participacion-estamento {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-weight: 600;
}
.tabla-horizontal-desplazable { overflow-x: auto; margin-bottom: 8px; }
table.tabla-participacion-horizontal {
  width: 100%;
  min-width: 480px;
  border-collapse: collapse;
  font-size: 0.85rem;
}
table.tabla-participacion-horizontal th, table.tabla-participacion-horizontal td {
  border: 1px solid var(--gris-borde);
  padding: 5px 6px;
  text-align: center;
  white-space: nowrap;
}
table.tabla-participacion-horizontal thead th {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  font-weight: 700;
}
table.tabla-participacion-horizontal .th-estamento,
table.tabla-participacion-horizontal .td-estamento {
  text-align: left;
  white-space: normal;
  min-width: 150px;
  position: sticky;
  left: 0;
  background: var(--blanco);
  font-weight: 600;
}
table.tabla-participacion-horizontal thead .th-estamento { background: var(--verde-claro); z-index: 1; }
table.tabla-participacion-horizontal .th-total,
table.tabla-participacion-horizontal .total-fila-estamento {
  background: var(--gris-fondo);
  font-weight: 700;
}
table.tabla-participacion-horizontal tfoot .fila-total-ie td {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  font-weight: 700;
}
table.tabla-participacion-horizontal tfoot .gran-total { background: var(--verde); color: var(--blanco); }
input.input-participantes-h {
  width: 52px;
  padding: 4px;
  text-align: center;
  border: 1px solid var(--gris-borde);
  border-radius: 4px;
}

/* ---------- Método de asistencia — botón activo ---------- */
.btn-metodo-activo {
  background: var(--verde);
  color: var(--blanco);
  border-color: var(--verde);
}

/* ---------- Sesión de preparación (pre-socialización) ---------- */
.lista-ie-preparacion { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.btn-ie-preparacion {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: var(--verde-claro); border: 1px solid var(--verde); border-radius: 8px;
  padding: 12px 16px; font-size: 0.95rem; font-weight: 600; color: var(--verde-oscuro);
  cursor: pointer; text-align: left;
}
.btn-ie-preparacion:hover { background: #d9ede2; }
.btn-ie-preparacion .marca-enviado { font-size: 1.1rem; }
#enlaceInformeEjecutivoIE { margin: 10px 0 16px; }
#avisoSinInformeEjecutivoIE { margin: 10px 0 16px; }
.banner-completado {
  background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid #bfe0cf;
  border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-weight: 600;
}

/* Preguntas de preparación: colapsables (accordion), casilla de texto amplia al abrirlas. */
details.pregunta-preparacion-colapsable {
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  background: var(--blanco);
}
details.pregunta-preparacion-colapsable summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--verde-oscuro);
  font-size: 1.05rem;
}
details.pregunta-preparacion-colapsable[open] summary { margin-bottom: 8px; }
details.pregunta-preparacion-colapsable textarea { min-height: 220px; }
.marca-con-contenido { color: var(--verde); font-weight: 700; }

/* ---------- Sección de socialización (Sesión 1: aportes de preparación por IE) ---------- */
.tarjeta-socializacion {
  background: var(--gris-fondo);
  border: 1px dashed var(--gris-borde);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 18px;
}
details.socializacion-ie {
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 10px 0;
  background: var(--blanco);
}
details.socializacion-ie summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--verde-oscuro);
}
details.socializacion-ie[open] summary { margin-bottom: 8px; }
.socializacion-seccion { margin: 10px 0; padding-top: 8px; border-top: 1px solid var(--gris-borde); }
.socializacion-seccion:first-of-type { border-top: none; }
.socializacion-seccion h4 { margin: 0 0 4px; color: var(--verde); font-size: 0.95rem; }
.socializacion-seccion p { margin: 0 0 8px; white-space: pre-wrap; }

/* ---------- Vista de pantalla completa genérica (aporte de socialización) ---------- */
.pantalla-completa-texto {
  position: fixed; inset: 0; z-index: 200; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; padding: 40px 20px; overflow-y: auto;
}
.pantalla-completa-texto #btnCerrarPantallaCompletaTexto { position: absolute; top: 20px; right: 20px; }
.contenido-pantalla-completa-texto { max-width: 720px; width: 100%; }
.contenido-pantalla-completa-texto h2 { margin-top: 40px; }
.contenido-pantalla-completa-texto p { white-space: pre-wrap; line-height: 1.6; }

/* ---------- Contador de palabras (Sesión 1 y 2) ---------- */
.contador-palabras {
  text-align: right;
  font-size: 0.78rem;
  color: var(--gris-texto);
  margin: 4px 0 14px;
}
.contador-palabras.fuera-de-rango { color: var(--rojo); font-weight: 600; }
.contador-palabras.en-rango { color: var(--verde-oscuro); font-weight: 600; }

/* ---------- Instituciones interesadas (ConectaEduca) — multi-selección con checkboxes ---------- */
.lista-checks-ie {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 16px;
}
.lista-checks-ie label {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--gris-fondo);
  border: 1px solid var(--gris-borde);
  border-radius: 20px;
  padding: 6px 12px;
  font-weight: 400;
  font-size: 0.85rem;
  cursor: pointer;
}
.lista-checks-ie input[type="checkbox"] { width: auto; margin: 0; }

/* ---------- Contador de participantes fijo (tarjeta de Participación) ---------- */
.contador-participantes-tarjeta {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.95rem;
  margin: 0 0 14px;
}
.contador-participantes-tarjeta strong { font-size: 1.2rem; }

/* ---------- Foto general del grupo (Participación) ---------- */
#previaFotoGrupo img {
  display: block;
  max-width: 260px;
  border-radius: 10px;
  margin: 10px 0;
  box-shadow: var(--sombra);
}

/* ---------- Valoración del Foro (corazones, copiada de FEI 3.1) ---------- */
.valoracion-pregunta { margin: 18px 0; }
.valoracion-pregunta > p { font-weight: 600; margin-bottom: 8px; }
.valoracion-corazones { display: flex; gap: 6px; }
button.corazon-valoracion {
  background: none;
  border: none;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  padding: 2px;
}
.valoracion-mejora { margin-top: 10px; background: var(--gris-fondo); border-radius: 8px; padding: 10px 14px; }
.valoracion-resultado {
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 12px 16px;
  margin: 16px 0;
  text-align: center;
}
.valoracion-nota { font-size: 1.1rem; font-weight: 700; color: var(--verde-oscuro); margin: 0; }
.valoracion-ya-enviada {
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--verde-oscuro);
  font-weight: 600;
}

@media (max-width: 480px) {
  header.marca h1 { font-size: 1.3rem; }
  #panelFirmantes { font-size: 0.9rem; }
}
</style>
