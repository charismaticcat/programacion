<style>
/* =====================================================
   Foro Educativo Comunal Neiva 2026 — estilos
   Paleta institucional heredada de FEI 3.1 (verde/amarillo,
   ver docs/01-auditoria-fei-3.1.md §2.6), adaptada a un layout
   propio y más compacto que el de 3.1.
   ===================================================== */

:root {
  --verde: #0b6a44;
  --verde-oscuro: #084d32;
  --verde-claro: #e6f2ec;
  --amarillo: #f2b705;
  --gris-texto: #444444;
  --gris-borde: #dcdcdc;
  --gris-fondo: #f7f8f7;
  --blanco: #ffffff;
  --rojo: #b3261e;
  --radio: 10px;
  --sombra: 0 2px 10px rgba(0, 0, 0, 0.08);
  font-family: "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--gris-fondo);
  color: #1a1a1a;
  font-size: 16px;
  line-height: 1.5;
}

.oculto { display: none !important; }

/* ---------- Panel permanente de firmantes (spec sección 8) ---------- */
#panelFirmantes {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--verde);
  color: var(--blanco);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  box-shadow: var(--sombra);
}
#panelFirmantes .icono { font-size: 1.3rem; margin-right: 8px; }
#panelFirmantes .info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
#panelFirmantes .contador { font-weight: 700; }
#panelFirmantes .ultimos { opacity: 0.9; font-size: 0.85rem; }
#panelFirmantes button {
  background: var(--blanco);
  color: var(--verde);
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ---------- Encabezado de marca ---------- */
header.marca {
  text-align: center;
  padding: 28px 16px 12px;
}
header.marca h1 {
  color: var(--verde);
  margin: 0 0 4px;
  font-size: 1.6rem;
}
header.marca p.subtitulo {
  margin: 0;
  color: var(--gris-texto);
  font-style: italic;
}

/* ---------- Contenedor principal / pantallas ---------- */
main {
  /* Ancho ampliado (antes 780px) para que la matriz de participación por
     estamento e institución quepa completa (hasta 6 IE + Estamento +
     Total) sin desplazamiento horizontal en pantallas medianas/grandes. */
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 16px 80px;
}
.pantalla { display: none; animation: aparecer 0.5s ease-out; }
.pantalla.visible { display: block; }
@keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--gris-borde);
  border-radius: var(--radio);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--sombra);
}

h2.titulo-seccion {
  color: var(--verde);
  border-bottom: 2px solid var(--verde-claro);
  padding-bottom: 8px;
  margin-top: 0;
}
h3.subtitulo-campo { color: var(--verde-oscuro); margin-bottom: 4px; }
p.ayuda { color: var(--gris-texto); font-size: 0.9rem; margin-top: 0; }

/* ---------- Formularios ---------- */
label { display: block; font-weight: 600; margin: 12px 0 4px; }
input[type="text"], input[type="email"], input[type="password"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  background: var(--blanco);
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--verde); border-color: var(--verde); }

.fila-botones { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.fila-botones-columna { flex-direction: column; }
.fila-botones-columna .btn { width: 100%; }
.separador-o {
  text-align: center; color: var(--gris-texto); font-size: 0.85rem; margin: 16px 0 4px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
button.btn, a.btn {
  display: inline-block;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}
button.btn-primario, a.btn-primario { background: var(--verde); color: var(--blanco); }
button.btn-primario:hover, a.btn-primario:hover { background: var(--verde-oscuro); }
button.btn-secundario { background: var(--blanco); color: var(--verde); border: 1px solid var(--verde); }
button.btn-peligro { background: var(--rojo); color: var(--blanco); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

@keyframes aparecerMensaje { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.mensaje {
  padding: 12px 16px 12px 42px;
  border-radius: 10px;
  margin: 12px 0;
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.4;
  position: relative;
  box-shadow: var(--sombra);
  animation: aparecerMensaje 0.25s ease-out;
  border-left: 4px solid transparent;
}
.mensaje::before {
  position: absolute;
  left: 14px;
  top: 12px;
  font-size: 1.05rem;
  line-height: 1;
}
.mensaje.error { background: #fbe9e7; color: var(--rojo); border-left-color: var(--rojo); }
.mensaje.error::before { content: "⚠️"; }
.mensaje.exito { background: var(--verde-claro); color: var(--verde-oscuro); border-left-color: var(--verde); }
.mensaje.exito::before { content: "✅"; }
.mensaje.info { background: #eef4fb; color: #1d4e78; border-left-color: #4a86c8; }
.mensaje.info::before { content: "ℹ️"; }

/* ---------- Indicador de carga (spinner) — se usa en vez de un gif animado ---------- */
.spinner-cargando {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 3px solid var(--gris-borde);
  border-top-color: var(--verde);
  border-radius: 50%;
  animation: girarSpinner 0.8s linear infinite;
  vertical-align: middle;
  flex-shrink: 0;
}
@keyframes girarSpinner { to { transform: rotate(360deg); } }
.texto-cargando { display: flex; align-items: center; gap: 8px; }

/* ---------- Overlay de carga con imagen/gif propio para 3 momentos concretos:
   1) validar código de acceso, 2) subir foto del grupo (ambos momentos),
   3) guardar responsable de envío. Si la imagen no carga (data URL
   inválida o sin conexión a un CDN externo) cae de vuelta al spinner de
   arriba mediante la clase .con-imagen-caida (ver mostrarCargaAccion_ en
   JS.html). ---------- */
.overlay-carga-accion {
  position: fixed; inset: 0; z-index: 320; background: rgba(8, 77, 50, 0.82); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  text-align: center; padding: 24px;
}
.overlay-carga-accion img.imagen-carga-accion {
  max-height: 22vh; max-width: 60vw; border-radius: 12px;
}
.overlay-carga-accion .spinner-cargando {
  display: none; width: 40px; height: 40px; border-width: 5px;
}
.overlay-carga-accion.con-imagen-caida img.imagen-carga-accion { display: none; }
.overlay-carga-accion.con-imagen-caida .spinner-cargando { display: inline-block; }
.overlay-carga-accion p.texto-carga-accion { font-size: 1rem; font-weight: 600; margin: 0; }

/* ---------- Aviso sutil "Texto copiado" al seleccionar aportes ---------- */
.aviso-texto-copiado {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(8, 77, 50, 0.85); color: var(--blanco);
  padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
  z-index: 340; pointer-events: none; opacity: 0; transition: opacity 0.25s ease;
}
.aviso-texto-copiado.visible { opacity: 1; }

/* ---------- Contador de actores agregados (ConectaEduca) ---------- */
.contador-actores-ce {
  font-weight: 600; color: var(--verde-oscuro, #084d32);
  background: rgba(8, 77, 50, 0.08); border-radius: 8px;
  padding: 8px 12px; margin: 6px 0 12px;
}
.overlay-carga-accion .emoji-carga-accion { font-size: 4.5rem; line-height: 1; }
.overlay-carga-accion .emoji-carga-accion.emoji-corriendo { animation: correrEmojiCarga 0.9s ease-in-out infinite; }
@keyframes correrEmojiCarga { 0%, 100% { transform: translateX(-16px) scaleX(-1); } 50% { transform: translateX(16px) scaleX(-1); } }
.overlay-carga-accion .emoji-carga-accion.emoji-camara { animation: pulsarEmojiCarga 1s ease-in-out infinite; }
@keyframes pulsarEmojiCarga { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.82); opacity: 0.55; } }
.overlay-carga-accion .barra-carga-indeterminada {
  width: min(220px, 60vw); height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); overflow: hidden;
}
.overlay-carga-accion .barra-carga-indeterminada span {
  display: block; width: 40%; height: 100%; background: var(--blanco); border-radius: 4px;
  animation: deslizarBarraCarga 1.1s ease-in-out infinite;
}
@keyframes deslizarBarraCarga { 0% { transform: translateX(-120%); } 100% { transform: translateX(350%); } }

/* ---------- Instituciones / tarjetas de lista ---------- */
.lista-instituciones { display: grid; gap: 8px; margin: 12px 0; }
.item-institucion {
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.item-institucion .comuna { color: var(--gris-texto); font-size: 0.85rem; }

/* ---------- Tabla ConectaEduca / firmantes ---------- */
table.tabla-simple { width: 100%; border-collapse: collapse; margin: 12px 0; }
table.tabla-simple th, table.tabla-simple td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--gris-borde);
  font-size: 0.92rem;
}
table.tabla-simple th { color: var(--verde-oscuro); }

/* ---------- Barra de progreso (avance del recorrido) ---------- */
.barra-progreso { height: 6px; background: var(--gris-borde); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.barra-progreso > div { height: 100%; background: var(--amarillo); transition: width 0.3s ease; }

/* ---------- Modal ---------- */
@keyframes aparecerModal { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-fondo {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
  display: flex; align-items: center; justify-content: center;
  /* Por encima del overlay de invitado (z-index 260, ver .overlay-invitado)
     — antes quedaba DEBAJO, así que el modal de confirmación era
     invisible/inaccesible dentro del flujo de invitado. */
  z-index: 300; padding: 16px;
  animation: aparecerMensaje 0.15s ease-out;
}
.modal-caja {
  background: var(--blanco); border-radius: var(--radio);
  max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding: 22px 24px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
  animation: aparecerModal 0.2s ease-out;
}
.modal-caja h3 { color: var(--verde); margin-top: 0; }
.modal-cerrar { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--gris-texto); }

/* Modal de confirmación genérico (#modalConfirmar, reemplaza a confirm()) */
#modalConfirmar .modal-caja { text-align: center; }
#modalConfirmar #mensajeModalConfirmar { font-size: 1rem; line-height: 1.5; margin: 6px 0 18px; }
#modalConfirmar .fila-botones { justify-content: center; }

footer.marca-pie {
  text-align: center; color: var(--gris-texto); font-size: 0.8rem;
  padding: 20px 16px 40px;
}

/* ---------- Desplegable "aporte propio" (accordion nativo <details>) ---------- */
details.desplegable-aporte {
  border: 1px dashed var(--verde);
  border-radius: 8px;
  padding: 10px 14px;
  margin-top: 16px;
  background: var(--verde-claro);
}
details.desplegable-aporte summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--verde-oscuro);
}
details.desplegable-aporte[open] summary { margin-bottom: 8px; }

/* ---------- Ficha de caracterización (pantalla de confirmación) ---------- */
.ficha-caracterizacion { border-collapse: collapse; width: 100%; margin: 10px 0 18px; }
.ficha-caracterizacion th, .ficha-caracterizacion td {
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--gris-borde); font-size: 0.9rem;
}
.ficha-caracterizacion caption {
  text-align: left; font-weight: 700; color: var(--verde); margin-bottom: 6px;
}
.celda-rector { display: flex; align-items: center; gap: 6px; }
.celda-rector .input-rector { flex: 1; min-width: 140px; padding: 6px 8px; font-size: 0.9rem; }
.estado-rector { font-size: 0.8rem; color: var(--verde-oscuro); }

/* ---------- Fichas de responsable/asistente de envío ---------- */
.tarjeta-responsable {
  background: var(--verde-claro); border-radius: 8px; padding: 10px 14px; margin: 8px 0;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}

/* ---------- Vista de pantalla completa del QR ---------- */
.pantalla-completa-qr {
  position: fixed; inset: 0; z-index: 200; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding: 24px; text-align: center;
}
.pantalla-completa-qr img { max-width: min(70vw, 480px); background: var(--blanco); padding: 16px; border-radius: 12px; }
.pantalla-completa-qr .contador-grande { font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 700; margin: 0; }
.pantalla-completa-qr .enlace-grande { font-size: 1rem; opacity: 0.85; word-break: break-all; max-width: 90vw; }
.pantalla-completa-qr #btnCerrarPantallaCompletaQR { position: absolute; top: 20px; right: 20px; }

/* ---------- Recursos descargables (Sesión 1) ---------- */
.tarjeta-recursos {
  background: var(--gris-fondo);
  border: 1px dashed var(--gris-borde);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 18px;
}
.item-recurso {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0;
  text-decoration: none;
  color: inherit;
}
.item-recurso:hover { background: #d9ede2; }
.item-recurso .emoji-recurso { font-size: 1.4rem; line-height: 1.2; }
.item-recurso strong { color: var(--verde-oscuro); display: block; }
.item-recurso p.ayuda { margin: 2px 0 0; }
.fila-botones-recursos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
a.btn-recurso {
  background: var(--blanco);
  color: var(--verde-oscuro);
  border: 1px solid var(--verde);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 0.85rem;
  font-weight: 600;
}
a.btn-recurso:hover { background: var(--verde-claro); }

/* ---------- Transición inicial (splash: logo del Foro, luego de la SEM) ---------- */
.pantalla-splash {
  position: fixed; inset: 0; z-index: 300; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  text-align: center; padding: 24px; cursor: pointer;
  transition: opacity 0.6s ease;
}
.pantalla-splash img.imagen-splash {
  max-height: 26vh; max-width: 70vw; background: var(--blanco); border-radius: 12px; padding: 16px;
  opacity: 0; transition: opacity 0.8s ease;
}
.pantalla-splash img.imagen-splash.visible { opacity: 1; }
.pantalla-splash .toque-continuar { font-size: 0.8rem; opacity: 0.75; position: absolute; bottom: 24px; margin: 0; }

/* ---------- Carrusel de bienvenida (logos y nombres de I.E., uno a uno) ---------- */
.pantalla-carrusel-ie {
  position: fixed; inset: 0; z-index: 300; background: var(--verde-oscuro); color: var(--blanco);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
}
.carrusel-ie-item { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: aparecerCarrusel 1s ease; }
.carrusel-ie-item img { max-height: 18vh; max-width: 60vw; background: var(--blanco); border-radius: 10px; padding: 10px; }
.carrusel-ie-item .icono-generico { font-size: 4rem; }
.carrusel-ie-item .nombre-ie { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700; margin: 0; }
.carrusel-ie-item .grupo-ie { opacity: 0.85; margin: 0; font-size: 0.9rem; }
@keyframes aparecerCarrusel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.carrusel-ie-progreso { position: absolute; bottom: 24px; font-size: 0.85rem; opacity: 0.8; margin: 0; }
.carrusel-ie-saltar { position: absolute; top: 20px; right: 20px; }

/* ---------- Participación por estamento e institución (formato 3.1) ----------
   UNA sola tabla horizontal: filas = estamento, columnas = IE, con
   encabezado corto "Comuna (N)" (nombre completo como tooltip) y fila/
   columna de Total — igual formato que el cuadro del informe generado. */
.resumen-participacion-estamento {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-weight: 600;
}
.tabla-horizontal-desplazable { overflow-x: auto; margin-bottom: 8px; }
table.tabla-participacion-horizontal {
  width: 100%;
  min-width: 480px;
  border-collapse: collapse;
  font-size: 0.85rem;
}
table.tabla-participacion-horizontal th, table.tabla-participacion-horizontal td {
  border: 1px solid var(--gris-borde);
  padding: 5px 6px;
  text-align: center;
  white-space: nowrap;
}
table.tabla-participacion-horizontal thead th {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  font-weight: 700;
}
table.tabla-participacion-horizontal .th-estamento,
table.tabla-participacion-horizontal .td-estamento {
  text-align: left;
  white-space: normal;
  min-width: 150px;
  position: sticky;
  left: 0;
  background: var(--blanco);
  font-weight: 600;
}
table.tabla-participacion-horizontal thead .th-estamento { background: var(--verde-claro); z-index: 1; }
table.tabla-participacion-horizontal .th-ie {
  white-space: normal;
  min-width: 100px;
  max-width: 130px;
}
.nombre-ie-columna { display: block; font-size: 0.72rem; line-height: 1.2; }
.comuna-ie-columna { display: block; font-size: 0.68rem; font-weight: 400; color: var(--gris-texto); margin-top: 2px; }
table.tabla-participacion-horizontal .th-total,
table.tabla-participacion-horizontal .total-fila-estamento {
  background: var(--gris-fondo);
  font-weight: 700;
}
table.tabla-participacion-horizontal tfoot .fila-total-ie td {
  background: var(--verde-claro);
  color: var(--verde-oscuro);
  font-weight: 700;
}
table.tabla-participacion-horizontal tfoot .gran-total { background: var(--verde); color: var(--blanco); }
input.input-participantes-h {
  width: 52px;
  padding: 4px;
  text-align: center;
  border: 1px solid var(--gris-borde);
  border-radius: 4px;
}

/* ---------- Método de asistencia — botón activo ---------- */
.btn-metodo-activo {
  background: var(--verde);
  color: var(--blanco);
  border-color: var(--verde);
}

/* ---------- Sesión de preparación (pre-socialización) ---------- */
.lista-ie-preparacion { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.btn-ie-preparacion {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; text-align: left; width: 100%;
}
.btn-ie-preparacion .nombre-ie-preparacion { color: var(--verde-oscuro); }
.btn-ie-preparacion .estado-ie-preparacion { font-size: 0.82rem; font-weight: 500; white-space: normal; }
.btn-ie-preparacion.ie-preparacion-completa {
  background: var(--verde-claro); border: 1px solid var(--verde);
}
.btn-ie-preparacion.ie-preparacion-completa:hover { background: #d9ede2; }
.btn-ie-preparacion.ie-preparacion-completa .estado-ie-completa { color: var(--verde-oscuro); }
.btn-ie-preparacion.ie-preparacion-pendiente {
  background: #fff8e6; border: 1px solid #f0c96b;
}
.btn-ie-preparacion.ie-preparacion-pendiente:hover { background: #fdf0cf; }
.btn-ie-preparacion.ie-preparacion-pendiente .estado-ie-pendiente { color: #8a6100; }
#enlaceInformeEjecutivoIE { margin: 10px 0 16px; }
#avisoSinInformeEjecutivoIE { margin: 10px 0 16px; }
.banner-completado {
  background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid #bfe0cf;
  border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-weight: 600;
}

/* Mensaje grande y centrado cuando Sesión 1/2 ya se envió de forma
   definitiva (spec del usuario: "solo debe aparecer mensaje grande en
   pantalla en la mitad"), seguido de las respuestas en solo lectura —
   nunca los cuadros de texto en blanco para volver a escribir. */
.mensaje-envio-definitivo {
  text-align: center; padding: 32px 16px; margin: 8px 0 24px;
  background: var(--verde-claro); border: 1px solid #bfe0cf; border-radius: 12px;
}
