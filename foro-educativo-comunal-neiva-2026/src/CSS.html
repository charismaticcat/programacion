<style>
/* =====================================================
   Foro Educativo Comunal Neiva 2026 — estilos
   Paleta institucional heredada de FEI 3.1 (verde/amarillo,
   ver docs/01-auditoria-fei-3.1.md §2.6), adaptada a un layout
   propio y más compacto que el de 3.1.
   ===================================================== */

:root {
  --verde: #0b6a44;
  --verde-oscuro: #084d32;
  --verde-claro: #e6f2ec;
  --amarillo: #f2b705;
  --gris-texto: #444444;
  --gris-borde: #dcdcdc;
  --gris-fondo: #f7f8f7;
  --blanco: #ffffff;
  --rojo: #b3261e;
  --radio: 10px;
  --sombra: 0 2px 10px rgba(0, 0, 0, 0.08);
  font-family: "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--gris-fondo);
  color: #1a1a1a;
  font-size: 16px;
  line-height: 1.5;
}

.oculto { display: none !important; }

/* ---------- Panel permanente de firmantes (spec sección 8) ---------- */
#panelFirmantes {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--verde);
  color: var(--blanco);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  box-shadow: var(--sombra);
}
#panelFirmantes .icono { font-size: 1.3rem; margin-right: 8px; }
#panelFirmantes .info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
#panelFirmantes .contador { font-weight: 700; }
#panelFirmantes .ultimos { opacity: 0.9; font-size: 0.85rem; }
#panelFirmantes button {
  background: var(--blanco);
  color: var(--verde);
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ---------- Encabezado de marca ---------- */
header.marca {
  text-align: center;
  padding: 28px 16px 12px;
}
header.marca h1 {
  color: var(--verde);
  margin: 0 0 4px;
  font-size: 1.6rem;
}
header.marca p.subtitulo {
  margin: 0;
  color: var(--gris-texto);
  font-style: italic;
}

/* ---------- Contenedor principal / pantallas ---------- */
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 12px 16px 80px;
}
.pantalla { display: none; animation: aparecer 0.2s ease-in; }
.pantalla.visible { display: block; }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--gris-borde);
  border-radius: var(--radio);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--sombra);
}

h2.titulo-seccion {
  color: var(--verde);
  border-bottom: 2px solid var(--verde-claro);
  padding-bottom: 8px;
  margin-top: 0;
}
h3.subtitulo-campo { color: var(--verde-oscuro); margin-bottom: 4px; }
p.ayuda { color: var(--gris-texto); font-size: 0.9rem; margin-top: 0; }

/* ---------- Formularios ---------- */
label { display: block; font-weight: 600; margin: 12px 0 4px; }
input[type="text"], input[type="email"], input[type="password"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  background: var(--blanco);
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--verde); border-color: var(--verde); }

.fila-botones { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
button.btn, a.btn {
  display: inline-block;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}
button.btn-primario, a.btn-primario { background: var(--verde); color: var(--blanco); }
button.btn-primario:hover, a.btn-primario:hover { background: var(--verde-oscuro); }
button.btn-secundario { background: var(--blanco); color: var(--verde); border: 1px solid var(--verde); }
button.btn-peligro { background: var(--rojo); color: var(--blanco); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.mensaje { padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-size: 0.95rem; }
.mensaje.error { background: #fbe9e7; color: var(--rojo); border: 1px solid #f3c1bd; }
.mensaje.exito { background: var(--verde-claro); color: var(--verde-oscuro); border: 1px solid #bfe0cf; }
.mensaje.info { background: #eef4fb; color: #1d4e78; border: 1px solid #cfe0f0; }

/* ---------- Instituciones / tarjetas de lista ---------- */
.lista-instituciones { display: grid; gap: 8px; margin: 12px 0; }
.item-institucion {
  background: var(--verde-claro);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.item-institucion .comuna { color: var(--gris-texto); font-size: 0.85rem; }

/* ---------- Tabla ConectaEduca / firmantes ---------- */
table.tabla-simple { width: 100%; border-collapse: collapse; margin: 12px 0; }
table.tabla-simple th, table.tabla-simple td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--gris-borde);
  font-size: 0.92rem;
}
table.tabla-simple th { color: var(--verde-oscuro); }

/* ---------- Barra de progreso (avance del recorrido) ---------- */
.barra-progreso { height: 6px; background: var(--gris-borde); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.barra-progreso > div { height: 100%; background: var(--amarillo); transition: width 0.3s ease; }

/* ---------- Modal ---------- */
.modal-fondo {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-caja {
  background: var(--blanco); border-radius: var(--radio);
  max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding: 22px 24px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}
.modal-caja h3 { color: var(--verde); margin-top: 0; }
.modal-cerrar { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--gris-texto); }

footer.marca-pie {
  text-align: center; color: var(--gris-texto); font-size: 0.8rem;
  padding: 20px 16px 40px;
}

@media (max-width: 480px) {
  header.marca h1 { font-size: 1.3rem; }
  #panelFirmantes { font-size: 0.9rem; }
}
</style>
