<script>
/**
 * Components.html — Foro Educativo Comunal Neiva 2026
 * Funciones de render reutilizables (patrón de renderizarPlenaria /
 * renderCaracterizacionHTML de FEI 3.1 — ver docs/01-auditoria-fei-3.1.md
 * §2.6), separadas de la lógica de negocio en JS.html.
 */

function escapeHtml(texto) {
  var div = document.createElement("div");
  div.textContent = texto == null ? "" : String(texto);
  return div.innerHTML;
}

/**
 * Formatea el número de comuna como "Comuna (N)" (spec: "los números que
 * aparecen frente a cada IE debe decir antes Comuna (#)"). Los valores no
 * numéricos (p.ej. "RURAL") se dejan tal cual, solo con capitalización.
 */
function formatearComuna(comuna) {
  var texto = String(comuna || "").trim();
  if (!texto) return "";
  if (/^\d+$/.test(texto)) return "Comuna " + texto;
  return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
}

function renderListaInstituciones(instituciones) {
  var contenedor = document.getElementById("listaInstituciones");
  contenedor.innerHTML = "";
  (instituciones || []).forEach(function (ie) {
    var item = document.createElement("div");
    item.className = "item-institucion";
    item.innerHTML =
      "<span>" + escapeHtml(ie.institucion) + "</span>" +
      "<span class='comuna'>" + escapeHtml(formatearComuna(ie.comuna)) + "</span>";
    contenedor.appendChild(item);
  });
}

/** Casillas para elegir qué IE del grupo están interesadas en un actor/entidad de ConectaEduca. */
function renderChecklistIEInteresadasCE(instituciones) {
  var contenedor = document.getElementById("listaIEInteresadasCE");
  if (!contenedor) return;
  contenedor.innerHTML = "";
  (instituciones || []).forEach(function (ie) {
    var etiqueta = document.createElement("label");
    etiqueta.innerHTML =
      "<input type='checkbox' data-nombre-ie='" + escapeHtml(ie.institucion) + "' value='" + escapeHtml(ie.idIE) + "'> " +
      escapeHtml(ie.institucion);
    contenedor.appendChild(etiqueta);
  });
}

function renderResumenFirmantes(estado) {
  document.getElementById("contadorFirmantes").textContent = estado.total || 0;
  var contadorTarjeta = document.getElementById("contadorParticipantesTarjeta");
  if (contadorTarjeta) contadorTarjeta.textContent = estado.total || 0;
  var ultimos = (estado.firmantes || []).slice(0, 3).map(function (f) {
    return f.nombre;
  });
  document.getElementById("ultimosFirmantes").textContent =
    ultimos.length ? "Últimos: " + ultimos.join(" · ") : "";
}

function renderTablaTodosFirmantes(firmantes) {
  var tbody = document.getElementById("tablaTodosFirmantes");
  tbody.innerHTML = "";
  (firmantes || []).forEach(function (f) {
    var fila = document.createElement("tr");
    // La columna "Rol" ya viene cruzada con el estamento cuando no hay un
    // rol en el foro distinto capturado (spec del usuario: "cruzar
    // estamento con rol" — listarFirmantesGrupo, Data.gs), así que nunca
    // debería verse vacía.
    fila.innerHTML =
      "<td>" + escapeHtml(f.nombre) + "</td>" +
      "<td>" + escapeHtml(f.institucion) + "</td>" +
      "<td>" + escapeHtml(f.rolForo || f.estamento) + "</td>";
    tbody.appendChild(fila);
  });
}

/** Ficha del responsable principal + lista de asistentes de envío, con botón para quitar. */
/**
 * `idFichaPrincipal`/`idListaAsistentes` permiten repetir la misma ficha
 * en Participación (por defecto) y también en "Revisar todo antes de
 * enviar" (Revisión y cierre, spec del usuario), sin duplicar lógica.
 */
function renderResponsables(responsables, idFichaPrincipal, idListaAsistentes) {
  var fichaPrincipal = document.getElementById(idFichaPrincipal || "fichaResponsablePrincipal");
  if (fichaPrincipal) {
    var p = responsables.principal;
    fichaPrincipal.innerHTML = p
      ? "<div class='tarjeta-responsable'><span>✅ <strong>" + escapeHtml(p.nombre) + "</strong>" +
        (p.rolForo ? " — " + escapeHtml(p.rolForo) : "") +
        (p.institucion ? " (" + escapeHtml(p.institucion) + ")" : "") +
        " — " + escapeHtml(p.correo) + "</span></div>"
      : "";
  }

  var listaAsistentes = document.getElementById(idListaAsistentes || "listaAsistentesEnvio");
  if (listaAsistentes) {
    listaAsistentes.innerHTML = "";
    (responsables.asistentes || []).forEach(function (a) {
      var item = document.createElement("div");
      item.className = "tarjeta-responsable";
      item.innerHTML =
        "<span>" + escapeHtml(a.nombre) + (a.rolForo ? " — " + escapeHtml(a.rolForo) : "") +
        (a.institucion ? " (" + escapeHtml(a.institucion) + ")" : "") + " — " + escapeHtml(a.correo) + "</span>" +
        "<button type='button' class='btn btn-secundario' data-quitar-asistente='" + a.idRegistro + "'>Quitar</button>";
      listaAsistentes.appendChild(item);
    });
  }
}

/**
 * Checklist de instituciones educativas presentes en la sesión — spec del
 * usuario: "Responsable de envio debe seleccionar qué instituciones
 * educativas están presentes", justo después de Responsable de envío.
 * Solo las marcadas aquí entran a la matriz de estamento
 * (renderParticipacionEstamento) y al informe final.
 */
function renderListaIEPresentes(instituciones) {
  var contenedor = document.getElementById("listaIEPresentes");
  if (!contenedor) return;
  if (!instituciones || !instituciones.length) {
    contenedor.innerHTML = "<p class='ayuda'>No hay instituciones para mostrar.</p>";
    return;
  }
  var html = "";
  instituciones.forEach(function (ie) {
    html += "<label class='opcion-ie-presente'>" +
      "<input type='checkbox' data-ie-presente='" + escapeHtml(ie.idIE) + "'" + (ie.presente ? " checked" : "") + "> " +
      escapeHtml(ie.institucion) +
      "</label>";
  });
  contenedor.innerHTML = html;
}

/**
 * Tabla ÚNICA y horizontal de participación por estamento (mismo formato
 * que 3.1, y mismo formato del cuadro dentro del informe generado):
 * filas = estamento, columnas = IE (encabezado corto "Comuna (N)", con
 * el nombre completo como tooltip), última columna/fila = Total —
 * conteo manual con autosuma, editable, distinto del conteo de
 * firmantes en vivo. `idContenedor` permite pintar la misma tabla tanto
 * en Participación como en Confirmación de caracterización.
 */
function renderParticipacionEstamento(datos, idContenedor) {
  var contenedor = document.getElementById(idContenedor);
  if (!contenedor) return;
  // Solo las IE marcadas como presentes entran a la matriz (spec del
  // usuario: "Responsable de envio debe seleccionar qué instituciones
  // educativas están presentes"; ver listaIEPresentes/renderListaIEPresentes).
  var instituciones = (datos ? datos.instituciones : []).filter(function (ie) { return ie.presente; });
  if (!instituciones.length) {
    contenedor.innerHTML = "<p class='ayuda'>Marque arriba qué instituciones educativas están presentes para que aparezcan aquí.</p>";
    return;
  }

  var html = "<table id='tabla_" + idContenedor + "' class='tabla-participacion-horizontal'>";
  html += "<thead><tr><th class='th-estamento'>Estamento</th>";
  instituciones.forEach(function (ie) {
    html += "<th class='th-ie' title='" + escapeHtml(ie.institucion) + "'>" +
      "<span class='nombre-ie-columna'>" + escapeHtml(ie.institucion) + "</span>" +
      "<span class='comuna-ie-columna'>" + escapeHtml(formatearComuna(ie.comuna)) + "</span>" +
      "</th>";
  });
  html += "<th class='th-total'>Total</th></tr></thead>";

  html += "<tbody>";
  datos.estamentos.forEach(function (e) {
    html += "<tr data-estamento='" + escapeHtml(e.clave) + "'>";
    html += "<td class='td-estamento'>" + escapeHtml(e.etiqueta) + "</td>";
    instituciones.forEach(function (ie) {
      html +=
        "<td><input type='number' min='0' step='1' inputmode='numeric' class='input-participantes-h' " +
        "data-ie='" + escapeHtml(ie.idIE) + "' data-estamento='" + escapeHtml(e.clave) + "' " +
        "value='" + (ie.valores[e.clave] || 0) + "'></td>";
    });
    html += "<td class='total-fila-estamento'>" + (datos.totalesPorEstamento[e.clave] || 0) + "</td>";
    html += "</tr>";
  });
  html += "</tbody>";

  html += "<tfoot><tr class='fila-total-ie'><td class='td-estamento'>Total</td>";
  instituciones.forEach(function (ie) {
    html += "<td data-total-ie='" + escapeHtml(ie.idIE) + "'>" + ie.total + "</td>";
  });
  html += "<td class='gran-total'>" + (datos.totalGeneral || 0) + "</td></tr></tfoot>";
  html += "</table>";

  contenedor.innerHTML = html;
}

/**
 * Resumen del total: si el grupo eligió el método QR, muestra
 * "firmantes / participantes declarados" para comparar la firma en vivo
 * contra el conteo manual; si no, el total declarado seguido de la
 * cantidad registrada en el listado de asistencia en PDF (spec del
 * usuario: debe quedar justo debajo de "Total de participantes
 * declarados"). `idResumen` permite mostrarlo tanto en Participación como
 * en Confirmación de caracterización.
 */
function renderResumenParticipacionEstamento(idResumen, datos, metodoAsistencia, totalFirmantes, cantidadListado) {
  var contenedor = document.getElementById(idResumen);
  if (!contenedor || !datos) return;
  if (metodoAsistencia === "QR") {
    contenedor.textContent = "👥 Firmantes / participantes declarados: " + (totalFirmantes || 0) + " / " + (datos.totalGeneral || 0);
  } else {
    var html = "👥 Total de participantes declarados: " + (datos.totalGeneral || 0);
    if (metodoAsistencia === "LISTADO" && cantidadListado) {
      html += "<br>Total de participantes en Listado de asistencia: " + cantidadListado;
    }
    contenedor.innerHTML = html;
  }
}

/** Ficha de caracterización del grupo: instituciones + resumen de participación, para confirmar antes de continuar. */
/**
 * grupo/instituciones/responsables como antes; `estadoFirmantes` es el
 * resultado de rpcEstadoFirmantes (solo se usa .total). El nombre del
 * rector(a) es editable, igual que en FEI 3.1 ("Rector(a) ✏️").
 */
function renderFichaCaracterizacion(grupo, instituciones, estadoFirmantes, responsables) {
  var contenedor = document.getElementById("fichaCaracterizacionGrupo");
  if (!contenedor) return;

  var html = "<table class='ficha-caracterizacion'><caption>" + escapeHtml(grupo) + "</caption>";
  html += "<tr><th>Institución educativa</th><th>DANE</th><th>Rector(a) ✏️</th></tr>";
  (instituciones || []).forEach(function (ie) {
    html += "<tr><td>" + escapeHtml(ie.institucion) + "</td><td>" + escapeHtml(ie.idIE) + "</td>" +
      "<td class='celda-rector'>" +
      "<input type='text' class='input-rector' data-ie-rector='" + escapeHtml(ie.idIE) + "' value='" + escapeHtml(ie.rector || "") + "' placeholder='Nombre del rector(a)'>" +
      "<span class='estado-rector' id='estadoRector_" + escapeHtml(ie.idIE) + "'></span>" +
      "</td></tr>";
  });
  html += "</table>";

  html += "<table class='ficha-caracterizacion'><caption>Participación</caption>";
  html += "<tr><td>Total de firmantes</td><td><strong>" + ((estadoFirmantes && estadoFirmantes.total) || 0) + "</strong></td></tr>";
  html += "<tr><td>Responsable de envío</td><td>" +
    (responsables.principal ? escapeHtml(responsables.principal.nombre) + " — " + escapeHtml(responsables.principal.correo) : "Sin registrar") +
    "</td></tr>";
  html += "<tr><td>Asistentes de envío</td><td>" +
    ((responsables.asistentes || []).length ? responsables.asistentes.map(function (a) { return escapeHtml(a.nombre); }).join(", ") : "Ninguno") +
    "</td></tr>";
  html += "</table>";

  contenedor.innerHTML = html;
}

/** Un "item-recurso" (emoji + título + descripción), como enlace de descarga clicable. */
function _htmlItemRecurso(r, compacto) {
  var enlace = document.createElement("a");
  enlace.className = compacto ? "btn-recurso" : "item-recurso";
  enlace.href = r.url;
  enlace.target = "_blank";
  enlace.rel = "noopener";
  enlace.title = r.descripcion || "";
  if (compacto) {
    enlace.textContent = r.emoji + " " + r.titulo;
  } else {
    enlace.innerHTML =
      "<span class='emoji-recurso'>" + escapeHtml(r.emoji) + "</span>" +
      "<span><strong>" + escapeHtml(r.titulo) + "</strong><p class='ayuda'>" + escapeHtml(r.descripcion) + "</p></span>";
  }
  return enlace;
}

/** Pinta los recursos descargables de Sesión 1 en el modal (ficha completa) y en la fila de botones pequeños. */
function renderRecursosSesion1(recursos) {
  var contenedorModal = document.getElementById("listaRecursosSesion1Modal");
  if (contenedorModal) {
    contenedorModal.innerHTML = "";
    if (!recursos || !recursos.length) {
      contenedorModal.innerHTML = "<p class='ayuda'>No hay archivos de apoyo disponibles todavía.</p>";
    } else {
      recursos.forEach(function (r) {
        contenedorModal.appendChild(_htmlItemRecurso(r, false));
      });
    }
  }

  var contenedorBotones = document.getElementById("listaRecursosSesion1Botones");
  if (contenedorBotones) {
    contenedorBotones.innerHTML = "";
    (recursos || []).forEach(function (r) {
      contenedorBotones.appendChild(_htmlItemRecurso(r, true));
    });
  }
}

/**
 * Vista previa de la fotografía general del grupo — reutilizable en
 * Participación y en la pantalla final (Informe generado), donde vuelve
 * a pedirse si se aplazó. Una vez subida, se muestra la foto, se
 * confirma con un mensaje "La foto del Grupo X ha sido subida" y se
 * oculta el formulario de subida (no hace falta volver a subirla).
 */
function renderFotoGrupo(fotoGrupoId, idPrevia, idFormulario, nombreGrupo) {
  var contenedor = document.getElementById(idPrevia || "previaFotoGrupo");
  var formulario = document.getElementById(idFormulario || "formularioFotoGrupo");
  if (!contenedor) return;
  if (fotoGrupoId) {
    contenedor.innerHTML =
      "<img src='" + urlImagenDrive(fotoGrupoId, 600) + "' alt='Fotografía general del grupo'>" +
      "<div class='mensaje exito'>La foto del " + escapeHtml(nombreGrupo || "grupo") + " ha sido subida.</div>" +
      "<div class='fila-botones' style='justify-content:center;'>" +
      "<button type='button' class='btn btn-secundario' data-cambiar-foto='" + escapeHtml(idFormulario || "formularioFotoGrupo") + "'>✏️ Cambiar fotografía</button>" +
      "</div>";
    if (formulario) formulario.classList.add("oculto");
  } else {
    contenedor.innerHTML = "<p class='ayuda'>Todavía no se ha subido ninguna fotografía.</p>";
    if (formulario) formulario.classList.remove("oculto");
  }
}

/**
 * Foto + pie de página con la cantidad de participantes declarados — se
 * usa en Confirmación de caracterización (contenedor por defecto) y,
 * reutilizando el mismo contenido, también en Revisión y cierre
 * (idContenedor="pieFotoCierre"), donde la fotografía puede agregarse o
 * cambiarse sin tener que volver a Participación (spec del usuario).
 */
function renderPieFotoCaracterizacion(fotoGrupoId, grupo, totalParticipantes, idContenedor) {
  var contenedor = document.getElementById(idContenedor || "pieFotoCaracterizacion");
  if (!contenedor) return;
  if (!fotoGrupoId) {
    contenedor.classList.add("oculto");
    contenedor.innerHTML = "";
    return;
  }
  contenedor.classList.remove("oculto");
  contenedor.innerHTML =
    "<img src='" + urlImagenDrive(fotoGrupoId, 600) + "' alt='Fotografía general del grupo'>" +
    "<p class='pie-foto-texto'>" + escapeHtml(grupo || "") + " — " + (totalParticipantes || 0) +
    " participantes declarados</p>";
}

function renderTablaConectaEduca(registros) {
  var tbody = document.querySelector("#tablaConectaEduca tbody");
  tbody.innerHTML = "";
  (registros || []).forEach(function (r) {
    var fila = document.createElement("tr");
    fila.innerHTML =
      "<td>" + escapeHtml(r.ACTOR) + "</td>" +
      "<td>" + escapeHtml(r.TIPO_ACTOR) + "</td>" +
      "<td>" + escapeHtml(r.AREA) + "</td>" +
      "<td><button type='button' class='btn btn-secundario' data-borrar-actor='" + r.ID_REGISTRO + "'>Quitar</button></td>";
    tbody.appendChild(fila);
  });
  // Cantidad de actores ya agregados por el grupo (spec del usuario: "al
  // dar click en agregar actor, deben aparecer la cantidad de actores que
  // se han seleccionado").
  var contador = document.getElementById("contadorActoresCE");
  if (contador) {
    var total = (registros || []).length;
    contador.classList.toggle("oculto", total === 0);
    contador.textContent = total === 0 ? "" :
      "✅ " + total + (total === 1 ? " actor/entidad agregado hasta ahora." : " actores/entidades agregados hasta ahora.");
  }
}

/** Botones de selección de IE para la Sesión de preparación — con ✅ si esa IE ya envió sus aportes. */
/**
 * Cada IE del grupo con su estado de preparación explícito — a la que ya
 * envió no se le vuelve a pedir nada (su trabajo ya cumplido no se ve
 * afectado); a la que falta se le marca con un texto claro, no solo la
 * ausencia de una marca.
 */
function renderListaIEPreparacion(instituciones, idsEnviados) {
  var contenedor = document.getElementById("listaIEPreparacion");
  if (!contenedor) return;
  contenedor.innerHTML = "";
  (instituciones || []).forEach(function (ie) {
    var yaEnviado = !!(idsEnviados && idsEnviados[ie.idIE]);
    var boton = document.createElement("button");
    boton.type = "button";
    boton.className = "btn-ie-preparacion" + (yaEnviado ? " ie-preparacion-completa" : " ie-preparacion-pendiente");
    boton.setAttribute("data-preparar-ie", ie.idIE);
    boton.innerHTML =
      "<span class='nombre-ie-preparacion'>" + escapeHtml(ie.institucion) + "</span>" +
      (yaEnviado
        ? "<span class='estado-ie-preparacion estado-ie-completa'>✅ Ya envió sus aportes</span>"
        : "<span class='estado-ie-preparacion estado-ie-pendiente'>⚠️ La IE no ha diligenciado la preparación de la socialización</span>");
    contenedor.appendChild(boton);
  });
}

/**
 * Sección de invitados al final de Selección de IE: los aportes YA
 * ENVIADOS por estudiantes/egresados y adultos responsables invitados —
 * agrupados por ROL (Estudiantes, Egresados(as), Acudientes), NO por IE
 * (spec del usuario: "los aportes se deben reunir como Estudiantes,
 * egresados y acudientes y no como aportes de (IE)" — corrige un lote
 * anterior que agrupaba primero por institución). Cada aporte individual
 * conserva la institución de la que viene, mostrada como una etiqueta
 * antes de sus respuestas — quien responde puede representar más de una
 * (ver _textoInicialPreparacionInvitado_, JS.html, que ya las menciona
 * todas dentro del propio texto de la respuesta), pero solo queda
 * archivado bajo UNA institución en la base de datos. Solo aparece aquí,
 * en el listado agregado del grupo — ya no se repite dentro de la
 * pantalla de cada IE individual.
 */
function renderAportesInvitadosGrupo(datos) {
  var contenedor = document.getElementById("listaInvitadosPreparacion");
  if (!contenedor) return;

  var estudiantesActuales = [];
  var egresados = [];
  var acudientes = [];
  (datos || []).forEach(function (ie) {
    ie.aportes.forEach(function (aporte) {
      var conIE = { institucion: ie.institucion, secciones: aporte.secciones };
      if (aporte.tipoInvitado === "ESTUDIANTE") {
        (aporte.rolEstudiante === "GRADUADO" ? egresados : estudiantesActuales).push(conIE);
      } else {
        acudientes.push(conIE);
      }
    });
  });

  var html =
    _seccionAportesInvitadosPorRol_("🧑‍🎓 Estudiantes", estudiantesActuales) +
    _seccionAportesInvitadosPorRol_("🎓 Egresados(as)", egresados) +
    _seccionAportesInvitadosPorRol_("👨‍👩‍👧 Acudientes", acudientes);
  contenedor.innerHTML = html || "<p class='ayuda'>Todavía no hay aportes de invitados en ninguna institución de este grupo.</p>";
}

/** Un <details> con todos los aportes de un rol (estudiantes, egresados(as) o acudientes), cada uno con su IE. */
function _seccionAportesInvitadosPorRol_(titulo, lista) {
  if (!lista.length) return "";
  var html = "<details class='socializacion-ie'>";
  html += "<summary>" + escapeHtml(titulo) + " (" + lista.length + ")</summary>";
  lista.forEach(function (aporte) {
    html += "<p class='ayuda' style='font-weight:600;margin-top:12px;'>" + escapeHtml(aporte.institucion) + "</p>";
    aporte.secciones.forEach(function (seccion) {
      html += "<div class='socializacion-seccion'>";
      html += "<h4>" + escapeHtml(seccion.titulo) + "</h4>";
      html += "<p>" + escapeHtml(seccion.texto) + "</p>";
      html += "</div>";
    });
  });
  html += "</details>";
  return html;
}

/** Las 6 preguntas editables de la Sesión de preparación de una IE (título + ayuda + textarea). */
/**
 * Cada pregunta de preparación en un <details> colapsable (spec: "amplía
 * más las casillas de texto y haz que sean colapsables cuando se les dé
 * click para no llenar tanta pantalla") — colapsadas por defecto, con un
 * indicador en el título de si ya tienen contenido, y una casilla de
 * texto más grande al desplegarlas.
 */
function renderPreguntasPreparacionIE(preguntas, respuestas) {
  var contenedor = document.getElementById("preguntasPreparacionIE");
  if (!contenedor) return;
  var html = "";
  (preguntas || []).forEach(function (p) {
    var texto = (respuestas && respuestas[p.clave]) || "";
    var tieneContenido = String(texto).trim() !== "";
    html += "<details class='pregunta-preparacion-colapsable'>";
    html += "<summary>" + escapeHtml(p.titulo) + (tieneContenido ? " <span class='marca-con-contenido'>✓</span>" : "") + "</summary>";
    html += "<p class='ayuda'>" + escapeHtml(p.ayuda) + "</p>";
    html += "<textarea id='campo_prep_" + p.clave + "' data-prep-pregunta='" + p.clave + "' rows='10'>" +
      escapeHtml(texto) + "</textarea>";
    html += "</details>";
  });
  contenedor.innerHTML = html;
  agregarAccionesTextareas_(contenedor);
}

/**
 * Igual que renderPreguntasPreparacionIE, para el acceso de invitado (sin
 * código) — ids/atributos propios. `textoInicial` (spec del usuario) se
 * usa SOLO cuando todavía no hay ninguna respuesta guardada — nunca pisa
 * un borrador ya escrito — para que cada respuesta inicie mencionando la(s)
 * institución(es) representadas; no cuenta como "ya respondida" (el
 * indicador ✓ sigue mirando la respuesta real, no el texto inicial).
 */
function renderPreguntasInvitado(preguntas, respuestas, textoInicial, mostrarBotonModoTexto) {
  var contenedor = document.getElementById("preguntasPreparacionInvitado");
  if (!contenedor) return;
  var html = "";
  (preguntas || []).forEach(function (p) {
    var guardado = (respuestas && respuestas[p.clave]) || "";
    var texto = guardado || (textoInicial || "");
    var tieneContenido = String(guardado).trim() !== "";
    html += "<details class='pregunta-preparacion-colapsable'>";
    html += "<summary>" + escapeHtml(p.titulo) + (tieneContenido ? " <span class='marca-con-contenido'>✓</span>" : "") + "</summary>";
    html += "<p class='ayuda'>" + escapeHtml(p.ayuda) + "</p>";
    // Botón general/específico repetido en CADA pregunta (spec del
    // usuario: "debe aparecer en cada pregunta") — solo cuando el
    // invitado marcó más de una institución; con una sola, ambos
    // formatos son idénticos. El modo elegido es compartido entre las 6
    // preguntas (un solo estado, ver JS.html), así que los botones de
    // todas se ven siempre en el mismo estado activo/inactivo.
    if (mostrarBotonModoTexto) {
      html += "<div class='fila-modo-texto-inicial-invitado'>";
      html += "<p class='ayuda'>Como marcaron más de una institución, elijan cómo quieren empezar esta respuesta:</p>";
      html += "<div class='fila-botones'>";
      html += "<button type='button' class='btn btn-secundario btn-modo-texto-inicial' data-modo-texto-btn='general'>📋 Responder de forma general</button>";
      html += "<button type='button' class='btn btn-secundario btn-modo-texto-inicial' data-modo-texto-btn='especifico'>🏫 Responder mencionando cada institución</button>";
      html += "</div></div>";
    }
    html += "<textarea id='campo_inv_prep_" + p.clave + "' data-inv-prep-pregunta='" + p.clave + "' rows='10'>" +
      escapeHtml(texto) + "</textarea>";
    html += "</details>";
  });
  contenedor.innerHTML = html;
  agregarAccionesTextareas_(contenedor);
}

/**
 * Respuestas de referencia del grupo (Informe de Síntesis), mostradas en
 * Sesión 1 (spec del usuario: "las respuestas arrastradas desde los
 * informes grupales deben aparecer en la sesión Construcción colectiva
 * del grupo, las respuestas deben ser las del informe del grupo, no las
 * de cada IE"): un <details> colapsado por cada pregunta, con lo que el
 * grupo ya respondió según su Informe de Síntesis (SintesisGrupos.gs),
 * con botón de pantalla completa.
 */
function renderSocializacionPreparacion(datos) {
  var contenedor = document.getElementById("listaSocializacionPreparacion");
  if (!contenedor) return;
  if (!datos || !datos.length) {
    contenedor.innerHTML = "<p class='ayuda'>Este grupo todavía no tiene un Informe de Síntesis con respuestas de referencia.</p>";
    return;
  }
  var html = "<div class='fila-botones'><button type='button' class='btn btn-secundario' data-alternar-socializacion>Expandir todas</button></div>";
  datos.forEach(function (p) {
    if (!p.texto) return;
    html += "<details class='socializacion-ie'>";
    html += "<summary>" + escapeHtml(p.etiqueta) + "</summary>";
    html += "<div class='socializacion-seccion'>";
    html += "<p>" + escapeHtml(p.texto) + "</p>";
    html += "<button type='button' class='btn-recurso' data-ver-completo='" + escapeHtml(p.codigo) + "'>🔍 Pantalla completa</button>";
    html += "</div>";
    html += "</details>";
  });
  contenedor.innerHTML = html;
}

/**
 * Checklist de la Sesión de socialización (Documento Orientador FEM2026,
 * item 10) — una fila por IE del grupo, con su estado ("✅ Socializó" o
 * pendiente) y un botón para iniciar el temporizador de 10 minutos (spec
 * del usuario: solo el temporizador, sin respuestas en esta pantalla —
 * ver Sesion1.gs para las respuestas reales del grupo). Los clics se
 * manejan con un único listener delegado en JS.html (mismo patrón que el
 * resto de la app para listas que se repintan).
 */
function renderChecklistSocializacionIE(datos) {
  var contenedor = document.getElementById("listaSocializacionIE");
  if (!contenedor) return;
  if (!datos || !datos.length) {
    contenedor.innerHTML = "<p class='ayuda'>Este grupo no tiene instituciones educativas registradas.</p>";
    return;
  }
  var html = "";
  datos.forEach(function (ie) {
    html += "<div class='fila-socializacion-ie" + (ie.socializo ? " socializo-hecho" : "") + "'>";
    html += "<span class='nombre-ie-socializacion'>" + (ie.socializo ? "✅ " : "⬜ ") + escapeHtml(ie.institucion) + "</span>";
    html += "<div class='fila-botones'>";
    if (!ie.socializo) {
      html += "<button type='button' class='btn btn-secundario' data-iniciar-socializacion-ie='" + escapeHtml(ie.idIE) + "'>▶ Iniciar temporizador</button>";
    }
    html += "</div></div>";
  });
  contenedor.innerHTML = html;
}

/**
 * Listado de Instituciones Educativas para que cada una se elija a sí misma
 * en el Conversatorio (spec del usuario: "omite que se generen codigos por
 * IE y mas bien que ellos mismos escojan la IE de un listado") — clic
 * delegado en JS.html vía data-elegir-institucion-conversatorio.
 */
function renderListaInstitucionesAccesoConversatorio(instituciones) {
  var contenedor = document.getElementById("listaInstitucionesAccesoConversatorio");
  if (!contenedor) return;
  if (!instituciones || !instituciones.length) {
    contenedor.innerHTML = "<p class='ayuda'>Todavía no se importaron las instituciones del Conversatorio (ejecutar importarDatosConversatorio).</p>";
    return;
  }
  var html = "";
  instituciones.forEach(function (institucion) {
    html += "<div class='fila-socializacion-ie'>";
    html += "<span class='nombre-ie-socializacion'>" + escapeHtml(institucion) + "</span>";
    html += "<div class='fila-botones'>";
    html += "<button type='button' class='btn btn-primario' data-elegir-institucion-conversatorio='" + escapeHtml(institucion) + "'>Elegir</button>";
    html += "</div></div>";
  });
  contenedor.innerHTML = html;
}

/**
 * Lista de grupos del Encuentro para el acceso SIN código (spec del
 * usuario: "Avoid code setting instead group schools to the following
 * group owner") — cada grupo se identifica por el/los funcionario(s)
 * responsable(s), mismo patrón que renderListaInstitucionesAccesoConversatorio.
 */
function renderListaGruposAcceso(grupos) {
  var contenedor = document.getElementById("listaGruposAcceso");
  if (!contenedor) return;
  if (!grupos || !grupos.length) {
    contenedor.innerHTML = "<p class='ayuda'>No hay grupos disponibles todavía.</p>";
    return;
  }
  var html = "";
  grupos.forEach(function (g) {
    html += "<div class='fila-socializacion-ie'>";
    html += "<span class='nombre-ie-socializacion'>" + escapeHtml(g.grupo) +
      (g.duenos && g.duenos.length ? " — " + escapeHtml(g.duenos.join(", ")) : "") + "</span>";
    html += "<div class='fila-botones'>";
    html += "<button type='button' class='btn btn-primario' data-elegir-grupo-acceso='" + escapeHtml(g.idGrupo) + "'>Ingresar</button>";
    html += "</div></div>";
  });
  contenedor.innerHTML = html;
}

/**
 * Grupos técnicos a los que pertenece la institución (spec del usuario:
 * "mostrar unicamente las IE que pertenecen a cada grupo" — es decir,
 * filtrar a solo los grupos de la propia institución, no los 7 completos)
 * — clic delegado en JS.html vía data-elegir-grupo-conversatorio.
 */
function renderGruposCaracterizacionConversatorio(grupos, grupoElegido) {
  var contenedor = document.getElementById("listaGruposCaracterizacionConversatorio");
  if (!contenedor) return;
  var propios = (grupos || []).filter(function (g) { return g.perteneceIE; });
  if (!propios.length) {
    contenedor.innerHTML = "<p class='ayuda'>Su institución no aparece en ningún grupo de articulación técnica (ejecutar importarDatosConversatorio si esto no es correcto).</p>";
    return;
  }
  var html = "";
  propios.forEach(function (g) {
    var clases = "tarjeta-seccion tarjeta-grupo-ie" + (g.idGrupo === grupoElegido ? " tarjeta-grupo-elegida" : "");
    html += "<div class='" + clases + "' style='text-align:left;margin-bottom:12px;'>";
    html += "<h3>" + escapeHtml(g.idGrupo) + " — " + escapeHtml(g.nombreGrupo) + "</h3>";
    html += "<p class='ayuda'><strong>" + escapeHtml(String(g.numIE)) + " IE</strong> · " + escapeHtml(g.tecnicasIncluidas) + "</p>";
    html += "<p class='ayuda'>" + escapeHtml(g.criterioAgrupacion) + "</p>";
    html += "<div class='fila-botones'><button type='button' class='btn btn-primario' data-elegir-grupo-conversatorio='" +
      escapeHtml(g.idGrupo) + "'>" + (g.idGrupo === grupoElegido ? "✅ Continuar con este grupo" : "Elegir este grupo") + "</button></div>";
    html += "</div>";
  });
  contenedor.innerHTML = html;
}

// Mismo catálogo de roles que el select de "Rol en la institución" del
// responsable (Index.html) — se reutiliza para cada acompañante (spec del
// usuario: "Acompañantes (opcional) debe permitir también agregar más
// acompañantes y seleccionar rol").
var OPCIONES_ROL_ACOMPANANTE_CONVERSATORIO_ = [
  "Rector(a)", "Coordinador(a) académico(a)", "Docente", "Enlace/articulador(a) SENA",
  "Orientador(a)", "Funcionario Secretaría de Educación Municipal", "Otro"
];

/**
 * Filas dinámicas de acompañantes (nombre + rol) en la pantalla de
 * responsable del Conversatorio. Cada llamada reemplaza por completo el
 * contenido del contenedor — JS.html es quien lee los valores actuales del
 * DOM antes de agregar/quitar una fila, para no perder lo ya escrito.
 */
function renderAcompanantesResponsableConversatorio(filas) {
  var contenedor = document.getElementById("listaAcompanantesResponsableConversatorio");
  if (!contenedor) return;
  var html = "";
  (filas || []).forEach(function (a, idx) {
    var opciones = "<option value=''>— Rol —</option>" + OPCIONES_ROL_ACOMPANANTE_CONVERSATORIO_.map(function (r) {
      return "<option value='" + escapeHtml(r) + "'" + (a.rol === r ? " selected" : "") + ">" + escapeHtml(r) + "</option>";
    }).join("");
    html += "<div class='fila-acompanante-conversatorio'>" +
      "<input type='text' class='campo-nombre-acompanante-conversatorio' placeholder='Nombre del acompañante' value='" + escapeHtml(a.nombre || "") + "'>" +
      "<select class='campo-rol-acompanante-conversatorio'>" + opciones + "</select>" +
      "<button type='button' class='btn-enlace' data-quitar-acompanante-conversatorio='" + idx + "'>✕ Quitar</button>" +
      "</div>";
  });
  contenedor.innerHTML = html;
}

/** Fila de solo-lectura ("Sin responder." si está vacío). */
function _filaLecturaConversatorio_(etiqueta, valor) {
  return "<p><strong>" + etiqueta + ":</strong> " + escapeHtml(valor || "Sin responder.") + "</p>";
}

/**
 * Fila de solo-lectura para una pregunta Sí/No — spec del usuario: "debe
 * aparecer aparte para seleccionar si o no, no debe aparecer dentro de la
 * casilla" — la respuesta se muestra como una insignia (Sí/No/Sin
 * responder), separada visualmente del texto de la pregunta, en vez de
 * texto plano pegado a continuación.
 */
function _filaPreguntaSiNoLecturaConversatorio_(etiqueta, valor) {
  var clase = valor === "Sí" ? "badge-si" : valor === "No" ? "badge-no" : "badge-sin-responder";
  return "<p class='fila-pregunta-si-no'><span>" + etiqueta + "</span> " +
    "<span class='" + clase + "'>" + escapeHtml(valor || "Sin responder") + "</span></p>";
}

/**
 * Técnicas SENA de la institución (Resolución Vs IE) con las 2 preguntas
 * de proyección 2027 debajo de cada una — spec del usuario: "poner todo
 * en solo lectura, y si hay necesidad de cambiar algo, dar click en el
 * lápiz, luego boton guardar". Cada tarjeta empieza en modo lectura
 * (.modo-lectura-tecnica visible, .modo-edicion-tecnica oculto); el lápiz
 * (data-editar-tecnica) y el botón Guardar (data-guardar-tecnica) los
 * alterna JS.html. `catalogoTecnicas` alimenta el checklist que aparece
 * si la pregunta 2 se responde "Sí" (data-toggle-detalle-nueva-articulacion,
 * cableado en JS.html vía evento "change" del select).
 */
function renderTecnicasResolucionConversatorio(tecnicas, catalogoTecnicas) {
  var contenedor = document.getElementById("listaTecnicasResolucionConversatorio");
  if (!contenedor) return;
  if (!tecnicas || !tecnicas.length) {
    contenedor.innerHTML = "<p class='ayuda'>No hay técnicas registradas todavía para esta institución en el documento de Resolución vs IE.</p>";
    return;
  }
  var html = "";
  tecnicas.forEach(function (t) {
    var idFila = escapeHtml(t.idFila);
    html += "<div class='tarjeta-seccion tarjeta-tecnica-conversatorio' style='text-align:left;margin-bottom:16px;' data-tarjeta-tecnica-conversatorio='" + idFila + "'>";

    // --- Modo lectura ---
    html += "<div class='modo-lectura-tecnica-conversatorio'>";
    html += "<div class='caja-datos-tecnica-conversatorio'>";
    html += _filaLecturaConversatorio_("Técnica / programa SENA", t.tecnicaSena);
    html += _filaLecturaConversatorio_("Programa aprobado por resolución", t.programaAprobado);
    html += _filaLecturaConversatorio_("Resolución o decreto", t.resolucionDecreto);
    html += "</div>";
    // Spec del usuario: las preguntas Sí/No van aparte, no dentro de la
    // misma casilla de los datos de la técnica.
    html += "<div class='caja-preguntas-tecnica-conversatorio'>";
    html += _filaPreguntaSiNoLecturaConversatorio_("¿Se aperturará esta articulación para grado 10° en el 2027?", t.preguntaApertura2027);
    html += _filaPreguntaSiNoLecturaConversatorio_("¿Se planea incluir una nueva articulación para el año 2027?", t.preguntaNuevaArticulacion2027);
    if (t.preguntaNuevaArticulacion2027 === "Sí" && t.nuevaArticulacionDetalle) {
      html += _filaLecturaConversatorio_("Detalle de la nueva articulación", t.nuevaArticulacionDetalle);
    }
    html += "</div>";
    // Spec del usuario: "Boton de es correcto pra informacion de tecnica o
    // deseamos editar esta información" — confirmar sin cambiar nada, o
    // abrir el modo edición.
    html += "<div class='fila-botones'>";
    if (t.confirmado) {
      html += "<span class='badge-tecnica-confirmada'>✅ Información confirmada</span>";
    } else {
      html += "<button type='button' class='btn btn-primario' data-confirmar-tecnica-conversatorio='" + idFila + "'>✅ Es correcta esta información</button>";
    }
    html += "<button type='button' class='btn btn-secundario' data-editar-tecnica-conversatorio='" + idFila + "'>✏️ Editar</button>";
    html += "</div>";
    html += "</div>";

    // --- Modo edición (oculto hasta hacer clic en el lápiz) ---
    html += "<div class='modo-edicion-tecnica-conversatorio oculto'>";
    html += "<div class='caja-datos-tecnica-conversatorio'>";
    html += "<label>Técnica / programa SENA</label>";
    html += "<input type='text' data-campo-edicion-tecnica='tecnicaSena' value='" + escapeHtml(t.tecnicaSena) + "'>";
    html += "<label>Programa aprobado por resolución</label>";
    html += "<input type='text' data-campo-edicion-tecnica='programaAprobado' value='" + escapeHtml(t.programaAprobado) + "'>";
    html += "<label>Resolución o decreto</label>";
    html += "<input type='text' data-campo-edicion-tecnica='resolucionDecreto' value='" + escapeHtml(t.resolucionDecreto) + "'>";
    html += "</div>";

    // Spec del usuario: las preguntas Sí/No van aparte, no dentro de la
    // misma casilla de los datos de la técnica.
    html += "<div class='caja-preguntas-tecnica-conversatorio'>";
    html += "<label>¿Se aperturará esta articulación para grado 10° en el 2027?</label>";
    html += "<select data-campo-edicion-tecnica='preguntaApertura2027'>";
    html += "<option value=''" + (t.preguntaApertura2027 ? "" : " selected") + ">— Sin responder —</option>";
    html += "<option value='Sí'" + (t.preguntaApertura2027 === "Sí" ? " selected" : "") + ">Sí</option>";
    html += "<option value='No'" + (t.preguntaApertura2027 === "No" ? " selected" : "") + ">No</option>";
    html += "</select>";

    html += "<label>¿Se planea incluir una nueva articulación para el año 2027?</label>";
    html += "<select data-campo-edicion-tecnica='preguntaNuevaArticulacion2027' data-toggle-detalle-nueva-articulacion='" + idFila + "'>";
    html += "<option value=''" + (t.preguntaNuevaArticulacion2027 ? "" : " selected") + ">— Sin responder —</option>";
    html += "<option value='Sí'" + (t.preguntaNuevaArticulacion2027 === "Sí" ? " selected" : "") + ">Sí</option>";
    html += "<option value='No'" + (t.preguntaNuevaArticulacion2027 === "No" ? " selected" : "") + ">No</option>";
    html += "</select>";

    // Spec del usuario: "Si selecciona si. Deplegar listado de tecnicas
    // actuales. y poner arriba casilla otro." — oculto por defecto salvo
    // que la pregunta ya esté en "Sí".
    html += "<div class='subform-nueva-articulacion-conversatorio" + (t.preguntaNuevaArticulacion2027 === "Sí" ? "" : " oculto") +
      "' data-subform-nueva-articulacion='" + idFila + "'>";
    html += "<label>Otro (técnica no listada)</label>";
    html += "<input type='text' data-otro-nueva-articulacion='" + idFila + "' placeholder='Escriba aquí si no está en la lista'>";
    html += "<label>Técnicas actuales</label>";
    html += "<div class='lista-catalogo-tecnicas-conversatorio'>";
    (catalogoTecnicas || []).forEach(function (tecnicaCatalogo, indice) {
      var idCheckbox = "catalogoTecnica_" + idFila + "_" + indice;
      html += "<label class='opcion-catalogo-tecnica'><input type='checkbox' id='" + idCheckbox + "' data-catalogo-tecnica='" + idFila + "' value='" + escapeHtml(tecnicaCatalogo) + "'> " + escapeHtml(tecnicaCatalogo) + "</label>";
    });
    html += "</div></div>";
    html += "</div>"; // cierra .caja-preguntas-tecnica-conversatorio

    html += "<div class='fila-botones'><button type='button' class='btn btn-primario' data-guardar-tecnica-conversatorio='" + idFila + "'>💾 Guardar</button></div>";
    html += "</div>";

    html += "</div>";
  });
  contenedor.innerHTML = html;
}

/**
 * Panel de administrador: estado de todas las instituciones del
 * Conversatorio, con botón para entrar a diligenciar/editar cada una
 * (clic delegado en JS.html vía data-entrar-institucion-superadmin).
 */
function renderListaInstitucionesPanelSuperadminConversatorio(instituciones) {
  var contenedor = document.getElementById("listaInstitucionesPanelSuperadminConversatorio");
  if (!contenedor) return;
  if (!instituciones || !instituciones.length) {
    contenedor.innerHTML = "<p class='ayuda'>Todavía no se importaron las instituciones del Conversatorio (ejecutar importarDatosConversatorio).</p>";
    return;
  }
  var html = "";
  instituciones.forEach(function (i) {
    var completado = i.estado === "COMPLETADO";
    html += "<div class='fila-socializacion-ie" + (completado ? " socializo-hecho" : "") + "'>";
    html += "<span class='nombre-ie-socializacion'>" + (completado ? "✅ " : "⬜ ") + escapeHtml(i.institucion) +
      (i.grupoElegido ? " <span class='ayuda'>(" + escapeHtml(i.grupoElegido) + ")</span>" : "") + "</span>";
    html += "<div class='fila-botones'>";
    html += "<button type='button' class='btn btn-secundario' data-entrar-institucion-superadmin='" + escapeHtml(i.institucion) + "'>Entrar</button>";
    html += "</div></div>";
  });
  contenedor.innerHTML = html;
}

function mostrarMensaje(idContenedor, texto, tipo) {
  var contenedor = document.getElementById(idContenedor);
  if (!contenedor) return;
  if (!texto) {
    contenedor.innerHTML = "";
    return;
  }
  contenedor.innerHTML = "<div class='mensaje " + (tipo || "info") + "'>" + escapeHtml(texto) + "</div>";
}
</script>
