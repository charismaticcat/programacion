<script>
/**
 * JS.html — Portal IE SABER 11 Neiva 2026
 * Mismo patrón que el Foro Comunal: wrapper único sobre google.script.run,
 * estado en localStorage para no repetir el token en cada visita, y
 * autoguardado por fila con debounce.
 */
var CLAVE_SESION_ADMIN_ = 'saber11_sesion_admin';
var estado = { nombreIE: '', tokenIE: '', tokenAdmin: '' };

function llamarServidor(nombreFn, args, exito, error) {
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.ok === false) { (error || function () {})(r); return; }
      exito(r && 'datos' in r ? r.datos : r);
    })
    .withFailureHandler(function (e) {
      (error || function () {})({ mensaje: 'Error de comunicación con el servidor. Intente de nuevo.' });
      console.error(nombreFn, e);
    })[nombreFn].apply(null, args || []);
}

function mostrarMensaje(id, texto, tipo) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = texto ? "<p class='mensaje " + (tipo || 'info') + "'>" + texto + '</p>' : '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ============================== DISTRIBUCIÓN ============================== */
function cargarDistribucion_() {
  llamarServidor('rpcListarInstituciones', [], function (lista) {
    var contenedor = document.getElementById('rejillaInstituciones');
    var html = '';
    (lista || []).forEach(function (ie) {
      var imgSrc = ie.logoBase64 ? 'data:' + (ie.logoMime || 'image/png') + ';base64,' + ie.logoBase64 : '';
      html += "<div class='tarjeta-ie' data-elegir-ie='" + escapeHtml(ie.nombreIE) + "'>" +
        (imgSrc ? "<img src='" + imgSrc + "' alt=''>" : "<div style='height:64px;'></div>") +
        "<div class='nombre-ie'>" + escapeHtml(ie.nombreIE) + '</div></div>';
    });
    contenedor.innerHTML = html || "<p class='mensaje error'>No se pudo cargar la lista de instituciones.</p>";
  }, function (e) {
    document.getElementById('rejillaInstituciones').innerHTML =
      "<p class='mensaje error'>" + escapeHtml(e.mensaje || 'Error al cargar instituciones.') + '</p>';
  });
}

/** Acceso automático (spec del usuario): clic en el logo entra directo, sin token ni correo. */
document.getElementById('rejillaInstituciones').addEventListener('click', function (evento) {
  var tarjeta = evento.target.closest('[data-elegir-ie]');
  if (!tarjeta) return;
  entrarPantallaIE_(tarjeta.getAttribute('data-elegir-ie'), '');
});

document.getElementById('enlaceSoyAdmin').addEventListener('click', function (evento) {
  evento.preventDefault();
  document.getElementById('bloqueTokenAdmin').classList.toggle('oculto');
});
document.getElementById('btnEntrarAdmin').addEventListener('click', function () {
  var token = document.getElementById('campoTokenAdmin').value.trim();
  llamarServidor('rpcValidarAccesoAdmin', [token], function () {
    try { localStorage.setItem(CLAVE_SESION_ADMIN_, token); } catch (e) {}
    entrarPantallaAdmin_(token);
  }, function (e) {
    mostrarMensaje('mensajeAccesoAdmin', e.mensaje || 'Token incorrecto.', 'error');
  });
});

/**
 * Tres vistas públicas (spec del usuario), accesibles antes de elegir
 * una IE y sin ningún token: resumen de envío de todas las IE, reporte
 * estadístico B1/B+ y listado de estudiantes B1/B+. Cada una se
 * recalcula en vivo al abrirla (nunca queda en caché) y, mientras
 * siguen abiertas, se refrescan solas cada 30 segundos (spec del
 * usuario: "actualiza reportes públicos cada vez que haya un
 * ingreso... guardado en la hoja original") para reflejar lo que vaya
 * entrando sin tener que recargar la página a mano.
 */
var TEMPORIZADOR_REFRESCO_PUBLICO_ = null;
function iniciarRefrescoPublico_(funcionCargar) {
  detenerRefrescoPublico_();
  TEMPORIZADOR_REFRESCO_PUBLICO_ = setInterval(funcionCargar, 30000);
}
function detenerRefrescoPublico_() {
  clearTimeout(TEMPORIZADOR_REFRESCO_PUBLICO_);
  TEMPORIZADOR_REFRESCO_PUBLICO_ = null;
}
function volverAPantallaDistribucionDesde_(idSeccion) {
  detenerRefrescoPublico_();
  document.getElementById(idSeccion).classList.add('oculto');
  document.getElementById('pantallaDistribucion').classList.remove('oculto');
}

document.getElementById('btnVerResumenGeneral').addEventListener('click', function () {
  document.getElementById('pantallaDistribucion').classList.add('oculto');
  document.getElementById('pantallaResumenGeneral').classList.remove('oculto');
  cargarResumenGeneralIE_();
  iniciarRefrescoPublico_(cargarResumenGeneralIE_);
});
document.getElementById('btnSalirResumenGeneral').addEventListener('click', function () {
  volverAPantallaDistribucionDesde_('pantallaResumenGeneral');
});
function cargarResumenGeneralIE_() {
  mostrarMensaje('mensajeResumenGeneral', 'Cargando… <span class="spinner"></span>', 'info');
  llamarServidor('rpcObtenerResumenEnvioTodasLasIE', [], function (r) {
    mostrarMensaje('mensajeResumenGeneral', '', '');
    document.getElementById('barraProgresoGeneralIE').innerHTML =
      "<div class='barra-progreso-general'><div class='relleno-barra-progreso' style='width:" + r.porcentaje + "%'></div></div>" +
      '<p>' + r.totalReportadas + ' de ' + r.totalIE + ' instituciones han reportado (' + r.porcentaje + '%).</p>';
    document.getElementById('cuerpoResumenGeneral').innerHTML = r.instituciones.map(function (ie) {
      // Reporte completo, sin nada que corregir (spec del usuario: "en los reportes
      // completos no poner ver correcciones, dejar en blanco").
      var observacionesHtml = ie.observaciones.length
        ? ie.observaciones.map(escapeHtml).join('<br>') +
          " <button type='button' class='btn-ver-correcciones-ie' data-ir-correcciones-ie=\"" + escapeHtml(ie.nombreIE) + "\">Ver correcciones aquí →</button>"
        : '';
      return '<tr><td>' + escapeHtml(ie.nombreIE) + '</td>' +
        "<td><span class='badge-color' style='background:" + ie.colorEstado + "'></span></td>" +
        '<td>' + (ie.docentes.length ? ie.docentes.map(escapeHtml).join(', ') : '—') + '</td>' +
        '<td>' + ie.totalEstudiantes + '</td>' +
        '<td>' + observacionesHtml + '</td></tr>';
    }).join('');
  }, function (e) {
    mostrarMensaje('mensajeResumenGeneral', e.mensaje || 'Error al cargar.', 'error');
  });
}
/**
 * "Ver correcciones aquí" (spec del usuario: "direccionar directamente
 * a donde se debe hacer el cambio") — entra de una vez a la pantalla de
 * esa institución, igual que al elegirla desde "Elija su institución
 * educativa" (el acceso de las IE es automático, sin token).
 */
document.getElementById('cuerpoResumenGeneral').addEventListener('click', function (evento) {
  var boton = evento.target.closest('[data-ir-correcciones-ie]');
  if (!boton) return;
  detenerRefrescoPublico_();
  document.getElementById('pantallaResumenGeneral').classList.add('oculto');
  entrarPantallaIE_(boton.getAttribute('data-ir-correcciones-ie'), '');
});

document.getElementById('btnVerReporteB1BMasPublico').addEventListener('click', function () {
  document.getElementById('pantallaDistribucion').classList.add('oculto');
  document.getElementById('pantallaReporteB1BMasPublico').classList.remove('oculto');
  cargarReporteB1BMasPublico_();
  iniciarRefrescoPublico_(cargarReporteB1BMasPublico_);
});
document.getElementById('btnSalirReporteB1BMasPublico').addEventListener('click', function () {
  volverAPantallaDistribucionDesde_('pantallaReporteB1BMasPublico');
});
function cargarReporteB1BMasPublico_() {
  mostrarMensaje('mensajeReporteB1BMasPublico', 'Cargando… <span class="spinner"></span>', 'info');
  llamarServidor('rpcObtenerReporteB1BMasPublico', [], function (r) {
    mostrarMensaje('mensajeReporteB1BMasPublico', '', '');
    document.getElementById('totalGeneralB1BMasPublico').textContent =
      'Total general: ' + r.totalB1BMas + ' estudiantes en B1/B+ de ' + r.totalEvaluados + ' evaluados (' + r.porcentajeGeneral + '%).';
    document.getElementById('listaInstitucionesB1BMasPublico').innerHTML = r.instituciones.map(function (ie) {
      var imgSrc = ie.logoBase64 ? 'data:' + (ie.logoMime || 'image/png') + ';base64,' + ie.logoBase64 : '';
      var filasCursos = ie.cursos.map(function (c) {
        return '<tr><td>' + escapeHtml(c.curso) + '</td><td>' + escapeHtml(c.jornada) + '</td><td>' + escapeHtml(c.tipo) + '</td><td>' + c.totalReportados + '</td><td>' + c.b1BMas + '</td><td>' + c.porcentaje + '%</td></tr>';
      }).join('');
      return "<div class='bloque-ie-b1bmas' data-nombre-ie=\"" + escapeHtml(ie.nombreIE) + '">' +
        "<div class='encabezado-ie-b1bmas'>" + (imgSrc ? "<img src='" + imgSrc + "' alt=''>" : '') +
        '<div><h3>' + escapeHtml(ie.nombreIE) + '</h3>' +
        '<p>' + ie.totalB1BMas + ' de ' + ie.totalEvaluados + ' evaluados en B1/B+ (' + ie.porcentaje + '%)</p></div>' +
        "<div class='acciones-ie-b1bmas'>" +
        "<button type='button' class='btn-icono-ie-b1bmas btn-ver-grande-ie' title='Ver en pantalla completa'>👁️</button>" +
        "<button type='button' class='btn-icono-ie-b1bmas btn-descargar-logo-ie' title='Descargar imagen de este resumen'>📥</button>" +
        '</div></div>' +
        (filasCursos ? "<table class='tabla-generica'><thead><tr><th>Curso</th><th>Jornada</th><th>Tipo</th><th>Reportados</th><th>B1/B+</th><th>%</th></tr></thead><tbody>" + filasCursos + '</tbody></table>' : '') +
        '</div>';
    }).join('') || "<p class='mensaje info'>Todavía no hay información reportada.</p>";
  }, function (e) {
    mostrarMensaje('mensajeReporteB1BMasPublico', e.mensaje || 'Error al cargar.', 'error');
  });
}
/** 👁️ ver en pantalla completa / 📥 descargar el logo — spec del usuario. */
document.getElementById('listaInstitucionesB1BMasPublico').addEventListener('click', function (evento) {
  var botonVer = evento.target.closest('.btn-ver-grande-ie');
  if (botonVer) {
    var bloque = botonVer.closest('.bloque-ie-b1bmas');
    document.getElementById('contenidoBloqueGrande').innerHTML = bloque.innerHTML;
    document.getElementById('overlayBloqueGrande').classList.remove('oculto');
    return;
  }
  var botonDescargar = evento.target.closest('.btn-descargar-logo-ie');
  if (botonDescargar) {
    descargarImagenBloqueIEB1BMas_(botonDescargar.closest('.bloque-ie-b1bmas'));
  }
});
/**
 * html2canvas no resuelve variables CSS (var(--azul-oscuro) etc. — las
 * usa casi todo el texto de CSS.html), así que el título, el texto y
 * los encabezados de la tabla salían invisibles y solo se veía el logo
 * (reporte del usuario). Copia el color ya resuelto por el navegador
 * (getComputedStyle, que sí entiende las variables) como estilo en
 * línea sobre el DUPLICADO que html2canvas captura (onclone) — nunca
 * toca el bloque real en pantalla.
 */
function resolverVariablesCssParaCaptura_(original, clon) {
  var estilo = window.getComputedStyle(original);
  clon.style.color = estilo.color;
  clon.style.backgroundColor = estilo.backgroundColor;
  for (var i = 0; i < original.children.length; i++) {
    if (clon.children[i]) resolverVariablesCssParaCaptura_(original.children[i], clon.children[i]);
  }
}
/**
 * Descarga una imagen de TODO el resumen de la IE (logo + texto + tabla
 * de cursos), no solo el logo (spec del usuario: "no se permite
 * descargar la imagen de todo el resumen de cada IE"), usando
 * html2canvas (cargado en Index.html) para capturar el bloque completo
 * tal cual se ve en pantalla.
 */
function descargarImagenBloqueIEB1BMas_(bloque) {
  if (typeof html2canvas !== 'function') {
    mostrarMensaje('mensajeReporteB1BMasPublico', 'No fue posible generar la imagen (librería no disponible).', 'error');
    return;
  }
  var acciones = bloque.querySelector('.acciones-ie-b1bmas');
  if (acciones) acciones.style.visibility = 'hidden';
  html2canvas(bloque, {
    backgroundColor: '#ffffff',
    scale: 2,
    onclone: function (documentoClonado, elementoClonado) {
      resolverVariablesCssParaCaptura_(bloque, elementoClonado);
    }
  }).then(function (canvas) {
    if (acciones) acciones.style.visibility = '';
    var enlace = document.createElement('a');
    enlace.href = canvas.toDataURL('image/png');
    enlace.download = bloque.getAttribute('data-nombre-ie') + ' - resumen B1-B+.png';
    document.body.appendChild(enlace);
    enlace.click();
    document.body.removeChild(enlace);
  }).catch(function () {
    if (acciones) acciones.style.visibility = '';
    mostrarMensaje('mensajeReporteB1BMasPublico', 'No fue posible generar la imagen.', 'error');
  });
}
function cerrarBloqueGrande_() {
  document.getElementById('overlayBloqueGrande').classList.add('oculto');
  document.getElementById('contenidoBloqueGrande').innerHTML = '';
}
document.getElementById('btnCerrarBloqueGrande').addEventListener('click', cerrarBloqueGrande_);
document.getElementById('overlayBloqueGrande').addEventListener('click', function (evento) {
  if (evento.target.id === 'overlayBloqueGrande') cerrarBloqueGrande_();
});
document.addEventListener('keydown', function (evento) {
  if (evento.key === 'Escape') cerrarBloqueGrande_();
});

document.getElementById('btnVerListadoB1BMas').addEventListener('click', function () {
  document.getElementById('pantallaDistribucion').classList.add('oculto');
  document.getElementById('pantallaListadoB1BMas').classList.remove('oculto');
  cargarListadoB1BMasPublico_();
  iniciarRefrescoPublico_(cargarListadoB1BMasPublico_);
});
document.getElementById('btnSalirListadoB1BMas').addEventListener('click', function () {
  volverAPantallaDistribucionDesde_('pantallaListadoB1BMas');
});
function cargarListadoB1BMasPublico_() {
  mostrarMensaje('mensajeListadoB1BMas', 'Cargando… <span class="spinner"></span>', 'info');
  llamarServidor('rpcObtenerListadoEstudiantesB1BMasPublico', [], function (r) {
    document.getElementById('anioListadoB1BMas').textContent = r.anio;
    mostrarMensaje('mensajeListadoB1BMas', r.total + ' estudiante(s) en nivel B1 o B+.', 'info');
    document.getElementById('cuerpoListadoB1BMas').innerHTML = r.estudiantes.map(function (est, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(est.nombreIE) + '</td><td>' + escapeHtml(est.nombreEstudiante) + '</td>' +
        '<td>' + escapeHtml(est.curso) + '</td><td>' + escapeHtml(est.tipoGrupo) + '</td><td>' + escapeHtml(est.nivel) + '</td></tr>';
    }).join('') || "<tr><td colspan='6'>Sin estudiantes en B1/B+ todavía.</td></tr>";
  }, function (e) {
    mostrarMensaje('mensajeListadoB1BMas', e.mensaje || 'Error al cargar.', 'error');
  });
}

/* ============================== VISTA DE IE ============================== */
var TEXTO_LETRERO_GRAFICOS_CLIENTE_ =
  'Se generarán los gráficos de la IE {IE} de acuerdo a la información ingresada. Para generar el gráfico ' +
  'de cada IE es necesario tener toda la información completa. Una vez finalizada la información dar clic ' +
  'en el botón generar gráficos y revise al lado del cuadro donde ingresó la información la imagen.';

function entrarPantallaIE_(nombreIE, token, comoAdmin) {
  estado.nombreIE = nombreIE;
  estado.tokenIE = token;
  estado.entroDesdeAdmin = !!comoAdmin;
  document.getElementById('pantallaDistribucion').classList.add('oculto');
  document.getElementById('pantallaAdmin').classList.add('oculto');
  document.getElementById('pantallaIE').classList.remove('oculto');
  document.getElementById('tituloIE').textContent = nombreIE;
  document.getElementById('notaAdminViendoIE').classList.toggle('oculto', !comoAdmin);
  document.getElementById('btnSalirIE').textContent = comoAdmin ? 'Volver al panel de administrador' : 'Salir';
  document.getElementById('letreroGraficosIE').textContent =
    '📊 ' + TEXTO_LETRERO_GRAFICOS_CLIENTE_.replace('{IE}', nombreIE.replace(/^\s*(I\.?\s*E\.?|IE)\s+/i, ''));
  cambiarPestanaIE_('misDatos');
  cargarDatosIE_();
}

/** Admin: entra a la vista de una IE sin salir del panel ni pedir su token — spec del usuario. */
function entrarIEDesdeAdmin_(nombreIE) {
  entrarPantallaIE_(nombreIE, estado.tokenAdmin, true);
}

/**
 * Volver a la pantalla de selección de IE (spec del usuario: "no debe
 * quedar en blanco") — en vez de location.reload() (puede quedar en
 * blanco dentro del iframe sandbox de Apps Script), se muestra de nuevo
 * la pantalla de distribución directamente, igual que al entrar.
 */
function volverASeleccionIE_() {
  estado.nombreIE = '';
  estado.tokenIE = '';
  cancelarGuardadosPendientesIE_();
  document.getElementById('pantallaIE').classList.add('oculto');
  document.getElementById('pantallaAdmin').classList.add('oculto');
  document.getElementById('pantallaDistribucion').classList.remove('oculto');
  // Feedback inmediato (spec del usuario: "redireccionar inmediatamente"):
  // no esperar a que llegue la respuesta del servidor para mostrar que la
  // pantalla ya cambió, y limpiar cualquier mensaje/galería que haya
  // quedado de la IE anterior.
  document.getElementById('rejillaInstituciones').innerHTML = "<p class='mensaje info'>Cargando instituciones… <span class='spinner'></span></p>";
  mostrarMensaje('mensajeAccesoIE', '', '');
  mostrarMensaje('mensajeDatosIE', '', '');
  mostrarMensaje('mensajeAccionesIE', '', '');
  mostrarMensaje('mensajeGraficosIE', '', '');
  mostrarMensaje('mensajeCompletitudGraficos', '', '');
  document.getElementById('galeriaGraficosIE').innerHTML = '';
  cargarDistribucion_();
}
/**
 * Cancela cualquier autoguardado todavía pendiente (debounce de 1200ms)
 * al salir de una IE — spec del usuario ("corregir errores de flujo"):
 * sin esto, un guardado pendiente de la IE anterior podía disparase ya
 * con otra IE cargada (estado.nombreIE cambiado) y escribir datos de la
 * IE vieja en la hoja de la IE nueva si se entraba a otra en menos de
 * 1.2 segundos.
 */
function cancelarGuardadosPendientesIE_() {
  Object.keys(temporizadorGuardadoFilaIE_).forEach(function (fila) {
    clearTimeout(temporizadorGuardadoFilaIE_[fila]);
  });
  temporizadorGuardadoFilaIE_ = {};
}
document.getElementById('btnSalirIE').addEventListener('click', function () {
  if (estado.entroDesdeAdmin) {
    estado.entroDesdeAdmin = false;
    document.getElementById('pantallaIE').classList.add('oculto');
    document.getElementById('pantallaAdmin').classList.remove('oculto');
    return;
  }
  volverASeleccionIE_();
});

document.querySelectorAll('[data-pestana-ie]').forEach(function (p) {
  p.addEventListener('click', function () { cambiarPestanaIE_(p.getAttribute('data-pestana-ie')); });
});
function cambiarPestanaIE_(nombre) {
  document.querySelectorAll('[data-pestana-ie]').forEach(function (p) {
    p.classList.toggle('activa', p.getAttribute('data-pestana-ie') === nombre);
  });
  ['misDatos', 'reporteDiario'].forEach(function (v) {
    document.getElementById('vista' + v.charAt(0).toUpperCase() + v.slice(1)).classList.toggle('oculto', v !== nombre);
  });
  if (nombre === 'reporteDiario') cargarResumenEnvioIE_();
}

/**
 * Resumen en vivo de la propia IE (spec del usuario) — estado con color,
 * cursos reportados (nombre, tipo, cantidad de estudiantes), docentes
 * que han reportado y observaciones.
 */
function cargarResumenEnvioIE_() {
  document.getElementById('tituloResumenEnvioIE').textContent = 'Resumen de Envío IE ' + estado.nombreIE;
  var contenedor = document.getElementById('contenedorResumenEnvioIE');
  contenedor.innerHTML = "<p class='mensaje info'>Cargando… <span class='spinner'></span></p>";
  llamarServidor('rpcObtenerResumenEnvioIE', [estado.nombreIE, estado.tokenIE], function (r) {
    var textoEstado = r.colorEstado === '#34A853' ? 'Completo' :
      r.colorEstado === '#F9AB00' ? 'Con observaciones' :
      r.colorEstado === '#EA4335' ? 'No enviado' : 'Sin evaluar todavía';
    var html = "<p><span class='badge-color' style='background:" + r.colorEstado + "'></span> <strong>Estado:</strong> " +
      escapeHtml(textoEstado) + '</p>';
    html += '<p><strong>Cursos reportados:</strong> ' + r.totalCursos + '</p>';
    if (r.cursos.length) {
      html += "<div class='tabla-desplazable'><table class='tabla-generica'><thead><tr>" +
        '<th>Curso</th><th>Tipo</th><th>Estudiantes</th></tr></thead><tbody>';
      r.cursos.forEach(function (c) {
        html += '<tr><td>' + escapeHtml(c.nombreCurso) + '</td><td>' + escapeHtml(c.tipo) + '</td><td>' + c.cantidadEstudiantes + '</td></tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += "<p class='mensaje info'>Todavía no hay cursos reportados.</p>";
    }
    html += '<p><strong>Docentes que han reportado:</strong> ' +
      (r.docentes.length ? r.docentes.map(escapeHtml).join(', ') : 'Ninguno todavía.') + '</p>';
    html += '<p><strong>Observaciones:</strong><br>' +
      (r.observaciones.length ? r.observaciones.map(escapeHtml).join('<br>') : 'Sin observaciones.') + '</p>';
    contenedor.innerHTML = html;
  }, function (e) {
    contenedor.innerHTML = "<p class='mensaje error'>" + escapeHtml(e.mensaje || 'Error al cargar.') + '</p>';
  });
}

function cargarDatosIE_() {
  cancelarGuardadosPendientesIE_();
  mostrarMensaje('mensajeDatosIE', 'Cargando estudiantes… <span class="spinner"></span>', 'info');
  llamarServidor('rpcObtenerDatosIE', [estado.nombreIE, estado.tokenIE], function (datos) {
    document.getElementById('badgeColorIE').style.background = datos.colorEstado;
    mostrarMensaje('mensajeDatosIE', '', '');
    estado.opcionesColumnasIE = datos.opciones || {};
    pintarTablaIE_(datos.filas);
    actualizarCompletitudGraficos_();
  }, function (e) {
    mostrarMensaje('mensajeDatosIE', e.mensaje || 'Error al cargar los datos.', 'error');
  });
}

/**
 * Aviso pasivo, sin necesidad de dar clic en "Generar gráficos" (spec del
 * usuario): si ya está completo o qué falta, para que el docente sepa de
 * una vez si puede generar o le falta completar algo.
 */
function actualizarCompletitudGraficos_() {
  llamarServidor('rpcVerificarCompletitudIE', [estado.nombreIE, estado.tokenIE], function (r) {
    if (r.completo) {
      mostrarMensaje('mensajeCompletitudGraficos', '✅ Información completa — ya puede generar los gráficos.', 'exito');
    } else {
      mostrarMensaje('mensajeCompletitudGraficos',
        '⚠️ Gráficos disponibles solo cuando la información esté completa. Falta:<br>' + (r.faltantes || []).map(escapeHtml).join('<br>'), 'info');
    }
  }, function (e) {
    if (e.faltantes) {
      mostrarMensaje('mensajeCompletitudGraficos',

/**

/**
 * Docentes y estudiantes se pintan en DOS contenedores separados (spec
 * del usuario: "dejar en limpio la sección de estudiantes") — la caja de
 * cada docente (nombre, correo, cursos que reporta) ya no va intercalada
 * entre las filas de sus estudiantes; vive aparte en #listaDocentesIE,
 * identificada por un índice de grupo (data-grupo-docente-indice) que
 * comparten sus filas de estudiante correspondientes en #cuerpoTablaIE.
 */
function pintarTablaIE_(filas) {
  var cuerpo = document.getElementById('cuerpoTablaIE');
  var listaDocentes = document.getElementById('listaDocentesIE');

  // 1) Agrupa por docente consecutivo.
  var gruposCrudos = [];
  filas.forEach(function (f) {
    var clave = texto_(f.docente).toUpperCase();
    var ultimo = gruposCrudos[gruposCrudos.length - 1];
    if (!ultimo || ultimo.clave !== clave) {
      gruposCrudos.push({ clave: clave, docente: f.docente, correoRegistro: f.correoRegistro, filas: [f] });
    } else {
      ultimo.filas.push(f);
    }
  });

  /**
   * 2) Un hueco en blanco a mitad de la hoja (filas sin docente entre
   * dos docentes con nombre) no merece su propia casilla vacía — spec
   * del usuario: "dejar un solo espacio para agregar docente luego del
   * último docente que aparezca registrado". Esas filas se absorben en
   * el grupo anterior (siguen siendo estudiantes editables, solo que ya
   * no tienen una casilla de docente propia); el único grupo en blanco
   * que queda visible es el último — el que sirve para agregar el
   * siguiente docente.
   */
  var gruposSinHuecos = [];
  gruposCrudos.forEach(function (g, i) {
    var esUltimo = i === gruposCrudos.length - 1;
    if (!g.clave && gruposSinHuecos.length && !esUltimo) {
      gruposSinHuecos[gruposSinHuecos.length - 1].filas = gruposSinHuecos[gruposSinHuecos.length - 1].filas.concat(g.filas);
    } else {
      gruposSinHuecos.push(g);
    }
  });
  if (!gruposSinHuecos.length) gruposSinHuecos.push({ clave: '', docente: '', correoRegistro: '', filas: [] }); // todavía sin estudiantes: un grupo en blanco para empezar

  /**
   * 3) Nunca debe quedar duplicado el nombre de un docente en dos
   * casillas distintas (spec del usuario) — aunque sus filas no sean
   * consecutivas en la hoja (p. ej. datos cargados en bloques
   * separados), todas sus filas se combinan en UNA sola casilla. El
   * orden de aparición en la tabla de estudiantes (indicePorFila) se
   * conserva tal cual viene de la hoja; solo cambia a qué casilla de
   * docente apunta cada fila.
   */
  var indicePorNombre = {};
  var grupos = [];
  var indicePorFila = {};
  gruposSinHuecos.forEach(function (g) {
    var indiceGrupo;
    if (g.clave && indicePorNombre.hasOwnProperty(g.clave)) {
      indiceGrupo = indicePorNombre[g.clave];
      grupos[indiceGrupo].filas = grupos[indiceGrupo].filas.concat(g.filas);
    } else {
      indiceGrupo = grupos.length;
      if (g.clave) indicePorNombre[g.clave] = indiceGrupo;
      grupos.push(g);
    }
    g.filas.forEach(function (f) { indicePorFila[f.fila] = indiceGrupo; });
  });

  var htmlDocentes = grupos.map(function (g, indiceGrupo) {
    return filaGrupoDocenteHtml_(indiceGrupo, g.docente, g.correoRegistro, cursosDeGrupo_(g.filas));
  }).join('');
  // La tabla de estudiantes respeta el orden original de la hoja (filas), no el orden de los grupos.
  var htmlEstudiantes = filas.map(function (f) { return filaIEHtml_(f, indicePorFila[f.fila]); }).join('');

  cuerpo.innerHTML = htmlEstudiantes;
  listaDocentes.innerHTML = htmlDocentes;
  filasSeleccionadasIE_.clear();
  ultimaFilaClicIE_ = null;
  actualizarResaltadoSeleccionIE_();
  limpiarRangoCeldasIE_();
  renumerarFilasIE_();
  actualizarResaltadoFaltantesIE_();
  // Deshacer (spec del usuario): punto de partida para cada fila, y se
  // olvida cualquier historial de una carga anterior.
  ultimoEstadoFilaIE_ = {};
  pilaDeshacerIE_ = [];
  filas.forEach(function (f) { ultimoEstadoFilaIE_[f.fila] = f; });
}
/** Cursos reales (1101-1109) que ya tienen estudiantes en este grupo — para preseleccionar "Cursos que reporta". */
function cursosDeGrupo_(filasDelGrupo) {
  var vistos = {};
  var cursos = [];
  filasDelGrupo.forEach(function (f) {
    var c = texto_(f.curso).toUpperCase();
    if (c && OPCIONES_CURSO_DOCENTE_.indexOf(c) >= 0 && !vistos[c]) { vistos[c] = true; cursos.push(c); }
  });
  return cursos;
}
function texto_(v) { return v == null ? '' : String(v).trim(); }
/** Numera visualmente los estudiantes desde 1 (spec del usuario), sin tocar data-fila-ie (la fila real de la hoja). */
function renumerarFilasIE_() {
  document.querySelectorAll('[data-fila-ie]').forEach(function (tr, i) {
    var span = tr.querySelector('.numero-visible-ie');

/**
 * Completitud por columna (spec del usuario): si a esta IE le falta
 * algún dato en una columna (jornada, género, curso, tipo/núm. de
 * documento, puntaje), el título de esa columna se pone rojo vivo y las
 * celdas vacías en pálido. Se recalcula después de pintar la tabla y
 * después de cada guardado/deshacer, para que se vea al instante cuando
 * ya se completó un dato.
 */
var CAMPOS_COMPLETITUD_IE_ = ['nombre', 'jornada', 'genero', 'curso', 'tipoDoc', 'numDoc', 'puntaje'];
function actualizarResaltadoFaltantesIE_() {
  var filas = document.querySelectorAll('[data-fila-ie]');
  CAMPOS_COMPLETITUD_IE_.forEach(function (campo) {
    var faltaAlguna = false;
    filas.forEach(function (tr) {
      var control = tr.querySelector('[data-campo-ie="' + campo + '"]');
      if (!control) return;
      var td = control.closest('td');
      var vacio = !texto_(control.value);
      td.classList.toggle('celda-faltante-ie', vacio);
      if (vacio) faltaAlguna = true;
    });
    var encabezado = document.querySelector('[data-campo-encabezado-ie="' + campo + '"]');
    if (encabezado) {
      encabezado.classList.toggle('encabezado-faltante-ie', faltaAlguna);
      // √ verde (spec del usuario: "lo que esté completo se pone un √ al lado del título") — solo si ya hay estudiantes.
      encabezado.classList.toggle('encabezado-completo-ie', !faltaAlguna && filas.length > 0);
    }
  });
}

/**
 * "Guardar este docente" (spec del usuario): traslada el docente y cada
 * curso de "Cursos que reporta" a "Estudiantes reportados", agregando
 * tantas filas en blanco como la cantidad indicada para cada curso —
 * cada fila nueva ya trae el docente, el curso y la jornada puestos,
 * para que solo falte completar los datos propios de cada estudiante.
 */
function guardarDocenteConCursosIE_(caja) {

  var correoRegistro = texto_(caja.querySelector('[data-campo-grupo-ie="correoRegistro"]').value);

  caja.querySelectorAll('.fila-curso-docente').forEach(function (fila) {

    var cantidad = Math.floor(Number(fila.querySelector('.input-cantidad-curso-docente').value)) || 0;
    if (curso && cantidad > 0) entradas.push({ curso: curso, jornada: jornada, cantidad: cantidad });
  });
  if (!entradas.length) {
    mostrarMensaje('mensajeDatosIE', 'Indique al menos un curso con la cantidad de estudiantes a agregar.', 'error');

 * por grupo (encabezado de grupo, [data-campo-grupo-ie]), no por fila.

var ORDEN_CAMPOS_IE_ = ['nombre', 'jornada', 'genero', 'curso', 'tipoDoc', 'numDoc', 'puntaje', 'intensificacion', 'sena', 'academico'];

var temporizadorGuardadoFilaIE_ = {};

function recolectarFilaIE_(tr) {
  var datos = {};
  tr.querySelectorAll('[data-campo-ie]').forEach(function (campo) {
    datos[campo.getAttribute('data-campo-ie')] = campo.value;
  });
  return datos;
}
/**
 * Pone en la fila lo que el servidor ya corrigió al guardar (nivel según
 * puntaje, un solo "SI" entre intensificación/SENA/académico, mayúsculas,
 * puntaje acotado a 0-100) — spec del usuario: "todos los criterios de
 * Si/no, puntaje modifica nivel". Nunca pisa el campo que el docente
 * tiene enfocado en este momento, para no perder lo que está escribiendo.
 */
function aplicarRegistroEnFila_(tr, registro) {
  var activo = document.activeElement;
  tr.querySelectorAll('[data-campo-ie]').forEach(function (campo) {
    if (campo === activo) return;
    var nombreCampo = campo.getAttribute('data-campo-ie');
    if (!(nombreCampo in registro)) return;
    var valor = registro[nombreCampo];
    campo.value = valor == null ? '' : valor;
  });
  tr.querySelector('.celda-nivel-ie').textContent = registro.nivel;
}
function guardarFilaIE_(tr) {
  var fila = Number(tr.getAttribute('data-fila-ie'));
  var estadoAntesDeEsteCambio = ultimoEstadoFilaIE_[fila];
  llamarServidor('rpcGuardarFilaIE', [estado.nombreIE, estado.tokenIE, fila, recolectarFilaIE_(tr)], function (r) {
    if (estadoAntesDeEsteCambio) pilaDeshacerIE_.push({ fila: fila, anterior: estadoAntesDeEsteCambio });
    ultimoEstadoFilaIE_[fila] = r.registro;
    aplicarRegistroEnFila_(tr, r.registro);
    sincronizarCabeceraGrupoIE_(tr);
    actualizarResaltadoFaltantesIE_();
    actualizarCompletitudGraficos_();
    mostrarConfirmacionGuardadoIE_();
  }, function (e) {
    mostrarMensaje('mensajeDatosIE', e.mensaje || 'No fue posible guardar.', 'error');
  });
}
/**
 * Refleja en la casilla de su docente (identificada por
 * data-grupo-docente-indice, ya no por estar al lado en el DOM) lo que
 * el servidor confirmó — por ejemplo, al deshacer un cambio que
 * afectaba el docente/correo. Nunca pisa la casilla si alguien la tiene
 * enfocada en este momento.
 */
function sincronizarCabeceraGrupoIE_(tr) {
  var indiceGrupo = tr.getAttribute('data-grupo-docente-indice');
  if (indiceGrupo == null) return;
  var cabecera = document.querySelector('.caja-grupo-docente[data-grupo-docente-indice="' + indiceGrupo + '"]');
  if (!cabecera) return;
  ['docente', 'correoRegistro'].forEach(function (campo) {
    var oculto = tr.querySelector('[data-campo-ie="' + campo + '"]');
    var visible = cabecera.querySelector('[data-campo-grupo-ie="' + campo + '"]');
    if (oculto && visible && document.activeElement !== visible) visible.value = oculto.value;
  });
}
/** Aviso breve de que el cambio ya quedó guardado en la hoja de cálculo real (spec del usuario). */
var temporizadorConfirmacionGuardadoIE_ = null;
function mostrarConfirmacionGuardadoIE_() {
  mostrarMensaje('mensajeDatosIE', '💾 Guardado en la hoja original.', 'exito');
  clearTimeout(temporizadorConfirmacionGuardadoIE_);
  temporizadorConfirmacionGuardadoIE_ = setTimeout(function () { mostrarMensaje('mensajeDatosIE', '', ''); }, 1800);
}
/**
 * Deshace el último cambio guardado (Ctrl/Cmd+Z) — vuelve esa fila al
 * estado que tenía antes y lo guarda de inmediato, para que quede
 * igual en la hoja de cálculo real.
 */
function deshacerUltimoCambioIE_() {
  if (!pilaDeshacerIE_.length) {
    mostrarMensaje('mensajeDatosIE', 'No hay cambios para deshacer.', 'info');
    return;
  }
  var cambio = pilaDeshacerIE_.pop();
  var tr = document.querySelector('[data-fila-ie="' + cambio.fila + '"]');
  if (!tr) return;
  aplicarRegistroEnFila_(tr, cambio.anterior);
  llamarServidor('rpcGuardarFilaIE', [estado.nombreIE, estado.tokenIE, cambio.fila, recolectarFilaIE_(tr)], function (r) {
    ultimoEstadoFilaIE_[cambio.fila] = r.registro;
    aplicarRegistroEnFila_(tr, r.registro);
    sincronizarCabeceraGrupoIE_(tr);
    actualizarResaltadoFaltantesIE_();
    actualizarCompletitudGraficos_();
    mostrarMensaje('mensajeDatosIE', '↩️ Último cambio deshecho (fila ' + cambio.fila + ').', 'exito');
  }, function (e) {
    mostrarMensaje('mensajeDatosIE', e.mensaje || 'No fue posible deshacer.', 'error');
  });
}
document.addEventListener('keydown', function (evento) {
  var esAtajoDeshacer = (evento.ctrlKey || evento.metaKey) && !evento.shiftKey && !evento.altKey &&
    (evento.key === 'z' || evento.key === 'Z');
  if (!esAtajoDeshacer) return;
  var pantallaIE = document.getElementById('pantallaIE');
  if (!pantallaIE || pantallaIE.classList.contains('oculto')) return;
  // Nunca dejar que el navegador interprete esto como "atrás" y saque del aplicativo.
  evento.preventDefault();
  deshacerUltimoCambioIE_();
});
document.getElementById('cuerpoTablaIE').addEventListener('change', function (evento) {
  var campo = evento.target.closest('[data-campo-ie]');
  if (!campo) return;
  var tr = campo.closest('[data-fila-ie]');
  if (campo.getAttribute('data-campo-ie') === 'intensificacion' ||
      campo.getAttribute('data-campo-ie') === 'sena' || campo.getAttribute('data-campo-ie') === 'academico') {
    if (campo.value === 'SI') {
      tr.querySelectorAll('select[data-campo-ie]').forEach(function (s) { if (s !== campo) s.value = 'NO'; });
    }

  guardarFilaIE_(tr);
});
/**
 * El docente/correo se edita una sola vez en la casilla del docente
 * (spec del usuario, ahora en su propia sección #listaDocentesIE) y se
 * propaga a todas las filas de estudiante de ese grupo — identificadas
 * por compartir el mismo data-grupo-docente-indice, no por estar al
 * lado en el DOM — guardando cada una en la hoja real.
 */
document.getElementById('listaDocentesIE').addEventListener('change', function (evento) {
  var campoGrupo = evento.target.closest('[data-campo-grupo-ie]');
  if (!campoGrupo) return;
  var nombreCampo = campoGrupo.getAttribute('data-campo-grupo-ie');
  var indiceGrupo = campoGrupo.closest('.caja-grupo-docente').getAttribute('data-grupo-docente-indice');
  var filasAfectadas = document.querySelectorAll('[data-fila-ie][data-grupo-docente-indice="' + indiceGrupo + '"]');
  filasAfectadas.forEach(function (tr) {
    var campoOculto = tr.querySelector('[data-campo-ie="' + nombreCampo + '"]');
    if (campoOculto) campoOculto.value = campoGrupo.value;
    guardarFilaIE_(tr);
  });
});
/**
 * Nivel según el puntaje obtenido (rangos ICFES, spec del usuario):
 * A-: 0-47, A1: 48-57, A2: 58-67, B1: 68-78, B+: 79-100. Vacío mientras
 * no haya un puntaje numérico — para que el docente vea el nivel al
 * instante, sin esperar el guardado (que de todos modos confirma el
 * valor real, calculado por la fórmula de la hoja).
 */
function nivelDePuntajeCliente_(valor) {
  var n = Number(valor);
  if (valor === '' || valor == null || !Number.isFinite(n)) return '';
  if (n <= 47) return 'A-';
  if (n <= 57) return 'A1';
  if (n <= 67) return 'A2';
  if (n <= 78) return 'B1';
  return 'B+';
}
document.getElementById('cuerpoTablaIE').addEventListener('input', function (evento) {
  var campo = evento.target.closest('input[data-campo-ie]');
  if (!campo) return;
  var tr = campo.closest('[data-fila-ie]');
  if (campo.getAttribute('data-campo-ie') === 'puntaje') {
    tr.querySelector('.celda-nivel-ie').textContent = nivelDePuntajeCliente_(campo.value);
  }
  clearTimeout(temporizadorGuardadoFilaIE_[tr.getAttribute('data-fila-ie')]);
  temporizadorGuardadoFilaIE_[tr.getAttribute('data-fila-ie')] = setTimeout(function () { guardarFilaIE_(tr); }, 1200);
});

function normalizarClienteIE_(v) {
  return (v || '').toString().trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function generoSegunNombreClienteIE_(nombreCompleto) {
  var clave = normalizarClienteIE_(nombreCompleto).split(' ')[0];
  if (!clave) return '';
  if (NOMBRES_FEMENINOS_IE_.indexOf(clave) >= 0) return 'FEMENINO';
  if (NOMBRES_MASCULINOS_IE_.indexOf(clave) >= 0) return 'MASCULINO';
  if (/A$/.test(clave)) return 'FEMENINO';
  if (/O$/.test(clave)) return 'MASCULINO';
  return '';
}
/** Pone la sugerencia en la casilla real de Género de esta fila (select de lista o input libre, según la hoja). */
function aplicarGeneroSugeridoIE_(campoGenero, sugerido) {
  if (campoGenero.tagName === 'SELECT') {
    var candidatas = sugerido === 'FEMENINO' ? ['FEMENINO', 'F', 'MUJER'] : ['MASCULINO', 'M', 'HOMBRE'];
    var opcion = Array.prototype.find.call(campoGenero.options, function (op) {
      return candidatas.indexOf(op.value.toUpperCase()) >= 0;
    });
    if (!opcion) return false;
    campoGenero.value = opcion.value;
  } else {
    campoGenero.value = sugerido;
  }
  return true;
}
document.getElementById('cuerpoTablaIE').addEventListener('focusout', function (evento) {
  var campoNombre = evento.target.closest('input[data-campo-ie="nombre"]');
  if (!campoNombre) return;
  var tr = campoNombre.closest('[data-fila-ie]');
  var campoGenero = tr.querySelector('[data-campo-ie="genero"]');
  if (!campoGenero || texto_(campoGenero.value)) return; // nunca pisa un género ya puesto, a mano o antes
  var sugerido = generoSegunNombreClienteIE_(campoNombre.value);
  if (!sugerido || !aplicarGeneroSugeridoIE_(campoGenero, sugerido)) return;
  clearTimeout(temporizadorGuardadoFilaIE_[tr.getAttribute('data-fila-ie')]);
  guardarFilaIE_(tr);
});

/**
 * Agrega una fila vacía al final y la devuelve — reusada por el botón,
 * Enter en la última fila y el pegado tipo Excel. Spec del usuario: no
 * repetir el nombre del docente en cada fila — por defecto hereda el
 * docente/correo de la última fila (así solo hay que escribirlo una
 * vez por grupo); "+ Agregar docente" llama con heredarDocente=false
 * para empezar un grupo nuevo con esos campos en blanco.
 */
/** Mayor índice de grupo de docente ya pintado, o -1 si todavía no hay ninguno. */
function ultimoIndiceGrupoDocenteIE_() {
  var cajas = document.querySelectorAll('.caja-grupo-docente');
  var maximo = -1;
  cajas.forEach(function (c) { maximo = Math.max(maximo, Number(c.getAttribute('data-grupo-docente-indice'))); });
  return maximo;
}
/**
 * Agrega una fila al final con los valores dados (el resto en blanco) —
 * base compartida por agregarFilaIE_ y por "Guardar este docente"
 * (guardarDocenteConCursosIE_), que ya trae docente/curso/jornada
 * puestos de antemano.
 */
function agregarFilaConValoresIE_(indiceGrupo, valores) {
  var filas = document.querySelectorAll('[data-fila-ie]');
  var ultima = filas.length ? Number(filas[filas.length - 1].getAttribute('data-fila-ie')) : 4;
  var datosIniciales = Object.assign({
    fila: ultima + 1, docente: '', correoRegistro: '', nombre: '', jornada: '', genero: '', curso: '', tipoDoc: '', numDoc: '',
    puntaje: '', nivel: '', intensificacion: 'NO', sena: 'NO', academico: 'NO'
  }, valores);
  var cuerpo = document.getElementById('cuerpoTablaIE');
  cuerpo.insertAdjacentHTML('beforeend', filaIEHtml_(datosIniciales, indiceGrupo));
  ultimoEstadoFilaIE_[datosIniciales.fila] = datosIniciales; // punto de partida para poder deshacer el primer cambio de esta fila
  renumerarFilasIE_();
  return cuerpo.lastElementChild;
}
function agregarFilaIE_(heredarDocente) {
  var listaDocentes = document.getElementById('listaDocentesIE');
  var indiceUltimo = ultimoIndiceGrupoDocenteIE_();
  var docentePrevio = '', correoPrevio = '', indiceGrupo;
  // "+ Agregar docente" (o todavía sin ningún grupo) necesita su propia
  // casilla de docente nueva; "+ Agregar estudiante" se une al último
  // grupo ya existente, heredando lo que ya tenga esa casilla.
  if (heredarDocente === false || indiceUltimo < 0) {
    indiceGrupo = indiceUltimo + 1;
    listaDocentes.insertAdjacentHTML('beforeend', filaGrupoDocenteHtml_(indiceGrupo, '', ''));
  } else {
    indiceGrupo = indiceUltimo;
    var cabeceraActual = listaDocentes.querySelector('.caja-grupo-docente[data-grupo-docente-indice="' + indiceGrupo + '"]');
    if (cabeceraActual) {
      var campoDocente = cabeceraActual.querySelector('[data-campo-grupo-ie="docente"]');
      var campoCorreo = cabeceraActual.querySelector('[data-campo-grupo-ie="correoRegistro"]');
      if (campoDocente) docentePrevio = campoDocente.value;
      if (campoCorreo) correoPrevio = campoCorreo.value;
    }
  }
  return agregarFilaConValoresIE_(indiceGrupo, { docente: docentePrevio, correoRegistro: correoPrevio });
}
document.getElementById('btnAgregarFilaIE').addEventListener('click', function () { agregarFilaIE_(true); });
document.getElementById('btnAgregarDocente').addEventListener('click', function () {
  agregarFilaIE_(false);
  var cajas = document.querySelectorAll('.caja-grupo-docente');
  var ultimaCaja = cajas[cajas.length - 1];
  var campoDocente = ultimaCaja && ultimaCaja.querySelector('[data-campo-grupo-ie="docente"]');
  if (campoDocente) campoDocente.focus();
});

/* --- Selección múltiple de filas, como en Excel (spec del usuario): clic en el número, Shift/Ctrl para varias --- */
var filasSeleccionadasIE_ = new Set();
var ultimaFilaClicIE_ = null;

function actualizarResaltadoSeleccionIE_() {
  document.querySelectorAll('[data-fila-ie]').forEach(function (tr) {
    tr.classList.toggle('fila-seleccionada', filasSeleccionadasIE_.has(Number(tr.getAttribute('data-fila-ie'))));
  });
  var hay = filasSeleccionadasIE_.size > 0;
  document.getElementById('btnDuplicarSeleccionadas').disabled = !hay;
  document.getElementById('btnEliminarSeleccionadas').disabled = !hay;
}
document.getElementById('cuerpoTablaIE').addEventListener('click', function (evento) {
  var celdaNumero = evento.target.closest('td:first-child');
  if (!celdaNumero) return;
  var tr = celdaNumero.closest('[data-fila-ie]');
  var fila = Number(tr.getAttribute('data-fila-ie'));
  if (evento.shiftKey && ultimaFilaClicIE_ != null) {
    var desde = Math.min(ultimaFilaClicIE_, fila), hasta = Math.max(ultimaFilaClicIE_, fila);
    document.querySelectorAll('[data-fila-ie]').forEach(function (f) {
      var n = Number(f.getAttribute('data-fila-ie'));
      if (n >= desde && n <= hasta) filasSeleccionadasIE_.add(n);
    });
  } else if (evento.ctrlKey || evento.metaKey) {
    if (filasSeleccionadasIE_.has(fila)) filasSeleccionadasIE_.delete(fila);
    else filasSeleccionadasIE_.add(fila);
    ultimaFilaClicIE_ = fila;
  } else {
    filasSeleccionadasIE_.clear();
    filasSeleccionadasIE_.add(fila);
    ultimaFilaClicIE_ = fila;
  }
  actualizarResaltadoSeleccionIE_();
});

/** Deja el valor de un campo como si nunca se hubiera escrito (NO para los Sí/No, vacío para el resto). */
function limpiarCampoIE_(campo) {
  var nombreCampo = campo.getAttribute('data-campo-ie');
  if (campo.tagName === 'SELECT') {
    campo.value = (nombreCampo === 'intensificacion' || nombreCampo === 'sena' || nombreCampo === 'academico') ? 'NO' : '';
  } else {
    campo.value = '';
  }
}
function eliminarFilasSeleccionadasIE_() {
  if (!filasSeleccionadasIE_.size) return;
  var filas = Array.from(filasSeleccionadasIE_).sort(function (a, b) { return a - b; });
  if (!confirm('¿Borrar la información de ' + filas.length + ' fila(s) seleccionada(s)? Esta acción no se puede deshacer.')) return;
  mostrarMensaje('mensajeDatosIE', 'Borrando ' + filas.length + ' fila(s)… <span class="spinner"></span>', 'info');
  filas.forEach(function (fila) {
    var tr = document.querySelector('[data-fila-ie="' + fila + '"]');
    if (!tr) return;
    tr.querySelectorAll('[data-campo-ie]').forEach(limpiarCampoIE_);
    guardarFilaIE_(tr); // guarda en segundo plano con lo que ya se leyó de la fila; sigue aunque ya se quite de la vista
    tr.remove(); // desaparece de la tabla al instante (spec del usuario: "no se están desapareciendo")
  });
  filasSeleccionadasIE_.clear();
  actualizarResaltadoSeleccionIE_();
  renumerarFilasIE_();
  actualizarResaltadoFaltantesIE_();
}
document.getElementById('btnEliminarSeleccionadas').addEventListener('click', eliminarFilasSeleccionadasIE_);
document.addEventListener('keydown', function (evento) {
  if (evento.key !== 'Delete' && evento.key !== 'Backspace') return;
  if (!filasSeleccionadasIE_.size) return;
  var activo = document.activeElement;
  if (activo && (activo.tagName === 'INPUT' || activo.tagName === 'SELECT' || activo.isContentEditable)) return;
  evento.preventDefault();
  eliminarFilasSeleccionadasIE_();
});

document.getElementById('btnDuplicarSeleccionadas').addEventListener('click', function () {
  if (!filasSeleccionadasIE_.size) return;
  var filas = Array.from(filasSeleccionadasIE_).sort(function (a, b) { return a - b; });
  mostrarMensaje('mensajeDatosIE', 'Duplicando ' + filas.length + ' fila(s)… <span class="spinner"></span>', 'info');
  var nuevasFilas = [];
  filas.forEach(function (fila) {
    var trOriginal = document.querySelector('[data-fila-ie="' + fila + '"]');
    if (!trOriginal) return;
    var datos = recolectarFilaIE_(trOriginal);
    var trNueva = agregarFilaIE_();
    Object.keys(datos).forEach(function (campo) {
      var el = trNueva.querySelector('[data-campo-ie="' + campo + '"]');
      if (el) el.value = datos[campo];
    });
    nuevasFilas.push(trNueva);
  });
  nuevasFilas.forEach(function (tr) { guardarFilaIE_(tr); });
  filasSeleccionadasIE_.clear();
  actualizarResaltadoSeleccionIE_();
});

/*
 * Selección de un rango de celdas de UNA sola columna (spec del
 * usuario: "permitir copiar usando Shift o arrastrando sobre una
 * casilla con cursor presionado para que copie únicamente lo que se
 * desea de la columna") — independiente de la selección de filas
 * completas (filasSeleccionadasIE_) de más arriba. Arrastrar con el
 * botón del mouse presionado, o Shift+clic, extiende el rango dentro
 * de la misma columna donde empezó; al copiar (Ctrl/Cmd+C) con más de
 * una celda en el rango, se copia solo esa columna, fila por fila.
 */
var arrastrandoCeldaIE_ = false;
var anclaCeldaIE_ = null; // { fila, campo }
var columnaRangoSeleccionadoIE_ = null;
var filasRangoSeleccionadoIE_ = new Set();

function limpiarRangoCeldasIE_() {
  document.querySelectorAll('.celda-rango-seleccionado-ie').forEach(function (td) {
    td.classList.remove('celda-rango-seleccionado-ie');
  });
  filasRangoSeleccionadoIE_.clear();
  columnaRangoSeleccionadoIE_ = null;
  anclaCeldaIE_ = null;
}
function resaltarRangoCeldasIE_() {
  document.querySelectorAll('.celda-rango-seleccionado-ie').forEach(function (td) {
    td.classList.remove('celda-rango-seleccionado-ie');
  });
  if (!columnaRangoSeleccionadoIE_) return;
  filasRangoSeleccionadoIE_.forEach(function (fila) {
    var control = document.querySelector('[data-fila-ie="' + fila + '"] [data-campo-ie="' + columnaRangoSeleccionadoIE_ + '"]');
    if (control) control.closest('td').classList.add('celda-rango-seleccionado-ie');
  });
}
function extenderRangoCeldaIE_(filaDesde, filaHasta) {
  var desde = Math.min(filaDesde, filaHasta), hasta = Math.max(filaDesde, filaHasta);
  filasRangoSeleccionadoIE_.clear();
  document.querySelectorAll('[data-fila-ie]').forEach(function (tr) {
    var n = Number(tr.getAttribute('data-fila-ie'));
    if (n >= desde && n <= hasta) filasRangoSeleccionadoIE_.add(n);
  });
  resaltarRangoCeldasIE_();
}
document.getElementById('cuerpoTablaIE').addEventListener('mousedown', function (evento) {
  var td = evento.target.closest('td');
  if (!td) return;
  var campo = td.querySelector('[data-campo-ie]');
  if (!campo) return;
  var nombreCampo = campo.getAttribute('data-campo-ie');
  var fila = Number(td.closest('[data-fila-ie]').getAttribute('data-fila-ie'));
  if (evento.shiftKey && anclaCeldaIE_ && anclaCeldaIE_.campo === nombreCampo) {
    columnaRangoSeleccionadoIE_ = nombreCampo;
    extenderRangoCeldaIE_(anclaCeldaIE_.fila, fila);
    evento.preventDefault();
    return;
  }
  anclaCeldaIE_ = { fila: fila, campo: nombreCampo };
  columnaRangoSeleccionadoIE_ = nombreCampo;
  arrastrandoCeldaIE_ = true;
  extenderRangoCeldaIE_(fila, fila);
});
document.getElementById('cuerpoTablaIE').addEventListener('mouseover', function (evento) {
  if (!arrastrandoCeldaIE_ || !anclaCeldaIE_) return;
  var td = evento.target.closest('td');
  if (!td) return;
  var campo = td.querySelector('[data-campo-ie="' + columnaRangoSeleccionadoIE_ + '"]');
  if (!campo) return;
  var fila = Number(td.closest('[data-fila-ie]').getAttribute('data-fila-ie'));
  extenderRangoCeldaIE_(anclaCeldaIE_.fila, fila);
});
document.addEventListener('mouseup', function () { arrastrandoCeldaIE_ = false; });

/* --- Comportamiento tipo Excel (spec del usuario): Enter, copiar, pegar --- */

// Al enfocar una celda de texto, seleccionar todo su contenido (como al hacer clic en una celda de Excel).
document.getElementById('cuerpoTablaIE').addEventListener('focusin', function (evento) {
  var campo = evento.target.closest('input[data-campo-ie]');
  if (campo) campo.select();
});

// Enter: confirma la celda (si es de texto, guarda de inmediato, sin esperar el debounce) y baja a la misma columna de la fila siguiente, agregando una fila si ya estaba en la última.
document.getElementById('cuerpoTablaIE').addEventListener('keydown', function (evento) {
  if (evento.key !== 'Enter') return;
  var campo = evento.target.closest('[data-campo-ie]');
  if (!campo) return;
  evento.preventDefault();
  var tr = campo.closest('[data-fila-ie]');
  if (campo.tagName === 'INPUT') {
    clearTimeout(temporizadorGuardadoFilaIE_[tr.getAttribute('data-fila-ie')]);
    guardarFilaIE_(tr);
  }
  var siguienteTr = tr.nextElementSibling || agregarFilaIE_();
  var siguienteCampo = siguienteTr.querySelector('[data-campo-ie="' + campo.getAttribute('data-campo-ie') + '"]');
  if (siguienteCampo) {
    siguienteCampo.focus();
    if (siguienteCampo.tagName === 'INPUT') siguienteCampo.select();
  }
});

// Copiar: con un rango de más de una celda seleccionado (arrastre o Shift+clic), se copia solo esa columna,
// fila por fila. Si no hay rango, un <select> (jornada, género, curso…) no tiene texto que seleccionar, así
// que se copia su valor a mano; en un <input> se deja el comportamiento nativo (copia el texto seleccionado).
document.getElementById('cuerpoTablaIE').addEventListener('copy', function (evento) {
  if (columnaRangoSeleccionadoIE_ && filasRangoSeleccionadoIE_.size > 1) {
    var filasOrdenadas = Array.from(filasRangoSeleccionadoIE_).sort(function (a, b) { return a - b; });
    var valores = filasOrdenadas.map(function (fila) {
      var control = document.querySelector('[data-fila-ie="' + fila + '"] [data-campo-ie="' + columnaRangoSeleccionadoIE_ + '"]');
      return control ? control.value : '';
    });
    evento.preventDefault();
    (evento.clipboardData || window.clipboardData).setData('text/plain', valores.join('\n'));
    return;
  }
  var campo = document.activeElement;
  if (campo && campo.tagName === 'SELECT' && campo.hasAttribute('data-campo-ie')) {
    evento.preventDefault();
    (evento.clipboardData || window.clipboardData).setData('text/plain', campo.value);
  }
});

// Pegar: si lo copiado traía varias celdas (filas separadas por salto de línea, columnas por tabulador — como al
// copiar un bloque de Excel/Sheets), se reparte celda por celda a partir de donde se pegó, creando filas si faltan.
document.getElementById('cuerpoTablaIE').addEventListener('paste', function (evento) {
  var campo = evento.target.closest('[data-campo-ie]');
  if (!campo) return;
  var texto = (evento.clipboardData || window.clipboardData).getData('text/plain');
  if (!texto || !/[\t\r\n]/.test(texto)) return; // una sola celda: deja el pegado normal del navegador
  evento.preventDefault();
  var filasTexto = texto.replace(/\r/g, '').split('\n');
  while (filasTexto.length > 1 && filasTexto[filasTexto.length - 1] === '') filasTexto.pop();
  var idxCampoInicial = ORDEN_CAMPOS_IE_.indexOf(campo.getAttribute('data-campo-ie'));
  if (idxCampoInicial < 0) return;
  var trActual = campo.closest('[data-fila-ie]');
  var filasAfectadas = [];
  filasTexto.forEach(function (lineaTexto, r) {
    if (r > 0) trActual = trActual.nextElementSibling || agregarFilaIE_();
    lineaTexto.split('\t').forEach(function (valor, c) {
      var nombreCampo = ORDEN_CAMPOS_IE_[idxCampoInicial + c];
      if (!nombreCampo) return;
      var destino = trActual.querySelector('[data-campo-ie="' + nombreCampo + '"]');
      if (!destino) return;
      valor = valor.trim();
      if (destino.tagName === 'SELECT') {
        var coincide = Array.prototype.some.call(destino.options, function (op) { return op.value.toUpperCase() === valor.toUpperCase(); });
        if (coincide) destino.value = valor.toUpperCase();
      } else {
        destino.value = valor;
      }
    });
    if (filasAfectadas.indexOf(trActual) < 0) filasAfectadas.push(trActual);
  });
  mostrarMensaje('mensajeDatosIE', 'Pegando ' + filasAfectadas.length + ' fila(s)… <span class="spinner"></span>', 'info');
  filasAfectadas.forEach(function (tr) { guardarFilaIE_(tr); });
});

/** Convierte un archivo en base64 (RPC) en una descarga real del navegador. */
function descargarArchivoBase64_(base64, mimeType, nombreArchivo) {
  var binario = atob(base64);
  var bytes = new Uint8Array(binario.length);
  for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
  var enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = nombreArchivo;
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}

/* ============================== ARRANQUE ============================== */
(function iniciar_() {
  var tokenAdminGuardado = null;
  try { tokenAdminGuardado = localStorage.getItem(CLAVE_SESION_ADMIN_); } catch (e) {}
  if (tokenAdminGuardado) {
    llamarServidor('rpcValidarAccesoAdmin', [tokenAdminGuardado], function () {
      entrarPantallaAdmin_(tokenAdminGuardado);
    }, function () {
      try { localStorage.removeItem(CLAVE_SESION_ADMIN_); } catch (e) {}
      cargarDistribucion_();
    });
  } else {
    cargarDistribucion_();
  }
})();
</script>
