<script>
(() => {
  'use strict';

  // ================================================================ Estado y utilidades
  const TOKEN_KEY = 'wp_admin_token';
  const A = { token: '', user: null, meta: null, view: 'dashboard', params: {}, challenge: '', client: null, clientTab: 'resumen' };

  const ss = {
    get: (k) => { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { window.sessionStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
    del: (k) => { try { window.sessionStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } }
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  /** Crea elementos de forma segura (nunca innerHTML con datos). */
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(k => {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'style') el.setAttribute('style', v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    const add = (c) => {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) c.forEach(add);
      else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    };
    children.forEach(add);
    return el;
  }
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };
  const money = (n) => { const v = Math.round(Number(n) || 0); return (v < 0 ? '-$ ' : '$ ') + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  const parseMoney = (v) => { const d = String(v == null ? '' : v).replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : 0; };
  const dt = (s) => (s ? String(s).replace('T', ' ').slice(0, 16) : '');
  const pretty = (v) => {
    if (!v) return '';
    if (A.meta && A.meta.etapas) { const st = A.meta.etapas.find(e => e.key === v); if (st) return st.label; }
    const s = String(v).replace(/_/g, ' ').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const stageBadge = (e) => h('span', { class: 'badge st-' + e, text: pretty(e) || 'Sin gestión' });
  const today = () => (A.meta ? A.meta.today : new Date().toISOString().slice(0, 10));
  const can = (perm) => !!(A.user && (A.user.permissions.indexOf('*') >= 0 || A.user.permissions.indexOf(perm) >= 0));
  const isSeller = () => A.user && A.user.rol === 'VENDEDOR';

  // ================================================================ Servidor
  function rpc(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) { reject({ code: 'NETWORK', message: 'Abra el panel desde la aplicación publicada.' }); return; }
      const runner = google.script.run
        .withSuccessHandler(res => (res && res.ok ? resolve(res.data) : reject((res && res.error) || { code: 'UNKNOWN', message: 'Respuesta inesperada.' })))
        .withFailureHandler(err => reject({ code: 'NETWORK', message: 'Sin conexión con el servidor.', raw: String((err && err.message) || err) }));
      runner[fn].apply(runner, args);
    });
  }
  /** Llamada autenticada: agrega el token y maneja sesión vencida. */
  function api(fn, ...args) {
    return rpc(fn, A.token, ...args).catch(err => {
      if (err.code === 'UNAUTHENTICATED') { ss.del(TOKEN_KEY); A.token = ''; showAuth('login'); toast(err.message, 'error'); }
      if (err.code === 'PASSWORD_CHANGE_REQUIRED') showAuth('password');
      throw err;
    });
  }
  function toast(msg, kind) {
    const el = h('div', { class: 'toast ' + (kind || ''), role: kind === 'error' ? 'alert' : 'status', text: msg });
    const box = $('#toasts');
    box.appendChild(el);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(() => el.remove(), kind === 'error' ? 7000 : 3500);
  }
  const fail = (err) => { if (err && err.code !== 'UNAUTHENTICATED') toast((err && err.message) || 'Error', 'error'); };
  function loading(el) { clear(el).appendChild(h('div', { class: 'loading' }, h('div', { class: 'spinner' }), 'Cargando…')); }
  function download(file) {
    const bin = atob(file.base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: file.mime }));
    const a = h('a', { href: url, download: file.name });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  // ================================================================ Modales
  /**
   * modal({title, body, actions:[{label, class, onClick: () => Promise|boolean}], wide})
   * onClick devuelve false para no cerrar, o una promesa (cierra al resolver).
   */
  function modal(opts) {
    const root = $('#modalRoot');
    const prevFocus = document.activeElement;
    let closed = false;
    const close = (fromAction) => {
      if (closed) return;
      closed = true;
      back.remove();
      if (!fromAction && opts.onClose) opts.onClose();
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    };
    const footer = h('footer', null);
    (opts.actions || [{ label: 'Cerrar', class: 'btn-ghost' }]).forEach(a => {
      const b = h('button', { type: 'button', class: 'btn ' + (a.class || 'btn-ghost'), text: a.label });
      b.addEventListener('click', () => {
        if (!a.onClick) { close(); return; }
        const r = a.onClick();
        if (r === false) return;
        if (r && typeof r.then === 'function') {
          $$('button', footer).forEach(x => { x.disabled = true; });
          r.then(res => { if (res !== false) close(true); }).catch(fail).then(() => $$('button', footer).forEach(x => { x.disabled = false; }));
        } else close(true);
      });
      footer.appendChild(b);
    });
    const dlg = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mTitle', style: opts.wide ? 'width:min(1000px,100%)' : null },
      h('header', null, h('h2', { id: 'mTitle', text: opts.title }), h('button', { type: 'button', class: 'xbtn', 'aria-label': 'Cerrar', text: '×', onclick: () => close(false) })),
      h('div', { class: 'mbody' }, opts.body), footer);
    const back = h('div', { class: 'modal-back' }, dlg);
    back.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(false); });
    root.appendChild(back);
    const first = $('input, select, textarea, button', dlg.querySelector('.mbody')) || $('button', footer);
    if (first) first.focus();
    return { close };
  }
  function confirmDialog(title, message, okLabel) {
    return new Promise(resolve => {
      modal({
        title, body: h('p', { text: message }), onClose: () => resolve(false),
        actions: [{ label: 'Cancelar', class: 'btn-ghost', onClick: () => { resolve(false); } },
          { label: okLabel || 'Confirmar', class: 'btn-primary', onClick: () => { resolve(true); } }]
      });
    });
  }

  // ================================================================ Formularios genéricos (desde el esquema)
  function enumOptions(col) {
    if (col.enumKey === 'cat:MUNICIPIOS') return A.meta.municipios;
    if (col.enumKey === 'ref:PRODUCTOS_WEB') return A.meta.productosWeb.map(p => ({ value: p.id, label: p.nombre }));
    return (A.meta.enums[col.enumKey] || []).filter(Boolean);
  }
  function inputFor(col, value, id) {
    const common = { id, name: col.name, 'data-col': col.name, 'data-type': col.type };
    switch (col.type) {
      case 't': return h('textarea', Object.assign({ rows: 3 }, common), value == null ? '' : String(value));
      case 'b': return h('label', { class: 'check-inline' }, h('input', Object.assign({ type: 'checkbox', checked: !!value }, common)), h('span', { text: 'Sí' }));
      case 'n': return h('input', Object.assign({ type: 'number', step: 'any', value: value === '' || value == null ? '' : String(value) }, common));
      case 'm': return h('input', Object.assign({ type: 'text', inputmode: 'numeric', value: value ? money(value) : '' }, common));
      case 'd': return h('input', Object.assign({ type: 'date', value: value || '' }, common));
      case 'dt': return h('input', Object.assign({ type: 'datetime-local', value: value ? String(value).slice(0, 16) : '' }, common));
      case 'e': {
        const sel = h('select', common, h('option', { value: '', text: '—' }));
        enumOptions(col).forEach(o => {
          const val = typeof o === 'object' ? o.value : o;
          const lab = typeof o === 'object' ? o.label : pretty(o);
          sel.appendChild(h('option', { value: val, text: lab }));
        });
        if (value && !$$('option', sel).some(o => o.value === value)) sel.appendChild(h('option', { value, text: pretty(value) }));
        sel.value = value || '';
        return sel;
      }
      default: {
        const inp = h('input', Object.assign({ type: 'text', value: value == null ? '' : String(value) }, common));
        if (col.name === 'TIPO_ESTABLECIMIENTO') inp.setAttribute('list', 'dl-tipos');
        return inp;
      }
    }
  }
  function readInputs(root) {
    const out = {};
    $$('[data-col]', root).forEach(el => {
      const t = el.getAttribute('data-type');
      const k = el.getAttribute('data-col');
      if (t === 'b') out[k] = el.checked;
      else if (t === 'm') out[k] = parseMoney(el.value);
      else if (t === 'n') out[k] = el.value === '' ? '' : Number(el.value);
      else out[k] = el.value;
    });
    return out;
  }
  function formGrid(table, record, onlyEditable) {
    const cols = A.meta.schema[table].filter(c => (onlyEditable ? c.editable : true));
    const grid = h('div', { class: 'form-grid' });
    cols.forEach((c, i) => {
      const id = 'fld-' + table + '-' + c.name + '-' + i;
      grid.appendChild(h('div', { class: 'field' + (c.type === 't' ? ' wide' : '') }, h('label', { for: id, text: c.label }), inputFor(c, record ? record[c.name] : '', id)));
    });
    return grid;
  }
  /** Modal de edición genérico para una tabla. */
  function recordModal(title, table, record, save) {
    const body = formGrid(table, record || {}, true);
    return modal({
      title, body,
      actions: [{ label: 'Cancelar' }, {
        label: 'Guardar', class: 'btn-primary',
        onClick: () => save(readInputs(body)).then(r => { toast('Guardado.', 'ok'); return r; })
      }]
    });
  }

  // ================================================================ Autenticación
  function showAuth(which) {
    ['Login', '2fa', 'Setup', 'Password', 'App'].forEach(v => { $('#view' + v).hidden = true; });
    const map = { login: 'Login', '2fa': '2fa', setup: 'Setup', password: 'Password', app: 'App' };
    $('#view' + map[which]).hidden = false;
    const first = $('#view' + map[which] + ' input');
    if (first && which !== 'app') first.focus();
  }
  const msg = (id, text, kind) => { const el = $(id); clear(el); if (text) el.appendChild(h('div', { class: 'notice ' + (kind || 'error'), text })); };

  function onLogin(e) {
    e.preventDefault();
    msg('#loginMsg', '');
    const btn = $('#loginBtn');
    btn.disabled = true;
    rpc('adm_login', $('#loginEmail').value.trim(), $('#loginPass').value, navigator.userAgent).then(r => {
      if (r.twoFactor) { A.challenge = r.challenge; showAuth('2fa'); return; }
      afterLogin(r);
    }).catch(err => msg('#loginMsg', err.message)).then(() => { btn.disabled = false; $('#loginPass').value = ''; });
  }
  function on2fa(e) {
    e.preventDefault();
    rpc('adm_verify2fa', A.challenge, $('#twoFaCode').value.trim(), navigator.userAgent).then(afterLogin).catch(err => msg('#twoFaMsg', err.message));
  }
  function afterLogin(r) {
    A.token = r.token;
    ss.set(TOKEN_KEY, r.token);
    if (r.user.mustChange) { showAuth('password'); return; }
    boot();
  }
  function onSetup(e) {
    e.preventDefault();
    if ($('#setupPass').value !== $('#setupPass2').value) { msg('#setupMsg', 'Las contraseñas no coinciden.'); return; }
    rpc('adm_createSuperAdmin', $('#setupCode').value.trim(), $('#setupEmail').value.trim(), $('#setupName').value.trim(), $('#setupPass').value)
      .then(r => { msg('#setupMsg', 'Listo. Inicie sesión con ' + r.email + '.', 'ok'); $('#loginEmail').value = r.email; setTimeout(() => showAuth('login'), 1200); })
      .catch(err => msg('#setupMsg', err.message));
  }
  function onPassword(e) {
    e.preventDefault();
    if ($('#pwdNew').value !== $('#pwdNew2').value) { msg('#pwdMsg', 'Las contraseñas no coinciden.'); return; }
    rpc('adm_changePassword', A.token, $('#pwdCurrent').value, $('#pwdNew').value)
      .then(() => { toast('Contraseña actualizada.', 'ok'); $$('#pwdForm input').forEach(i => { i.value = ''; }); boot(); })
      .catch(err => msg('#pwdMsg', err.message));
  }
  function logout() {
    rpc('adm_logout', A.token).catch(() => null);
    ss.del(TOKEN_KEY);
    A.token = '';
    A.user = null;
    showAuth('login');
  }

  function boot() {
    api('adm_me').then(r => {
      A.user = r.user;
      A.meta = r.meta;
      $('#meName').textContent = r.user.nombre;
      $('#meRole').textContent = pretty(r.user.rol) + ' · ' + r.user.email;
      let dl = $('#dl-tipos');
      if (!dl) { dl = h('datalist', { id: 'dl-tipos' }); document.body.appendChild(dl); }
      clear(dl);
      A.meta.tiposEstablecimiento.forEach(t => dl.appendChild(h('option', { value: t })));
      renderNav();
      showAuth('app');
      go(A.view || 'dashboard', A.params);
    }).catch(err => { if (err.code !== 'PASSWORD_CHANGE_REQUIRED') showAuth('login'); });
  }

  function init() {
    $('#loginForm').addEventListener('submit', onLogin);
    $('#twoFaForm').addEventListener('submit', on2fa);
    $('#setupForm').addEventListener('submit', onSetup);
    $('#pwdForm').addEventListener('submit', onPassword);
    $('#goSetup').addEventListener('click', () => showAuth('setup'));
    $('#backLogin').addEventListener('click', () => showAuth('login'));
    $('#btnLogout').addEventListener('click', logout);
    $('#btnChangePwd').addEventListener('click', () => showAuth('password'));
    $('#menuBtn').addEventListener('click', () => {
      const open = !$('#sidebar').classList.contains('open');
      $('#sidebar').classList.toggle('open', open);
      $('#menuBtn').setAttribute('aria-expanded', String(open));
    });
    A.token = ss.get(TOKEN_KEY) || '';
    if (A.token) { boot(); return; }
    rpc('adm_setupStatus').then(s => {
      if (!s.configured) { showAuth('login'); msg('#loginMsg', 'El sistema aún no está configurado: ejecute setup() en el editor de Apps Script.', 'warn'); return; }
      showAuth(s.hasSuperAdmin ? 'login' : 'setup');
    }).catch(() => showAuth('login'));
  }

  // ================================================================ Navegación
  const NAV = [
    { id: 'dashboard', label: 'Dashboard', perm: 'dashboard' },
    { sep: 'Clientes' },
    { id: 'solicitudes', label: 'Solicitudes recibidas', perm: 'solicitudes.read' },
    { id: 'clientes', label: 'Clientes', perm: 'clients.read' },
    { id: 'duplicados', label: 'Duplicados', perm: 'duplicates' },
    { id: 'archivos', label: 'Archivos por revisar', perm: 'files.read' },
    { sep: 'CRM' },
    { id: 'pipeline', label: 'Pipeline / Kanban', perm: 'crm.read' },
    { id: 'seguimientos', label: 'Seguimientos', perm: 'crm.read' },
    { id: 'actividades', label: 'Actividades', perm: 'crm.read' },
    { sep: 'Ventas' },
    { id: 'ventas', label: 'Propuestas y ventas', perm: 'sales.read' },
    { id: 'proyectos', label: 'Proyectos web', perm: 'sales.read' },
    { sep: 'Sistema' },
    { id: 'auditoria', label: 'Auditoría', perm: 'audit.read' },
    { id: 'usuarios', label: 'Usuarios', perm: 'users.manage' },
    { id: 'configuracion', label: 'Configuración', perm: 'config.write' }
  ];
  function renderNav() {
    const ul = clear($('#nav'));
    let pendingSep = null;
    NAV.forEach(n => {
      if (n.sep) { pendingSep = n.sep; return; }
      if (!can(n.perm)) return;
      if (pendingSep) { ul.appendChild(h('li', { class: 'nav-sep', text: pendingSep })); pendingSep = null; }
      ul.appendChild(h('li', null, h('button', { type: 'button', 'data-view': n.id, onclick: () => go(n.id) }, h('span', { text: n.label }))));
    });
  }
  function go(view, params) {
    A.view = view;
    A.params = params || {};
    $$('#nav button').forEach(b => b.setAttribute('aria-current', b.getAttribute('data-view') === (view === 'cliente' ? 'clientes' : view) ? 'page' : 'false'));
    $('#sidebar').classList.remove('open');
    clear($('#viewActions'));
    const body = $('#viewBody');
    loading(body);
    const fn = VIEWS[view] || VIEWS.dashboard;
    fn(body, A.params);
    $('#main').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
  const setTitle = (t) => { $('#viewTitle').textContent = t; };
  const addAction = (label, cls, onClick) => $('#viewActions').appendChild(h('button', { type: 'button', class: 'btn ' + cls, text: label, onclick: onClick }));

  // ================================================================ Tablas
  function table(columns, rows, opts) {
    opts = opts || {};
    columns = columns.filter(Boolean);
    if (!rows.length) return h('div', { class: 'empty', text: opts.empty || 'Sin resultados.' });
    const thead = h('thead', null, h('tr', null, columns.map(c => h('th', { class: c.num ? 'num' : null, scope: 'col', text: c.label }))));
    const tbody = h('tbody', null, rows.map(r => {
      const tr = h('tr', { class: opts.onRow ? 'click' : null }, columns.map(c => {
        const v = c.render ? c.render(r) : r[c.key];
        return h('td', { class: c.num ? 'num' : null }, v instanceof Node ? v : (v == null ? '' : String(v)));
      }));
      if (opts.onRow) {
        tr.tabIndex = 0;
        tr.addEventListener('click', (e) => { if (!e.target.closest('button, a, select, input')) opts.onRow(r); });
        tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === tr) opts.onRow(r); });
      }
      return tr;
    }));
    return h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' }, thead, tbody));
  }
  function selectField(label, id, options, value, withAll) {
    const sel = h('select', { id });
    if (withAll !== false) sel.appendChild(h('option', { value: '', text: withAll || 'Todos' }));
    options.forEach(o => sel.appendChild(h('option', { value: typeof o === 'object' ? o.value : o, text: typeof o === 'object' ? o.label : pretty(o) })));
    sel.value = value || '';
    return h('div', { class: 'field' }, h('label', { for: id, text: label }), sel);
  }

  // ================================================================ Gráficos (paleta validada, sin librerías)
  function hbars(items, fmt) {
    const max = Math.max(1, ...items.map(i => i.value));
    return h('div', { class: 'hbars' }, items.map(i => h('div', { class: 'hbar', title: i.label + ': ' + fmt(i.value) + (i.extra ? ' · ' + i.extra : '') },
      h('span', { class: 'lbl', text: i.label }),
      h('span', { class: 'track' }, h('span', { class: 'fill', style: 'display:block;width:' + Math.max(0.5, 100 * i.value / max) + '%' })),
      h('span', { class: 'val', text: fmt(i.value) + (i.extra ? ' · ' + i.extra : '') }))));
  }
  function vbarsPair(rows, s1, s2) {
    if (!rows.some(r => r.a || r.b)) return h('div', { class: 'empty', text: 'Aún no hay ' + s1.toLowerCase() + ' ni ' + s2.toLowerCase() + ' registrados en estos meses.' });
    const max = Math.max(1, ...rows.map(r => Math.max(r.a, r.b)));
    const wrap = h('div', { class: 'viz' });
    const tip = h('div', { class: 'viz-tip', hidden: true });
    const bars = h('div', { class: 'vbars', role: 'img', 'aria-label': s1 + ' y ' + s2 + ' por mes' }, rows.map(r => h('div', { class: 'vgroup' },
      [['a', 's1', s1], ['b', 's2', s2]].map(p => {
        const bar = h('div', { class: 'vbar ' + p[1], style: 'height:' + Math.max(1, 100 * r[p[0]] / max) + '%' });
        bar.addEventListener('mouseenter', () => {
          tip.textContent = r.label + ' · ' + p[2] + ': ' + money(r[p[0]]);
          tip.hidden = false;
          tip.style.left = (bar.offsetLeft + bar.offsetWidth / 2) + 'px';
          tip.style.top = bar.offsetTop + 'px';
        });
        bar.addEventListener('mouseleave', () => { tip.hidden = true; });
        return bar;
      }))));
    const legend = h('div', { class: 'legend' }, h('span', null, h('i', { style: 'background:var(--series-1)' }), s1), h('span', null, h('i', { style: 'background:var(--series-2)' }), s2));
    const labels = h('div', { class: 'vlabels' }, rows.map(r => h('span', { text: r.label })));
    const tbl = table([{ label: 'Mes', key: 'label' }, { label: s1, num: true, render: r => money(r.a) }, { label: s2, num: true, render: r => money(r.b) }], rows);
    tbl.hidden = true;
    const toggle = h('button', { type: 'button', class: 'btn-link small', text: 'Ver como tabla', onclick: () => { tbl.hidden = !tbl.hidden; toggle.textContent = tbl.hidden ? 'Ver como tabla' : 'Ocultar tabla'; } });
    wrap.appendChild(legend);
    wrap.appendChild(bars);
    wrap.appendChild(labels);
    wrap.appendChild(tip);
    return h('div', null, wrap, h('div', { style: 'margin-top:8px' }, toggle), tbl);
  }
  const tile = (label, value, sub, alert, onClick) => h('div', { class: 'tile' + (alert ? ' alert' : ''), role: onClick ? 'button' : null, tabindex: onClick ? '0' : null, style: onClick ? 'cursor:pointer' : null, onclick: onClick || null },
    h('div', { class: 'label', text: label }), h('div', { class: 'value', text: value }), sub ? h('div', { class: 'sub', text: sub }) : null);
  const monthLabel = (m) => { const names = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return names[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(2, 4); };

  // ================================================================ VISTAS
  const VIEWS = {};

  // ---------------------------------------------------------------- Dashboard
  VIEWS.dashboard = (body) => {
    setTitle('Dashboard');
    addAction('Actualizar', 'btn-ghost', () => go('dashboard'));
    api('adm_dashboard').then(d => {
      clear(body);
      body.appendChild(h('div', { class: 'tiles' },
        tile('Clientes', d.clientes.total.toLocaleString('es-CO'), d.clientes.sinEmail.toLocaleString('es-CO') + ' sin email', false, () => go('clientes')),
        tile('Formularios por revisar', String(d.solicitudes.porRevisar), d.solicitudes.recibidas30 + ' recibidos en 30 días', d.solicitudes.porRevisar > 0, () => go('solicitudes')),
        tile('Oportunidades abiertas', String(d.oportunidades.abiertas), money(d.oportunidades.valorPipeline) + ' en pipeline', false, () => go('pipeline')),

  function proposalModal(opps, prop, onDone) {
    const items = prop ? JSON.parse(JSON.stringify(prop.ITEMS_JSON || [])) : [{ descripcion: '', cantidad: 1, precioUnitario: 0, productoWebId: '' }];
    const oppSel = h('select', { id: 'propOpp', disabled: !!prop }, opps.map(o => h('option', { value: o.OPORTUNIDAD_ID, text: o.TITULO + ' (' + pretty(o.ETAPA) + ')' })));

    const val = h('input', { type: 'date', id: 'propVal', value: prop ? prop.VALIDEZ_HASTA : '' });
    const notas = h('textarea', { id: 'propNotas', rows: 3 }, prop ? prop.NOTAS : '');
    const list = h('div', null);
    const total = h('strong', null);
    const recalc = () => {
      const sub = items.reduce((s, it) => s + (Number(it.cantidad) || 1) * parseMoney(it.precioUnitario), 0);
      total.textContent = 'Subtotal ' + money(sub) + ' · Total ' + money(Math.max(0, sub - parseMoney(desc.value)));
    };
    const renderItems = () => {
      clear(list);
      items.forEach((it, i) => {
        const pw = h('select', { 'aria-label': 'Producto web ítem ' + (i + 1) }, h('option', { value: '', text: 'Producto…' }), A.meta.productosWeb.map(p => h('option', { value: p.id, text: p.nombre })));
        pw.value = it.productoWebId || '';
        const d = h('input', { type: 'text', 'aria-label': 'Descripción ítem ' + (i + 1), value: it.descripcion, placeholder: 'Descripción' });
        const q = h('input', { type: 'number', min: '1', 'aria-label': 'Cantidad ítem ' + (i + 1), value: String(it.cantidad || 1), style: 'max-width:80px' });
        const p = h('input', { type: 'text', inputmode: 'numeric', 'aria-label': 'Precio ítem ' + (i + 1), value: it.precioUnitario ? money(it.precioUnitario) : '', placeholder: 'Precio' });
        pw.addEventListener('change', () => {
          const prod = A.meta.productosWeb.find(x => x.id === pw.value);
          it.productoWebId = pw.value;
          if (prod) { it.descripcion = prod.nombre; d.value = prod.nombre; if (prod.precio) { it.precioUnitario = prod.precio; p.value = money(prod.precio); } }
          recalc();
        });
        d.addEventListener('input', () => { it.descripcion = d.value; });
        q.addEventListener('input', () => { it.cantidad = Number(q.value) || 1; recalc(); });
        p.addEventListener('input', () => { it.precioUnitario = parseMoney(p.value); recalc(); });
        list.appendChild(h('div', { class: 'filters', style: 'margin-bottom:6px' }, pw, d, q, p,
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Quitar', onclick: () => { items.splice(i, 1); renderItems(); } })));
      });
      recalc();
    };
    desc.addEventListener('input', recalc);
    renderItems();
    const body = h('div', null,
      h('div', { class: 'field' }, h('label', { for: 'propOpp', text: 'Oportunidad' }), oppSel),
      h('h3', { text: 'Ítems (precios editables)' }), list,

        h('div', { class: 'field wide' }, h('label', { for: 'propNotas', text: 'Notas' }), notas)),
      h('p', null, total));
    modal({
      title: prop ? 'Editar propuesta ' + prop.NUMERO : 'Nueva propuesta', body, wide: true,
      actions: [{ label: 'Cancelar' }, {
        label: 'Guardar', class: 'btn-primary', onClick: () => api('adm_saveProposal', {

  function kanban(r, reload) {
    const w = can('crm.write');
    const wrap = h('div', { class: 'kanban' });
    r.stages.forEach(st => {
      const items = r.items.filter(o => o.ETAPA === st.key);
      const col = h('section', { class: 'kcol', 'data-stage': st.key, 'aria-label': st.label },
        h('div', { class: 'kcol-head' }, h('strong', { text: st.label }), h('span', { class: 'muted', text: items.length + ' · ' + money(r.totals[st.key].value) })));
      const cards = h('div', { class: 'kcards' });
      items.forEach(o => {
        const overdue = o.PROXIMO_SEGUIMIENTO && o.PROXIMO_SEGUIMIENTO < today();
        const card = h('article', { class: 'kcard' + (overdue ? ' overdue' : ''), draggable: w ? 'true' : null, 'data-id': o.OPORTUNIDAD_ID, tabindex: '0' },
          h('div', { class: 'title', text: o.CLIENTE_NOMBRE }),
          h('div', { class: 'small', text: o.TITULO }),
          h('div', { class: 'meta' }, h('span', { text: money(o.VALOR_ESTIMADO) }), h('span', { text: o.DIAS_EN_ETAPA + ' d en etapa' })),
          o.PROXIMO_SEGUIMIENTO ? h('div', { class: 'meta' }, h('span', { text: (overdue ? '⚠ ' : '') + 'Seguimiento ' + o.PROXIMO_SEGUIMIENTO })) : null,
          w ? stageSelect(o, reload) : null);
        card.addEventListener('click', (e) => { if (!e.target.closest('select')) go('cliente', { id: o.CLIENTE_ID, tab: 'crm' }); });
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target === card) go('cliente', { id: o.CLIENTE_ID, tab: 'crm' }); });
        card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', o.OPORTUNIDAD_ID); card.classList.add('dragging'); });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        cards.appendChild(card);
      });
      if (w) {
        col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
        col.addEventListener('dragleave', () => col.classList.remove('over'));
        col.addEventListener('drop', (e) => {
          e.preventDefault();
          col.classList.remove('over');
          const id = e.dataTransfer.getData('text/plain');
          const o = r.items.find(x => x.OPORTUNIDAD_ID === id);
          if (!o || o.ETAPA === st.key) return;
          const openSale = () => api('adm_getClient', o.CLIENTE_ID).then(d => { A.client = d; return moveOpp(o, st.key); });
          (st.key === 'GANADO' ? openSale() : moveOpp(o, st.key)).then(x => { if (x) reload(); }).catch(err => { fail(err); reload(); });
        });
      }
      col.appendChild(cards);
      wrap.appendChild(col);
    });
    return wrap;
  }

  function compareDuplicate(dupId) {

      const rows = r.fields.filter(f => r.a[f] || r.b[f]).map(f => {

          h('span', null),
          h('strong', { text: labels[f] || f }),
          h('label', { class: 'check-inline' }, h('input', { type: 'radio', name: 'ch-' + f, value: 'A', checked: !!r.a[f] || !r.b[f], disabled: same }), h('span', { text: String(r.a[f] === true ? 'Sí' : r.a[f] === false ? 'No' : r.a[f] || '—') })),
          h('label', { class: 'check-inline' }, h('input', { type: 'radio', name: 'ch-' + f, value: 'B', checked: !r.a[f] && !!r.b[f], disabled: same }), h('span', { text: String(r.b[f] === true ? 'Sí' : r.b[f] === false ? 'No' : r.b[f] || '—') })));

        title: 'Comparar posibles duplicados', body, wide: true,
        actions: [{ label: 'Cerrar' },
          { label: 'No es el mismo', class: 'btn-ghost', onClick: () => api('adm_resolveDuplicate', dupId, 'NO_ES_EL_MISMO', {}).then(() => { toast('Marcado como distinto.', 'ok'); go(A.view === 'cliente' ? 'cliente' : 'duplicados', A.params); }) },

  // ---------------------------------------------------------------- Configuración
  VIEWS.configuracion = (body) => {
    setTitle('Configuración');
    Promise.all([api('adm_getConfig'), api('adm_systemInfo'), api('adm_importStatus')]).then(([cfg, info, imp]) => {
      clear(body);
      // Sistema
      body.appendChild(h('div', { class: 'card' }, h('h2', { text: 'Sistema' }),
        info.permisos.length ? h('div', { class: 'notice error', text: 'Atención: compartido públicamente: ' + info.permisos.join(', ') }) : h('div', { class: 'notice ok', text: 'Hojas y carpetas privadas (sin enlaces públicos).' }),
        kvList([['Formulario público', h('a', { href: info.publicUrl, target: '_blank', rel: 'noopener', text: info.publicUrl })], ['Base de datos', h('a', { href: info.dbUrl, target: '_blank', rel: 'noopener', text: 'Abrir CRM_WEB_DB' })], ['Auditoría', h('a', { href: info.auditUrl, target: '_blank', rel: 'noopener', text: 'Abrir CRM_WEB_AUDITORIA' })], ['Carpeta de clientes', h('a', { href: info.rootFolderUrl, target: '_blank', rel: 'noopener', text: 'Abrir CLIENTES_WEB' })]])));
      // Importación
      const impBox = h('div', { class: 'card' }, h('h2', { text: 'Importación de la base (CCH@E26-9316)' }),
        kvList([['Fuente configurada', imp.sourceConfigured ? 'Sí' : 'No (defina IMPORT_SOURCE_SPREADSHEET_ID en Propiedades del script)'], ['Estado', pretty(imp.state)], ['Progreso', imp.imported + ' / ' + imp.total], ['Mensaje', imp.lastMessage]]),
        h('div', { class: 'actions', style: 'margin-top:10px' },
          h('button', { type: 'button', class: 'btn btn-ghost', text: 'Actualizar estado', onclick: () => go('configuracion') }),
          h('button', { type: 'button', class: 'btn btn-primary', disabled: !imp.sourceConfigured || imp.state === 'EN_CURSO', text: imp.state === 'COMPLETADA' ? 'Volver a importar (solo agrega faltantes)' : 'Iniciar importación', onclick: () => confirmDialog('Importar base', 'Se importarán los registros que falten. Puede tardar varios minutos y continúa en segundo plano.', 'Importar').then(ok => { if (ok) { toast('Importando…'); api('adm_importStart').then(s => { toast(s.lastMessage, 'ok'); go('configuracion'); }).catch(fail); } }) })));
      body.appendChild(impBox);
      // Ajustes
      const setBox = h('div', { class: 'card' }, h('h2', { text: 'Ajustes' }));
      Object.keys(cfg.settings).forEach(k => {
        const s = cfg.settings[k];
        const id = 'set-' + k;
        const input = s.type === 'b' ? h('select', { id }, h('option', { value: 'true', text: 'Sí' }), h('option', { value: 'false', text: 'No' })) : h('input', { type: 'text', id, value: String(s.value) });
        if (s.type === 'b') input.value = s.value ? 'true' : 'false';
        setBox.appendChild(h('div', { class: 'filters' }, h('div', { class: 'field q', style: 'max-width:none;flex:1' }, h('label', { for: id, text: s.label }), input),
          h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Guardar', onclick: () => api('adm_saveSetting', k, input.value).then(() => toast('Ajuste guardado.', 'ok')).catch(fail) })));
      });
      body.appendChild(setBox);
      // Productos web
      const pw = h('div', { class: 'card' }, h('h2', null, h('span', { text: 'Productos web de Webpaya (precios sugeridos, editables)' }),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: '+ Producto', onclick: () => recordModal('Nuevo producto web', 'PRODUCTOS_WEB', { ACTIVO: true }, v => api('adm_saveProductoWeb', v).then(r => { go('configuracion'); return r; })) })));
      pw.appendChild(table([{ label: 'Nombre', key: 'NOMBRE' }, { label: 'Precio sugerido', num: true, render: p => (p.PRECIO_SUGERIDO ? money(p.PRECIO_SUGERIDO) : '—') }, { label: 'Adicional', render: p => (p.ES_ADICIONAL ? 'Sí' : '') }, { label: 'Activo', render: p => (p.ACTIVO ? 'Sí' : 'No') },
        { label: '', render: p => h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Editar', onclick: () => recordModal('Editar producto web', 'PRODUCTOS_WEB', p, v => api('adm_saveProductoWeb', Object.assign(v, { PRODUCTO_WEB_ID: p.PRODUCTO_WEB_ID, VERSION: p.VERSION })).then(r => { go('configuracion'); return r; })) }) }], cfg.productosWeb));
      body.appendChild(pw);
      // Catálogos
      const cat = h('div', { class: 'card' }, h('h2', { text: 'Catálogos (autocompletado)' }));
      Object.keys(cfg.catalogos).forEach(name => {
        const items = cfg.catalogos[name];
        const fixed = name === 'MUNICIPIOS';
        const input = h('input', { type: 'text', 'aria-label': 'Nuevo ítem en ' + name, placeholder: 'Nuevo ítem' });
        cat.appendChild(h('h3', { text: pretty(name) + (fixed ? ' (fijo por decisión del negocio)' : '') }));
        cat.appendChild(h('div', { class: 'actions' }, items.map(it => h('span', { class: 'badge' + (it.ACTIVO ? '' : ' danger') },
          it.ETIQUETA, fixed ? null : h('button', { type: 'button', class: 'btn-link small', 'aria-label': (it.ACTIVO ? 'Desactivar ' : 'Activar ') + it.ETIQUETA, text: it.ACTIVO ? '×' : '↺', onclick: () => api('adm_saveCatalogItem', { ITEM_ID: it.ITEM_ID, CATALOGO: name, ACTIVO: !it.ACTIVO, VERSION: it.VERSION }).then(() => go('configuracion')).catch(fail) })))));
        if (!fixed) cat.appendChild(h('div', { class: 'filters', style: 'margin-top:8px' }, input, h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Agregar', onclick: () => api('adm_saveCatalogItem', { CATALOGO: name, ETIQUETA: input.value }).then(() => go('configuracion')).catch(fail) })));
      });
      body.appendChild(cat);
    }).catch(err => { clear(body).appendChild(h('div', { class: 'notice error', text: err.message })); });
  };

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
