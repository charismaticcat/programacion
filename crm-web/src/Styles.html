<style>
  :root {
    --brand: #0f3d3e;
    --brand-600: #155557;
    --brand-50: #e8f1f0;
    --accent: #e0902f;
    --accent-50: #fdf3e6;
    --bg: #f5f6f2;
    --surface: #ffffff;
    --text: #1d2626;
    --muted: #5b6766;
    --border: #d9dedb;
    --danger: #b3261e;
    --danger-50: #fbeceb;
    --ok: #1e7a4c;
    --ok-50: #e7f4ec;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 40, 40, .06), 0 8px 24px rgba(16, 40, 40, .06);
    --focus: 0 0 0 3px rgba(224, 144, 47, .45);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand-600); }
  .skip { position: absolute; left: -999px; top: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; z-index: 50; }
  .skip:focus { left: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Barra superior ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--brand); color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 60px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--brand);
    display: grid; place-items: center; font-weight: 800;
  }
  .topbar .spacer { flex: 1; }
  .radicado { font-size: 13px; background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 999px; }
  .save-state { font-size: 13px; opacity: .9; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ad0b3; display: inline-block; }
  .save-state.saving .dot { background: var(--accent); animation: pulse 1s infinite; }
  .save-state.offline .dot { background: #ff8a80; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ---------- Disposición ---------- */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; max-width: 1120px; margin: 0 auto; padding: 28px 20px 120px; }
  .stepper { position: sticky; top: 88px; align-self: start; }
  .stepper ol { list-style: none; margin: 0; padding: 0; }
  .stepper li button {
    width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px;
    font: inherit; color: var(--muted); display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .stepper li button:disabled { cursor: not-allowed; opacity: .55; }
  .stepper li button .num {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center;
    font-size: 12px; font-weight: 700; flex: none; background: var(--surface);
  }
  .stepper li.done .num { background: var(--brand-50); border-color: var(--brand-600); color: var(--brand); }
  .stepper li.current button { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .stepper li.current .num { background: var(--brand); color: #fff; border-color: var(--brand); }
  .stepper li.has-error .num { border-color: var(--danger); color: var(--danger); }
  .progress-mobile { display: none; }

  main { min-width: 0; outline: none; }
  .step { display: none; }
  .step.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 6px; font-size: 24px; line-height: 1.25; }
  .card h3 { margin: 0 0 12px; font-size: 18px; }
  .lead { color: var(--muted); margin: 0 0 22px; }
  .hero {
    background: linear-gradient(135deg, var(--brand) 0%, #1c6a66 100%); color: #fff; border-radius: var(--radius);
    padding: 36px 32px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .hero h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.2; }
  .hero p { margin: 0; opacity: .92; max-width: 60ch; }
  .checklist { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px; }
  .checklist li { display: flex; gap: 10px; align-items: flex-start; }
  .checklist li::before { content: "✓"; color: var(--ok); font-weight: 800; }

  /* ---------- Formularios ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
  .grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .label { font-weight: 600; font-size: 14px; }
  .req { color: var(--danger); margin-left: 2px; }
  .help { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=search], select, textarea {
    width: 100%; font: inherit; color: var(--text); background: #fff; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 11px 12px; min-height: 46px; transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, .upload-zone:focus-within, a:focus-visible {
    outline: none; border-color: var(--accent); box-shadow: var(--focus);
  }
  .invalid input, .invalid textarea, .invalid select { border-color: var(--danger); background: var(--danger-50); }
  .error-msg { color: var(--danger); font-size: 13px; font-weight: 600; }
  .counter { font-size: 12px; color: var(--muted); align-self: flex-end; }
  .counter.over { color: var(--danger); font-weight: 700; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .choice span {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1.5px solid var(--border);
    border-radius: 999px; background: #fff; font-weight: 600; font-size: 14px; min-height: 44px;
  }
  .choice input:checked + span { border-color: var(--brand); background: var(--brand-50); color: var(--brand); }
  .choice input:focus-visible + span { box-shadow: var(--focus); }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; }
  .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--brand); flex: none; }
  .check strong { display: block; }
  .check.required { border-color: var(--brand-600); }
  .inline-check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .inline-check input { width: 20px; height: 20px; accent-color: var(--brand); }

  /* ---------- Botones ---------- */
  .btn {
    font: inherit; font-weight: 700; border-radius: 12px; padding: 12px 20px; min-height: 48px; border: 1.5px solid transparent;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-600); }
  .btn-accent { background: var(--accent); color: #1d1406; }
  .btn-ghost { background: #fff; color: var(--brand); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--brand-600); }
  .btn-danger-text { background: transparent; border: 0; color: var(--danger); font-weight: 600; cursor: pointer; padding: 8px; min-height: 40px; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn-sm { padding: 8px 14px; min-height: 40px; font-size: 14px; }
  .step-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 15; background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
    border-top: 1px solid var(--border); padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .step-nav .inner { max-width: 1120px; margin: 0 auto; display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
  .step-nav .inner .grow { flex: 1; color: var(--muted); font-size: 14px; }

  /* ---------- Identificación ---------- */
  .option-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .option-card {
    text-align: left; border: 1.5px solid var(--border); border-radius: var(--radius); background: #fff; padding: 20px; cursor: pointer; font: inherit;
  }
  .option-card strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .option-card[aria-pressed=true] { border-color: var(--brand); background: var(--brand-50); }
  .tabs { display: flex; gap: 8px; margin: 18px 0 14px; flex-wrap: wrap; }
  .tab { border: 1.5px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; min-height: 42px; }
  .tab[aria-selected=true] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .search-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .search-row .field { flex: 1 1 220px; }
  .results { display: grid; gap: 10px; margin-top: 16px; }
  .result { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; background: #fff; }
  .result .meta { color: var(--muted); font-size: 14px; }
  .notice { border-radius: 12px; padding: 14px 16px; margin: 12px 0; font-size: 15px; }
  .notice.info { background: var(--brand-50); color: var(--brand); }
  .notice.warn { background: var(--accent-50); color: #6b4108; }
  .notice.error { background: var(--danger-50); color: var(--danger); }
  .notice.ok { background: var(--ok-50); color: var(--ok); }
  .linked { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* ---------- Repetibles ---------- */
  .repeater { display: grid; gap: 14px; }
  .item { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; background: #fcfcfa; }
  .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .item-head h3 { margin: 0; font-size: 16px; }
  .add-btn { margin-top: 14px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }

  /* ---------- Archivos ---------- */
  .upload-zone {
    position: relative; border: 2px dashed var(--border); border-radius: var(--radius); padding: 18px; background: #fff;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .upload-zone.drag { border-color: var(--accent); background: var(--accent-50); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone .zone-text { flex: 1; min-width: 180px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .thumb { width: 118px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; font-size: 12px; position: relative; }
  .thumb .img { height: 86px; background: #eef1ef center/cover no-repeat; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
  .thumb .cap { padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb .rm { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
  .thumb.loading .img { background: linear-gradient(90deg, #eef1ef 0%, #dde3e0 50%, #eef1ef 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .item-photo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .item-photo .thumb { width: 96px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* ---------- Revisión y confirmación ---------- */
  .review-section { border-top: 1px solid var(--border); padding: 16px 0; }
  .review-section:first-of-type { border-top: 0; }
  .review-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .review-head h3 { margin: 0; font-size: 17px; }
  dl.review { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; margin: 10px 0 0; }
  dl.review dt { color: var(--muted); font-size: 14px; }
  dl.review dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .success-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--ok-50); color: var(--ok); display: grid; place-items: center; font-size: 38px; margin-bottom: 14px; }
  .big-code { font-size: 26px; font-weight: 800; letter-spacing: 1px; color: var(--brand); background: var(--brand-50); display: inline-block; padding: 8px 16px; border-radius: 12px; }

  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; display: grid; gap: 8px; width: min(92vw, 460px); }
  .toast-msg { background: #1d2626; color: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 15px; }
  .toast-msg.error { background: var(--danger); }
  .toast-msg.ok { background: var(--ok); }
  .overlay { position: fixed; inset: 0; background: rgba(245,246,242,.8); display: none; place-items: center; z-index: 60; }
  .overlay.show { display: grid; }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--brand-50); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hp { position: absolute; left: -5000px; width: 1px; height: 1px; overflow: hidden; }

  /* ---------- Móvil ---------- */
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; padding: 16px 12px 120px; gap: 12px; }
    .stepper { display: none; }
    .progress-mobile { display: block; background: var(--surface); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
    .progress-mobile .bar { height: 6px; background: var(--brand-50); border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .progress-mobile .bar span { display: block; height: 100%; background: var(--brand); transition: width .3s; }
    .card { padding: 20px 16px; }
    .hero { padding: 26px 20px; }
    .hero h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .option-cards { grid-template-columns: 1fr; }
    dl.review { grid-template-columns: 1fr; }
    dl.review dt { margin-top: 8px; }
    .topbar { padding: 8px 12px; }
    .radicado { display: none; }
    .step-nav .inner .grow { display: none; }
    .step-nav .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .topbar, .stepper, .step-nav, #toast { display: none !important; }
    .layout { display: block; padding: 0; }
    .card { box-shadow: none; }
  }
</style>
