function prepararColapsadoPreguntaSesion3(idBloque,completada){
    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const encabezado = bloque.querySelector(":scope > .tarjetaPregunta");
    if(!encabezado) return;

    encabezado.classList.add("encabezadoPreguntaSesion3");
    encabezado.style.cursor = "pointer";
    encabezado.title = completada
        ? "Pregunta respondida. Haga clic para continuar o editar."
        : "Pregunta disponible.";

    if(!encabezado.dataset.colapsoSesion3Inicializado){
        encabezado.addEventListener("click",function(){
            if(bloque.classList.contains("bloquePreguntaBloqueada")) return;
            abrirPreguntaSesion3(idBloque);
        });
        encabezado.dataset.colapsoSesion3Inicializado = "1";
    }

    bloque.classList.toggle("preguntaCompletadaSesion3",!!completada);
}

function cerrarPreguntaSesion3(idBloque){
    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const encabezado = bloque.querySelector(":scope > .tarjetaPregunta");
    if(!encabezado) return;

    Array.from(bloque.children).forEach(function(hijo){
        if(hijo !== encabezado){
            hijo.dataset.ocultoPorColapsoSesion3 = "1";
            hijo.style.display = "none";
        }
    });

    bloque.classList.add("preguntaColapsadaSesion3");
}

function abrirPreguntaSesion3(idBloque){
    const bloqueObjetivo = document.getElementById(idBloque);
    if(!bloqueObjetivo) return;
    if(bloqueObjetivo.classList.contains("bloquePreguntaBloqueada")) return;

    IDS_PREGUNTAS_S3.forEach(function(id){
        if(id !== idBloque) cerrarPreguntaSesion3(id);
    });

    Array.from(bloqueObjetivo.children).forEach(function(hijo){
        if(hijo.dataset.ocultoPorColapsoSesion3 === "1"){
            hijo.style.display = "";
            delete hijo.dataset.ocultoPorColapsoSesion3;
        }
    });

    bloqueObjetivo.classList.remove("preguntaColapsadaSesion3");
    bloqueObjetivo.scrollIntoView({behavior:"smooth",block:"start"});
}

function actualizarEstadoSesion3(){
    /*
     * P1: 40–200 palabras.
     */
    const p1 = actualizarContadorSesion3(
        "respuestaSesion3Pregunta1",
        "contadorSesion3Pregunta1",
        "progresoPalabrasSesion3Pregunta1",
        "mensajeContadorSesion3Pregunta1",
        MIN_P1_S3,
        MAX_P1_S3,
        "bloqueSesion3Pregunta1"
    );

    habilitarBloqueSesion3("bloqueSesion3Pregunta2",p1);
    habilitarCampoSesion3("respuestaSesion3Pregunta2Accion1",p1);

    /*
     * P2:
     * Acciones 1, 2 y 3: obligatorias, 20–100 palabras.
     * Acciones 4 y 5: opcionales, SIN límite de palabras.
     */
    const a1 = validarAccionSesion3(1);
    const a2 = validarAccionSesion3(2);
    const a3 = validarAccionSesion3(3);

    habilitarBloqueSesion3("contenedorAccion2Sesion3",a1);
    habilitarCampoSesion3("respuestaSesion3Pregunta2Accion2",a1);

    habilitarBloqueSesion3("contenedorAccion3Sesion3",a1 && a2);
    habilitarCampoSesion3("respuestaSesion3Pregunta2Accion3",a1 && a2);

    const opcionalesHabilitadas = a1 && a2 && a3;

    habilitarBloqueSesion3("contenedorAccion4Sesion3",opcionalesHabilitadas);
    habilitarCampoSesion3(
        "respuestaSesion3Pregunta2Accion4",
        opcionalesHabilitadas
    );

    habilitarBloqueSesion3("contenedorAccion5Sesion3",opcionalesHabilitadas);
    habilitarCampoSesion3(
        "respuestaSesion3Pregunta2Accion5",
        opcionalesHabilitadas
    );

    /*
     * Las acciones 1–3 sí tienen contador.
     * Las acciones 4–5 no tienen límite ni validación
     * por cantidad de palabras.
     */
    [1,2,3].forEach(function(n){
        actualizarContadorSesion3(
            "respuestaSesion3Pregunta2Accion" + n,
            "contadorSesion3Pregunta2Accion" + n,
            "progresoPalabrasSesion3Pregunta2Accion" + n,
            "mensajeContadorSesion3Pregunta2Accion" + n,
            MIN_ACCION_S3,
            MAX_ACCION_S3
        );

        activarColorTextareaAccion_(
            document.getElementById("respuestaSesion3Pregunta2Accion" + n),
            MIN_ACCION_S3,
            MAX_ACCION_S3
        );
    });

    marcarAccionesOpcionalesSesion3();

    /*
     * Acciones 4 y 5 (opcionales, sin mínimo): solo se despliegan si
     * la persona hace clic en "+ Añadir" — no tienen contador ni
     * barra de progreso, y con solo abrirlas ya cuentan como
     * completas.
     */
    activarAccionOpcional_(
        "abrirAccion4Sesion3",
        "contenidoAccion4Sesion3",
        "respuestaSesion3Pregunta2Accion4",
        "contenedorAccion5Sesion3"
    );

    activarAccionOpcional_(
        "abrirAccion5Sesion3",
        "contenidoAccion5Sesion3",
        "respuestaSesion3Pregunta2Accion5"
    );

    const accionesCompletas = a1 && a2 && a3;

    actualizarEstadoTarjetaAcciones_(
        "bloqueSesion3Pregunta2",
        contarAccionesCompletadas_(
            [a1, a2, a3],
            ["contenidoAccion4Sesion3", "contenidoAccion5Sesion3"]
        ),
        5,
        3
    );

    habilitarBloqueSesion3(
        "bloqueSesion3Pregunta3",
        accionesCompletas
    );

    habilitarControlesSesion3Seleccion(
        "bloqueSesion3Pregunta3",
        accionesCompletas
    );

    const p3 = validarPregunta3Sesion3();

    marcarTarjetaSeleccionValida_("bloqueSesion3Pregunta3", p3);

    const puedeP4 = accionesCompletas && p3;

    habilitarBloqueSesion3(
        "bloqueSesion3Pregunta4",
        puedeP4
    );

    habilitarControlesSesion3Seleccion(
        "bloqueSesion3Pregunta4",
        puedeP4
    );

    const p4 = validarPregunta4Sesion3();

    marcarTarjetaSeleccionValida_("bloqueSesion3Pregunta4", p4);

    /*
     * P3 y P4 se validan por selección, no por número
     * de palabras.
     */
    const completa =
        p1 &&
        accionesCompletas &&
        p3 &&
        p4;

    const boton =
        document.getElementById("btnFinalizarSesion3");

    if(boton){
        boton.disabled = !completa;
        boton.textContent = "Continuar →";
    }

    actualizarColapsoPreguntasSesion3([
        p1,
        accionesCompletas,
        p3,
        p4
    ]);
}

/*****************************************************
 * OPCIONES 4 Y 5 — SESIÓN 3
 *
 * Son opcionales y no tienen límite de palabras.
 *****************************************************/
function marcarAccionesOpcionalesSesion3(){

/*
 * Las tres acciones obligatorias empiezan colapsadas: se abren de a
 * una, en orden, y cada una se colapsa sola al terminar de
 * escribirla (ver activarAvanceAutomaticoAccion_).
 */
function inicializarAcordeonAccionesSesion3(){

    const ids = [
        "contenedorAccion1Sesion3",
        "contenedorAccion2Sesion3",
        "contenedorAccion3Sesion3"
    ];

    ids.forEach(function(id, indice){

        inicializarEncabezadoAccion_(id, ids);

        const bloque = document.getElementById(id);

        if(bloque && !bloque.dataset.colapsoAccionInicial){
            cerrarAccionColapsable_(id);
            bloque.dataset.colapsoAccionInicial = "1";
        }

        const siguiente = ids[indice + 1];

        activarAvanceAutomaticoAccion_(
            "respuestaSesion3Pregunta2Accion" + (indice + 1),
            id,
            MIN_ACCION_S3,
            MAX_ACCION_S3,
            siguiente,
            ids
        );

    });

}

    // La visibilidad del texto "Otro" (mostrar/ocultar su recuadro)
    // ya la controla actualizarInterfazOpcionesSesion3(); aquí solo
    // se respeta el bloqueo general de la pregunta.
    bloque.querySelectorAll('input[type="text"]').forEach(function(c){ c.disabled=!habilitado; });
    const textarea=bloque.querySelector('textarea');
    if(textarea) textarea.disabled=!habilitado;
}

/*****************************************************
 * SESIÓN 4 / "SESIÓN PROPIA" (OPCIONAL)
 *
 * Título único + objetivo (debe iniciar con un verbo en infinitivo)
 * + líneas temáticas propias, cada una con preguntas y respuestas
 * abiertas sin límite. Las líneas/preguntas/respuestas se guardan
 * como un único JSON en #sesionPropiaLineasJSON (campo oculto, viaja
 * solo con el resto del formulario porque construirDatosBorrador
 * recorre todo input/textarea con id) — evita tener que inventar y
 * restaurar decenas de ids numerados dinámicos.
 *
 * No se puede agregar una pregunta sin que exista antes una línea
 * temática (estructural: el botón vive dentro de la tarjeta de la
 * línea), ni una respuesta sin que exista antes el texto de la
 * pregunta (el botón "+ Agregar respuesta" solo se muestra una vez
 * la pregunta tiene contenido).
 *****************************************************/
let lineasTematicasPropias_ = [];

function cargarLineasTematicasPropiasDesdeCampo_(){
    try{
        const raw = document.getElementById("sesionPropiaLineasJSON")?.value || "[]";
        const parsed = JSON.parse(raw);
        lineasTematicasPropias_ = Array.isArray(parsed) ? parsed : [];
    }catch(error){ lineasTematicasPropias_ = []; }
}

function guardarLineasTematicasPropiasEnCampo_(){
    const campo = document.getElementById("sesionPropiaLineasJSON");
    if(campo) campo.value = JSON.stringify(lineasTematicasPropias_);
    guardarBorradorLocal({silencioso:true});
}

/* Sin títulos ni etiquetas fijas en ninguna parte: toda orientación
 * al usuario vive únicamente en el placeholder del campo (que
 * desaparece en cuanto se escribe algo), y cada parte agregada
 * (línea, pregunta, respuesta) tiene su propio botón "−" para
 * eliminarla, junto al "+" correspondiente para volver a agregarla. */
function renderLineasTematicasPropias_(){
    const cont = document.getElementById("listaLineasTematicasPropias");
    if(!cont) return;

    cont.innerHTML = lineasTematicasPropias_.map(function(linea, li){
        const numLinea = li+1;
        const preguntasHTML = (linea.preguntas||[]).map(function(p, pi){
            const numPregunta = pi+1;
            const terminada = !!p.terminada;
            let bloqueRespuesta = "";
            if(p.respuestaVisible || terminada){
                bloqueRespuesta =
                    '<div class="filaSesionPropiaConQuitar">'+
                        '<textarea class="textareaRespuestaPropia" data-linea="'+li+'" data-pregunta="'+pi+'" '+(terminada?'disabled':'')+' placeholder="Escriba aquí la respuesta '+numPregunta+'...">'+escapeHtml(p.respuesta||"")+'</textarea>'+
                        (terminada
                            ? ''
                            : '<button type="button" class="btnQuitarSesionPropia btnQuitarRespuesta" data-linea="'+li+'" data-pregunta="'+pi+'" aria-label="Quitar respuesta">−</button>')+
                    '</div>'+
                    (terminada
                        ? '<div class="okRespuestaTerminada">✓ OK</div>'
                        : '<button type="button" class="btnRespuestaTerminada" data-linea="'+li+'" data-pregunta="'+pi+'">✓ Respuesta terminada</button>');
            }else if(String(p.texto||"").trim()){
                bloqueRespuesta = '<button type="button" class="btnAgregarRespuestaPregunta" data-linea="'+li+'" data-pregunta="'+pi+'">+ Respuesta '+numPregunta+'</button>';
            }
            return '<div class="bloquePreguntaPropia'+(terminada?' terminada':'')+'" data-linea="'+li+'" data-pregunta="'+pi+'">'+
                '<div class="filaSesionPropiaConQuitar">'+
                    '<textarea class="textareaPreguntaPropia" data-linea="'+li+'" data-pregunta="'+pi+'" '+(terminada?'disabled':'')+' placeholder="Escriba aquí la pregunta '+numPregunta+'...">'+escapeHtml(p.texto||"")+'</textarea>'+
                    (terminada
                        ? ''
                        : '<button type="button" class="btnQuitarSesionPropia btnQuitarPregunta" data-linea="'+li+'" data-pregunta="'+pi+'" aria-label="Quitar pregunta">−</button>')+
                '</div>'+
                bloqueRespuesta+
            '</div>';
        }).join("");

        return '<div class="tarjetaLineaTematicaPropia" data-linea="'+li+'">'+
            '<div class="encabezadoLineaTematicaPropia filaSesionPropiaConQuitar">'+
                '<input type="text" class="inputTituloLinea" data-linea="'+li+'" value="'+escapeAttr(linea.titulo||"")+'" placeholder="Escriba aquí el título de la línea temática '+numLinea+'...">'+
                '<button type="button" class="btnQuitarSesionPropia btnQuitarLinea" data-linea="'+li+'" aria-label="Quitar línea temática">−</button>'+
            '</div>'+
            '<div class="listaPreguntasLinea">'+preguntasHTML+'</div>'+
            '<button type="button" class="btnAgregarPreguntaLinea" data-linea="'+li+'">+ Pregunta</button>'+
        '</div>';
    }).join("");
}

function validarObjetivoSesionPropia_(){
    const campo=document.getElementById("objetivoSesionPropia");
    const error=document.getElementById("errorObjetivoSesionPropia");
    if(!campo) return true;
    const texto=String(campo.value||"").trim();
    if(!texto){ if(error) error.style.display="none"; campo.classList.remove("campoConError"); return true; }
    const primeraPalabra=(texto.split(/\s+/)[0]||"").toLowerCase().replace(/[^a-záéíóúñ]/g,"");
    const esInfinitivo = primeraPalabra.length>2 && /(ar|er|ir)$/.test(primeraPalabra);
    if(error) error.style.display = esInfinitivo ? "none" : "block";
    campo.classList.toggle("campoConError", !esInfinitivo);
    return esInfinitivo;
}

function inicializarSesionPropia_(){
    const nombreIE=String(getCampoNombreIE()||"").replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim();
    if(nombreIE) document.querySelectorAll(".nombreIESesion4").forEach(function(el){ el.textContent=nombreIE; });
    const escudo=document.getElementById("escudoPreguntaSesion4");
    if(escudo && typeof LOGO_IE_URL!=="undefined" && LOGO_IE_URL) escudo.src=LOGO_IE_URL;

    cargarLineasTematicasPropiasDesdeCampo_();
    renderLineasTematicasPropias_();

    // TÍTULO (agregable con + y eliminable con −).
    const btnAgregarTitulo=document.getElementById("btnAgregarTituloSesionPropia");
    if(btnAgregarTitulo && !btnAgregarTitulo.dataset.inicializado){
        btnAgregarTitulo.dataset.inicializado="1";
        btnAgregarTitulo.addEventListener("click",function(){
            document.getElementById("tituloSesionPropiaVacio").style.display="none";
            document.getElementById("tituloSesionPropiaLleno").style.display="";
            document.getElementById("tituloSesionPropia")?.focus();
        });
    }
    if(document.getElementById("tituloSesionPropia")?.value){
        document.getElementById("tituloSesionPropiaVacio").style.display="none";
        document.getElementById("tituloSesionPropiaLleno").style.display="";
    }
    document.getElementById("tituloSesionPropia")?.addEventListener("input",function(){ guardarBorradorLocal({silencioso:true}); });
    const btnQuitarTitulo=document.getElementById("btnQuitarTituloSesionPropia");
    if(btnQuitarTitulo && !btnQuitarTitulo.dataset.inicializado){
        btnQuitarTitulo.dataset.inicializado="1";
        btnQuitarTitulo.addEventListener("click",function(){
            const campo=document.getElementById("tituloSesionPropia");
            if(campo) campo.value="";
            document.getElementById("tituloSesionPropiaLleno").style.display="none";
            document.getElementById("tituloSesionPropiaVacio").style.display="";
            guardarBorradorLocal({silencioso:true});
        });
    }

    // OBJETIVO (agregable con + y eliminable con −; valida verbo en infinitivo).
    const btnAgregarObjetivo=document.getElementById("btnAgregarObjetivoSesionPropia");
    if(btnAgregarObjetivo && !btnAgregarObjetivo.dataset.inicializado){
        btnAgregarObjetivo.dataset.inicializado="1";
        btnAgregarObjetivo.addEventListener("click",function(){
            document.getElementById("objetivoSesionPropiaVacio").style.display="none";
            document.getElementById("objetivoSesionPropiaLleno").style.display="";
            document.getElementById("objetivoSesionPropia")?.focus();
        });
    }
    if(document.getElementById("objetivoSesionPropia")?.value){
        document.getElementById("objetivoSesionPropiaVacio").style.display="none";
        document.getElementById("objetivoSesionPropiaLleno").style.display="";
    }
    const objetivoCampo=document.getElementById("objetivoSesionPropia");
    if(objetivoCampo && !objetivoCampo.dataset.inicializado){
        objetivoCampo.dataset.inicializado="1";
        objetivoCampo.addEventListener("input",function(){ validarObjetivoSesionPropia_(); guardarBorradorLocal({silencioso:true}); });
        validarObjetivoSesionPropia_();
    }
    const btnQuitarObjetivo=document.getElementById("btnQuitarObjetivoSesionPropia");
    if(btnQuitarObjetivo && !btnQuitarObjetivo.dataset.inicializado){
        btnQuitarObjetivo.dataset.inicializado="1";
        btnQuitarObjetivo.addEventListener("click",function(){
            const campo=document.getElementById("objetivoSesionPropia");
            if(campo) campo.value="";
            const error=document.getElementById("errorObjetivoSesionPropia");
            if(error) error.style.display="none";
            campo?.classList.remove("campoConError");
            document.getElementById("objetivoSesionPropiaLleno").style.display="none";
            document.getElementById("objetivoSesionPropiaVacio").style.display="";
            guardarBorradorLocal({silencioso:true});
        });
    }

    // + AGREGAR LÍNEA TEMÁTICA.
    const btnAgregarLinea=document.getElementById("btnAgregarLineaTematica");
    if(btnAgregarLinea && !btnAgregarLinea.dataset.inicializado){
        btnAgregarLinea.dataset.inicializado="1";
        btnAgregarLinea.addEventListener("click",function(){
            lineasTematicasPropias_.push({titulo:"",preguntas:[]});
            renderLineasTematicasPropias_();
            guardarLineasTematicasPropiasEnCampo_();
        });
    }

    // Delegación de eventos sobre el contenedor dinámico: se
    // registra UNA sola vez, no en cada renderizado.
    const lista=document.getElementById("listaLineasTematicasPropias");
    if(lista && !lista.dataset.inicializado){
        lista.dataset.inicializado="1";

        lista.addEventListener("input",function(evento){
            const li=evento.target.dataset.linea;
            if(li===undefined) return;
            const linea=lineasTematicasPropias_[Number(li)];
            if(!linea) return;
            if(evento.target.classList.contains("inputTituloLinea")){
                linea.titulo=evento.target.value;
            }else if(evento.target.classList.contains("textareaPreguntaPropia")){
                const pi=Number(evento.target.dataset.pregunta);
                if(linea.preguntas[pi]) linea.preguntas[pi].texto=evento.target.value;
            }else if(evento.target.classList.contains("textareaRespuestaPropia")){
                const pi=Number(evento.target.dataset.pregunta);
                if(linea.preguntas[pi]) linea.preguntas[pi].respuesta=evento.target.value;
            }else{
                return;
            }
            // No se vuelve a renderizar en cada tecla (perdería el
            // foco): solo se guarda el estado. El "+ Agregar
            // respuesta" solo aparecerá al perder el foco/re-render
            // siguiente (clic en otro botón), lo cual es aceptable.
            guardarLineasTematicasPropiasEnCampo_();
        });

        lista.addEventListener("blur",function(evento){
            if(evento.target.classList && evento.target.classList.contains("textareaPreguntaPropia")){
                renderLineasTematicasPropias_();
            }
        },true);

        lista.addEventListener("click",function(evento){
            const boton=evento.target.closest("button");
            if(!boton) return;
            const li=Number(boton.dataset.linea);
            const linea=lineasTematicasPropias_[li];
            if(!linea) return;

            if(boton.classList.contains("btnAgregarPreguntaLinea")){
                linea.preguntas.push({texto:"",respuesta:"",respuestaVisible:false,terminada:false});
            }else if(boton.classList.contains("btnAgregarRespuestaPregunta")){
                const pi=Number(boton.dataset.pregunta);
                if(linea.preguntas[pi]) linea.preguntas[pi].respuestaVisible=true;
            }else if(boton.classList.contains("btnRespuestaTerminada")){
                const pi=Number(boton.dataset.pregunta);
                if(linea.preguntas[pi]) linea.preguntas[pi].terminada=true;
            }else if(boton.classList.contains("btnQuitarLinea")){
                // Elimina la línea temática completa (y sus preguntas/respuestas).
                lineasTematicasPropias_.splice(li,1);
            }else if(boton.classList.contains("btnQuitarPregunta")){
                // Elimina la pregunta completa (y su respuesta, si tenía).
                const pi=Number(boton.dataset.pregunta);
                linea.preguntas.splice(pi,1);
            }else if(boton.classList.contains("btnQuitarRespuesta")){
                // Solo borra la respuesta; la pregunta permanece y vuelve
                // a mostrar el botón "+ Respuesta".
                const pi=Number(boton.dataset.pregunta);
                if(linea.preguntas[pi]){
                    linea.preguntas[pi].respuesta="";
                    linea.preguntas[pi].respuestaVisible=false;
                }
            }else{
                return;
            }
            renderLineasTematicasPropias_();
            guardarLineasTematicasPropiasEnCampo_();
        });
    }
}

/*****************************************************
 * GUARDADO AUTOMÁTICO LOCAL + SINCRONIZACIÓN
 *a
 * El navegador guarda inmediatamente una copia local.
 * Esto protege el avance ante pérdida de Internet,
 * cierre de pestaña y cortes de energía una vez que
 * los datos ya fueron introducidos.
 *
 * Cuando vuelve Internet, el borrador se sincroniza
 * con Google Sheets mediante guardarAvanceForo().
 *****************************************************/

const CLAVE_BORRADOR_FORO_BASE =
    "foroEducativoNeiva2026_borrador";

const CLAVE_ID_FORO_BASE =
    "foroEducativoNeiva2026_id";

let temporizadorSincronizacion = null;
let sincronizacionEnCurso = false;
let cambioPendiente = false;


/*****************************************************
 * ESTADO DE AUTENTICACIÓN
 *****************************************************/

function accesoEstaAutorizadoFEM(){

    return !!(
        window.DATOS_ACCESO_FEM &&
        window.DATOS_ACCESO_FEM.ok === true &&
        String(
            window.DATOS_ACCESO_FEM.idForo || ""
        ).trim() !== ""
    );

}


function obtenerSufijoAccesoLocal(){

    const token =
        typeof TOKEN_ACCESO !== "undefined"
            ? String(
                TOKEN_ACCESO || ""
              ).trim()
            : "";

    if(!token){
        return "";
    }

    /*
     * El TOKEN es único por IE.
     * Se utiliza para que dos IE no compartan
     * el mismo borrador en el mismo navegador.
     */
    return "_" +
        encodeURIComponent(token)
            .replace(/%/g,"_");

}


function obtenerClaveBorradorForo(){

    return (
        CLAVE_BORRADOR_FORO_BASE +
        obtenerSufijoAccesoLocal()
    );

}


function obtenerClaveIdForo(){

    return (
        CLAVE_ID_FORO_BASE +
        obtenerSufijoAccesoLocal()
    );

}


/*****************************************************
 * OBTENER ID_FORO OFICIAL
 *
 * El ID_FORO NO se genera en el navegador.
 *
 * Cada IE tiene un único ID_FORO asignado en
 * la hoja AccesosIE.
 *****************************************************/

function obtenerIdForo(){

    if(accesoEstaAutorizadoFEM()){

        const idOficial =
            String(
                window.DATOS_ACCESO_FEM.idForo || ""
            ).trim();

        if(!idOficial){

            throw new Error(
                "Esta institución no tiene un ID_FORO autorizado. " +
                "Solicite asistencia a la Secretaría de Educación de Neiva " +
                "al correo educacion@alcaldianeiva.gov.co " +
                "o al 318 456 1081."
            );

        }


        const clave =
            obtenerClaveIdForo();

        const idGuardado =
            String(
                localStorage.getItem(clave) || ""
            ).trim();


        /*
         * Si existe un valor local diferente al oficial,
         * se corrige inmediatamente. Nunca se conserva
         * un ID de otra IE.
         */
        if(
            idGuardado &&
            idGuardado !== idOficial
        ){

            localStorage.removeItem(clave);

        }


        localStorage.setItem(
            clave,
            idOficial
        );

        return idOficial;

    }


    /*
     * La sesión en memoria (window.DATOS_ACCESO_FEM) se perdió —
     * normalmente porque la página se recargó después de haber
     * iniciado sesión (por ejemplo, al reabrir la pestaña o al
     * quedar en segundo plano).
     *
     * Si este mismo navegador ya había validado un código para
     * esta institución, se reutiliza el ID_FORO que quedó
     * guardado localmente en vez de bloquear el guardado. El
     * servidor vuelve a validar ese ID_FORO en cada operación
     * (guardarAvanceForo, subirEvidenciasFEM, etc.), así que esto
     * no omite ningún control de seguridad real.
     */
    const idPersistido =
        String(
            localStorage.getItem(
                obtenerClaveIdForo()
            ) || ""
        ).trim();

    if(idPersistido){
        return idPersistido;
    }

    throw new Error(
        "La institución debe autenticarse antes de guardar."
    );

}


function construirDatosBorrador(){

    const datos = {
        idForo: obtenerIdForo(),
        pantallaActual: pantallaActual,
        fechaInicio: null,
        fechaGuardado: new Date().toISOString(),
        institucion: "",
        dane: "",
        campos: {}
    };

    const guardadoAnterior =
        localStorage.getItem(obtenerClaveBorradorForo());

    if(guardadoAnterior){

        try{

            const anterior =
                JSON.parse(guardadoAnterior);

            datos.fechaInicio =
                anterior.fechaInicio || null;

        }catch(error){
            // Se ignora un borrador anterior inválido.
        }

    }

    if(!datos.fechaInicio){
        datos.fechaInicio = datos.fechaGuardado;
    }

    document
        .querySelectorAll("input, textarea, select")
        .forEach(function(campo){

            if(!campo.id) return;

            // Los archivos no se pueden restaurar desde localStorage.
            if(campo.type === "file") return;

            if(campo.type === "checkbox"){

                datos.campos[campo.id] = {
                    tipo: "checkbox",
                    valor: campo.checked
                };

            }else{

                datos.campos[campo.id] = {
                    tipo: campo.type,
                    valor: campo.value
                };

            }

        });

    const campoInstitucion =
        document.getElementById("institucion");

    const campoDane =
        document.getElementById("dane");

    if(campoInstitucion){
        datos.institucion = campoInstitucion.value || "";
    }

    if(campoDane){
        datos.dane = campoDane.value || "";
    }

    return datos;

}


function guardarBorradorLocal(opciones){

    opciones = opciones || {};

    /*
     * Antes de autenticar no existe un ID_FORO válido.
     * No mostramos error ni intentamos sincronizar.
     */
    if(!accesoEstaAutorizadoFEM()){

        return null;

    }

    try{

        const datos =
            construirDatosBorrador();

        localStorage.setItem(
            obtenerClaveBorradorForo(),
            JSON.stringify(datos)
        );

        cambioPendiente = true;

        if(!opciones.silencioso){

            mostrarEstadoGuardado(
                "🟢 Avance guardado en este dispositivo"
            );

        }

        programarSincronizacion();

        return datos;

    }catch(error){

        console.error(
            "No fue posible guardar el avance local:",
            error
        );

        mostrarEstadoGuardado(
            "⚠️ No se pudo guardar localmente"
        );

        return null;

    }

}


/*
 * Aplica al formulario un objeto "datos" con la misma forma que
 * construye construirDatosBorrador() ({campos, pantallaActual, ...}),
 * sin importar si vino de localStorage o del respaldo en la nube
 * (AvancesForo, vía obtenerAvanceForo). Ambos casos comparten
 * exactamente esta lógica.
 */
function aplicarDatosDeBorrador_(datos, mostrarPantalla, mensajeEstado){

    /*
     * Las tarjetas de responsables adicionales son dinámicas: si el
     * borrador trae datos para "responsable2Nombre" en adelante, hay
     * que recrear esas tarjetas ANTES del recorrido genérico de abajo
     * — si no, getElementById no las encuentra y esos datos se
     * pierden en silencio.
     */
    try{ precrearTarjetasResponsablesDesdeBorrador_(datos.campos); }catch(error){ console.error(error); }

    /*
     * Campos de texto/textarea restaurados: se recuerdan aparte para
     * disparar su evento "input" DESPUÉS de asignar todos los
     * valores (ver más abajo). Antes solo se hacía esto para
     * "respuestaSesion1", así que al retomar el formulario todas las
     * demás preguntas (Sesión 1 Pregunta 2, y las de Sesión 2 y 3)
     * mostraban "0 palabras" y su barra de progreso en 0% hasta que
     * la persona volvía a escribir algo — aunque el texto guardado
     * sí estuviera ahí, dentro del campo.
     */
    const camposDeTextoRestaurados = [];

    Object.keys(datos.campos || {})
        .forEach(function(id){

            const campo =
                document.getElementById(id);

            if(!campo) return;

            const informacion =
                datos.campos[id];

            if(informacion.tipo === "checkbox"){

                campo.checked =
                    Boolean(informacion.valor);

            }else{

                campo.value =
                    informacion.valor ?? "";

                if(
                    campo.tagName === "TEXTAREA" ||
                    campo.tagName === "INPUT"
                ){
                    camposDeTextoRestaurados.push(campo);
                }

            }

        });

    camposDeTextoRestaurados.forEach(function(campo){
        campo.dispatchEvent(new Event("input"));
    });

    /*
     * Si ya se habían subido las evidencias en una sesión
     * anterior (el navegador se recargó, se reingresó con el
     * código, o se continuó desde otro dispositivo), habilitar
     * "Continuar" en la pantalla de evidencias. El único chequeo
     * que existía para esto corría una sola vez al cargar la
     * página, antes de que hubiera datos que restaurar, así que
     * el botón quedaba deshabilitado para siempre aunque las
     * evidencias ya estuvieran subidas.
     */
    const contEvidenciasBtn =
        document.getElementById("btnContinuarDesdeEvidencias");

    /*
     * La asistencia ya no es un archivo que se sube: se firma por
     * QR durante toda la jornada, en paralelo, sin bloquear nada.
     * "Continuar" depende únicamente de la fotografía.
     */
    if(
        contEvidenciasBtn &&
        document.getElementById("evidenciaFotoUrl")?.value
    ){
        contEvidenciasBtn.disabled = false;
    }
    actualizarPreviaFotoEvidencia_();
    if(typeof aplicarEstadoMetodoAsistencia_==="function") aplicarEstadoMetodoAsistencia_();
    if(typeof actualizarEstadoEvidencias==="function") actualizarEstadoEvidencias();

    // Recalcular datos derivados.
    if(typeof actualizarTotalParticipantes === "function"){
        actualizarTotalParticipantes();
    }

    // Restaurar correctamente el estado del consentimiento.
    if(typeof actualizarEstadoConsentimiento === "function"){
        actualizarEstadoConsentimiento();
    }

    if(typeof mostrarResumen === "function"){
        mostrarResumen(false);
    }

    /*
     * (El disparo de "input" sobre los campos de texto restaurados
     * ya se hizo arriba, justo después de asignar sus valores, para
     * todas las preguntas de las tres sesiones — no solo
     * "respuestaSesion1".)
     */

    if(
        mostrarPantalla &&
        datos.pantallaActual &&
        datos.pantallaActual >= 1 &&
        datos.pantallaActual <= TOTAL_PANTALLAS
    ){

        pantallaActual =
            Number(datos.pantallaActual);

        mostrarPantallaGuardada(
            pantallaActual
        );

    }

    cambioPendiente = false;

    mostrarEstadoGuardado(
        mensajeEstado || "🔄 Avance recuperado"
    );

}


function restaurarBorradorLocal(opciones){

    opciones = opciones || {};

    const mostrarPantalla =
        opciones.mostrarPantalla === true;

    try{

        const guardado =
            localStorage.getItem(
                obtenerClaveBorradorForo()
            );

        if(!guardado) return false;

        const datos =
            JSON.parse(guardado);

        aplicarDatosDeBorrador_(
            datos,
            mostrarPantalla,
            "🔄 Avance recuperado"
        );

        return true;

    }catch(error){

        console.error(
            "No fue posible restaurar el avance:",
            error
        );

        return false;

    }

}


/*
 * Recuperar el avance guardado en el servidor (AvancesForo) cuando
 * NO hay nada en este navegador — típicamente al continuar desde
 * un dispositivo distinto al que se usó para empezar. El respaldo
 * en la nube ya se venía guardando en cada autoguardado
 * (guardarAvanceForo), pero nunca se leía de vuelta: si alguien
 * abría su enlace en otro equipo, el formulario empezaba en blanco
 * aunque sus respuestas SÍ estuvieran a salvo en la hoja de cálculo.
 *
 * callback(encontrado) se invoca siempre, exista o no un avance
 * guardado, para que quien llama decida qué pantalla mostrar.
 */
function restaurarAvanceDesdeServidor_(idForo, callback){

    if(!idForo){
        callback(false);
        return;
    }

    google.script.run
        .withSuccessHandler(function(resultado){

            if(
                !resultado ||
                !resultado.ok ||
                !resultado.encontrado ||
                !resultado.datos
            ){
                callback(false);
                return;
            }

            try{

                localStorage.setItem(
                    obtenerClaveBorradorForo(),
                    JSON.stringify(resultado.datos)
                );

                aplicarDatosDeBorrador_(
                    resultado.datos,
                    true,
                    "☁️ Avance recuperado desde la nube"
                );

                callback(true);

            }catch(error){

                console.error(
                    "No fue posible aplicar el avance recuperado de la nube:",
                    error
                );

                callback(false);

            }

        })
        .withFailureHandler(function(error){

            console.error(
                "No fue posible consultar el avance en la nube:",
                error
            );

            callback(false);

        })
        .obtenerAvanceForo(idForo);

}


function mostrarPantallaGuardada(paso){

        2: "pantallaRecorrido",

        7: "pantallaSesion2",
        8: "pantallaSesion3",
        9: "pantallaEvidencias",
        10: "pantallaPlenaria",
        11: "pantallaFinalFEM",
        12: "pantallaCierreFEM"
    };

    const id =
        pantallas[paso];

    if(!id) return;

    document

function programarSincronizacion(){

    if(temporizadorSincronizacion){
        clearTimeout(temporizadorSincronizacion);
    }

    temporizadorSincronizacion =
        setTimeout(function(){
            sincronizarBorradorConServidor();
        }, 2000);

}


function sincronizarBorradorConServidor(){

    if(!accesoEstaAutorizadoFEM()){
        return;
    }

    if(sincronizacionEnCurso) return;

    if(!navigator.onLine){

        mostrarEstadoGuardado(
            "🟠 Sin Internet: avance guardado en este dispositivo"
        );

        return;

    }

    const guardado =
        localStorage.getItem(
            obtenerClaveBorradorForo()
        );

    if(!guardado) return;

    let datos;

    try{
        datos = JSON.parse(guardado);
    }catch(error){
        return;
    }

    sincronizacionEnCurso = true;

    google.script.run
        .withSuccessHandler(function(respuesta){

            sincronizacionEnCurso = false;

            if(respuesta && respuesta.ok){

                cambioPendiente = false;

                if(respuesta.idForo){
                    localStorage.setItem(
                        obtenerClaveIdForo(),
                        respuesta.idForo
                    );
                }

                mostrarEstadoGuardado(
                    "☁️ Avance respaldado"
                );

            }else{

                mostrarEstadoGuardado(
                    "🟢 Guardado localmente; pendiente de respaldo"
                );

            }

        })
        .withFailureHandler(function(error){

            sincronizacionEnCurso = false;

            console.log(
                "No fue posible sincronizar el borrador:",
                error
            );

            mostrarEstadoGuardado(
                "🟠 Sin Internet: avance guardado en este dispositivo"
            );

        })
        .guardarAvanceForo(datos);

}


function activarGuardadoAutomatico(){

    document.addEventListener(
        "input",
        function(){
            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
        }
    );

    document.addEventListener(
        "change",
        function(){
            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
        }
    );

    // Guardar inmediatamente al abandonar la página.
    window.addEventListener(
        "beforeunload",
        function(){
            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
        }
    );

    // pagehide es especialmente útil en móviles.
    window.addEventListener(
        "pagehide",
        function(){
            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
        }
    );

    // Si la pestaña pasa a segundo plano, guardar.
    document.addEventListener(
        "visibilitychange",
        function(){

            if(document.visibilityState === "hidden"){
                if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
            }

        }
    );

    // Cuando vuelve Internet, intentar respaldar lo pendiente.
    window.addEventListener(
        "online",
        function(){

            mostrarEstadoGuardado(
                "🌐 Internet restablecido; sincronizando…"
            );

            sincronizarBorradorConServidor();

        }
    );

    // Informar sin perder el avance local.
    window.addEventListener(
        "offline",
        function(){

            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }

            mostrarEstadoGuardado(
                "🟠 Sin Internet: avance guardado en este dispositivo"
            );

        }
    );

    // Respaldo periódico mientras la página está abierta.
    setInterval(function(){

        if(cambioPendiente){
            if(accesoEstaAutorizadoFEM()){
                guardarBorradorLocal({silencioso:true});
            }
        }

    }, 30000);

}

    const logoIEAcceso =

function validarCodigoAccesoFEM(forzar){

        return;

     */

        typeof TOKEN_ACCESO !== "undefined"
            ? String(
                TOKEN_ACCESO || ""

                            {

                    resultado.idForo
                ){

                    localStorage.setItem(
                        obtenerClaveIdForo(),

function confirmarFEM(mensaje, opciones){
    return new Promise(function(resolve){
        const modal=document.getElementById("modalConfirmarFEM");
        if(!modal){ resolve(window.confirm(mensaje)); return; }
        const titulo=document.getElementById("modalConfirmarTitulo");
        const texto=document.getElementById("modalConfirmarMensaje");
        const btnOk=document.getElementById("btnModalConfirmarAceptar");
        const btnCancelar=document.getElementById("btnModalConfirmarCancelar");
        if(titulo) titulo.textContent=(opciones&&opciones.titulo)||"¿Está seguro?";
        if(texto) texto.textContent=mensaje;
        if(btnOk) btnOk.textContent=(opciones&&opciones.textoAceptar)||"Sí, enviar";
        if(btnCancelar) btnCancelar.textContent=(opciones&&opciones.textoCancelar)||"Cancelar";

        function cerrar(resultado){
            modal.classList.remove("visible");
            modal.setAttribute("aria-hidden","true");
            btnOk.removeEventListener("click",onOk);
            btnCancelar.removeEventListener("click",onCancelar);
            resolve(resultado);
        }
        function onOk(){ cerrar(true); }
        function onCancelar(){ cerrar(false); }

        btnOk.addEventListener("click",onOk);
        btnCancelar.addEventListener("click",onCancelar);
        modal.classList.add("visible");
        modal.setAttribute("aria-hidden","false");
    });
}

     * Una vez respondidas las 4 preguntas de corazones, se calcula la
     * nota promedio (1 a 5) y, según el rango, se muestra un mensaje
     * con emoji y se revela la pregunta abierta final con un texto
     * distinto — esta pregunta permanece oculta hasta ese momento.
     */
    function actualizarResultadoValoracionFEM_(){

            if(bloqueAbierto) bloqueAbierto.style.display="none";
            if(bloqueResultado) bloqueResultado.style.display="none";

        if(nota<3){

            pregunta="😭 ¡Debemos hacerlo mejor! ¿Qué sugerencias, recomendaciones o propuestas tienen para fortalecer la organización y desarrollo del Foro Educativo Institucional 2027?";
        }else if(nota<=4){
            emoji="😬";

        if(estado) estado.textContent="Guardando…";

        const respuestas={
            p1:puntajes.p1, p2:puntajes.p2, p3:puntajes.p3, p4:puntajes.p4,
            p5:document.getElementById("valoracionP5")?.value||"",
            mejoraP1:document.getElementById("valoracionMejoraP1")?.value||"",
            mejoraP2:document.getElementById("valoracionMejoraP2")?.value||"",
            mejoraP3:document.getElementById("valoracionMejoraP3")?.value||"",
            mejoraP4:document.getElementById("valoracionMejoraP4")?.value||""
        };

        google.script.run
            .withSuccessHandler(function(res){
                if(res && res.ok){
                    if(estado) estado.textContent="¡Gracias por su valoración!";
                    btnEnviar.textContent="✓ Valoración enviada";
                    mostrarModalCierreDefinitivoFEM_(idForo);
                }else{
                    btnEnviar.disabled=false; btnEnviar.textContent="Enviar valoración";
                    if(estado) estado.textContent=(res && res.mensaje) || "No fue posible guardar la valoración.";
                }
            })
            .withFailureHandler(function(error){
                btnEnviar.disabled=false; btnEnviar.textContent="Enviar valoración";
                if(estado) estado.textContent="No fue posible guardar la valoración: "+(error.message||error);
            })
            .guardarValoracionFEM(idForo, respuestas);
    });
}

/*
 * Confirmación final, grande y centrada, una vez enviada la
 * valoración. El botón "Cerrar" dispara el correo comprobante de
 * participación (con el grupo de la IE) y, solo entonces, intenta
 * cerrar la pestaña — si el navegador no lo permite (por ejemplo,
 * porque la pestaña no se abrió con window.open()), se avisa que ya
 * puede cerrarla manualmente en vez de quedar sin ninguna respuesta.
 */
function mostrarModalCierreDefinitivoFEM_(idForo){
    const modal=document.getElementById("modalCierreDefinitivoFEM");
    if(!modal) return;
    modal.classList.add("visible");
    modal.setAttribute("aria-hidden","false");

    const btnCerrar=document.getElementById("btnCerrarDefinitivoFEM");
    if(!btnCerrar || btnCerrar.dataset.wired==="1") return;
    btnCerrar.dataset.wired="1";

    btnCerrar.addEventListener("click", async function(){
        // El comprobante ya se envió en un clic anterior (el cierre
        // real de la pestaña casi nunca ocurre —los navegadores solo
        // permiten cerrar por script una pestaña que el propio script
        // abrió—, así que sin esta bandera cada clic volvía a
        // reenviar el correo). Un segundo clic solo repite el paso a
        // la pantalla de despedida, nunca reenvía nada.
        if(btnCerrar.dataset.enviado==="1"){
            mostrarPantallaDespedidaFEM_();
            return;
        }

        btnCerrar.disabled=true; btnCerrar.textContent="Enviando comprobante…";
        try{
            const datos=obtenerDatosFormularioActual_();
            await new Promise((resolve,reject)=>{
                google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
                    .enviarComprobanteParticipacionFEM(idForo, datos);
            });
        }catch(error){
            console.error("No fue posible enviar el comprobante de participación:", error);
        }
        btnCerrar.dataset.enviado="1";
        try{ window.close(); }catch(e){}
        mostrarPantallaDespedidaFEM_();
    });
}

/*
 * Pantalla final de despedida, personalizada con el número de
 * participantes reportados en la caracterización, el nombre de la
 * IE, el rector(a) y todos los responsables del diligenciamiento
 * (el principal + los adicionales). No depende de que window.close()
 * funcione — es en sí misma el cierre de la experiencia.
 */
function mostrarPantallaDespedidaFEM_(){
    const modal=document.getElementById("modalCierreDefinitivoFEM");
    if(modal){ modal.classList.remove("visible"); modal.setAttribute("aria-hidden","true"); }

    const pantalla=document.getElementById("pantallaDespedidaFEM");
    if(!pantalla) return;

    const total=(typeof getTotalParticipantes==="function" ? getTotalParticipantes() : 0)||0;
    const ie=String(getCampoNombreIE()||"").replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim()||"nuestra institución";
    const rector=String(document.getElementById("rector")?.value||"").trim()||"su rector(a)";
    const responsables=(typeof obtenerNombresResponsablesFEM_==="function" ? obtenerNombresResponsablesFEM_() : []);

    let textoResponsables="";
    if(responsables.length===1){
        textoResponsables=" y a "+escapeHtml(responsables[0]);
    }else if(responsables.length>1){
        const todosMenosUltimo=responsables.slice(0,-1).map(escapeHtml).join(", ");
        textoResponsables=" y a "+todosMenosUltimo+" y "+escapeHtml(responsables[responsables.length-1]);
    }

    const fraseInspiradora="La educación se construye entre todos: gracias por sembrar, con su voz, la escuela viva que soñamos para Neiva.";

    const mensaje=document.getElementById("textoDespedidaFEM");
    if(mensaje){
        mensaje.innerHTML =
            "¡Muchas gracias a los <strong>"+total+"</strong> integrantes de la comunidad educativa de la IE <strong>"+escapeHtml(ie)+"</strong>, a su líder <strong>"+escapeHtml(rector)+"</strong>"+
            textoResponsables+
            " por enviar diligentemente las respuestas construidas desde el diálogo."+
            "<br><br><em>"+fraseInspiradora+"</em>";
    }

    document.querySelectorAll(".pantalla").forEach(function(p){ p.classList.remove("visible"); });
    pantalla.classList.add("visible");
    try{ pantalla.scrollIntoView({behavior:"instant",block:"start"}); }catch(error){ window.scrollTo(0,0); }
}

/*
 * Construye/actualiza el código QR de asistencia y el contador de
 * firmas de la pantalla de Evidencias. La asistencia ya no se sube
 * en PDF: cada participante firma escaneando este QR desde su
 * propio celular (ver registrarAsistenciaQR / paginaAsistenciaQR_
 * en Código.js).
 */
function actualizarQRAsistencia_(){
    aplicarEstadoMetodoAsistencia_();

    const nombreIE=String(getCampoNombreIE()||"").replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim();
    ["nombreIEAvisoAsistencia1","nombreIEAvisoAsistencia2"].forEach(function(id){
        const el=document.getElementById(id); if(el) el.textContent=nombreIE||"—";
    });

    const img=document.getElementById("qrAsistencia");
    if(!img) return;

    let idForo="";
    try{
        idForo=obtenerIdForo();
    }catch(error){
        idForo=String(localStorage.getItem(obtenerClaveIdForo())||"").trim();
    }
    if(!idForo || !URL_WEBAPP_PRODUCCION_CLIENTE) return;

    const urlAsistencia=URL_WEBAPP_PRODUCCION_CLIENTE+"?asistencia="+encodeURIComponent(idForo);
    // chart.googleapis.com (Google Charts) está descontinuado y ya no
    // sirve códigos QR — se reemplaza por api.qrserver.com, que sigue
    // funcionando y no requiere clave de API.
    img.src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data="+encodeURIComponent(urlAsistencia);
    img.dataset.urlAsistencia=urlAsistencia;

    const linkTexto=document.getElementById("linkAsistenciaQR");
    if(linkTexto){ linkTexto.href=urlAsistencia; linkTexto.textContent=urlAsistencia; }

    actualizarContadoresAsistenciaQR_(idForo, nombreIE);
}

/*
 * Contadores de participación/asistencia — se muestran tanto en
 * Evidencias como en la pantalla de generar informe (hasta ahí deben
 * seguir visibles, según lo pedido). Solo tienen sentido con el
 * método QR: con PDF no hay firmas individuales que contar.
 *
 * Bug corregido: antes esto se consultaba UNA sola vez (al entrar a
 * la pantalla), así que si alguien firmaba por QR mientras la
 * persona que diligencia el formulario seguía en Evidencias, el
 * conteo se quedaba "congelado" en 0 para siempre en esa pantalla.
 * Ahora, mientras Evidencias o la pantalla final estén visibles, se
 * vuelve a consultar solo cada 10s (generacionPollingContadoresQR_
 * evita que se acumulen varias cadenas de refresco en paralelo si
 * esta función se llama desde más de un punto a la vez).
 */
let generacionPollingContadoresQR_=0;
function actualizarContadoresAsistenciaQR_(idForo, nombreIE, esAutoRefresco){
    if(!esAutoRefresco) generacionPollingContadoresQR_++;
    const miGeneracion=generacionPollingContadoresQR_;
    const metodo=document.getElementById("metodoAsistencia")?.value||"";
    const totalCaracterizacion=getTotalParticipantes()||0;
    const textoCaracterizacion=totalCaracterizacion===1
        ? "1 participante reportado en este foro."
        : totalCaracterizacion+" participantes reportados en este foro.";

    ["conteoCaracterizacionQR","conteoCaracterizacionQRFinal"].forEach(function(id){
        const el=document.getElementById(id); if(el) el.textContent=textoCaracterizacion;
    });

    const btnFirmasFinal=document.getElementById("btnVerFirmasEnVivoFinal");
    const conteosFinal=[document.getElementById("conteoCaracterizacionQRFinal"),document.getElementById("conteoAsistentesQRFinal")];
    if(metodo!=="QR"){
        // Sin firmas por QR que contar (se eligió PDF): se ocultan los
        // contadores/botón de firmas en vivo de la pantalla final, en
        // vez de mostrarlos vacíos o engañosos.
        if(btnFirmasFinal) btnFirmasFinal.style.display="none";
        conteosFinal.forEach(function(el){ if(el) el.style.display="none"; });
        return;
    }
    if(btnFirmasFinal) btnFirmasFinal.style.display="";
    conteosFinal.forEach(function(el){ if(el) el.style.display=""; });

    ["conteoAsistentesQR","conteoAsistentesQRFinal"].forEach(function(id){
        const el=document.getElementById(id);
        if(el) el.textContent="Consultando firmas…";
    });

    google.script.run
        .withSuccessHandler(function(res){
            const texto=(!res || !res.ok)
                ? "No fue posible consultar las firmas."
                : (res.total===1 ? "1 persona ya firmó asistencia." : res.total+" personas ya firmaron asistencia.");
            ["conteoAsistentesQR","conteoAsistentesQRFinal"].forEach(function(id){
                const el=document.getElementById(id); if(el) el.textContent=texto;
            });
            programarSiguienteActualizacionContadoresQR_(idForo, nombreIE, miGeneracion);
        })
        .withFailureHandler(function(){
            ["conteoAsistentesQR","conteoAsistentesQRFinal"].forEach(function(id){
                const el=document.getElementById(id); if(el) el.textContent="No fue posible consultar las firmas.";
            });
            programarSiguienteActualizacionContadoresQR_(idForo, nombreIE, miGeneracion);
        })
        .contarAsistentesQR(idForo);
}

function programarSiguienteActualizacionContadoresQR_(idForo, nombreIE, generacion){
    // Una llamada más nueva (por ejemplo, al cambiar de pantalla) tomó
    // el control: esta cadena de refresco se detiene sola.
    if(generacion!==generacionPollingContadoresQR_) return;
    const evidenciasVisible=document.getElementById("pantallaEvidencias")?.classList.contains("visible");
    const finalVisible=document.getElementById("pantallaFinalFEM")?.classList.contains("visible");
    if(!evidenciasVisible && !finalVisible) return;
    setTimeout(function(){ actualizarContadoresAsistenciaQR_(idForo, nombreIE, true); }, 10000);
}

/*****************************************************
 * SELECTOR DE MÉTODO DE ASISTENCIA (QR vs. PDF)
 *
 * Un solo clic activa el método elegido; "Cambiar método" funciona
 * como un botón atrás, sin perder lo ya escrito en ninguno de los
 * dos si la persona cambia de opinión.
 *****************************************************/
function aplicarEstadoMetodoAsistencia_(){

    const eligioAlgo=metodo==="QR"||metodo==="PDF";

function elegirMetodoAsistencia_(metodo){

    if(campo){ campo.value=metodo; campo.dispatchEvent(new Event("change")); }
    aplicarEstadoMetodoAsistencia_();

function inicializarSelectorMetodoAsistencia_(){
    const btnQR=document.getElementById("btnElegirMetodoQR");
    const btnPDF=document.getElementById("btnElegirMetodoPDF");
    const btnCambiar=document.getElementById("btnCambiarMetodoAsistencia");
    if(btnQR && !btnQR.dataset.inicializado){ btnQR.dataset.inicializado="1"; btnQR.addEventListener("click",function(){ elegirMetodoAsistencia_("QR"); }); }
    if(btnPDF && !btnPDF.dataset.inicializado){ btnPDF.dataset.inicializado="1"; btnPDF.addEventListener("click",function(){ elegirMetodoAsistencia_("PDF"); }); }
    if(btnCambiar && !btnCambiar.dataset.inicializado){
        btnCambiar.dataset.inicializado="1";

            actualizarEstadoEvidencias();
            guardarBorradorLocal({silencioso:true});
        });
    }
    aplicarEstadoMetodoAsistencia_();
}

/*****************************************************
 * DESCARGAR EL CÓDIGO QR
 *
 * Como la imagen viene de api.qrserver.com (otro origen), se trae con
 * fetch() y se descarga como blob con el nombre pedido — un <a
 * download> directo sobre una URL externa no descarga, solo la abre.
 * Si el proveedor llegara a bloquear el fetch (CORS), se cae de
 * vuelta a abrir la imagen en una pestaña nueva para guardarla a mano.
 *****************************************************/
function inicializarDescargaQR_(){
    const btn=document.getElementById("btnDescargarQR");
    if(!btn || btn.dataset.inicializado==="1") return;
    btn.dataset.inicializado="1";

    btn.addEventListener("click", async function(){
        const img=document.getElementById("qrAsistencia");
        if(!img || !img.src) return;
        const nombreIE=String(getCampoNombreIE()||"").replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim();
        const urlAsistencia=img.dataset.urlAsistencia||"";
        const nombreArchivo=("Asistencia de Foro Educativo IE "+nombreIE+" Link "+urlAsistencia)
            .replace(/[\\/:*?"<>|]/g,"-")
            .slice(0,180) + ".png";

        try{
            const respuesta=await fetch(img.src);
            const blob=await respuesta.blob();
            const url=URL.createObjectURL(blob);
            const enlace=document.createElement("a");
            enlace.href=url; enlace.download=nombreArchivo;
            document.body.appendChild(enlace); enlace.click(); enlace.remove();
            setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        }catch(error){
            console.error("No fue posible descargar el QR, se abre en una pestaña nueva:",error);
            window.open(img.src,"_blank");
        }
    });
}

/*****************************************************
 * FIRMAS DE ASISTENCIA EN VIVO
 *
 * Modal reutilizable desde Evidencias y desde la pantalla de generar
 * informe (btnVerFirmasEnVivoEvidencias / btnVerFirmasEnVivoFinal):
 * lista, en tiempo real, quiénes ya firmaron por QR. Se refresca cada
 * 8 segundos mientras el modal está abierto y se detiene al cerrarlo.
 *****************************************************/
let intervaloFirmasEnVivo_=null;

function inicializarFirmasEnVivo_(){
    ["btnVerFirmasEnVivoEvidencias","btnVerFirmasEnVivoFinal"].forEach(function(id){
        const btn=document.getElementById(id);
        if(btn && !btn.dataset.inicializado){ btn.dataset.inicializado="1"; btn.addEventListener("click",abrirFirmasEnVivo_); }
    });
    const cerrar=document.getElementById("btnCerrarFirmasEnVivo");
    if(cerrar && !cerrar.dataset.inicializado){ cerrar.dataset.inicializado="1"; cerrar.addEventListener("click",cerrarFirmasEnVivo_); }

    const pantallaCompleta=document.getElementById("btnFirmasEnVivoPantallaCompleta");
    if(pantallaCompleta && !pantallaCompleta.dataset.inicializado){
        pantallaCompleta.dataset.inicializado="1";
        pantallaCompleta.addEventListener("click",async function(){
            const contenido=document.getElementById("modalFirmasEnVivoContenido");
            if(!contenido) return;
            try{
                if(!document.fullscreenElement) await contenido.requestFullscreen();
                else await document.exitFullscreen();
            }catch(error){ console.error("No fue posible mostrar las firmas en pantalla completa:",error); }
        });
    }
}

function abrirFirmasEnVivo_(){
    const modal=document.getElementById("modalFirmasEnVivo");
    if(!modal) return;
    modal.classList.add("visible");
    modal.setAttribute("aria-hidden","false");
    refrescarFirmasEnVivo_();
    if(intervaloFirmasEnVivo_) clearInterval(intervaloFirmasEnVivo_);
    intervaloFirmasEnVivo_=setInterval(refrescarFirmasEnVivo_, 8000);
}

function cerrarFirmasEnVivo_(){
    const modal=document.getElementById("modalFirmasEnVivo");
    if(modal){ modal.classList.remove("visible"); modal.setAttribute("aria-hidden","true"); }
    if(intervaloFirmasEnVivo_){ clearInterval(intervaloFirmasEnVivo_); intervaloFirmasEnVivo_=null; }
}

function refrescarFirmasEnVivo_(){
    let idForo="";
    try{ idForo=obtenerIdForo(); }catch(error){ idForo=String(localStorage.getItem(obtenerClaveIdForo())||"").trim(); }
    const resumen=document.getElementById("resumenFirmasEnVivo");
    const lista=document.getElementById("listaFirmasEnVivo");
    if(!idForo){ if(resumen) resumen.textContent="No fue posible identificar el registro."; return; }

    google.script.run
        .withSuccessHandler(function(res){
            if(!res || !res.ok){
                if(resumen) resumen.textContent="No fue posible consultar las firmas.";
                return;
            }
            if(resumen) resumen.textContent=(res.asistentes.length===1?"1 persona ha firmado":res.asistentes.length+" personas han firmado")+" — se actualiza automáticamente cada 8 segundos.";
            if(lista){
                lista.innerHTML = res.asistentes.length
                    ? res.asistentes.map(function(a){
                        return '<div class="filaFirmaEnVivo">'+
                            '<span class="filaFirmaEnVivoNombre">'+escapeHtml(a.nombre)+'</span>'+
                            '<span class="filaFirmaEnVivoDetalle">'+escapeHtml(a.cargo||"")+(a.rolForo?" · "+escapeHtml(a.rolForo):"")+'</span>'+
                            '<span class="filaFirmaEnVivoHora">'+escapeHtml(a.hora||"")+'</span>'+
                        '</div>';
                    }).join("")
                    : '<p class="despedidaFEMCierre">Todavía nadie ha firmado.</p>';
            }
        })
        .withFailureHandler(function(){
            if(resumen) resumen.textContent="No fue posible consultar las firmas.";
        })
        .obtenerListaAsistentesQR(idForo);
}

/*
 * Muestra la fotografía de evidencia ya registrada (si la hay) al
 * volver a esta pantalla — antes solo quedaba en un input oculto,
 * sin ningún indicio visual, y daba la impresión de haberse
 * perdido u obligaba a creer que había que subirla de nuevo.
 */
/*
 * foto.getUrl() (guardado en evidenciaFotoUrl) es el enlace normal de
 * "ver en Drive" — una página HTML, no una imagen — así que NUNCA
 * sirve como src de un <img>: el navegador simplemente no la muestra
 * (bug reportado: "no muestra imagen cargada"). Para previsualizar se
 * necesita el formato de imagen directa de Google (mismo patrón que
 * ya se usa para los logos de las IE, ver urlPublicaLogoDrive_ en
 * Código.js), construido aquí a partir del ID del archivo.
 */
function construirUrlImagenEmbebible_(fileId, ancho){
    fileId=String(fileId||"").trim();
    if(!fileId) return "";
    return "https://lh3.googleusercontent.com/d/"+fileId+"=w"+(ancho||1200);
}

function actualizarPreviaFotoEvidencia_(){
    const fotoId=document.getElementById("evidenciaFotoId")?.value||"";
    const url=construirUrlImagenEmbebible_(fotoId) || document.getElementById("evidenciaFotoUrl")?.value||"";
    const img=document.getElementById("previaFotoEvidencia");
    const texto=document.getElementById("textoFotoRegistrada");
    const pie=document.getElementById("pieFotoEvidencia");
    if(!img) return;
    if(url){
        img.src=url;
        img.style.display="block";
        if(texto) texto.style.display="block";
        if(pie){
            const fechaTexto=document.getElementById("evidenciaFotoFecha")?.value||"";
            const fecha=fechaTexto?new Date(fechaTexto):new Date();
            pie.textContent=construirPieFotoEvidenciaCliente_(fecha);
            pie.style.display="block";
        }
    }else{
        img.style.display="none";
        if(texto) texto.style.display="none";
        if(pie) pie.style.display="none";
    }
}
function actualizarEstadoEvidencias(){
    const foto=document.getElementById("archivoFoto")?.files?.[0];
    const subir=document.getElementById("btnSubirEvidencias");
    const okFoto=foto && ["image/jpeg","image/png"].includes(foto.type) && foto.size<=10*1024*1024;
    pintarEstadoArchivo("estadoFoto",foto,okFoto,"Imagen válida.","Seleccione JPG/PNG de máximo 10 MB.");

    /*
     * Además de la foto, hay que haber elegido un método de
     * asistencia — y si es PDF, tener el archivo y el número de
     * asistentes. El método QR no exige ningún archivo aquí: la
     * asistencia se firma aparte, por celular.
     */
    const metodo=document.getElementById("metodoAsistencia")?.value||"";
    let okAsistencia=metodo==="QR";
    if(metodo==="PDF"){
        const pdf=document.getElementById("archivoAsistenciaPDF")?.files?.[0];
        const numero=Number(document.getElementById("numeroAsistentesPDF")?.value||0);
        const yaSubido=!!document.getElementById("asistenciaPdfUrl")?.value;
        const okPdfArchivo=(pdf && pdf.type==="application/pdf" && pdf.size<=15*1024*1024) || (!pdf && yaSubido);
        okAsistencia=okPdfArchivo && numero>0;
        const estadoPdfEl=document.getElementById("estadoAsistenciaPDF");
        if(estadoPdfEl){
            if(pdf){
                pintarEstadoArchivo("estadoAsistenciaPDF", pdf, pdf.type==="application/pdf"&&pdf.size<=15*1024*1024, "PDF válido.", "Seleccione un archivo PDF de máximo 15 MB.");
            }else if(yaSubido){
                estadoPdfEl.textContent="✓ Ya hay un PDF de asistencia registrado. Si sube uno nuevo, lo reemplazará.";
                estadoPdfEl.className="estadoArchivo ok";
            }else{
                estadoPdfEl.textContent="";
                estadoPdfEl.className="estadoArchivo";
            }
        }
    }

    if(subir) subir.disabled=!(okFoto && okAsistencia);

    /*
     * Vista previa inmediata (antes de subir): se muestra debajo del
     * botón de elegir archivo apenas se selecciona la foto, sin
     * esperar a que termine de subirse.
     */
    if(okFoto){
        const img=document.getElementById("previaFotoEvidencia");
        const pie=document.getElementById("pieFotoEvidencia");
        const texto=document.getElementById("textoFotoRegistrada");
        if(img){
            img.src=URL.createObjectURL(foto);
            img.style.display="block";
        }
        if(pie){
            pie.textContent=construirPieFotoEvidenciaCliente_(new Date());
            pie.style.display="block";
        }
        if(texto) texto.style.display="none";
    }else if(!foto){
        // Se deseleccionó sin elegir una nueva: volver a mostrar la
        // que ya estuviera subida (si la hay).

function mostrarMensajeEvidencias(msg){ const el=document.getElementById("mensajeEvidencias"); if(el){el.textContent=msg;el.style.display="block";} }
function leerArchivoDataURL(file){
    return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });

function esperar_(ms){ return new Promise(r=>setTimeout(r,ms)); }

/*****************************************************
 * INDICADOR DE PROGRESO CON GIF
 * Usado en: subir evidencias (flotante, no bloquea — no debe tapar
 * el QR de asistencia), enviar respuestas de una sesión en la
 * plenaria, "Preparando informe" (enviarForoDefinitivo) y
 * "Generando informe" (generarInformeFEM). google.script.run no
 * entrega progreso real de la operación, así que la barra avanza de
 * forma simulada (roja → amarilla → verde, reutilizando
 * calcularColorBarraProgreso_) hasta el 90% mientras se espera la
 * respuesta del servidor, y salta a 100% verde al terminar.
 *****************************************************/

let overlayProgresoActivo_ = null;

function mostrarOverlayProgreso_(gifUrl, texto, opciones){
    ocultarOverlayProgreso_(true);

    opciones = opciones || {};

    const overlay = document.createElement("div");
    overlay.className = "overlayProgresoFEM" + (opciones.flotante ? " overlayProgresoFlotante" : "");
    overlay.innerHTML =
        '<div class="overlayProgresoTarjeta">' +
            (gifUrl ? '<img src="' + gifUrl + '" alt="" class="overlayProgresoGif">' : '') +
            (texto ? '<p class="overlayProgresoTexto">' + texto + '</p>' : '') +
            '<div class="overlayProgresoBarraFondo"><div class="overlayProgresoBarraRelleno"></div></div>' +
        '</div>';
    document.body.appendChild(overlay);

    const relleno = overlay.querySelector(".overlayProgresoBarraRelleno");
    const inicio = Date.now();
    const duracion = opciones.duracionMs || 6000;

    const intervalo = setInterval(function(){
        const transcurrido = Date.now() - inicio;
        const pct = Math.min(90, (transcurrido / duracion) * 90);
        relleno.style.width = pct + "%";
        relleno.style.backgroundColor = calcularColorBarraProgreso_(pct, 45, 90);
    }, 150);

    overlayProgresoActivo_ = { overlay: overlay, intervalo: intervalo, relleno: relleno };
}

function mostrarModalContinuarInforme_(){
    document.getElementById("modalContinuarInformeFEM")?.classList.add("visible");
}

function ocultarOverlayProgreso_(sinCompletar){
    if(!overlayProgresoActivo_) return;
    clearInterval(overlayProgresoActivo_.intervalo);
    const overlay = overlayProgresoActivo_.overlay;
    if(!sinCompletar){
        overlayProgresoActivo_.relleno.style.width = "100%";
        overlayProgresoActivo_.relleno.style.backgroundColor = "rgb(0,200,83)";
        setTimeout(function(){ overlay.remove(); }, 350);
    }else{
        overlay.remove();
    }
    overlayProgresoActivo_ = null;
}

async function subirEvidenciasFEM(){
    const foto=document.getElementById("archivoFoto")?.files?.[0];
    const btn=document.getElementById("btnSubirEvidencias");
    const metodoAsistenciaElegido=document.getElementById("metodoAsistencia")?.value||"";
    if(!foto || !metodoAsistenciaElegido){actualizarEstadoEvidencias();return;}
    btn.disabled=true; btn.textContent="Registrando…";
    mostrarOverlayProgreso_(
        "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3Z200YzZoNnpwajM5b3N5dWlob3IwZHdkeDc3bnlwMnlkbWl5OGRqciZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/cV4LUYbSFpDrIdOmIh/giphy.gif",
        "Subiendo fotografía…",
        {flotante:true, duracionMs:5000}
    );
    try{
        const datos=obtenerDatosFormularioActual_();
        if(!datos || !String(datos.idForo||"").trim()){
            /*
             * Si esto vuelve a ocurrir, el estado real de
             * window.DATOS_ACCESO_FEM queda en la consola del
             * navegador (F12) para diagnosticar la causa exacta,
             * sin exponer ese detalle técnico al usuario final.
             */
            try{
                console.error(
                    "subirEvidenciasFEM: idForo ausente. DATOS_ACCESO_FEM=",
                    window.DATOS_ACCESO_FEM
                );
            }catch(diagErr){
                console.error("subirEvidenciasFEM: idForo ausente y no se pudo serializar DATOS_ACCESO_FEM:", diagErr);
            }
            throw new Error("No fue posible recuperar el ID_FORO de la institución autenticada. Regrese al acceso e ingrese nuevamente el código.");
        }
        const fotoData=await leerArchivoDataURL(foto);

        /*
         * Si se pierde la conexión a mitad de la subida, no debe
         * quedar en un estado confuso donde parece que "no pasó
         * nada": se reintenta unas pocas veces (típico de una señal
         * intermitente), y si de verdad no hay forma de subirla, se
         * avisa explícitamente que la fotografía NUEVA no quedó
         * guardada y que sigue registrada la anterior — nunca se
         * deja pensando que sí se actualizó cuando no fue así.
         */
        let resultado=null, ultimoError=null;
        for(let intento=1; intento<=3; intento++){
            try{
                resultado=await new Promise((resolve,reject)=>{
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).subirEvidenciasFEM(
                        datos.idForo, fotoData, foto.name, foto.type, datos
                    );
                });
                ultimoError=null;
                break;
            }catch(err){
                ultimoError=err;
                if(intento<3){
                    btn.textContent="Reintentando ("+intento+"/3)…";
                    await esperar_(1500*intento);
                }
            }
        }
        if(ultimoError){
            throw new Error(
                "No fue posible subir la nueva fotografía por un problema de conexión, después de varios intentos. " +
                "Sigue registrada la fotografía anterior (si había una). Verifique su conexión a Internet e intente de nuevo."
            );
        }
        if(!resultado || !resultado.ok) throw new Error(resultado?.mensaje||"No fue posible registrar las evidencias.");
        document.getElementById("evidenciaFotoUrl").value=resultado.foto.url;
        document.getElementById("evidenciaFotoId").value=resultado.foto.id;
        if(document.getElementById("evidenciaFotoFecha")) document.getElementById("evidenciaFotoFecha").value=new Date().toISOString();
        actualizarPreviaFotoEvidencia_();

        /*
         * Si el método elegido fue PDF, subirlo también (la foto ya
         * quedó registrada arriba, independientemente del método de
         * asistencia).
         */
        let mensajeFinal="✓ Fotografía registrada. La asistencia se sigue firmando por QR — puede continuar a la plenaria mientras tanto.";
        if(metodoAsistenciaElegido==="PDF"){
            const archivoPdf=document.getElementById("archivoAsistenciaPDF")?.files?.[0];
            if(archivoPdf){
                btn.textContent="Subiendo PDF de asistencia…";
                const pdfData=await leerArchivoDataURL(archivoPdf);
                const resultadoPdf=await new Promise((resolve,reject)=>{
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
                        .subirAsistenciaPDF(datos.idForo, pdfData, archivoPdf.name, datos);
                });
                if(!resultadoPdf || !resultadoPdf.ok) throw new Error(resultadoPdf?.mensaje||"No fue posible subir el PDF de asistencia.");
                document.getElementById("asistenciaPdfUrl").value=resultadoPdf.pdf.url;
                document.getElementById("asistenciaPdfId").value=resultadoPdf.pdf.id;
            }
            mensajeFinal="✓ Fotografía y PDF de asistencia registrados. Puede continuar a la plenaria.";
        }

        const campos=["evidenciaFotoUrl","evidenciaFotoId","evidenciaFotoFecha","metodoAsistencia","asistenciaPdfUrl","asistenciaPdfId","numeroAsistentesPDF"];
        campos.forEach(id=>document.getElementById(id)?.dispatchEvent(new Event("change")));
        guardarBorradorLocal({silencioso:true});
        mostrarMensajeEvidencias(mensajeFinal);
        document.getElementById("btnContinuarDesdeEvidencias").disabled=false;
        btn.textContent="✓ Evidencias registradas";
        ocultarOverlayProgreso_();
    }catch(e){
        console.error(e); mostrarMensajeEvidencias("⚠ "+(e.message||e)); btn.disabled=false; btn.textContent="⬆️ Registrar evidencias";
        ocultarOverlayProgreso_(true);
    }
}

/*
 * Pie de página de la fotografía de evidencias: mismo texto en la
 * pantalla de Evidencias (antes y después de subir), en la
 * plenaria, y en el cuerpo del informe (ese lo arma Código.js con

 * fecha guardada al subir, o el momento actual como aproximación
 * antes de subir).
 */
function formatearFechaFotoEvidenciaCliente_(fecha){
    const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const dia=String(fecha.getDate()).padStart(2,"0");
    const mes=meses[fecha.getMonth()]||"";
    const mesCapitalizado=mes.charAt(0).toUpperCase()+mes.slice(1);
    const anio=fecha.getFullYear();
    const hora=String(fecha.getHours()).padStart(2,"0")+":"+String(fecha.getMinutes()).padStart(2,"0");
    return dia+"-"+mesCapitalizado+"-"+anio+", a las "+hora;
}

function construirPieFotoEvidenciaCliente_(fecha){
    const ieSinPrefijo=getCampoNombreIE().replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim();
    return "Imagen 1: Docentes de la IE "+ieSinPrefijo+" en actividad del Foro Educativo Institucional — Neiva 2026 (fecha "+formatearFechaFotoEvidenciaCliente_(fecha)+").";
}

     */
    let paginaDestino = 0;
    if(opciones.irASesion){
        const indice = plenariaPaginas.findIndex(p=>p.sesion===opciones.irASesion);
        paginaDestino = indice>=0 ? indice : plenariaPaginas.length-1;
    }else{
        /*
         * Si al entrar (o reingresar) las tres sesiones ya estaban
         * enviadas de antes, no tiene sentido obligar a recorrer
         * pregunta por pregunta una revisión ya cerrada y de solo
         * lectura: se va directo a la última página, para que
         * "Continuar" pase al informe final con un solo clic —
         * igual que cuando se acaba de enviar la Sesión 3.
         */
        const sesionesEnviadas = window._FEM_SESIONES_ENVIADAS || {};
        if(sesionesEnviadas[1] && sesionesEnviadas[2] && sesionesEnviadas[3]){
            paginaDestino = plenariaPaginas.length - 1;
        }
    }
    prepararSecuenciaPlenaria(paginaDestino);
    actualizarBotonesPlenaria();
}

function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function escapeAttr(s){return escapeHtml(s);}
function sesionEnviadaLocal(sesion){ return !!window._FEM_SESIONES_ENVIADAS?.[sesion]; }
function prepararSecuenciaPlenaria(paginaInicial){
    const pages=Array.prototype.slice.call(document.querySelectorAll("#plenariaContenido .plenariaPagina"));
    /*
     * Una página queda habilitada (se puede llegar a ella con
     * "Continuar" o con los números de arriba) si es la primera,
     * si sus respuestas ya fueron enviadas definitivamente (se
     * muestra solo de referencia), o si la página anterior ya lo
     * está. Así, después de reenviar una sesión y reconstruir la
     * plenaria, todo lo ya enviado sigue siendo navegable y la
     * primera pregunta pendiente queda inmediatamente disponible
     * — no hace falta volver a "descubrir" nada con el scroll.
     */
    pages.forEach((p,i)=>{
        const meta=plenariaPaginas[i]||{};
        const previa=plenariaPaginas[i-1];
        const previaEnviada = i>0 && previa && previa.sent;
        p.classList.toggle("habilitada", i===0 || !!meta.sent || previaEnviada);
    });
    // Siempre se puede llegar, al menos, a la página siguiente a la actual.
    if(pages[1]) pages[1].classList.add("habilitada");
    pages.forEach((p,i)=>{
        const sentinel=document.createElement("div"); sentinel.className="sentinelPlenaria"; p.appendChild(sentinel);
        const obs=new IntersectionObserver(entries=>{ entries.forEach(en=>{ if(en.isIntersecting && i+1<pages.length){ pages[i+1].classList.add("habilitada"); } }); },{threshold:.15}); obs.observe(sentinel);
    });
    const destino = (typeof paginaInicial==="number" && pages[paginaInicial]) ? paginaInicial : 0;
    plenariaPaginaActual = destino;
    if(pages[destino]){
        pages[destino].classList.add("habilitada");
        if(pages[destino+1]) pages[destino+1].classList.add("habilitada");
        pages[destino].scrollIntoView({behavior:"instant",block:"start"});
    }
    actualizarBotonesPlenaria();
}
function plenariaIrA(i){
    const pages=Array.prototype.slice.call(document.querySelectorAll("#plenariaContenido .plenariaPagina"));
    if(i<0||i>=pages.length) return;
    if(!pages[i].classList.contains("habilitada")) return;
    plenariaPaginaActual=i;
    /*
     * Desbloquear de inmediato la página siguiente en vez de
     * esperar a que el observador de scroll la detecte: con
     * scrollIntoView({behavior:"instant"}) o con animaciones
     * cortas el observador no siempre alcanza a dispararse antes
     * de que el usuario vuelva a hacer clic en "Continuar", y el
     * botón quedaba sin efecto aparente.
     */
    if(pages[i+1]) pages[i+1].classList.add("habilitada");
    pages[i].scrollIntoView({behavior:"smooth",block:"start"});
    actualizarBotonesPlenaria();
}
function actualizarBotonesPlenaria(){
    /*
     * "Anterior" (vuelve a Evidencias) y "Continuar" (intenta generar
     * el informe final) ya no dependen de en qué pregunta de la
     * plenaria se está — ver sus click handlers en inicializarPlenaria.
     * Moverse entre preguntas es tarea exclusiva de los números de la
     * barra de navegación de arriba.
     */
    document.querySelectorAll("#plenariaNavegacion button").forEach((b,i)=>b.classList.toggle("activo",i===plenariaPaginaActual));
}

function insertarBotonesEnvioSesion(){

    seps.forEach((sep,idx)=>{

        sep.appendChild(b); b.disabled=ses>1 && !window._FEM_SESIONES_ENVIADAS?.[ses-1];
        b.addEventListener("click",async()=>{
            if(window._FEM_SESIONES_ENVIADAS?.[ses]) return;
                        const confirmado=await confirmarFEM(
                "¿Está seguro de enviar sus respuestas? Una vez enviadas no podrán modificarse.",
                {titulo:`Enviar respuestas de Sesión ${ses}`}
            );
            if(!confirmado) return;
            b.disabled=true; b.textContent="Enviando…";
            mostrarOverlayProgreso_(
                "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3azZjM2xiazltNWVhNmcwMXVtaDF2eGZoMG1vZ2g1cTV4bTJsYTE5dyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/UX0cPFtehDrVtvuwit/giphy.gif",
                `Enviando respuestas de Sesión ${ses}…`,
                {duracionMs:4000}
            );
            try{
                const r=await enviarSesionPlenaria(ses); if(!r?.ok) throw new Error(r?.mensaje||"No fue posible enviar la sesión.");
                window._FEM_SESIONES_ENVIADAS=window._FEM_SESIONES_ENVIADAS||{}; window._FEM_SESIONES_ENVIADAS[ses]=true;
                ocultarOverlayProgreso_();
                renderizarPlenaria({irASesion:ses+1});
                mostrarEstadoGuardado(`✅ Respuestas de Sesión ${ses} enviadas definitivamente.`);
            }catch(e){
                ocultarOverlayProgreso_(true);
                b.disabled=false; b.textContent=`📤 Enviar respuestas de Sesión ${ses}`; alert(e.message||e);
            }
        });
    });
}

async function finalizarFEMUI(){

    const b=document.getElementById("btnFinalizarFEM");b.disabled=true;b.textContent="Cerrando…";

    }catch(e){b.disabled=false;b.textContent="🔒 Finalizar y cerrar el formulario";mostrarEstadoInformeFinal("⚠ "+(e.message||e));}}

function obtenerDispositivoIdFEM(){
    const k="foroEducativoNeiva2026_dispositivo";
    let id=localStorage.getItem(k);
    if(!id){
        id="FEM-DEV-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
        localStorage.setItem(k,id);
    }
    return id;
}
