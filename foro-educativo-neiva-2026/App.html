/*****************************************************
 * INTRODUCCIÓN VISUAL DE BIENVENIDA
 *
 * Secuencia única y controlada (una sola función, no varios
 * setTimeout dispersos): aparece la imagen institucional del FEM dentro de la
 * propia tarjeta de bienvenida, se mantiene un instante, se
 * desvanece, y solo entonces aparece el mensaje personalizado y se
 * habilita "Continuar". Se protege contra ejecutarse más de una vez
 * por carga de página (varios puntos del flujo pueden terminar
 * mostrando Bienvenida) y nunca deja la pantalla bloqueada si la
 * imagen falla o tarda: hay un límite de tiempo de seguridad.
 *****************************************************/

let bienvenidaIntroInicializada = false;

function capitalizarNombreIEVista_(nombre){
    return String(nombre || "")
        .toLowerCase()
        .replace(/(^|\s)\S/g, function(letra){ return letra.toUpperCase(); });
}

function initializeWelcomeIntro(){

    if(bienvenidaIntroInicializada) return;
    bienvenidaIntroInicializada = true;

    try{

        const nombreIE =
            typeof NOMBRE_IE_ACCESO !== "undefined"
                ? String(NOMBRE_IE_ACCESO || "").trim()
                : "";

        const spanNombreIE = document.getElementById("bienvenidaNombreIE");
        if(spanNombreIE) spanNombreIE.textContent = nombreIE ? capitalizarNombreIEVista_(nombreIE) : "su institución";

        const escenario = document.getElementById("bienvenidaEscenario");
        const visual = document.getElementById("bienvenidaIntroVisual");
        const imagen = document.getElementById("bienvenidaIntroImagen");
        const contenido = document.getElementById("bienvenidaContenido");
        const boton = document.getElementById("btnComenzar");

        function revelarContenido(){
            if(contenido) contenido.classList.add("bienvenidaContenidoVisible");
            if(visual) visual.style.display = "none";
            if(boton) boton.disabled = false;
        }

        if(!escenario || !visual || !imagen || !contenido || !boton){
            // Si falta algún elemento, no se bloquea la pantalla.
            if(boton) boton.disabled = false;
            if(contenido) contenido.classList.add("bienvenidaContenidoVisible");
            return;
        }

        const prefiereMenosMovimiento =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if(prefiereMenosMovimiento || !imagen.getAttribute("src")){
            revelarContenido();
            return;
        }

        // Salvavidas: si la imagen no carga, tarda demasiado, o el
        // evento animationend no llega a dispararse por cualquier
        // motivo, igual se revela el contenido dentro del máximo de
        // 3 segundos prometido.
        let yaResuelto = false;
        const salvavidasMs = 2600;
        const salvavidas = setTimeout(function(){
            if(yaResuelto) return;
            yaResuelto = true;
            revelarContenido();
        }, salvavidasMs);

        function iniciarSecuenciaVisual(){
            visual.classList.add("welcomeIntroVisualActivo");
        }

        visual.addEventListener("animationend", function(){
            if(yaResuelto) return;
            yaResuelto = true;
            clearTimeout(salvavidas);
            revelarContenido();
        }, { once:true });

        if(imagen.complete && imagen.naturalWidth > 0){
            iniciarSecuenciaVisual();
        }else{
            imagen.addEventListener("load", iniciarSecuenciaVisual, { once:true });
            imagen.addEventListener("error", function(){
                if(yaResuelto) return;
                yaResuelto = true;
                clearTimeout(salvavidas);
                revelarContenido();
            }, { once:true });
        }

    }catch(error){

        console.error("No fue posible iniciar la introducción de bienvenida:", error);

        // Ante cualquier error inesperado, nunca se deja la pantalla
        // bloqueada: se revela todo de inmediato.
        const contenidoEmergencia = document.getElementById("bienvenidaContenido");
        const botonEmergencia = document.getElementById("btnComenzar");
        const visualEmergencia = document.getElementById("bienvenidaIntroVisual");
        if(contenidoEmergencia) contenidoEmergencia.classList.add("bienvenidaContenidoVisible");
        if(visualEmergencia) visualEmergencia.style.display = "none";
        if(botonEmergencia) botonEmergencia.disabled = false;

    }

}

/*****************************************************
 * APERTURA DE SESIÓN 1
 *
 * "Primera Sesión" y su subtítulo NO se duplican: son el mismo
 * título/subtítulo que ya vive en el flujo normal de la pantalla.
 * Durante la apertura se les agregan clases a #pantallaSesion1 que
 * los sacan a un overlay centrado de pantalla completa, uno a la
 * vez (CSS puro); al terminar, esas clases se quitan y vuelven
 * exactamente a su posición normal, sin duplicar contenido.
 *
 * Se protege contra ejecutarse más de una vez por carga de página
 * (puede dispararse tanto al navegar normalmente a Sesión 1 como al
 * restaurar una sesión guardada que ya estaba ahí).
 *****************************************************/

let sesion1AperturaInicializada = false;

function iniciarAperturaSesion1(){

    if(sesion1AperturaInicializada) return;
    sesion1AperturaInicializada = true;

    try{

        const pantalla = document.getElementById("pantallaSesion1");
        const tituloApertura = document.getElementById("sesion1AperturaTitulo");
        const subtituloApertura = document.getElementById("sesion1AperturaSubtitulo");
        const contenido = document.getElementById("sesion1Contenido");

        if(!pantalla || !tituloApertura || !subtituloApertura || !contenido) return;

        function terminarAperturaSesion1(){
            pantalla.classList.remove("sesion1EnApertura", "sesion1FaseTitulo", "sesion1FaseSubtitulo");
        }

        const prefiereMenosMovimiento =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if(prefiereMenosMovimiento){
            // El contenido ya está visible por defecto (solo se oculta
            // cuando se agrega sesion1EnApertura): no hace falta nada.
            return;
        }

        pantalla.classList.add("sesion1EnApertura", "sesion1FaseTitulo");

        setTimeout(function(){
            try{
                pantalla.classList.remove("sesion1FaseTitulo");
                pantalla.classList.add("sesion1FaseSubtitulo");

                setTimeout(function(){
                    try{ terminarAperturaSesion1(); }
                    catch(error){ terminarAperturaSesion1(); }
                }, 3000);

            }catch(error){ terminarAperturaSesion1(); }
        }, 1900);

    }catch(error){

        console.error("No fue posible iniciar la apertura de Sesión 1:", error);

        const pantallaEmergencia = document.getElementById("pantallaSesion1");
        if(pantallaEmergencia){
            pantallaEmergencia.classList.remove("sesion1EnApertura", "sesion1FaseTitulo", "sesion1FaseSubtitulo");
        }

    }

}

/*****************************************************

function obtenerGrupoInstitucion(nombreInstitucion){

    if(!nombreInstitucion){
        return "";
    }

    function normalizar(texto){

        return texto
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[.,]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();

    }

    const nombreNormalizado =
        normalizar(nombreInstitucion);


    for(const grupo in GRUPOS_INSTITUCIONES){

        const encontrada =
            GRUPOS_INSTITUCIONES[grupo].some(
                function(nombreIE){

                    return normalizar(nombreIE)
                        === nombreNormalizado;

                }
            );

        if(encontrada){
            return grupo;
        }

    }

    console.warn(
        "No se encontró grupo para:",
        nombreInstitucion
    );

    return "";

}

        contenedor.innerHTML = `

            <div class="recorridoIcono">
                ${tarjeta.icono}
            </div>

            <h3>
                ${tarjeta.titulo}
            </h3>

                ¿Qué haremos?
            </p>

            <p>
                ${tarjeta.que}
            </p>

            <p class="recorridoPregunta">
                ¿Qué debemos tener listo?
            </p>

            <p>
                ${tarjeta.preparado}
            </p>

            <p class="recorridoPregunta">
                ¿Para qué sirve esta etapa?
            </p>

            <p>
                ${tarjeta.paraQue}
            </p>

            <p class="recorridoFrase">
                ${tarjeta.frase}
            </p>

        `;


        /* ACTUALIZAR CONTADOR */

        document.getElementById("contadorRecorrido")
            .textContent =
            (tarjetaRecorridoActual + 1) +
            " de " +
            tarjetasRecorrido.length;


        /* BOTÓN ANTERIOR */

        document.getElementById("btnRecorridoAnterior")
            .disabled =
            tarjetaRecorridoActual === 0;


        /* ÚLTIMA TARJETA */

        if(
            tarjetaRecorridoActual ===
            tarjetasRecorrido.length - 1
        ){

            document.getElementById(
                "btnRecorridoSiguiente"
            ).style.display = "none";

            document.getElementById(
                "btnIniciarRecorrido"

        }else{

        /* Forzar el navegador a reconocer el estado inicial */

 * CAMBIAR PANTALLA
 *****************************************************/

function cambiarPantalla(actual,nueva,paso){

    if(accesoEstaAutorizadoFEM()){

        guardarBorradorLocal({
            silencioso:true
        });

    }

    document
        .querySelectorAll(".pantalla")
        .forEach(function(pantalla){
            pantalla.classList.remove("visible");
        });

    const nuevaPantalla =
        document.getElementById(nueva);

    if(!nuevaPantalla){
        console.error("No existe la pantalla:", nueva);
        return;
    }

    nuevaPantalla.classList.add("visible");

    /*
     * Sin esto, el navegador conserva la posición de scroll de
     * la pantalla anterior. Como todas las pantallas viven en el
     * mismo documento largo, el usuario podía terminar viendo un
     * punto intermedio o el final de la pantalla nueva y creer
     * que el botón "Atrás"/"Continuar" no hizo nada.
     */
    try{
        nuevaPantalla.scrollIntoView({behavior:"instant",block:"start"});
    }catch(error){
        window.scrollTo(0,0);
    }

    pantallaActual = Number(paso);

    actualizarBarra();

    guardarBorradorLocal({silencioso:true});

    if(nueva === "pantallaSesion1" && typeof iniciarAperturaSesion1 === "function") {
        iniciarAperturaSesion1();
    }

    if(nueva === "pantallaSesion3") {
        setTimeout(mostrarRecordatorioSesion3, 120);
    }

    if(nueva === "pantallaEvidencias") {
        setTimeout(actualizarQRAsistencia_, 50);
        actualizarPreviaFotoEvidencia_();
    }

    if(nueva === "pantallaFinalFEM") {
        // Los contadores de participación/firmas deben seguir
        // visibles hasta esta pantalla de generar informe.
        setTimeout(function(){
            let idForo=""; try{ idForo=obtenerIdForo(); }catch(e){}
            actualizarContadoresAsistenciaQR_(idForo);
        }, 50);
    }

    if(nueva === "pantallaPlenaria") {
        setTimeout(renderizarPlenaria, 80);
    }

}

/*
 * Transición entre sesiones (1→2→3→pregunta S4→S4→Evidencias): el
 * escudo de la IE aparece suavemente, se sostiene un instante y se
 * desvanece hacia la pantalla nueva — menos de 3 segundos en total.
 * El cambio de pantalla real ocurre de inmediato, oculto detrás del
 * overlay (que empieza opaco), así que no hay ningún salto brusco
 * cuando el escudo termina de desvanecerse.
 */
function transicionSesionConEscudo_(actual, nueva, paso){
    const logoUrl = (typeof LOGO_IE_URL !== "undefined" && LOGO_IE_URL) ? LOGO_IE_URL : "";

    cambiarPantalla(actual, nueva, paso);

    if(!logoUrl) return; // sin escudo cargado, no hay nada que animar

    const overlay=document.createElement("div");
    overlay.className="transicionEscudoIE";
    overlay.innerHTML='<img src="'+logoUrl+'" class="transicionEscudoImg" alt="">';
    document.body.appendChild(overlay);

    requestAnimationFrame(function(){
        requestAnimationFrame(function(){ overlay.classList.add("visible"); });
    });
    setTimeout(function(){ overlay.classList.remove("visible"); }, 1300);
    setTimeout(function(){ overlay.remove(); }, 2100);
}

function cargarInstituciones(){

                error && error.message
                    ? error.message

            console.error(
                "No fue posible cargar las instituciones:",
                detalle,
                error
            );

            const aviso = document.getElementById("mensajeInstituciones");
            if(aviso){
                aviso.textContent =
                    "No fue posible cargar automáticamente las instituciones. " + detalle;
                aviso.style.display = "block";
            }

        })
        .obtenerInstitucionesJSON();

}


/*****************************************************
 * RECIBIR INSTITUCIONES
 *****************************************************/

function recibirInstituciones(json){

    try{

        instituciones =
            typeof json === "string"
                ? JSON.parse(json)
                : (json || {});

    }catch(error){

        console.error(
            "Error interpretando las instituciones:",
            error
        );

        instituciones = {};

        return;

    }


    const lista =
        document.getElementById(
            "listaInstituciones"
        );

    if(lista){

        lista.innerHTML = "";

        Object.keys(instituciones)
            .sort()
            .forEach(function(nombre){

                const option =
                    document.createElement("option");

                option.value =
                    nombre;

                lista.appendChild(option);

            });

    }


    const campo =
        document.getElementById(
            "institucion"
        );

    if(campo){

        /*
         * input cubre la selección de datalist
         * y change cubre otros navegadores.
         */
        if(
            campo.dataset.institucionListeners !== "1"
        ){

            campo.addEventListener(
                "input",
                seleccionarInstitucion
            );

            campo.addEventListener(
                "change",
                seleccionarInstitucion
            );

            campo.dataset.institucionListeners =
                "1";

        }

    }


    /*
     * Si la autenticación ya ocurrió antes de
     * terminar de cargar Oficiales, completar
     * ahora los datos de la IE.
     */
    if(
        window.DATOS_ACCESO_FEM &&
        window.DATOS_ACCESO_FEM.ok === true
    ){

        aplicarDatosAccesoFEM();

    }

}


/*****************************************************
 * APLICAR DATOS DEL ACCESO AUTORIZADO
 *****************************************************/

function aplicarDatosAccesoFEM(){

    const acceso =
        window.DATOS_ACCESO_FEM;

    if(
        !acceso ||
        acceso.ok !== true
    ){

        return false;

    }


    const ie =
        String(
            acceso.ie || ""
        ).trim();

    if(!ie){
        return false;
    }


    const datosIE =
        acceso.datosIE ||
        instituciones[ie] ||
        {};


    institucionSeleccionada =
        ie;


    const campoInstitucion =
        document.getElementById(
            "institucion"
        );

    if(campoInstitucion){

        campoInstitucion.value =
            ie;

        /*
         * En un enlace personalizado la IE
         * no puede ser cambiada.
         */
        campoInstitucion.readOnly =
            true;

    }


    const dane =
        document.getElementById("dane");

    if(dane){

        dane.value =
            String(
                acceso.dane ||
                datosIE.dane ||
                ""
            ).trim();

        dane.readOnly = true;

    }


    const rector =
        document.getElementById("rector");

    if(rector){

        rector.value =
            datosIE.rector || "";

    }


    const direccion =
        document.getElementById("direccion");

    if(direccion){

        direccion.value =
            datosIE.direccion || "";

    }


    const zona =
        document.getElementById("zona");

    if(zona){

        zona.value =
            datosIE.zona || "";

    }


    const comuna =
        document.getElementById("comuna");

    if(comuna){

        comuna.value =
            datosIE.comuna || "";

    }


    const correoIE =
        document.getElementById("correoIE");

    if(correoIE){

        correoIE.value =
            datosIE.correo || "";

    }


    const grupo =
        document.getElementById("grupo");

    if(grupo){

        grupo.value =
            obtenerGrupoInstitucion(
                ie
            );

    }


    /*
     * Recalcular resumen y total.
     */
    try{
        actualizarTotalParticipantes();
    }catch(error){
        console.error(error);
    }


    return true;

}

function seleccionarInstitucion(){

    const campo =
        document.getElementById(
            "institucion"
        );


    if(!campo) return;


    const nombre =
        campo.value
            .trim();


    /*
     * Si está vacío,
     * limpiar todos los datos.
     */

    if(nombre === ""){

        limpiarDatosInstitucion();

        return;

    }


    /*
     * Buscar coincidencia exacta.
     */

    let datosEncontrados =
        instituciones[nombre];

     * Si no existe exactamente,
     * buscar ignorando mayúsculas/minúsculas.
     */

    if(!datosEncontrados){

        const clave =
            Object.keys(
                instituciones
            ).find(
                function(nombreInstitucion){

                    return nombreInstitucion
                        .trim()
                        .toLowerCase()
                        ===
                        nombre
                            .toLowerCase();

            );

            datosEncontrados =
                instituciones[

                ];

            function(nombreInstitucion){

                    .trim()
                    .toLowerCase()
                    ===
                    nombre
                        .toLowerCase();

            }
        ) || nombre;

if(grupo){

function validarCaracterizacion(){

    const campos = [

        {id:"institucion", nombre:"Institución Educativa"},
        {id:"nombre", nombre:"Nombre de quien diligencia el instrumento"},
        {id:"correo", nombre:"Correo electrónico personal"},
        {id:"cargo", nombre:"Cargo"},
        {id:"rolForoResponsable", nombre:"Rol dentro del Foro"}

    ];

    let errores = [];

    document
        .querySelectorAll(".campoError")
        .forEach(function(c){

            c.classList.remove("campoError");

        });

    campos.forEach(function(c){

        const control = document.getElementById(c.id);

        if(control.value.trim() == ""){

            errores.push(c.nombre);

            control.classList.add("campoError");

        }

    });

    const mensaje =
        document.getElementById("mensajeValidacion");

    if(errores.length){

        mensaje.style.display = "block";

        mensaje.innerHTML =
            "<b>Debe completar los siguientes campos:</b><br><br>• "
            + errores.join("<br>• ");

        /*
         * No basta con listar arriba cuáles campos faltan: hay que
         * llevar a la persona hasta ahí. Se lleva al mensaje de error
         * primero (para que vea la lista completa) y, medio segundo
         * después, al primer campo marcado en rojo, donde además
         * queda el foco listo para escribir.
         */
        mensaje.scrollIntoView({behavior:"smooth", block:"center"});
        const primerCampoConError = document.querySelector(".campoError");
        if(primerCampoConError){
            setTimeout(function(){
                primerCampoConError.scrollIntoView({behavior:"smooth", block:"center"});
                primerCampoConError.focus();
            }, 500);
        }

        return;

    }

    mensaje.style.display = "none";

    mostrarResumen();
    }

        rCorreo: "correo",

    };

    Object.keys(camposResumen).forEach(function(idResumen){

        const resumen = document.getElementById(idResumen);
        const campo = document.getElementById(camposResumen[idResumen]);

        if(resumen && campo){
            resumen.textContent = campo.value || "";
        }

    });

    const participantes = [
        "Rector",
        "Coordinador",
        "Docentes",

        "Orientador",
        "Estudiantes",
        "Padres",
        "Administrativos",
        "Egresados",
        "Sector",
        "Otros"
    ];

    let total = 0;

    participantes.forEach(function(tipo){

        const campo =
            document.getElementById("participantes" + tipo);

        const resumen =
            document.getElementById("rParticipantes" + tipo);

        const valor = campo ? (parseInt(campo.value,10) || 0) : 0;

        if(resumen){
            resumen.textContent = valor;

        totalCampo.textContent = total;
    }

    const totalResumen = document.getElementById("rTotalParticipantes");
    if(totalResumen){
        totalResumen.textContent = total;
    }

    if(navegar){
        cambiarPantalla(
            "pantallaCaracterizacion",
            "pantallaResumen",
            5
        );
    }

/*****************************************************
 * CONTADORES Y CONTROL DE LAS PREGUNTAS — SESIÓN 1
 *****************************************************/

const MINIMO_PALABRAS_SESION = 200;
const MAXIMO_PALABRAS_SESION = 400;


/*****************************************************
 * CONTAR PALABRAS
 *****************************************************/

function contarPalabras(texto){

    if(!texto || !String(texto).trim()){
        return 0;
    }

    // Unicode: reconoce tildes, ñ y otros caracteres de alfabetos
    // sin separar una palabra por sus caracteres especiales.
    const coincidencias = String(texto).match(/[\p{L}\p{M}\p{N}]+(?:[’'\-][\p{L}\p{M}\p{N}]+)*/gu);

    return coincidencias ? coincidencias.length : 0;

}

/*****************************************************
 * COLOR DINÁMICO DE LA BARRA DE PROGRESO / TEXTAREA
 * Compartida por las tres sesiones. De 0 al 25% del mínimo se ve
 * roja, entre 25% y 50% pasa de roja a amarilla, entre 50% y 100%
 * pasa de amarilla a verde. Superado el mínimo, el verde se sigue
 * intensificando (hacia un verde "encendido") a medida que se
 * acerca al máximo permitido. Si se supera el máximo, vuelve a rojo
 * (señal de "está fuera de rango, hay que recortar el texto").
 *****************************************************/

function calcularColorBarraProgreso_(palabras, minimo, maximo){

    const ROJO = [198, 40, 40];
    const AMARILLO = [244, 180, 0];
    const VERDE = [11, 106, 68];
    const VERDE_ENCENDIDO = [0, 200, 83];

    if(maximo && palabras > maximo){
        return "rgb(" + ROJO[0] + "," + ROJO[1] + "," + ROJO[2] + ")";
    }

    const base = minimo > 0 ? minimo : 1;
    const porcentajeMinimo = palabras / base;

    function mezclar(colorA, colorB, avance){
        avance = Math.max(0, Math.min(1, avance));
        return [
            Math.round(colorA[0] + (colorB[0] - colorA[0]) * avance),
            Math.round(colorA[1] + (colorB[1] - colorA[1]) * avance),
            Math.round(colorA[2] + (colorB[2] - colorA[2]) * avance)
        ];
    }

    let color;

    if(porcentajeMinimo <= 0.25){

        color = ROJO;

    }else if(porcentajeMinimo <= 0.5){

        color = mezclar(ROJO, AMARILLO, (porcentajeMinimo - 0.25) / 0.25);

    }else if(porcentajeMinimo <= 1){

        color = mezclar(AMARILLO, VERDE, (porcentajeMinimo - 0.5) / 0.5);

    }else{

        const techo = (maximo && maximo > minimo) ? maximo : minimo * 2;
        const porcentajeSobreMinimo = (palabras - minimo) / (techo - minimo);
        color = mezclar(VERDE, VERDE_ENCENDIDO, porcentajeSobreMinimo);

    }

    return "rgb(" + color[0] + "," + color[1] + "," + color[2] + ")";

}

/*****************************************************
 * MARCA VISUAL DE "MÍNIMO CUMPLIDO"
 * Enciende en verde la línea del panel de apoyo y la línea de la
 * respuesta (misma idea que la línea lateral del panel de apoyo)
 * en cuanto el texto alcanza el mínimo de palabras exigido. Si se
 * indica idBloquePregunta (solo aplica a preguntas de una sola
 * respuesta, no a los campos de "acción"), también ilumina el
 * cuadro de la pregunta.
 *****************************************************/

function actualizarMarcaMinimoCumplido_(campo, palabras, minimo, idBloquePregunta, maximo){

    if(!campo) return;

    /*
     * "Cumplido" = respuesta válida: alcanzó el mínimo Y, si hay
     * máximo definido, no lo superó. Superar el máximo ya se marca
     * en rojo (ver calcularColorBarraProgreso_), así que no tendría
     * sentido dejarlo también "en verde" aquí.
     */
    const cumplido =
        palabras >= minimo &&
        (!maximo || palabras <= maximo);

    const contenedor = campo.closest(".contenedorTrabajoSesion");
    if(contenedor){
        contenedor.classList.toggle("minimoPalabrasCumplido", cumplido);
    }

    /*
     * Si el campo es una "acción" (Sesión 2/3, Pregunta 2), marca
     * también su bloque colapsable — para el ✓ del encabezado
     * (ver [id^="contenedorAccion"] en CSS.html).
     */
    const bloqueAccion = campo.closest('[id^="contenedorAccion"]');
    if(bloqueAccion){
        bloqueAccion.classList.toggle("minimoPalabrasCumplido", cumplido);
    }

    if(idBloquePregunta){
        const bloque = document.getElementById(idBloquePregunta);
        const tarjeta = bloque && bloque.querySelector(":scope > .tarjetaPregunta");
        if(tarjeta){
            tarjeta.classList.toggle("minimoPalabrasCumplido", cumplido);
            /*
             * Rojo si no alcanza el mínimo o si superó el máximo —
             * en cualquiera de los dos casos la respuesta no es
             * válida todavía.
             */
            tarjeta.classList.toggle("preguntaFueraDeRango", !cumplido);
        }
    }

}

/*****************************************************
 * ESTADO DE LA TARJETA — PREGUNTAS DE SELECCIÓN
 * (Sesión 2, Preguntas 3 y 5; Sesión 3, Preguntas 3 y 4)
 * Estas preguntas no se miden por palabras sino por si hay al
 * menos una opción marcada: verde + ✓ cuando es válida (alguna
 * opción, o "Otro" con su texto), roja mientras no se cumpla.
 *****************************************************/

function marcarTarjetaSeleccionValida_(idBloque, valida){

    const bloque = document.getElementById(idBloque);
    const tarjeta = bloque && bloque.querySelector(":scope > .tarjetaPregunta");
    if(!tarjeta) return;

    tarjeta.classList.toggle("minimoPalabrasCumplido", valida);
    tarjeta.classList.toggle("preguntaFueraDeRango", !valida);

}

/*****************************************************
 * ESTADO DE LA TARJETA "PREGUNTA 2" (ACCIONES) —
 * SESIÓN 2 Y 3
 * A diferencia de las preguntas de una sola respuesta, esta
 * pregunta se completa por CANTIDAD de acciones (no por palabras):
 * verde + ✓ con el mínimo de 3, más verde todavía si se responden
 * las 5. Roja mientras no se llegue a 3.
 *****************************************************/

function contarAccionesCompletadas_(validezObligatorias, idsContenidoOpcionales){

    let completas = validezObligatorias.filter(Boolean).length;

    (idsContenidoOpcionales || []).forEach(function(idContenido){
        const el = document.getElementById(idContenido);
        if(el && el.classList.contains("minimoPalabrasCumplido")){
            completas++;
        }
    });

    return completas;

}

function actualizarEstadoTarjetaAcciones_(idBloquePregunta, completas, totalMaximo, minimoRequerido){

    const bloque = document.getElementById(idBloquePregunta);
    const tarjeta = bloque && bloque.querySelector(":scope > .tarjetaPregunta");
    if(!tarjeta) return;

    const cumpleMinimo = completas >= minimoRequerido;
    const todasCompletas = totalMaximo > 0 && completas >= totalMaximo;

    tarjeta.classList.toggle("minimoPalabrasCumplido", cumpleMinimo);
    tarjeta.classList.toggle("preguntaAccionesCompletas", todasCompletas);
    tarjeta.classList.toggle("preguntaFueraDeRango", !cumpleMinimo);

}

/*****************************************************
 * COLOR EN VIVO DEL RECUADRO DE RESPUESTA (CAMPOS DE
 * "ACCIÓN", SESIÓN 2 Y 3)
 * En vez de una barra de progreso aparte, estos campos pintan su
 * propio borde con el mismo semáforo (rojo → amarillo → verde →
 * verde encendido / rojo si se pasa del máximo). Empieza a pintarse
 * solo cuando la persona hace clic por primera vez — antes de eso
 * se deja con el borde normal, para no mostrar un campo vacío en
 * rojo sin que nadie lo haya tocado todavía.
 *****************************************************/

function activarColorTextareaAccion_(campo, minimo, maximo){

    if(!campo || campo.dataset.colorAccionInicializado) return;

    campo.dataset.colorAccionInicializado = "1";

    function pintar(){
        const palabras = contarPalabras(campo.value);
        campo.style.borderColor =
            calcularColorBarraProgreso_(palabras, minimo, maximo);
    }

    campo.addEventListener("focus", function(){
        campo.dataset.colorAccionActivado = "1";
        pintar();
    });

    campo.addEventListener("input", function(){
        if(campo.dataset.colorAccionActivado === "1"){
            pintar();
        }
    });

    // Si ya trae texto guardado (se retoma el formulario), se pinta
    // de una vez sin esperar el clic.
    if(contarPalabras(campo.value) > 0){
        campo.dataset.colorAccionActivado = "1";
        pintar();
    }

}

/*****************************************************
 * ACCIONES OPCIONALES (4 y 5, SESIÓN 2 Y 3)
 * Sin mínimo de palabras: se mantienen ocultas detrás de un botón
 * "+ Añadir" hasta que la persona decide usarlas. Con solo abrirlas
 * ya cuentan como completas (línea/cuadro en verde) — no hace falta
 * escribir nada porque son opcionales.
 *****************************************************/

function activarAccionOpcional_(idBoton, idContenido, idCampo, idSiguienteContenedor){

    const boton = document.getElementById(idBoton);
    const contenido = document.getElementById(idContenido);
    const campo = document.getElementById(idCampo);

    if(!boton || !contenido || !campo) return;

    // Botón "X" para quitar esta opción una vez abierta (sin tener
    // que borrar el texto a mano) — se agrega una sola vez, como
    // primer elemento del bloque.
    let btnQuitar = contenido.querySelector(".btnQuitarAccionOpcional");
    if(!btnQuitar){
        btnQuitar = document.createElement("button");
        btnQuitar.type = "button";
        btnQuitar.className = "btnQuitarAccionOpcional";
        btnQuitar.setAttribute("aria-label", "Quitar esta opción");
        btnQuitar.textContent = "✕ Quitar esta opción";
        contenido.insertBefore(btnQuitar, contenido.firstChild);
    }

    function ocultar(){
        contenido.classList.add("accionOpcionalOculta");
        contenido.classList.remove("minimoPalabrasCumplido");
        campo.value = "";
        campo.disabled = true;
        boton.style.display = "";
        // Recalcular contador de palabras/estado ya que el campo quedó vacío.
        campo.dispatchEvent(new Event("input"));
        guardarBorradorLocal({silencioso:true});
    }

    function revelar(){
        boton.style.display = "none";
        contenido.classList.remove("accionOpcionalOculta");
        contenido.classList.add("minimoPalabrasCumplido");
        campo.disabled = false;

        /*
         * Por si el botón vive dentro de un contenedor que a su vez
         * empieza oculto (la segunda opción adicional, encadenada a
         * que se abra la primera): se descubre también, para que no
         * quede escondida al restaurar un formulario que ya la
         * tenía respondida.
         */
        if(boton.parentElement){
            boton.parentElement.classList.remove("accionOpcionalOculta");
        }

        // Encadenar: al abrir esta opción, aparece el botón para
        // agregar la siguiente (máximo 2 opciones adicionales).
        if(idSiguienteContenedor){
            const siguiente = document.getElementById(idSiguienteContenedor);
            if(siguiente){
                siguiente.classList.remove("accionOpcionalOculta");
            }
        }
    }

    /*
     * Si ya había una respuesta guardada (se retoma el formulario
     * desde otro dispositivo o después de recargar), se muestra de
     * inmediato en vez de quedar escondida detrás del botón.
     */
    if(campo.value && campo.value.trim() !== ""){
        revelar();
    }

    if(boton.dataset.accionOpcionalInicializada) return;

    boton.dataset.accionOpcionalInicializada = "1";

    boton.addEventListener("click", function(){
        revelar();
        campo.focus();
    });

    btnQuitar.addEventListener("click", ocultar);

}

/*****************************************************
 * ÍCONO DEL OJO — AMPLIAR PREGUNTA (SESIÓN 1, 2 Y 3)
 * Mismo botón/ícono y mismo comportamiento que ya existía en la
 * plenaria (.btnAmpliarPregunta, pantalla completa por pregunta):
 * se reutiliza aquí en vez de crear un control nuevo. Al hacer clic
 * se pone en pantalla completa el bloque COMPLETO de la pregunta
 * (encabezado + panel de apoyo + respuesta), no solo el encabezado.
 *****************************************************/

function activarOjoPreguntaSesion_(idBloque){

    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const tarjeta = bloque.querySelector(":scope > .tarjetaPregunta");
    if(!tarjeta || tarjeta.querySelector(".btnAmpliarPregunta")) return;

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "btnAmpliarPregunta";
    boton.title = "Ampliar esta pregunta";
    boton.setAttribute("aria-label", "Ampliar esta pregunta");
    boton.textContent = "👁️";

    boton.addEventListener("click", async function(){
        try{
            if(!document.fullscreenElement){
                await bloque.requestFullscreen();
            }else{
                await document.exitFullscreen();
            }
        }catch(error){
            console.error("No fue posible ampliar la pregunta:", error);
        }
    });

    tarjeta.appendChild(boton);

}

/*****************************************************
 * SINCRONIZAR CASILLA "OTRO" CON SU TEXTO
 * (Sesión 2: Preguntas 3 y 5. Sesión 3: Preguntas 3 y 4)
 * Si se deselecciona "Otro", se borra el texto escrito. Si el
 * texto queda vacío, se deselecciona "Otro" — deben comportarse
 * igual en las cuatro preguntas.
 *****************************************************/

function sincronizarOtroCheckbox_(idCheckOtro, idTextoOtro, alCambiar){

    const check = document.getElementById(idCheckOtro);
    const texto = document.getElementById(idTextoOtro);

    if(!check || !texto) return;
    if(check.dataset.sincronizacionOtroInicializada) return;
    check.dataset.sincronizacionOtroInicializada = "1";

    check.addEventListener("change", function(){
        if(!check.checked && texto.value){
            texto.value = "";
            if(typeof alCambiar === "function") alCambiar();
        }
    });

    texto.addEventListener("input", function(){
        if(check.checked && !texto.value.trim()){
            check.checked = false;
            if(typeof alCambiar === "function") alCambiar();
        }
    });

}

/*
 * Complemento de sincronizarOtroCheckbox_: la opción "Otro" también
 * se puede quitar borrando directamente su línea del textarea
 * principal ("Otro: ..."), no solo desmarcando la casilla. Al
 * detectar que esa línea ya no está, se desmarca la casilla y se
 * limpia el campo de texto de "Otro" para que ambos queden
 * sincronizados — evita dejar una casilla marcada sin ninguna línea
 * correspondiente en la respuesta.
 */
function sincronizarOtroDesdeTextareaPrincipal_(campoId, otroId, otroTextoId, prefijo){
    const campo = document.getElementById(campoId);
    const check = document.getElementById(otroId);
    const texto = document.getElementById(otroTextoId);
    if(!campo || !check || !texto) return;
    if(campo.dataset.sincronizacionOtroPrincipalInicializada) return;
    campo.dataset.sincronizacionOtroPrincipalInicializada = "1";

    campo.addEventListener("input", function(){
        if(!check.checked) return;
        const lineaOtro = (prefijo + texto.value).trim();
        const sigueEstando = campo.value.split(/\r?\n/).some(function(linea){ return linea.trim() === lineaOtro; });
        if(!sigueEstando){
            check.checked = false;
            texto.value = "";
            check.dispatchEvent(new Event("change"));
        }
    });
}

/*****************************************************
 * ACORDEÓN DE ACCIONES (SESIÓN 2 Y 3, PREGUNTA 2)
 * Todas las acciones empiezan colapsadas. Al terminar de escribir
 * una (llega al mínimo y se sale del campo) se colapsa sola y se
 * abre la siguiente — solo una acción visible a la vez. Una acción
 * ya respondida puede volver a abrirse con un clic en su
 * encabezado. Es genérico: sirve igual para Sesión 2 y Sesión 3,
 * cuyos encabezados usan clases distintas
 * (.encabezadoAccionSesion2 / .encabezadoAccionSesion3).
 *****************************************************/

function encabezadoAccionDe_(bloque){
    return bloque.querySelector(
        ":scope > .encabezadoAccionSesion2, :scope > .encabezadoAccionSesion3"
    );
}

function cerrarAccionColapsable_(idBloque){

    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const encabezado = encabezadoAccionDe_(bloque);
    if(!encabezado) return;

    Array.from(bloque.children).forEach(function(hijo){
        if(hijo !== encabezado){
            hijo.dataset.ocultoPorColapsoAccion = "1";
            hijo.style.display = "none";
        }
    });

    bloque.classList.add("accionColapsada");

}

function abrirAccionColapsable_(idBloque, idsHermanos){

    const bloque = document.getElementById(idBloque);
    if(!bloque) return;
    if(bloque.classList.contains("bloquePreguntaBloqueada")) return;

    (idsHermanos || []).forEach(function(id){
        if(id !== idBloque){
            cerrarAccionColapsable_(id);
        }
    });

    Array.from(bloque.children).forEach(function(hijo){
        if(hijo.dataset.ocultoPorColapsoAccion === "1"){
            hijo.style.display = "";
            delete hijo.dataset.ocultoPorColapsoAccion;
        }
    });

    bloque.classList.remove("accionColapsada");

}

function inicializarEncabezadoAccion_(idBloque, idsHermanos){

    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const encabezado = encabezadoAccionDe_(bloque);
    if(!encabezado || encabezado.dataset.colapsoAccionInicializado) return;

    encabezado.setAttribute("role", "button");
    encabezado.setAttribute("tabindex", "0");

    encabezado.addEventListener("click", function(){
        if(bloque.classList.contains("bloquePreguntaBloqueada")) return;
        if(bloque.classList.contains("accionColapsada")){
            abrirAccionColapsable_(idBloque, idsHermanos);
        }else{
            cerrarAccionColapsable_(idBloque);
        }
    });

    encabezado.addEventListener("keydown", function(evento){
        if(evento.key === "Enter" || evento.key === " "){
            evento.preventDefault();
            encabezado.click();
        }
    });

    encabezado.dataset.colapsoAccionInicializado = "1";

}

/*
 * Al perder el foco (se "culmina" de escribir), si la acción ya es
 * válida se colapsa sola y se abre la siguiente de la lista.
 */
function activarAvanceAutomaticoAccion_(idCampo, idBloque, minimo, maximo, idSiguienteBloque, idsHermanos){

    const campo = document.getElementById(idCampo);
    if(!campo || campo.dataset.avanceAutoInicializado) return;
    campo.dataset.avanceAutoInicializado = "1";

    campo.addEventListener("blur", function(){

        const palabras = contarPalabras(campo.value);
        const valida = palabras >= minimo && (!maximo || palabras <= maximo);

        if(valida){
            cerrarAccionColapsable_(idBloque);
            if(idSiguienteBloque){
                abrirAccionColapsable_(idSiguienteBloque, idsHermanos);
            }
        }

    });

}

/*****************************************************
 * ACTUALIZAR CONTADOR PREGUNTA 1
 *****************************************************/

function actualizarContadorPregunta1(){

    const campo =
        document.getElementById(
            "respuestaSesion1"
        );

    const contador =
        document.getElementById(
            "contadorSesion1"
        );

    const barra =
        document.getElementById(
            "progresoPalabrasSesion1"
        );

    const mensaje =
        document.getElementById(
            "mensajeContador"
        );


    if(!campo){
        return;
    }


    const palabras =
        contarPalabras(
            campo.value
        );


    /*
     * CONTADOR
     */

    if(contador){

        contador.textContent =
            palabras +
            " / " +
            MAXIMO_PALABRAS_SESION +
            " palabras";

    }


    /*
     * BARRA DE PROGRESO
     */

    if(barra){

        const porcentaje =
            Math.min(
                (palabras / MAXIMO_PALABRAS_SESION) * 100,
                100
            );

        barra.style.width =
            porcentaje + "%";

        barra.style.backgroundColor =
            calcularColorBarraProgreso_(
                palabras,
                MINIMO_PALABRAS_SESION,
                MAXIMO_PALABRAS_SESION
            );

    }


    /*
     * MENSAJE
     */

    if(mensaje){

        if(palabras < MINIMO_PALABRAS_SESION){

            mensaje.textContent =
                "⚠ Debe escribir al menos 200 palabras.";

            mensaje.style.color =
                "#C62828";

        }else if(palabras <= MAXIMO_PALABRAS_SESION){

            mensaje.textContent =
                "✓ Longitud adecuada. Puede continuar.";

            mensaje.style.color =
                "#0B6A44";

        }else{

            mensaje.textContent =
                "⚠ Ha superado el máximo de 400 palabras.";

            mensaje.style.color =
                "#C62828";

        }

    }

    /*
     * Ilumina en verde el cuadro de la pregunta, la línea del panel
     * de apoyo y la línea de la respuesta en cuanto se alcanza el
     * mínimo de palabras.
     */

    actualizarMarcaMinimoCumplido_(
        campo,
        palabras,
        MINIMO_PALABRAS_SESION,
        "bloquePregunta1",
        MAXIMO_PALABRAS_SESION
    );

    /*
     * Cada cambio en la Pregunta 1
     * revisa si se puede habilitar
     * la Pregunta 2.
     */

    actualizarEstadoPregunta2();

    /*
     * También revisa aquí mismo si ya se puede habilitar "Continuar":
     * si la Pregunta 2 ya cumplía el mínimo, terminar de escribir la
     * Pregunta 1 debe habilitar el botón sin necesidad de tocar la
     * Pregunta 2 de nuevo (antes solo se revisaba desde el input de
     * la Pregunta 2, así que había que escribir algo ahí, como un
     * espacio, para que el botón reaccionara).
     */

    actualizarEstadoContinuar();

}

 * ACTUALIZAR CONTADOR PREGUNTA 2

function actualizarContadorPregunta2(){

        );

    const contador =
        document.getElementById(
            "contadorSesion1Pregunta2"

    const barra =
        document.getElementById(
            "progresoPalabrasSesion1Pregunta2"
        );

    const mensaje =
        document.getElementById(
            "mensajeContadorPregunta2"
        );


    if(!campo){
        return;
    }


    const palabras =
        contarPalabras(
            campo.value
        );


    /*
     * CONTADOR
     */

    if(contador){

        contador.textContent =
            palabras +
            " / " +
            MAXIMO_PALABRAS_SESION +
            " palabras";

    }


    /*
     * BARRA
     */

    if(barra){

        const porcentaje =
            Math.min(
                (palabras / MAXIMO_PALABRAS_SESION) * 100,
                100
            );

        barra.style.width =
            porcentaje + "%";

        barra.style.backgroundColor =
            calcularColorBarraProgreso_(
                palabras,
                MINIMO_PALABRAS_SESION,
                MAXIMO_PALABRAS_SESION
            );

    }


    /*
     * MENSAJE
     */

    if(mensaje){

        if(palabras < MINIMO_PALABRAS_SESION){

            mensaje.textContent =
                "⚠ Debe escribir al menos 200 palabras.";

            mensaje.style.color =
                "#C62828";

        }else if(palabras <= MAXIMO_PALABRAS_SESION){

            mensaje.textContent =
                "✓ Longitud adecuada. Puede continuar.";

            mensaje.style.color =
                "#0B6A44";

        }else{

            mensaje.textContent =
                "⚠ Ha superado el máximo de 400 palabras.";

            mensaje.style.color =
                "#C62828";

        }

    }

    /*
     * Ilumina en verde el cuadro de la pregunta, la línea del panel
     * de apoyo y la línea de la respuesta en cuanto se alcanza el
     * mínimo de palabras.
     */

    actualizarMarcaMinimoCumplido_(
        campo,
        palabras,
        MINIMO_PALABRAS_SESION,
        "bloquePregunta2",
        MAXIMO_PALABRAS_SESION
    );

    /*
     * Revisar botón Continuar.
     */

    actualizarEstadoContinuar();

}


/*****************************************************
 * HABILITAR / BLOQUEAR PREGUNTA 2
 *****************************************************/

function actualizarEstadoPregunta2(){

    const campo =
        document.getElementById(
            "respuestaSesion1"
        );

    const bloque =
        document.getElementById(
            "bloquePregunta2"
        );


    if(!campo || !bloque){
        return;
    }


    const palabras =
        contarPalabras(
            campo.value
        );


    /*
     * Pregunta 2 aparece en cuanto la Pregunta 1 alcanza el mínimo
     * requerido — la VISIBILIDAD no depende del máximo. Si luego se
     * supera el máximo, la Pregunta 2 sigue visible: lo único que
     * pasa es que la Pregunta 1 deja de ser válida (eso lo controla
     * aparte actualizarEstadoContinuar, que sí exige min Y max). No
     * confundir "se puede ver" con "es válida".
     */

    if(
        palabras >= MINIMO_PALABRAS_SESION
    ){

        bloque.classList.remove(
            "bloquePreguntaBloqueada"
        );

        bloque.classList.add(
            "bloquePreguntaHabilitada"
        );

    }else{

        bloque.classList.remove(
            "bloquePreguntaHabilitada"
        );

        bloque.classList.add(
            "bloquePreguntaBloqueada"
        );

    }

}
/*****************************************************
 * CONTROL DEL BOTÓN CONTINUAR
 *****************************************************/

function actualizarEstadoContinuar(){

    const pregunta1 =
        document.getElementById(
            "respuestaSesion1"
        );

    const pregunta2 =
        document.getElementById(
            "respuestaSesion1Pregunta2"
        );

    const boton =
        document.getElementById(
            "btnSesion2"
        );


    if(!boton){
        return;
    }


    const palabras1 =
        pregunta1
            ? contarPalabras(
                pregunta1.value
            )
            : 0;


    const palabras2 =
        pregunta2
            ? contarPalabras(
                pregunta2.value
            )
            : 0;


    /*
     * Las dos preguntas deben cumplir
     * el mínimo y máximo permitido.
     */

    const pregunta1Valida =
        palabras1 >= MINIMO_PALABRAS_SESION &&
        palabras1 <= MAXIMO_PALABRAS_SESION;


    const pregunta2Valida =
        palabras2 >= MINIMO_PALABRAS_SESION &&
        palabras2 <= MAXIMO_PALABRAS_SESION;


    boton.disabled =
        !(pregunta1Valida && pregunta2Valida);

}

/*****************************************************
 * COLAPSADO — SESIÓN 1
 *
 * Mismo patrón que el ya existente para Sesión 2/3
 * (cerrarPreguntaSesion2/abrirPreguntaSesion2): al hacer clic en el
 * encabezado de una pregunta, o al enfocar el área de respuesta de
 * la Pregunta 2, la otra pregunta se colapsa (solo se ve su
 * encabezado) sin perder ningún dato — es un estado de presentación,
 * nunca borra ni invalida nada.
 *****************************************************/

const IDS_PREGUNTAS_S1 = ["bloquePregunta1", "bloquePregunta2"];

function cerrarPreguntaSesion1(idBloque){

    const bloque = document.getElementById(idBloque);
    if(!bloque) return;

    const encabezado = bloque.querySelector(":scope > .tarjetaPregunta");
    if(!encabezado) return;

    Array.from(bloque.children).forEach(function(hijo){
        if(hijo !== encabezado){
            hijo.dataset.ocultoPorColapso = "1";
            hijo.style.display = "none";
        }
    });

    bloque.classList.add("preguntaColapsadaSesion1");
    encabezado.setAttribute("aria-expanded", "false");

}

function abrirPreguntaSesion1(idBloque){

    const bloqueObjetivo = document.getElementById(idBloque);
    if(!bloqueObjetivo) return;

    // No se puede abrir una pregunta todavía bloqueada (Pregunta 2
    // antes de que la 1 llegue al mínimo de palabras).
    if(bloqueObjetivo.classList.contains("bloquePreguntaBloqueada")) return;

    IDS_PREGUNTAS_S1.forEach(function(id){
        if(id !== idBloque) cerrarPreguntaSesion1(id);
    });

    Array.from(bloqueObjetivo.children).forEach(function(hijo){
        if(hijo.dataset.ocultoPorColapso === "1"){
            hijo.style.display = "";
            delete hijo.dataset.ocultoPorColapso;
        }
    });

    bloqueObjetivo.classList.remove("preguntaColapsadaSesion1");

    const encabezadoObjetivo = bloqueObjetivo.querySelector(":scope > .tarjetaPregunta");
    if(encabezadoObjetivo) encabezadoObjetivo.setAttribute("aria-expanded", "true");

    bloqueObjetivo.scrollIntoView({ behavior:"smooth", block:"start" });

}

function inicializarColapsoSesion1(){

    IDS_PREGUNTAS_S1.forEach(function(idBloque){

        const bloque = document.getElementById(idBloque);
        if(!bloque) return;

        const encabezado = bloque.querySelector(":scope > .tarjetaPregunta");
        if(!encabezado || encabezado.dataset.colapsoInicializado) return;

        encabezado.setAttribute("role", "button");
        encabezado.setAttribute("tabindex", "0");
        encabezado.setAttribute("aria-expanded", "true");
        encabezado.setAttribute("aria-controls", idBloque);

        encabezado.addEventListener("click", function(){
            if(bloque.classList.contains("preguntaColapsadaSesion1")){
                abrirPreguntaSesion1(idBloque);
            }
        });

        encabezado.addEventListener("keydown", function(evento){
            if(evento.key === "Enter" || evento.key === " "){
                evento.preventDefault();
                if(bloque.classList.contains("preguntaColapsadaSesion1")){
                    abrirPreguntaSesion1(idBloque);
                }
            }
        });

        encabezado.dataset.colapsoInicializado = "1";

    });

    // Enfocar el área de respuesta de la Pregunta 2 colapsa la
    // Pregunta 1 — no hace falta hacer clic primero en su encabezado.
    const pregunta2 = document.getElementById("respuestaSesion1Pregunta2");
    if(pregunta2 && !pregunta2.dataset.colapsoFocoInicializado){
        pregunta2.addEventListener("focus", function(){
            abrirPreguntaSesion1("bloquePregunta2");
        });
        pregunta2.dataset.colapsoFocoInicializado = "1";
    }

}

function actualizarTotalParticipantes(){

    const campos = [
        "participantesRector",
        "participantesCoordinador",
        "participantesDocentes",
        "participantesTutorPTA",
        "participantesOrientador",
        "participantesEstudiantes",
        "participantesPadres",
        "participantesAdministrativos",
        "participantesEgresados",
        "participantesSector",
        "participantesOtros"
    ];

    let total = 0;

    campos.forEach(function(id){

        const campo = document.getElementById(id);

        if(!campo) return;

        let valor = parseInt(campo.value, 10);

        if(isNaN(valor) || valor < 0){
            valor = 0;
        }

        valor = Math.floor(valor);
        campo.value = valor;
        total += valor;

    });

    const totalElemento =
        document.getElementById("totalParticipantes");

    if(totalElemento){
        totalElemento.textContent = total;
    }

    const totalResumen =
        document.getElementById("rTotalParticipantes");

    if(totalResumen){
        totalResumen.textContent = total;
    }

    return total;

}

/*****************************************************
 * RESPONSABLES ADICIONALES DEL DILIGENCIAMIENTO
 *
 * Varias personas del equipo institucional pueden completar y
 * enviar el cuestionario usando el MISMO código de acceso de la IE
 * — no hace falta un código por persona (la sesión sigue siendo de
 * un solo dispositivo a la vez, como siempre; esto solo registra
 * quiénes son responsables del diligenciamiento). El responsable
 * "1" son los campos "Nombre/Correo/Cargo" ya existentes arriba;
 * aquí se agregan del 2 al 5, con nombre, correo, cargo y teléfono.
 * Cada campo se guarda solo con tener un id (construirDatosBorrador
 * recorre TODOS los input/select con id), así que no hace falta
 * ningún registro adicional para que viajen con el resto del
 * formulario.
 *****************************************************/
const CARGOS_RESPONSABLE_ADICIONAL_ = ["Docente","Rector(a)","Coordinador(a)","Tutor(a) PTA/FI 3.0","Orientador(a) Escolar","Padre de familia","Madre de familia","Estudiante","Administrativo(a)","Otro"];
const ROLES_FORO_RESPONSABLE_ = ["👑 Líder – Rectora","🎓 Dinamizadora Pedagógica – Tutora PTA / PFI 3.0","👥 Dinamizadora de Mesas de Trabajo","📝 Relatora","⏱️ Dinamizadora del Tiempo","💻 Dinamizadora de la Sistematización","🙋 Participante"];
const MAX_RESPONSABLES_ADICIONALES_ = 3;

function contarTarjetasResponsables_(){
    const lista = document.getElementById("listaResponsablesAdicionales");
    return lista ? lista.querySelectorAll(".tarjetaResponsableAdicional").length : 0;
}

function actualizarBotonAgregarResponsable_(){
    const btn = document.getElementById("btnAgregarResponsable");
    if(!btn) return;
    const lleno = contarTarjetasResponsables_() >= MAX_RESPONSABLES_ADICIONALES_;
    btn.disabled = lleno;
    btn.textContent = lleno ? "Máximo "+(MAX_RESPONSABLES_ADICIONALES_+1)+" responsables" : "+ Agregar otro responsable";
}

function crearTarjetaResponsable_(indice){
    const lista = document.getElementById("listaResponsablesAdicionales");
    if(!lista || document.getElementById("responsable"+indice+"Nombre")) return;

    const opciones = CARGOS_RESPONSABLE_ADICIONAL_.map(function(c){ return "<option>"+c+"</option>"; }).join("");
    const opcionesRol = ROLES_FORO_RESPONSABLE_.map(function(r){ return "<option>"+r+"</option>"; }).join("");
    const tarjeta = document.createElement("div");
    tarjeta.className = "tarjetaResponsableAdicional";
    tarjeta.dataset.indice = String(indice);
    // Mismos campos que "Información de quien diligencia el
    // instrumento" (nombre, correo, cargo, rol dentro del Foro) —
    // ningún dato adicional distinto al del responsable principal.
    tarjeta.innerHTML =
        '<div class="tarjetaResponsableEncabezado">'+
            '<strong>Responsable adicional '+indice+'</strong>'+
            '<button type="button" class="btnQuitarResponsable" aria-label="Quitar este responsable">🗑 Quitar</button>'+
        '</div>'+
        '<div class="grupo"><label>Nombre de quien diligencia el instrumento</label><input type="text" id="responsable'+indice+'Nombre" autocomplete="name"></div>'+
        '<div class="grupo"><label>Correo electrónico personal</label><input type="email" id="responsable'+indice+'Correo"></div>'+
        '<div class="grupo"><label>Cargo</label><select id="responsable'+indice+'Cargo"><option value="">Seleccione...</option>'+opciones+'</select></div>'+
        '<div class="grupo"><label>Rol dentro del Foro</label><select id="responsable'+indice+'RolForo"><option value="">Seleccione...</option>'+opcionesRol+'</select></div>';

    lista.appendChild(tarjeta);

    tarjeta.querySelector(".btnQuitarResponsable").addEventListener("click", function(){
        tarjeta.remove();
        actualizarBotonAgregarResponsable_();
        guardarBorradorLocal({silencioso:true});
    });
}

function actualizarNombreIEAvisoResponsables_(){
    const span=document.getElementById("nombreIEAvisoResponsables");
    if(!span) return;
    const nombreIE=String(getCampoNombreIE()||"").replace(/^\s*(instituci[oó]n\s+educativa|i\.?\s*e\.?)\s+/i,"").trim();
    if(nombreIE) span.textContent=nombreIE;
}

function inicializarResponsablesAdicionales_(){
    const btnAgregar = document.getElementById("btnAgregarResponsable");
    if(!btnAgregar || btnAgregar.dataset.inicializado==="1") return;
    btnAgregar.dataset.inicializado = "1";

    btnAgregar.addEventListener("click", function(){
        if(contarTarjetasResponsables_() >= MAX_RESPONSABLES_ADICIONALES_) return;
        crearTarjetaResponsable_(contarTarjetasResponsables_()+2);
        actualizarBotonAgregarResponsable_();
    });

    // El nombre de la IE puede llegar un poco después (según el flujo
    // de acceso), así que además de fijarlo una vez ahora, se
    // actualiza cada vez que el campo "institucion" cambie.
    actualizarNombreIEAvisoResponsables_();
    document.getElementById("institucion")?.addEventListener("input", actualizarNombreIEAvisoResponsables_);
    document.getElementById("institucion")?.addEventListener("change", actualizarNombreIEAvisoResponsables_);

    actualizarBotonAgregarResponsable_();
}

/*
 * Al restaurar un borrador (localStorage o servidor), las tarjetas de
 * responsables adicionales todavía no existen en el DOM — hay que
 * recrearlas ANTES de que aplicarDatosDeBorrador_ intente asignar sus
 * valores por getElementById, o esos datos se perderían en silencio.
 */
function precrearTarjetasResponsablesDesdeBorrador_(campos){
    if(!campos) return;
    let maxIndice = 0;
    Object.keys(campos).forEach(function(id){
        const m = id.match(/^responsable(\d+)(Nombre|Correo|Cargo|Telefono)$/);
        if(m && campos[id] && campos[id].valor) maxIndice = Math.max(maxIndice, Number(m[1]));
    });
    if(!maxIndice) return;
    for(let i=2; i<=maxIndice; i++){ crearTarjetaResponsable_(i); }
    actualizarBotonAgregarResponsable_();
}

/*
 * Devuelve los nombres de TODOS los responsables del diligenciamiento
 * (el principal + los adicionales que tengan nombre), en el orden en
 * que aparecen. Se usa en la pantalla de despedida.
 */
function obtenerNombresResponsablesFEM_(){
    const nombres = [];
    const principal = String(document.getElementById("nombre")?.value||"").trim();
    if(principal) nombres.push(principal);
    document.querySelectorAll('[id^="responsable"][id$="Nombre"]').forEach(function(campo){
        const valor = String(campo.value||"").trim();
        if(valor) nombres.push(valor);
    });
    return nombres;
}

/*****************************************************
 * HERRAMIENTAS DE LA SESIÓN 1
 * Guardado + pantalla completa + modo lectura.
 * La barra queda preparada para permanecer visible
 * durante el desplazamiento. El acabado visual se hará
 * posteriormente en CSS.
 *****************************************************/
function activarHerramientasSesion1(){

    const barra = document.querySelector(
        "#pantallaSesion1 .barraHerramientas"
    );

    if(barra){
        barra.classList.add("barraHerramientasDeslizable");
        // Comportamiento funcional desde App; el aspecto final se ajustará en CSS.
        barra.style.position = "sticky";
        barra.style.top = "0";
        barra.style.zIndex = "1000";
    }

    const guardar = document.getElementById("btnGuardarSesion1");
    if(guardar && guardar.dataset.guardadoInicializado !== "1"){
        guardar.addEventListener("click",function(){
            const datos = guardarBorradorLocal({silencioso:false});
            if(datos){
                mostrarEstadoGuardado("🟢 Avance guardado correctamente");
            }
        });
        guardar.dataset.guardadoInicializado = "1";
    }

    const botonesPantalla = document.querySelectorAll("#btnPantallaCompleta");
    botonesPantalla.forEach(function(boton){
        if(boton.dataset.pantallaCompletaInicializada === "1") return;

        boton.addEventListener("click",async function(){
            try{
                if(!document.fullscreenElement){
                    await document.documentElement.requestFullscreen();
                    botonesPantalla.forEach(function(b){
                        b.textContent = "✕ Salir de pantalla completa";
                    });
                }else{
                    await document.exitFullscreen();
                }
            }catch(error){
                console.error("No fue posible activar pantalla completa:",error);
            }
        });
        boton.dataset.pantallaCompletaInicializada = "1";
    });

    if(!document.documentElement.dataset.fullscreenListener){
        document.addEventListener("fullscreenchange",function(){
            const activo = !!document.fullscreenElement;
            botonesPantalla.forEach(function(b){
                b.textContent = activo
                    ? "✕ Salir de pantalla completa"
                    : "⛶ Pantalla completa";
            });
        });
        document.documentElement.dataset.fullscreenListener = "1";
    }

    const botonesLectura = document.querySelectorAll("#btnModoLectura");
    botonesLectura.forEach(function(boton){
        if(boton.dataset.modoLecturaInicializado === "1") return;

        boton.addEventListener("click",function(){
            const pantalla = document.getElementById("pantallaSesion1");
            if(!pantalla) return;

            pantalla.classList.toggle("modoLectura");
            const activo = pantalla.classList.contains("modoLectura");

            botonesLectura.forEach(function(b){
                b.textContent = activo
                    ? "✏️ Volver a edición"
                    : "📖 Modo lectura";
            });
        });
        boton.dataset.modoLecturaInicializado = "1";
    });
}

/*****************************************************
 * BARRA GLOBAL "VOLVER A MODO EDICIÓN"
 *
 * Un único botón grande y fijo arriba de toda la página que se
 * desliza hacia abajo apenas CUALQUIER pestaña entra en pantalla
 * completa o en modo lectura, y vuelve a subir al salir de ambos.
 * No hace falta modificar cada botón que activa pantalla
 * completa/modo lectura: se detecta automáticamente con el evento
 * nativo "fullscreenchange" (cubre TODO fullscreen — el de la
 * página completa, el del QR, el de las firmas en vivo) y con un
 * MutationObserver sobre la clase de cada pantalla (cubre TODO modo
 * lectura — Sesión 1, 2, 3 y Plenaria).
 *****************************************************/
function actualizarBarraVolverEdicionGlobal_(){
    const barra=document.getElementById("barraVolverEdicionGlobal");
    if(!barra) return;
    const enFullscreen=!!(document.fullscreenElement||document.webkitFullscreenElement);
    const enModoLectura=!!document.querySelector(
        ".modoLectura, .modoLecturaSesion2, .modoLecturaSesion3, .modoLecturaPlenaria"
    );
    barra.classList.toggle("visible", enFullscreen||enModoLectura);
}

function inicializarBarraVolverEdicionGlobal_(){
    document.addEventListener("fullscreenchange", actualizarBarraVolverEdicionGlobal_);
    document.addEventListener("webkitfullscreenchange", actualizarBarraVolverEdicionGlobal_);

    const observador=new MutationObserver(actualizarBarraVolverEdicionGlobal_);
    document.querySelectorAll(".pantalla").forEach(function(p){
        observador.observe(p, {attributes:true, attributeFilter:["class"]});
    });

    const btn=document.getElementById("btnVolverEdicionGlobal");
    if(btn && !btn.dataset.inicializado){
        btn.dataset.inicializado="1";
        btn.addEventListener("click", function(){
            // 1) Salir de pantalla completa, sea cual sea el elemento
            //    que esté en fullscreen (toda la página, el QR, el
            //    modal de firmas en vivo).
            if(document.fullscreenElement && document.exitFullscreen){
                document.exitFullscreen().catch(function(){});
            }
            // 2) Apagar cualquier modo lectura activo, reusando los
            //    botones que ya lo hacen (evita duplicar su lógica).
            if(document.getElementById("pantallaSesion1")?.classList.contains("modoLectura")){
                document.getElementById("btnModoLectura")?.click();
            }
            if(document.getElementById("pantallaSesion2")?.classList.contains("modoLecturaSesion2")){
                document.getElementById("btnModoLecturaSesion2")?.click();
            }
            if(document.getElementById("pantallaSesion3")?.classList.contains("modoLecturaSesion3")){
                document.getElementById("btnModoLecturaSesion3")?.click();
            }
            if(document.getElementById("pantallaPlenaria")?.classList.contains("modoLecturaPlenaria")){
                alternarModoLecturaPlenaria();
            }
            setTimeout(actualizarBarraVolverEdicionGlobal_, 400);

function estadoPalabrasSesion2(campo,min,max){

function actualizarContadorSesion2(idCampo,idContador,idBarra,idMensaje,min,max,idBloquePregunta){
    const campo = document.getElementById(idCampo);
    if(!campo) return false;

    const n = contarPalabras(campo.value);
    const contador = document.getElementById(idContador);
    const barra = document.getElementById(idBarra);
    const mensaje = document.getElementById(idMensaje);

    if(contador) contador.textContent = n + " / " + max + " palabras";
    if(barra){
        barra.style.width = Math.min((n / max) * 100,100) + "%";
        barra.style.backgroundColor = calcularColorBarraProgreso_(n, min, max);
    }

    if(mensaje){
        if(n < min){
            mensaje.textContent = "⚠ Debe escribir al menos " + min + " palabras.";
            mensaje.style.color = "#C62828";
        }else if(n <= max){
            mensaje.textContent = "✓ Longitud adecuada. Puede continuar.";
            mensaje.style.color = "#0B6A44";
        }else{
            mensaje.textContent = "⚠ Ha superado el máximo de " + max + " palabras.";
            mensaje.style.color = "#C62828";
        }
    }

    actualizarMarcaMinimoCumplido_(campo, n, min, idBloquePregunta, max);

    return n >= min && n <= max;
}

function limpiarLineasGeneradas(campo,clave){
    if(!campo) return [];

    const generadas = JSON.parse(campo.dataset[clave] || "[]");
    const lineas = campo.value
        .split(/\r?\n/)
        .map(function(x){ return x.trim(); })
        .filter(Boolean);

    return lineas.filter(function(linea){
        return generadas.indexOf(linea) === -1;
    });
}

function actualizarRespuestaSeleccionMultiple(
    campoId,
    opciones,
    clave,
    otroId,
    otroTextoId,
    prefijo
){

    const campo = document.getElementById(campoId);
    if(!campo) return;

    /*
     * IMPORTANTE:
     * No reconstruimos el textarea perdiendo el contenido
     * que el usuario ya escribió.
     *
     * Primero recuperamos las líneas que fueron generadas
     * en la actualización anterior y las retiramos.
     * Todo lo demás se conserva como texto del usuario.
     */

    let generadasAnteriores = [];

    try{
        generadasAnteriores =
            JSON.parse(campo.dataset[clave] || "[]");
    }catch(e){
        generadasAnteriores = [];
    }

    const lineasActuales =
        campo.value
            .split(/\r?\n/)
            .map(function(linea){
                return linea.trim();
            })
            .filter(Boolean);


    /*
     * Conservar solamente el contenido que NO fue generado
     * por el sistema en la actualización anterior.
     */
    const contenidoUsuario =
        lineasActuales.filter(function(linea){

            return generadasAnteriores.indexOf(linea) === -1;

        });


    const nuevas = [];


    /*
     * OPCIONES NORMALES ACTUALMENTE SELECCIONADAS
     */
    Object.keys(opciones).forEach(function(id){

        const check =
            document.getElementById(id);

        if(
            check &&
            check.checked &&
            id !== otroId
        ){

            const texto =
                opciones[id];

            if(
                nuevas.indexOf(texto) === -1
            ){

                nuevas.push(texto);

            }

        }

    });


    /*
     * OTRO
     *
     * Si está seleccionado, conservamos el texto
     * que ya existe en el campo "Otro".
     *
     * Si por alguna razón el campo de Otro está vacío,
     * intentamos recuperar el texto que ya estaba en
     * el textarea.
     */

    const otro =
        document.getElementById(otroId);

    const textoOtro =
        document.getElementById(otroTextoId);

    if(
        otro &&
        otro.checked
    ){

        let texto = "";

        if(
            textoOtro &&
            textoOtro.value.trim()
        ){

            texto =
                textoOtro.value.trim();

        }else{

            const lineaOtro =
                lineasActuales.find(function(linea){

                    return linea
                        .toLowerCase()
                        .indexOf(
                            prefijo.trim().toLowerCase()
                        ) === 0;

                });

            if(lineaOtro){

                texto =
                    lineaOtro
                        .substring(prefijo.length)
                        .trim();

            }

        }

        const lineaOtroNueva =
            prefijo + texto;

        if(
            nuevas.indexOf(lineaOtroNueva) === -1
        ){

            nuevas.push(lineaOtroNueva);

        }

    }


    /*
     * Mantener el texto escrito manualmente por el usuario.
     *
     * Primero van las opciones seleccionadas,
     * después Otro y finalmente cualquier texto
     * que el usuario hubiera escrito manualmente.
     */

    const resultado = [];

    nuevas.forEach(function(linea){

        if(
            resultado.indexOf(linea) === -1
        ){

            resultado.push(linea);

        }

    });


    contenidoUsuario.forEach(function(linea){

        /*
         * No duplicar una opción generada.
         */
        if(
            resultado.indexOf(linea) === -1
        ){

            resultado.push(linea);

        }

    });


    campo.value =
        resultado.join("\n");


    /*
     * Guardar SOLO las líneas que el sistema generó.
     * Esto permite que en la siguiente modificación
     * sepamos qué debemos reemplazar y qué pertenece
     * al usuario.
     */

    campo.dataset[clave] =
        JSON.stringify(nuevas);

}

/*****************************************************
 * PREPARAR COLAPSADO — SESIÓN 2
 *
 * La pregunta NO se cierra automáticamente.
 * Solo se prepara para que pueda abrirse/cerrarse
 * cuando el usuario haga clic en su encabezado.
 *****************************************************/

function prepararColapsadoPreguntaSesion2(
    idBloque,
    completada
){

    const bloque =
        document.getElementById(idBloque);

    if(!bloque){
        return;
    }


    const encabezado =
        bloque.querySelector(
            ":scope > .tarjetaPregunta"
        );

    if(!encabezado){
        return;
    }


    encabezado.classList.add(
        "encabezadoPreguntaSesion2"
    );

    encabezado.style.cursor = "pointer";


    encabezado.title =
        completada
        ? "Pregunta respondida. Haga clic para continuar o editar."
        : "Pregunta disponible.";


    /*
     * Registrar el clic UNA sola vez.
     */

    if(
        !encabezado.dataset.colapsoInicializado
    ){

        encabezado.addEventListener(
            "click",
            function(){

                /*
                 * Si la pregunta todavía está bloqueada,
                 * no se puede abrir.
                 */

                if(
                    bloque.classList.contains(
                        "bloquePreguntaBloqueada"
                    )
                ){
                    return;
                }


                /*
                 * El usuario hizo clic.
                 * AHORA sí se recoge la pregunta
                 * anterior y se abre esta.
                 */

                abrirPreguntaSesion2(
                    idBloque
                );

            }
        );


        encabezado.dataset.colapsoInicializado =
            "1";

    }


    /*
     * Marcar visualmente como respondida,
     * pero SIN cerrarla.
     */

    if(completada){

        bloque.classList.add(
            "preguntaCompletadaSesion2"
        );

    }else{

        bloque.classList.remove(
            "preguntaCompletadaSesion2"
        );

    }

}


/*****************************************************
 * CERRAR UNA PREGUNTA — SESIÓN 2
 *****************************************************/

function cerrarPreguntaSesion2(
    idBloque
){

    const bloque =
        document.getElementById(idBloque);

    if(!bloque){
        return;
    }


    const encabezado =
        bloque.querySelector(
            ":scope > .tarjetaPregunta"
        );

    if(!encabezado){
        return;
    }


    /*
     * Ocultar todo excepto el encabezado.
     */

    Array.from(
        bloque.children
    ).forEach(function(hijo){

        if(hijo !== encabezado){

            hijo.dataset.ocultoPorColapso =
                "1";

            hijo.style.display =
                "none";

        }

    });


    bloque.classList.add(
        "preguntaColapsadaSesion2"
    );

}


/*****************************************************
 * ABRIR UNA PREGUNTA — SESIÓN 2
 *
 * Esta función solamente se ejecuta cuando
 * el usuario hace clic en una pregunta.
 *****************************************************/

function abrirPreguntaSesion2(
    idBloque
){

    const bloqueObjetivo =
        document.getElementById(
            idBloque
        );

    if(!bloqueObjetivo){
        return;
    }


    /*
     * No permitir abrir preguntas bloqueadas.
     */

    if(
        bloqueObjetivo.classList.contains(
            "bloquePreguntaBloqueada"
        )
    ){
        return;
    }


    /*
     * Cerrar las demás preguntas.
     *
     * Esto ocurre SOLO porque el usuario
     * hizo clic para abrir una pregunta.
     */

    IDS_PREGUNTAS_S2.forEach(
        function(id){

            if(id !== idBloque){

                cerrarPreguntaSesion2(
                    id
                );

            }

        }
    );


    /*
     * Mostrar nuevamente el contenido
     * de la pregunta seleccionada.
     */

    Array.from(
        bloqueObjetivo.children
    ).forEach(function(hijo){

        if(
            hijo.dataset.ocultoPorColapso ===
            "1"
        ){

            hijo.style.display =
                "";

            delete hijo.dataset
                .ocultoPorColapso;

        }

    });


    bloqueObjetivo.classList.remove(
        "preguntaColapsadaSesion2"
    );


    /*
     * Llevar la pregunta seleccionada
     * al área visible.
     */

    bloqueObjetivo.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

        "respuestaSesion2Pregunta2Accion5"
    );


    [1,2,3].forEach(function(n){

        );

        );

    });


    /* =================================================
       PREGUNTA 3
       ================================================= */

    const accionesCompletas =
        a1 && a2 && a3;

    actualizarEstadoTarjetaAcciones_(
        "bloqueSesion2Pregunta2",
        contarAccionesCompletadas_(
            [a1, a2, a3],
            ["contenidoAccion4Sesion2", "contenidoAccion5Sesion2"]
        ),
        5,
        3
    );

    habilitarBloqueSesion2(

    );

    habilitarControlesDentroSesion2(
        "bloqueSesion2Pregunta3",

    );

    /* Después validar */
    const p3 =
        validarPregunta3Sesion2();

    marcarTarjetaSeleccionValida_("bloqueSesion2Pregunta3", p3);


    /* =================================================
       PREGUNTA 4
       ================================================= */

    const puedeP4 =

    habilitarBloqueSesion2(

        puedeP4
    );

    habilitarCampoSesion2(

    );


    const p4 = actualizarContadorSesion2(

        MAX_P4_S2,

    );


    /* =================================================
       PREGUNTA 5
       ================================================= */

    const puedeP5 =
        accionesCompletas &&

    habilitarBloqueSesion2(
        "bloqueSesion2Pregunta5",
        puedeP5
    );

    habilitarControlesDentroSesion2(
        "bloqueSesion2Pregunta5",

    );

    const p5 =

    marcarTarjetaSeleccionValida_("bloqueSesion2Pregunta5", p5);


    /* =================================================

        document.getElementById(

        );

    if(boton3){

            !(
                p1 &&

            );

    /* =================================================
       COLAPSADO
       ================================================= */

    actualizarColapsoPreguntasSesion2([

    ]);

function estadoPalabrasSesion3(campo,min,max){
    if(!campo) return false;
    const n = contarPalabras(campo.value);
    return n >= min && n <= max;
}

function actualizarContadorSesion3(idCampo,idContador,idBarra,idMensaje,min,max,idBloquePregunta){
    const campo = document.getElementById(idCampo);
    if(!campo) return false;

    const n = contarPalabras(campo.value);
    const contador = document.getElementById(idContador);
    const barra = document.getElementById(idBarra);
    const mensaje = document.getElementById(idMensaje);

    if(contador) contador.textContent = n + " / " + max + " palabras";
    if(barra){
        barra.style.width = Math.min((n / max) * 100,100) + "%";
        barra.style.backgroundColor = calcularColorBarraProgreso_(n, min, max);
    }

    if(mensaje){
        if(n < min){
            mensaje.textContent = "⚠ Debe escribir al menos " + min + " palabras.";
            mensaje.style.color = "#C62828";
        }else if(n <= max){
            mensaje.textContent = "✓ Longitud adecuada. Puede continuar.";
            mensaje.style.color = "#0B6A44";
        }else{
            mensaje.textContent = "⚠ Ha superado el máximo de " + max + " palabras.";
            mensaje.style.color = "#C62828";
        }
    }

    actualizarMarcaMinimoCumplido_(campo, n, min, idBloquePregunta, max);

    return n >= min && n <= max;
}
