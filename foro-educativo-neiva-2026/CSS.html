<style>

/* =====================================================
CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --verde:#0b6a44;
    --verdeClaro:#2b8d63;
    --gris:#666;
    --grisClaro:#f4f6f8;
    --blanco:#ffffff;

}
/* =====================================================
   PALETA OFICIAL - FORO EDUCATIVO NEIVA 2026
===================================================== */

:root{

    --verde-neiva:#0B6A44;
    --amarillo-neiva:#F4B400;
    --rojo-neiva:#C62828;

    --blanco:#FFFFFF;

    --gris-fondo:#F7F8FA;
    --gris-borde:#DADCE0;
    --gris-texto:#4A4A4A;

    --sombra:0 4px 14px rgba(0,0,0,.08);

    --radio:12px;

    /*
     * =================================================
     * 01. TOKENS / VARIABLES — sistema de diseño
     * =================================================
     * Nombres semánticos que alias a la misma paleta institucional
     * de arriba (nunca se introduce un color nuevo): el resto del
     * archivo puede seguir usando --verde-neiva, --gris-texto, etc.
     * sin romper nada, y las reglas nuevas usan estos nombres.
     */
    --color-primary:#0B6A44;
    --color-primary-hover:#0A5C3B;
    --color-accent:#F4B400;
    --color-danger:#C62828;
    --color-text:#252525;
    --color-text-muted:#5F6368;
    --color-background:#F7F8FA;
    --color-surface:#FFFFFF;
    --color-border:#DADCE0;

    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:20px;

    --shadow-sm:0 1px 3px rgba(16,24,32,.08), 0 1px 2px rgba(16,24,32,.06);
    --shadow-md:0 6px 20px rgba(16,24,32,.10);

    --content-width:1100px;
    --reading-width:70ch;

    /*
     * Ancho dedicado para la pantalla de consentimiento (documento
     * de lectura larga) — NUNCA el mismo que la tarjeta angosta de
     * acceso (~480px) ni el --content-width genérico. Cambiar este
     * valor no afecta ninguna otra pantalla.
     */
    --consent-content-width:900px;

    /*
     * Marco institucional (Drive) usado como fondo de la tarjeta de
     * acceso y como marca de agua del documento de consentimiento —
     * una sola definición, dos usos. Requiere haber ejecutado
     * hacerPublicosLogosGlobales() una vez (ver Pruebas.js) para que
     * el archivo sea accesible sin sesión de Google.
     */
    --marco-acceso-url:url("https://lh3.googleusercontent.com/d/1qKHFEoq61uBOn1tNusZxXcK8rutIxDAS=w1200");

    --transition-fast:150ms ease-out;
    --transition-normal:220ms ease-out;

    /* Escala de espaciado en múltiplos de 4px. */
    --space-1:4px;
    --space-2:8px;
    --space-3:12px;
    --space-4:16px;
    --space-5:20px;
    --space-6:24px;
    --space-8:32px;
    --space-10:40px;
    --space-12:48px;

    /* Altura estándar de controles interactivos (inputs, botones). */
    --control-height:48px;

}

body{

    font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

    background:var(--color-background);

    color:var(--color-text);

    min-height:100vh;

}

/*
 * prefers-reduced-motion: se desactivan las transiciones y
 * animaciones no esenciales para quien lo pida — no afecta la
 * funcionalidad, solo el movimiento decorativo.
 */
@media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
        scroll-behavior:auto !important;
    }
}

/* =====================================================
05. ENCABEZADO
===================================================== */

.header{

    position:sticky;
    top:0;
    z-index:999;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:var(--space-4);

    background:var(--color-surface);
    padding:10px var(--space-6);
    border-bottom:1px solid var(--color-border);
    box-shadow:var(--shadow-sm);

}

.logoIzquierdo,
.logoDerecho{

    flex:0 0 auto;
    width:96px;

    display:flex;
    justify-content:center;
    align-items:center;

}

.logoIzquierdo img,
.logoDerecho img{

    max-width:96px;
    max-height:48px;
    width:auto;
    height:auto;
    object-fit:contain;

}

.tituloHeader{

    flex:1;
    min-width:0;
    text-align:center;

}

.logoIEHeader{

    display:inline-block;
    vertical-align:middle;
    max-width:32px;
    max-height:32px;
    margin:0 8px 0 0;
    border-radius:6px;
    object-fit:contain;

}

.tituloHeader h1{

    display:inline-block;
    vertical-align:middle;
    color:var(--color-primary);
    font-size:clamp(15px, 2.4vw, 21px);
    font-weight:700;
    letter-spacing:.2px;
    line-height:1.25;

}

.tituloHeader h2{

    margin-top:1px;
    color:var(--color-text-muted);
    font-size:12px;
    font-weight:500;
    letter-spacing:.4px;
    text-transform:uppercase;

}

@media (max-width:640px){

    .header{
        padding:8px var(--space-3);
        gap:var(--space-2);
    }

    .logoIzquierdo,
    .logoDerecho{
        width:52px;
    }

    .logoIzquierdo img,
    .logoDerecho img{
        max-width:52px;
        max-height:34px;
    }

    .logoIEHeader{
        display:block;
        margin:0 auto 4px;
    }

    .tituloHeader h1{
        font-size:clamp(13px, 4vw, 16px);
    }

    .tituloHeader h2{
        font-size:10px;
    }

}

/* =====================================================
06. BARRA DE PROGRESO
===================================================== */

.barraSuperior{

    height:6px;
    background:var(--color-border);

}

#barraProgreso{

    width:8%;
    height:100%;
    background:var(--color-primary);
    transition:width var(--transition-normal);

}

/* =====================================================
04. CONTENEDOR / LAYOUT GLOBAL
===================================================== */

#contenedorPrincipal{

    width:min(calc(100% - 32px), var(--content-width));
    margin:var(--space-8) auto;

}

/* =====================================================
07. PANTALLAS
===================================================== */

.pantalla{

    display:none;

    background:var(--color-surface);
    border-radius:var(--radius-lg);
    padding:clamp(20px, 4vw, 48px);
    border:1px solid var(--color-border);
    box-shadow:var(--shadow-sm);

    animation:aparecer var(--transition-normal);

}

.visible{

    display:block;

}

@keyframes aparecer{

    from{

        opacity:0;
        transform:translateY(8px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

/* =====================================================
03. TIPOGRAFÍA
===================================================== */

.tituloPrincipal{

    text-align:center;
    font-size:clamp(24px, 4vw, 34px);
    font-weight:700;
    line-height:1.2;
    color:var(--color-primary);
    margin-bottom:var(--space-2);

}

.subtitulo{

    text-align:center;
    font-size:clamp(17px, 2.4vw, 21px);
    font-weight:500;
    color:var(--color-text-muted);
    margin-bottom:var(--space-6);

}

.textoCentro{

    max-width:var(--reading-width);
    margin-left:auto;
    margin-right:auto;
    text-align:center;
    font-size:16px;
    line-height:1.65;
    margin-bottom:var(--space-4);

}

/* =====================================================
08. FORMULARIOS — controles globales
===================================================== */

.grupo{

    margin-bottom:var(--space-6);

}

.grupo label{

    display:block;
    margin-bottom:var(--space-2);
    font-weight:600;
    font-size:15px;
    color:var(--color-primary);

}

.ayudaCampo{

    display:block;
    font-size:13px;
    font-weight:normal;
    color:var(--color-text-muted);
    font-style:normal;
    margin:var(--space-2) 0 0;

}

/*
 * Controles interactivos (fuera de .grupo también, para que la
 * normalización alcance a toda la aplicación: acceso, asistencia,
 * caracterización, sesiones, plenaria) — altura, tipografía y
 * estado de foco consistentes en todas partes.
 */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="number"],
input[type="password"],
input[type="search"],
input[type="date"],
select,
.grupo input,
.grupo select,
.grupo textarea{

    width:100%;
    min-height:var(--control-height);
    padding:12px var(--space-4);
    font-family:inherit;
    font-size:16px;
    color:var(--color-text);
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-sm);
    transition:border-color var(--transition-fast), box-shadow var(--transition-fast);

}

textarea.grupo,
.grupo textarea{
    min-height:120px;
    line-height:1.55;
    padding:12px var(--space-4);
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.grupo input:focus,
.grupo select:focus,
.grupo textarea:focus{

    outline:none;
    border-color:var(--color-primary);
    box-shadow:0 0 0 3px rgba(11,106,68,.18);

}

/* =====================================================
13. CONSENTIMIENTO
===================================================== */

/* --- CONSENT — BASE ---
 * A diferencia de la pantalla de acceso (tarjeta angosta de
 * autenticación), esta es una interfaz de lectura de documento: usa
 * su propia variable de ancho, nunca el ancho de la tarjeta de
 * acceso ni el --content-width genérico de las demás pantallas.
 */
#consentimientoDocumentoWrap{

    position:relative;
    width:min(100%, var(--consent-content-width));
    margin:0 auto;

}

.btnAmpliarConsentimiento{

    position:absolute;
    top:0;
    right:0;
    width:38px;
    height:38px;
    border:1px solid var(--color-border);
    border-radius:50%;
    background:var(--color-surface);
    color:var(--color-primary);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background var(--transition-fast), color var(--transition-fast);
    z-index:2;

}

.btnAmpliarConsentimiento:hover{
    background:var(--color-primary);
    color:var(--blanco);
    border-color:var(--color-primary);
}

.btnCerrarConsentimientoCompleto{

    display:none;

}

/* --- CONSENT — DOCUMENT ---
 * El contenedor exterior (#consentimientoDocumentoWrap) puede ser
 * ancho; el TEXTO adentro conserva una medida de lectura cómoda
 * (--reading-width) centrada — así el documento "respira" en
 * pantallas grandes sin que las líneas se vuelvan interminables.
 */
.cajaTexto{

    position:relative;
    width:100%;
    margin:var(--space-5) 0 var(--space-4);
    border:1px solid var(--color-border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);
    padding:clamp(20px, 4vw, 40px);
    /* Alto predecible según el viewport, nunca tan corto que apenas
       haga falta desplazarse ni tan alto que la casilla y el botón
       queden lejos, fuera de la vista inicial. */
    height:clamp(340px, 62vh, 620px);
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background-color:var(--color-surface);
    font-size:16px;
    line-height:1.65;
    scroll-behavior:smooth;

}

.cajaTexto > *{
    max-width:var(--reading-width);
    margin-left:auto;
    margin-right:auto;
}

.cajaTexto p{ margin:0 0 var(--space-4); }
.cajaTexto ul,
.cajaTexto ol{ margin:0 0 var(--space-4) 22px; }
.cajaTexto li{ margin-bottom:10px; line-height:1.6; }
.cajaTexto hr{
    border:none;
    border-top:1px solid var(--color-border);
    margin:var(--space-8) auto;
    max-width:var(--reading-width);
}

.cajaTexto h1,
.cajaTexto h2,
.cajaTexto h3,
.cajaTexto h4{
    color:var(--color-primary);
    font-weight:700;
    margin:var(--space-6) auto var(--space-3);
    line-height:1.3;
}
.cajaTexto h2{ font-size:22px; text-align:left; }
.cajaTexto h3{ font-size:18px; }
.cajaTexto > h2:first-child{
    margin-top:0;
    text-align:center;
    font-size:clamp(19px, 3vw, 23px);
}

/* --- CONSENT — WATERMARK ---
 * Mismo mecanismo que el marco de fondo de la pantalla de acceso
 * (--marco-acceso-url, definida una sola vez en :root): aquí se
 * desvanece con una capa blanca semitransparente encima (el color de
 * fondo real de la caja sigue siendo blanco sólido) para que quede
 * como una marca de agua discreta, nunca compitiendo con el texto.
 * background-attachment por defecto (no "local") lo mantiene fijo
 * dentro del recuadro mientras el texto se desplaza — como una marca
 * de agua real, no como una imagen que "pasa" y desaparece.
 */
.cajaTexto{
    background-image:
        linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.90)),
        var(--marco-acceso-url);
    background-repeat:no-repeat;
    background-position:center 32px, center 32px;
    background-size:auto, min(320px, 55%) auto;
}

/* --- CONSENT — STATUS --- */
.mensajeLectura{

    width:min(100%, var(--consent-content-width));
    margin:0 auto var(--space-4);
    font-size:14px;
    font-weight:600;
    color:var(--color-text-muted);
    text-align:center;
    transition:color var(--transition-normal);

}

/* --- CONSENT — ACCEPTANCE --- */
.grupoCheck{

    width:min(100%, var(--consent-content-width));
    margin:var(--space-2) auto var(--space-6);
    display:flex;
    align-items:flex-start;
    gap:var(--space-3);
    padding:var(--space-4) var(--space-5);
    background:var(--color-background);
    border-radius:var(--radius-sm);
    border-left:4px solid var(--color-accent);

}

.grupoCheck input{

    flex:0 0 auto;
    width:20px;
    height:20px;
    margin-top:2px;
    accent-color:var(--color-primary);

}

.grupoCheck label{
    font-size:15px;
    font-weight:600;
    color:var(--color-text);
    cursor:pointer;
}

.grupoCheck input:disabled + label{
    color:var(--color-text-muted);
    cursor:not-allowed;
}

#pantallaConsentimiento .botones{
    width:min(100%, var(--consent-content-width));
    margin-left:auto;
    margin-right:auto;
    justify-content:center;
}

/* --- CONSENT — FULLSCREEN ---
 * Se pone en pantalla completa el CONTENEDOR (#consentimientoDocumentoWrap),
 * no un clon: incluye el mismo #textoConsentimiento, #acepto y
 * #btnContinuar de siempre — mismo estado, mismos listeners, cero
 * sincronización necesaria. Es una vista de lectura, nunca editable
 * (el consentimiento nunca fue un textarea).
 */
#consentimientoDocumentoWrap:fullscreen{

    width:100%;
    max-width:none;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--color-background);
    padding:clamp(16px, 4vw, 48px);
    overflow-y:auto;

}

#consentimientoDocumentoWrap:fullscreen .btnAmpliarConsentimiento{
    display:none;
}

#consentimientoDocumentoWrap:fullscreen .btnCerrarConsentimientoCompleto{
    display:inline-flex;
    align-items:center;
    position:absolute;
    top:0;
    right:0;
    background:var(--color-surface);
    color:var(--color-text);
    border:1px solid var(--color-border);
    border-radius:var(--radius-sm);
    padding:8px 16px;
    font-size:14px;
    font-weight:600;
    min-height:auto;
    z-index:2;
}

#consentimientoDocumentoWrap:fullscreen .btnCerrarConsentimientoCompleto:hover{
    background:var(--color-background);
    border-color:var(--color-primary);
    color:var(--color-primary);
}

#consentimientoDocumentoWrap:fullscreen .cajaTexto{
    flex:1 1 auto;
    min-height:0;
    height:auto;
    width:100%;
    max-width:var(--consent-content-width);
    margin-left:auto;
    margin-right:auto;
    font-size:17px;
}

#consentimientoDocumentoWrap:fullscreen .mensajeLectura,
#consentimientoDocumentoWrap:fullscreen .grupoCheck,
#consentimientoDocumentoWrap:fullscreen .botones{
    max-width:var(--consent-content-width);
}

/* --- CONSENT — RESPONSIVE --- */
@media (max-width:640px){

    #consentimientoDocumentoWrap{
        width:calc(100% - 8px);
    }

    .cajaTexto{
        padding:16px;
        height:clamp(320px, 58vh, 520px);
    }

    .cajaTexto{
        background-size:auto, min(200px, 60%) auto;
    }

    .btnAmpliarConsentimiento{
        width:44px;
        height:44px;
    }

}

/* =====================================================
09. BOTONES
===================================================== */

.botones{

    margin-top:var(--space-8);
    display:flex;
    justify-content:space-between;
    gap:var(--space-3);
    flex-wrap:wrap;

}

button{

    min-height:var(--control-height);
    background:var(--color-primary);
    color:var(--blanco);
    border:none;
    border-radius:var(--radius-sm);
    padding:12px 28px;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background var(--transition-fast), box-shadow var(--transition-fast);

}

button:hover:not(:disabled){

    background:var(--color-primary-hover);

}

button:focus-visible{

    outline:none;
    box-shadow:0 0 0 3px rgba(11,106,68,.28);

}

button:disabled{

    background:#BDBDBD;
    cursor:not-allowed;

}

/* =====================================================
10. ACCESO — pantalla de acceso (#pantallaAccesoFEM)
===================================================== */

/*
 * La pantalla de acceso deja de ser una ".pantalla" blanca genérica
 * con sombra grande: pasa a ser una composición de página completa
 * (el marco institucional de fondo) con la tarjeta de acceso,
 * compacta, centrada encima. Se anula el padding/sombra/borde que
 * .pantalla aplica por defecto y se reconstruye aquí.
 *
 * Fondo: la imagen "Marco para documentos y para formularios" es
 * vertical (2:3) — se usa con background-size:contain (nunca se
 * recorta ni se distorsiona) sobre un degradado institucional suave
 * que rellena el resto del viewport en cualquier proporción de
 * pantalla.
 */
#pantallaAccesoFEM{

    display:none;
    padding:0;
    border:none;
    border-radius:0;
    box-shadow:none;
    background:
        linear-gradient(180deg, rgba(11,106,68,.06), rgba(247,248,250,0) 40%),
        var(--color-background);

}

#pantallaAccesoFEM.visible{

    display:flex;
    justify-content:center;
    padding:clamp(24px, 6vw, 64px) var(--space-4);

}

.contenedorAccesoFEM{

    position:relative;
    width:min(100%, 480px);
    margin:0 auto;
    background:
        linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.97)),
        var(--marco-acceso-url) center top / contain no-repeat,
        var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:clamp(28px, 5vw, 44px) clamp(24px, 5vw, 36px);
    text-align:center;

}

.indicadorAccesoFEM{

    font-size:12px;
    font-weight:600;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--color-text-muted);
    margin-bottom:var(--space-4);

}

.tituloAccesoPrincipal{

    font-size:clamp(21px, 3.2vw, 26px);
    font-weight:700;
    line-height:1.25;
    color:var(--color-text);
    margin-bottom:var(--space-4);

}

.tituloAccesoFEM{

    font-size:14px;
    line-height:1.5;
    color:var(--color-primary);
    background:rgba(11,106,68,.08);
    border-radius:var(--radius-sm);
    padding:10px var(--space-4);
    margin-bottom:var(--space-6);

}

.bloqueCodigoAccesoFEM{

    display:flex;
    flex-direction:column;
    gap:var(--space-2);
    text-align:left;
    margin-bottom:var(--space-6);

}

.bloqueCodigoAccesoFEM label{

    font-size:14px;
    font-weight:600;
    color:var(--color-text);

}

.bloqueCodigoAccesoFEM input{

    width:100%;
    min-height:50px;
    padding:0 var(--space-4);
    font-size:16px;
    text-align:center;
    letter-spacing:1px;
    color:var(--color-text);
    background:var(--color-background);
    border:1px solid var(--color-border);
    border-radius:var(--radius-sm);
    transition:border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);

}

.bloqueCodigoAccesoFEM input:focus-visible{

    outline:none;
    background:var(--color-surface);
    border-color:var(--color-primary);
    box-shadow:0 0 0 3px rgba(11,106,68,.18);

}

.bloqueCodigoAccesoFEM button{

    width:100%;
    min-height:50px;
    font-size:15px;
    letter-spacing:.4px;
    margin-top:var(--space-1);

}

.mensajeAccesoFEM{

    font-size:14px;
    line-height:1.5;
    margin-top:var(--space-1);

}

.contactoAccesoFEM{

    text-align:left;
    background:var(--color-background);
    border-left:3px solid var(--color-accent);
    border-radius:var(--radius-sm);
    padding:var(--space-4) var(--space-5);

}

.contactoAccesoFEMPregunta{

    font-size:13px;
    color:var(--color-text-muted);
    margin-bottom:var(--space-2);

}

.contactoAccesoFEMEntidad{

    font-size:14px;
    font-weight:700;
    color:var(--color-primary);
    margin-bottom:2px;

}

.contactoAccesoFEMDato{

    font-size:13px;
    color:var(--color-text-muted);
    line-height:1.6;

}

@media (max-width:420px){

    .contenedorAccesoFEM{
        padding:24px 20px;
    }

}

/* =====================================================
11. BIENVENIDA — pantalla de bienvenida (#pantallaBienvenida)

Introducción visual breve (imagen institucional del FEM que aparece,
se sostiene y se desvanece) antes del saludo personalizado. Un solo
escenario estable (.bienvenidaEscenario) reserva el espacio para que
pasar de la imagen al texto no mueva ni redimensione la tarjeta.
===================================================== */

.bienvenidaTarjeta{

    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:clamp(24px, 5vw, 48px);
    max-width:780px;
    margin:0 auto;

}

.bienvenidaEscenario{

    position:relative;
    min-height:clamp(200px, 28vw, 280px);
    display:flex;
    align-items:center;
    justify-content:center;

}

.welcomeIntroVisual{

    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;

}

/*
 * Secuencia completa en una sola animación (1.9s): entra (0-16%),
 * se sostiene (16-68%), se desvanece (68-100%). JS solo espera el
 * evento "animationend" de este mismo elemento para revelar el
 * texto — nunca hay temporizadores sueltos que puedan desincronizarse
 * de lo que realmente se ve en pantalla.
 */
@keyframes bienvenidaIntroSecuencia{
    0%   { opacity:0; transform:scale(.98); }
    16%  { opacity:1; transform:scale(1); }
    68%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1); }
}

.welcomeIntroVisual.welcomeIntroVisualActivo{
    animation:bienvenidaIntroSecuencia 1900ms ease-out forwards;
}

.welcomeIntroImagen{

    max-width:min(360px, 70%);
    width:100%;
    height:auto;
    object-fit:contain;

}

.bienvenidaContenido{

    position:relative;
    width:100%;
    max-width:700px;
    margin:0 auto;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity var(--transition-normal), transform var(--transition-normal);

}

.bienvenidaContenido.bienvenidaContenidoVisible{
    opacity:1;
    transform:translateY(0);
}

.bienvenidaSaludo{

    font-size:clamp(22px, 3.6vw, 30px);
    font-weight:700;
    line-height:1.3;
    color:var(--color-text);
    margin-bottom:var(--space-4);

}

.bienvenidaSaludo strong{
    color:var(--color-primary);
}

.bienvenidaTexto{

    max-width:640px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
    color:var(--color-text-muted);

}

.bienvenidaTexto:first-of-type{
    font-size:19px;
    font-weight:600;
    color:var(--color-text);
    margin-bottom:var(--space-3);
}

.bienvenidaTexto:not(:first-of-type){
    font-size:16px;
}

#pantallaBienvenida .botones{
    justify-content:center;
}

@media (max-width:640px){

    .bienvenidaEscenario{
        min-height:clamp(160px, 40vw, 220px);
    }

    .welcomeIntroImagen{
        max-width:min(240px, 78%);
    }

    .bienvenidaSaludo{
        font-size:clamp(20px, 5.6vw, 24px);
    }

}

/* --- Movimiento reducido: sin animación, todo visible de inmediato ---
   (la regla global de prefers-reduced-motion ya fuerza duraciones a
   ~0, esto además evita el salto de posición del "translateY".) */
@media (prefers-reduced-motion: reduce){
    .bienvenidaContenido{
        transform:none;
    }
}

/* =====================================================
21. RESPONSIVE — reglas generales
===================================================== */

/*
 * El encabezado y la tipografía (.tituloHeader h1, .tituloPrincipal,
 * .pantalla) ya son fluidos con clamp()/min() más arriba — no
 * necesitan un salto brusco en un punto de quiebre fijo. Aquí solo
 * quedan los ajustes que sí son un cambio real de estructura
 * (botones en columna) y solo desde el rango realmente móvil, no
 * desde tablet — apilar botones a 900px hacía que pantallas de
 * tablet en horizontal, que ya tienen espacio de sobra, se vieran
 * innecesariamente angostas.
 */
@media(max-width:640px){

.botones{

    flex-direction:column;

}

.botones button{

    width:100%;

}

}

.campoError{

    border:2px solid #d32f2f !important;

    background:#fff8f8;

}/* =====================================================
SESIÓN 1
===================================================== */

/*
 * Apertura de Sesión 1: "Primera Sesión" y su subtítulo son EL MISMO
 * título/subtítulo que luego queda en el flujo normal (nunca se
 * duplican, ver sección 22 del encargo) — durante la apertura, JS
 * les agrega clases en el propio #pantallaSesion1 que los saca en
 * overlay a pantalla completa, centrados, uno a la vez; al terminar,
 * esas clases se quitan y vuelven a su posición normal en el
 * documento sin ningún cambio de contenido.
 */
.sesion1TituloBloque{
    text-align:center;
}

#pantallaSesion1.sesion1EnApertura #sesion1Contenido{
    display:none;
}

#pantallaSesion1.sesion1EnApertura #sesion1TituloBloque{
    position:fixed;
    inset:0;
    z-index:80;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--color-background);
    padding:var(--space-6);
}

#pantallaSesion1.sesion1EnApertura #sesion1AperturaTitulo,
#pantallaSesion1.sesion1EnApertura #sesion1AperturaSubtitulo{
    opacity:0;
    transition:opacity 450ms ease-out;
    max-width:min(90vw, 640px);
}

#pantallaSesion1.sesion1EnApertura.sesion1FaseTitulo #sesion1AperturaTitulo{
    opacity:1;
}

#pantallaSesion1.sesion1EnApertura.sesion1FaseSubtitulo #sesion1AperturaSubtitulo{
    opacity:1;
}

@media (prefers-reduced-motion: reduce){
    #pantallaSesion1.sesion1EnApertura #sesion1AperturaTitulo,
    #pantallaSesion1.sesion1EnApertura #sesion1AperturaSubtitulo{
        transition:none;
    }
}

.panelSesion{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:18px;

    margin:25px 0 35px 0;

}

.datoSesion{

    background:#f8fafb;

    border-left:5px solid var(--verde);

    border-radius:10px;

    padding:18px;

    text-align:center;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.datoSesion strong{

    display:block;

    color:var(--verde);

    margin-bottom:8px;

}

/* =====================================================
12. TARJETAS Y PANELES
===================================================== */

.tarjetaObjetivo,
.tarjetaDesarrollo,
.tarjetaPregunta,
.tarjetaSintesis{

    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-md);
    padding:var(--space-6);
    margin-bottom:var(--space-6);
    transition:border-color var(--transition-fast);

}

.tarjetaObjetivo{

    background:#ffffff;

    border-left:8px solid var(--verde-neiva);

    /*
     * Menos relleno lateral que antes (era 30px parejo): el texto
     * del objetivo llega más cerca del borde de la tarjeta/marco de
     * la pantalla, en vez de quedar "encogido" en el centro.
     */
    padding:30px 20px;

    margin:35px 0 25px;

}

.tarjetaObjetivo p{

    max-width:none;

}

.tarjetaPregunta{

    background:#ffffff;

    border-left:8px solid var(--amarillo-neiva);

    padding:30px;

    margin:0 0 55px;

}
.tarjetaPregunta h3,
.tarjetaObjetivo h3{

    margin:0 0 15px;

    font-size:22px;

    font-weight:700;

}

.textoPregunta{

    font-size:20px;

    line-height:1.8;

    font-weight:500;

    color:#333;

    margin:0;

    max-width:70ch;

}

.tarjetaSintesis{

    border-left:6px solid var(--rojo-neiva);

}

.tarjetaObjetivo h3,
.tarjetaDesarrollo h3,
.tarjetaPregunta h3,
.tarjetaSintesis h3{

    margin:0 0 14px 0;

    color:var(--verde-neiva);

    font-size:20px;

    font-weight:700;

}

.tarjetaObjetivo p,
.tarjetaDesarrollo p,
.tarjetaPregunta p,
.tarjetaSintesis p{

    color:var(--gris-texto);

    line-height:1.7;

    margin:0;

}

/*
 * Nota para el relator (Sesiones 1, 2 y 3): antes iba mezclada dentro
 * del párrafo del objetivo; ahora es su propio recuadro amarillo,
 * igual como se pidió — separado, no compite visualmente con el
 * objetivo pero tampoco pasa desapercibido.
 */
.notaRelator{

    background:#FFF8E1;
    border-left:4px solid var(--color-accent);
    border-radius:var(--radius-sm);
    padding:var(--space-3) var(--space-4);
    margin:var(--space-4) 0 var(--space-6);
    font-size:14px;
    line-height:1.55;
    color:#7A5B00;

}

/*
 * Documentos de apoyo: su propia tarjeta, separada del objetivo,
 * con acento amarillo (es material de referencia, no la instrucción
 * principal) y los enlaces como botones reales en vez de texto
 * subrayado azul de navegador por defecto.
 */
.documentos-apoyo-sesion1{

    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-left:6px solid var(--color-accent);
    border-radius:var(--radius-md);
    padding:var(--space-6);
    margin:var(--space-6) 0;

}

.documentos-apoyo-titulo{

    font-size:16px;
    font-weight:700;
    color:var(--color-primary);
    margin-bottom:var(--space-2);

}

.documentos-apoyo-texto{

    font-size:15px;
    line-height:1.6;
    color:var(--color-text-muted);
    margin-bottom:var(--space-4);
    max-width:var(--reading-width);

}

.documentos-apoyo-botones{

    display:flex;
    flex-wrap:wrap;
    gap:var(--space-3);

}

.btn-documento-apoyo{

    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--color-surface);
    color:var(--color-primary);
    border:1px solid var(--color-primary);
    border-radius:var(--radius-sm);
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    transition:background var(--transition-fast), color var(--transition-fast);

}

.btn-documento-apoyo:hover{

    background:var(--color-primary);
    color:var(--blanco);

}

.contenedorTrabajoSesion{

    display:grid;

    grid-template-columns:25% 75%;

    gap:25px;

    margin:30px 0;

}

.panelGuia{

    /*
     * Fondo verde institucional (tenue, para no competir con el
     * texto) con la línea lateral amarilla como acento — identifica
     * el panel como "guía/orientación". La línea pasa a verde sólo
     * cuando la pregunta asociada ya cumplió el mínimo de palabras
     * (ver .minimoPalabrasCumplido más abajo).
     */
    background:rgba(11,106,68,.07);

    border:1px solid var(--color-border, #e2e2e2);

    border-left:4px solid var(--amarillo-neiva);

    border-radius:var(--radius-md);

    padding:var(--space-5);

    transition:border-left-color var(--transition-fast);

    /*
     * El encabezado ahora es compacto (antes ocupaba ~130px de
     * alto): este desplazamiento se ajusta al nuevo alto real
     * (encabezado + barra de progreso) para que el panel no quede
     * "flotando" con un hueco grande arriba al hacer scroll.
     */
    position:sticky;

    top:88px;

    align-self:start;

}

.panelGuia h3{

    color:var(--amarillo-neiva);

    margin-bottom:18px;

    /*
     * Sombra oscura para que el amarillo no se pierda sobre el
     * fondo claro del panel.
     */
    text-shadow:0 1px 2px rgba(0,0,0,.55);

}

.panelGuia ul{

    list-style:none;

    padding:0;

    margin:20px 0 0;

}

/*
 * Texto de apoyo (los ítems de la guía) en negrita — las preguntas
 * de apoyo (los títulos h3, ya en amarillo) se dejan como están.
 */
.panelGuia li,
.panelGuia > p{

    font-weight:700;

}

.panelGuia li{

    position:relative;

    padding-left:28px;

    margin-bottom:16px;

    line-height:1.6;

}
.panelGuia li::before{

    content:"✓";

    position:absolute;

    left:0;

    top:0;

    color:var(--verde-neiva);

    font-weight:bold;

    font-size:18px;

}

/*
 * Casillas de selección (equipos de trabajo, Sesiones 2 y 3): antes
 * eran checkboxes nativos crudos, sin ningún estilo, separados con
 * <br> — se veían como HTML de navegador por defecto. Se escala el
 * control, se le da al texto espacio para respirar y un objetivo de
 * toque cómodo, sin tocar los id ni la estructura que usa el JS.
 */
.panelGuia label{

    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:6px 0;
    font-size:15px;
    font-weight:700;
    line-height:1.45;
    color:var(--color-text);
    cursor:pointer;

}

.panelGuia label:hover{

    color:var(--color-primary);

}

.panelGuia input[type="checkbox"],
.panelGuia input[type="radio"]{

    flex:0 0 auto;
    width:19px;
    height:19px;
    min-height:0;
    margin-top:1px;
    accent-color:var(--color-primary);
    cursor:pointer;

}

/* El <br> entre casillas ya no hace falta: .panelGuia label es un
   bloque flex con su propio espaciado (padding). */
.panelGuia br{

    display:none;

}

.panelGuia input[type="text"]{

    min-height:40px;
    margin:var(--space-2) 0 var(--space-2) 29px;

}

.panelRespuesta{

    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-left:4px solid transparent;
    border-radius:var(--radius-md);
    padding:var(--space-5);
    transition:border-left-color var(--transition-fast);

}

/*
 * Estado "mínimo cumplido": se agrega con JS (ver
 * actualizarMarcaMinimoCumplido_ en App.html) sobre el
 * .contenedorTrabajoSesion de la pregunta, y sobre su
 * .tarjetaPregunta cuando aplica, en cuanto el texto alcanza el
 * mínimo de palabras exigido.
 */
.contenedorTrabajoSesion.minimoPalabrasCumplido .panelGuia{

    border-left-color:var(--verde-neiva);

}

.contenedorTrabajoSesion.minimoPalabrasCumplido .panelRespuesta{

    border-left-color:var(--verde-neiva);

}

/*
 * El propio recuadro de la respuesta (el textarea) también se pone
 * verde cuando se cumple el mínimo — además de su borde en vivo
 * (rojo/amarillo/verde según avance, ver calcularColorBarraProgreso_
 * en App.html), que se pinta directamente con JS.
 */
.contenedorTrabajoSesion.minimoPalabrasCumplido .panelRespuesta textarea{

    background:rgba(11,106,68,.07);

}

/*
 * Campos de "acción" (Sesión 2 y 3): ya no tienen barra de progreso
 * aparte — su propio borde hace de semáforo. El botón "+ Añadir"
 * de las acciones opcionales (4 y 5) y su contenido oculto hasta el
 * clic.
 */
.botonAccionOpcional{

    display:block;
    width:100%;
    background:var(--color-surface);
    border:2px dashed var(--color-border);
    border-radius:var(--radius-md);
    padding:var(--space-4);
    margin:var(--space-4) 0;
    color:var(--color-primary);
    font-weight:600;
    font-size:15px;
    text-align:center;
    cursor:pointer;
    transition:border-color var(--transition-fast), background var(--transition-fast);

}

.botonAccionOpcional:hover{

    border-color:var(--color-primary);
    background:rgba(11,106,68,.05);

}

.accionOpcionalOculta{

    display:none;

}

.tarjetaPregunta.minimoPalabrasCumplido{

    background:rgba(11,106,68,.07);
    border-left-color:var(--verde-neiva);
    box-shadow:0 0 0 2px rgba(11,106,68,.18);

}

/*
 * Barra de herramientas (Guardar / Pantalla completa / Modo
 * lectura): son utilidades de apoyo, no la acción principal de la
 * pantalla — deben leerse como secundarias frente a la pregunta y
 * la respuesta, así que usan un estilo "ghost" (contorno, sin
 * relleno) en vez del mismo botón verde sólido que "Continuar".
 */
.barraHerramientas{

    display:flex;

    gap:var(--space-2);

    flex-wrap:wrap;

    margin-bottom:var(--space-5);

}

.barraHerramientas button{

    background:transparent;
    color:var(--color-text-muted);
    border:1px solid var(--color-border);
    padding:8px 16px;
    font-size:13px;
    font-weight:500;
    min-height:auto;

}

.barraHerramientas button:hover:not(:disabled){

    background:var(--color-background);
    color:var(--color-primary);
    border-color:var(--color-primary);

}

.panelRespuesta textarea{

    width:100%;

    min-height:340px;

    resize:vertical;

    padding:18px;

    font-size:17px;

    line-height:1.8;

    border:1px solid #cfd8dc;

    border-radius:12px;

}

.panelRespuesta textarea:focus{

    outline:none;

    border-color:var(--verde);

    box-shadow:0 0 10px rgba(11,106,68,.25);

}
.contadorPalabras{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    margin-top:20px;

    font-size:18px;

    font-weight:700;

    transition:.3s;

}
.barraPalabras{

    width:100%;

    height:10px;

    background:#E6E6E6;

    border-radius:20px;

    overflow:hidden;

    margin-top:10px;

    margin-bottom:30px;

}

/*
 * Selector por prefijo de id (en vez de listar cada pregunta de
 * Sesión 1/2/3 una por una): todas las barras de progreso de
 * palabras comparten id "progresoPalabrasSesion...". Antes solo
 * existía esta regla para "progresoPalabrasSesion1" (Sesión 1,
 * Pregunta 1) — el resto de las preguntas de las tres sesiones no
 * tenían ni alto ni color de fondo definidos, así que su barra de
 * progreso era invisible (ancho correcto, pero 0 de alto).
 */
[id^="progresoPalabrasSesion"]{

    width:0%;

    height:100%;

    background:#C62828;

    border-radius:20px;

    transition:width .35s ease,
               background-color .35s ease;

}

.textoAyuda{

    color:#666;

    margin-bottom:25px;

}

.tarjetaSintesis label{

    display:block;

    font-weight:bold;

    color:var(--verde);

    margin-top:20px;

    margin-bottom:8px;

}

.tarjetaSintesis textarea{

    width:100%;

    min-height:150px;

    padding:14px;

    font-size:16px;

    border:1px solid #cfd8dc;

    border-radius:10px;

    resize:vertical;

}

.tarjetaSintesis textarea:focus{

    outline:none;

    border-color:var(--verde);

    box-shadow:0 0 8px rgba(11,106,68,.20);

}

/* =====================================================
RESPONSIVE SESIÓN 1
===================================================== */

@media(max-width:1000px){

.panelSesion{

    grid-template-columns:repeat(2,1fr);

}

.contenedorTrabajoSesion{

    grid-template-columns:1fr;

}

.panelGuia{

    position:relative;

    top:auto;

}

}

@media(max-width:700px){

.panelSesion{

    grid-template-columns:1fr;

}

.barraHerramientas{

    flex-direction:column;

}

.barraHerramientas button{

RESUMEN

.tarjetaResumen{

    background:#ffffff;

    border-radius:16px;

    padding:35px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.tablaResumen{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}

.tablaResumen th{

    width:35%;

    text-align:left;

    padding:14px;

    background:#f2f6f8;

    color:var(--verde);

    border-bottom:1px solid #ddd;

}

.tablaResumen td{

    padding:14px;

    border-bottom:1px solid #ddd;

}/*=====================================================
CONSENTIMIENTO INFORMADO
=====================================================*/

.seccionConsentimiento{

    margin-bottom:var(--space-6);

}

.seccionConsentimiento h3{

    color:var(--color-primary);

    margin-bottom:var(--space-2);

    padding-bottom:6px;

    border-bottom:1px solid var(--color-border);

}

.seccionConsentimiento p{

     * text-align:justify a esta medida de lectura (~70ch) es lo que

/*=====================================================
13. AVISO IMPORTANTE — "Antes de finalizar"

Sigue siendo un bloque semántico destacado, pero menos saturado:
fondo casi blanco con un ligero tinte verde, acento institucional
solo en el borde izquierdo (no relleno completo), radio moderado.
Su ancho ya queda acotado por .cajaTexto > * (--reading-width).
=====================================================*/

.avisoImportante{

    margin-top:var(--space-6);

    padding:var(--space-5);

    background:#F6FBF8;

    border:1px solid var(--color-border);

    border-left:4px solid var(--color-primary);

    border-radius:var(--radius-sm);

}

.avisoImportante h4{

    color:var(--color-primary);

    font-size:15px;

    margin-bottom:var(--space-2);

}

.avisoImportante p{

    text-align:left;

    line-height:1.6;

}

.avisoImportante ul{

    margin:var(--space-3) 0 var(--space-3) 22px;

}

.avisoImportante li{

    margin-bottom:8px;

}
/*
 * Regla de botones deshabilitados duplicada — ya está consolidada
 * en la sección 09. BOTONES (background gris + cursor). Mantenerla
 * repetida con opacidad + escala de grises encima hacía el texto
 * del botón difícil de leer.
 */

.mensajeContador{

    margin-top:12px;

    font-size:15px;

    font-weight:600;

    text-align:right;

    transition:.3s;

}
/* =====================================================
   RECORRIDO DEL FORO
   Módulo 1 - Conozca el recorrido
   ===================================================== */

#pantallaRecorrido {
    text-align: center;
}

/* Título */

#pantallaRecorrido .recorridoTitulo {
    color: #0B6A44;
    margin-bottom: 10px;
}

#pantallaRecorrido .recorridoSubtitulo {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 12px;
}

#pantallaRecorrido .recorridoIntro {
    max-width: 850px;
    margin: 0 auto 25px auto;
    line-height: 1.6;
}

/* Tarjeta */

.recorridoTarjeta {
    max-width: 820px;
    min-height: 300px;
    margin: 0 auto;
    padding: 30px 40px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    text-align: left;
    box-sizing: border-box;
}


/* Icono */

.recorridoIcono {
    text-align: center;
    font-size: 42px;
    margin-bottom: 8px;
}

/* Título de tarjeta */

.recorridoTarjeta h3 {
    text-align: center;
    color: #0B6A44;
    font-size: 24px;
    margin: 5px 0 22px 0;
}

/* Preguntas */

.recorridoPregunta {
    font-weight: bold;
    color: #0B6A44;
    margin-top: 18px;
    margin-bottom: 5px;
}

.recorridoTarjeta p {
    line-height: 1.55;
    margin-top: 5px;
}

/* Listas */

.recorridoTarjeta ul {
    margin-top: 8px;
    padding-left: 25px;
}

.recorridoTarjeta li {
    margin-bottom: 5px;
}

/* Frase final */

    font-style: italic;

}

/* Navegación */

    margin: 20px auto 15px auto;
    display: flex;
    align-items: center;

.recorridoNavegacion button {

}

}

.recorridoPreparacion ul {
    margin: 0;

}

.recorridoPreparacion li {
    margin-bottom: 5px;
}

/* Botón */

#btnIniciarRecorrido {
    margin-top: 10px;
}
/* =====================================================
   TRANSICIÓN DE TARJETAS DEL RECORRIDO
   ===================================================== */

.recorridoTarjeta.transicionSalida {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.recorridoTarjeta.transicionEntrada {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease, transform 0.3s ease;
}
.recorridoTarjeta.transicionSalida {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
}

.recorridoTarjeta.transicionEntrada {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease, transform 0.3s ease;
}
/* =====================================================
   PARTICIPACIÓN EN EL FORO
   ===================================================== */

.participacionForo {
    margin-top: 40px;
    margin-bottom: 35px;
    padding: 30px;
    background: #f8fafb;
    border: 1px solid #dfe7e3;
    border-radius: 16px;
}

/* TÍTULO */

.tituloParticipacion {
    margin: 0 0 10px 0;
    text-align: center;
    color: var(--verde);
    font-size: 26px;
}

/* TEXTO INTRODUCTORIO */

.textoParticipacion {
    margin: 0 auto 28px auto;
    max-width: 750px;
    text-align: center;
    color: #555;
    font-size: 16px;
    line-height: 1.5;
}

/* TABLA */

.tablaParticipacion {
    width: 100%;
    border: 1px solid #d8e2dd;
    border-radius: 12px;
    overflow: hidden;
    background: white;
}

/* ENCABEZADO */

.encabezadoParticipacion {
    display: grid;
    grid-template-columns: 1fr 190px;
    background: var(--verde);
    color: white;
    font-weight: bold;
    padding: 14px 20px;
    text-align: center;
}

.encabezadoParticipacion div:first-child {
    text-align: left;
}

/* FILAS */

.filaParticipacion {
    display: grid;
    grid-template-columns: 1fr 190px;
    align-items: center;
    min-height: 68px;
    padding: 10px 20px;
    border-bottom: 1px solid #e5e5e5;
    column-gap: 20px;
}

.filaParticipacion:last-child {
    border-bottom: none;
}

/* NOMBRE DEL ESTAMENTO */

.filaParticipacion label {
    margin: 0;
    color: #333;
    font-size: 16px;
    font-weight: 600;
}

/* CAMPOS NUMÉRICOS */

.inputParticipantes {
    width: 100% !important;
    box-sizing: border-box;
    padding: 11px 14px !important;
    margin: 0 !important;

    border: 1px solid #cfcfcf;
    border-radius: 8px;

    font-size: 16px;
    text-align: center;

    background: white;
}

/* FOCO */

.inputParticipantes:focus {
    outline: none;
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(11,106,68,.12);
}

/* TOTAL */

.totalParticipacion {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 15px;

    margin-top: 18px;
    padding: 16px 20px;

    background: var(--verde);
    color: white;

    border-radius: 10px;

    font-size: 18px;
}

.totalParticipacion strong {
    min-width: 55px;
    padding: 6px 12px;

    background: white;
    color: var(--verde);

    border-radius: 7px;

    text-align: center;
    font-size: 20px;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:700px){

    .participacionForo {
        padding: 18px;
    }

    .encabezadoParticipacion,
    .filaParticipacion {
        grid-template-columns: 1fr 120px;
    }

    .filaParticipacion {
        padding: 10px 12px;
        column-gap: 10px;
    }

    .filaParticipacion label {
        font-size: 14px;
    }

    .encabezadoParticipacion {
        font-size: 14px;
        padding: 12px;
    }

    .totalParticipacion {
        justify-content: space-between;
        font-size: 16px;
    }
}

/* =====================================================
   PREGUNTAS BLOQUEADAS / HABILITADAS — SESIONES 1, 2 Y 3

   Antes solo Sesión 2 tenía tratamiento visual (y era apenas una
   opacidad reducida: la pregunta "bloqueada" seguía completamente
   visible y ocupando su espacio). Ahora es una sola regla global:
   bloqueada = oculta por completo, sin dejar espacio en blanco;
   habilitada = aparece con una revelación breve.
   ===================================================== */
.bloquePreguntaBloqueada{
    display:none;
}

.bloquePreguntaHabilitada{
    display:block;
    animation:revelarPreguntaBloque 260ms ease-out;
}

@keyframes revelarPreguntaBloque{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion: reduce){
    .bloquePreguntaHabilitada{ animation:none; }
}

/* =====================================================
   COLAPSADO — PREGUNTAS DE SESIÓN 1, 2 Y 3

   Mismo lenguaje visual para las tres sesiones: el encabezado de una
   pregunta colapsada se ve clicable y compacto; una pregunta ya
   completada muestra ✓ junto a su título. Colapsar es solo un
   estado de presentación — nunca borra ni invalida respuestas.
   ===================================================== */
.preguntaColapsadaSesion1,
.preguntaColapsadaSesion2,
.preguntaColapsadaSesion3{
    margin-bottom:14px;
}

.preguntaColapsadaSesion1 > .tarjetaPregunta,
.preguntaColapsadaSesion2 > .tarjetaPregunta,
.preguntaColapsadaSesion3 > .tarjetaPregunta{
    margin-bottom:0;
    cursor:pointer;
}

.preguntaColapsadaSesion1 > .tarjetaPregunta h3::before,
.preguntaColapsadaSesion2 > .tarjetaPregunta h3::before,
.preguntaColapsadaSesion3 > .tarjetaPregunta h3::before{
    content:"+ ";
    color:var(--color-primary);
    font-weight:700;
}

.preguntaCompletadaSesion1 > .tarjetaPregunta h3::after,
.preguntaCompletadaSesion2 > .tarjetaPregunta h3::after,
.preguntaCompletadaSesion3 > .tarjetaPregunta h3::after{
    content:"  ✓";
    color:var(--verde-neiva);
}

#pantallaSesion1 .tarjetaPregunta:focus-visible,
#pantallaSesion2 .tarjetaPregunta:focus-visible,
#pantallaSesion3 .tarjetaPregunta:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(11,106,68,.28);
    border-radius:var(--radius-sm);
}
